<!doctype html>
<html><head><meta charset="utf-8"><title>scale display</title>
<style>
@font-face{font-family:"Oswald";src:url(fonts/oswald-latin-500-normal.woff2) format("woff2");font-weight:500}
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="900" height="384"></canvas>
<script>
// The check-in scale's passenger display (checkin_hall `scale`, the film's first shot and its echo in chapter 3),
// pinned by gfx/doc_composite.py through frames/raw/checkin_hall/scale.corners.json. A backlit monochrome panel: dark
// segments on the lit face, so it multiplies the plate's own glow. No weight is shown: the sources say only "slightly
// over the weight allowance", so a segment bar lights past the limit tick and the panel says OVERWEIGHT, blinking
// twice, then holding. Contract: window.draw('display', t), window.READY.
const W = 900, H = 384, cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const INK = '#20262c', GHOST = 'rgba(32,38,44,0.05)';
// review 9 (fault 14): the panel read as a printed card. What makes it an LCD here: uneven edge-lit backlight with LED
// hot spots along the bottom, a face recessed behind the bezel glass (an inner shadow on the top and left edges),
// slightly translucent segments that cast a soft second image on the backplane (the parallax shadow every
// transflective LCD has), and a bar made of discrete segments that light one by one. The segments past the limit
// stand taller than the rest and blink with the word, so the excess is its own shape without colour (red is the seam's).
const N = 21, LIMIT = 16, FULL = 20;          // 16 segments up to the limit, 4 past it: slightly over, never a number
const bx = 70, by = 286, bw = W - 140, bh = 34, gap = 8, sw = (bw - (N - 1) * gap) / N;
function face(ctx) {
  ctx.fillStyle = '#e4e8ea'; ctx.fillRect(0, 0, W, H);
  const v = ctx.createLinearGradient(0, 0, 0, H);             // a little darker toward the top: the viewing angle
  v.addColorStop(0, 'rgba(30,36,44,0.10)'); v.addColorStop(0.55, 'rgba(30,36,44,0)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  for (const [x, a] of [[0.17, 0.75], [0.5, 0.6], [0.83, 0.7]]) {   // edge-lit LEDs along the bottom
    const g = ctx.createRadialGradient(W * x, H + 10, 4, W * x, H + 10, 190);
    g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const bl = ctx.createRadialGradient(W * 0.5, H * 0.52, 60, W * 0.5, H * 0.5, W * 0.66);   // falloff toward the bezel
  bl.addColorStop(0, 'rgba(255,255,255,0)'); bl.addColorStop(1, 'rgba(36,42,52,0.42)'); ctx.fillStyle = bl; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(32,38,44,0.035)'; for (let x = 0; x < W; x += 4) ctx.fillRect(x, 0, 1, H); for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}
function bezel(ctx) {                                         // the face sits behind the glass: inner shadow top and left
  let g = ctx.createLinearGradient(0, 0, 0, 26); g.addColorStop(0, 'rgba(10,12,16,0.55)'); g.addColorStop(1, 'rgba(10,12,16,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 26);
  g = ctx.createLinearGradient(0, 0, 20, 0); g.addColorStop(0, 'rgba(10,12,16,0.40)'); g.addColorStop(1, 'rgba(10,12,16,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 20, H);
}
// review 10 (fault 11): still a printed card at its on-screen size. The glass over the panel: a soft diagonal reflection
// of the hall's lights, screened over everything (segments too, as a reflection lies over the ink), brightest across the
// upper left and gone by the middle. It is faint (at most 13 % of the way to white); the composite carries the texture's
// edge over the plate's bright bleed (no keyline) and adds the face's glow onto the bezel (scale_overweight.json).
function glass(ctx) {
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const g = ctx.createLinearGradient(0, 0, W * 0.62, H * 1.45);      // the axis runs down-right: the band lies across it
  g.addColorStop(0.00, 'rgba(255,255,255,0.035)'); g.addColorStop(0.16, 'rgba(255,255,255,0.13)');
  g.addColorStop(0.30, 'rgba(255,255,255,0.07)'); g.addColorStop(0.36, 'rgba(255,255,255,0.09)');
  g.addColorStop(0.55, 'rgba(255,255,255,0.0)'); g.addColorStop(1.00, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
}
// every inked element is drawn twice: a soft shadow on the backplane (3 px down-right), then the segment itself
function ink(ctx, fn) {
  ctx.save(); ctx.filter = 'blur(2.5px)'; ctx.translate(3, 4); ctx.globalAlpha = 0.16; fn(); ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.9; fn(); ctx.restore();
}
function seg(ctx, i, tall) {
  const x = bx + i * (sw + gap), e = tall ? 9 : 0;
  ctx.fillRect(x, by - e, sw, bh + 2 * e);
}
function draw(mode, t) {
  const ctx = document.getElementById('c').getContext('2d');
  ctx.save(); face(ctx);
  ctx.font = '500 150px "Oswald"'; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
  // the unlit segments show faintly, as on a real panel
  ctx.fillStyle = GHOST; for (let i = 0; i < N; i++) seg(ctx, i, i >= LIMIT);
  if (t > 1.15) ctx.fillText('OVERWEIGHT', W / 2, 230);
  // the segments light one by one as the load cell settles over 1.4 s, with a small hunt at the end
  const level = Math.max(0, Math.min(FULL, Math.round(ease(t / 1.4) * FULL + 0.6 * Math.sin(t * 9) * Math.exp(-2.2 * t))));
  const over = t - 1.25, on = over > 1.1 || (over > 0 && Math.floor(over / 0.275) % 2 === 0);
  ctx.fillStyle = INK;
  ink(ctx, () => {
    for (let i = 0; i < Math.min(level, LIMIT); i++) seg(ctx, i, false);
    // past the limit: taller segments, and once OVERWEIGHT shows they blink with it (lit while the bar is still settling)
    for (let i = LIMIT; i < level; i++) if (over <= 0 || on) seg(ctx, i, true);
    // the limit: a tick between segments 16 and 17 with a notch above and below, so "past the limit" reads at phone size
    const lx = bx + LIMIT * (sw + gap) - gap / 2;
    ctx.fillRect(lx - 2.5, by - 22, 5, bh + 44);
    ctx.beginPath(); ctx.moveTo(lx - 13, by - 38); ctx.lineTo(lx + 13, by - 38); ctx.lineTo(lx, by - 22); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(lx - 13, by + bh + 38); ctx.lineTo(lx + 13, by + bh + 38); ctx.lineTo(lx, by + bh + 22); ctx.closePath(); ctx.fill();
    if (on) ctx.fillText('OVERWEIGHT', W / 2, 230);            // two blinks, then steady
  });
  bezel(ctx); glass(ctx); ctx.restore();
}
window.draw = draw;
document.fonts.load('500 150px "Oswald"').then(() => { window.READY = true; });
</script></body></html>
