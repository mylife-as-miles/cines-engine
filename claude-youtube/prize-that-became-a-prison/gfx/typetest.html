<!doctype html>
<html><head><meta charset="utf-8"><title>Type test</title>
<style>
@font-face{font-family:"Archivo";src:url("fonts/archivo/Archivo%5Bwdth,wght%5D.ttf") format("truetype");font-weight:100 900}
@font-face{font-family:"PlexMono";src:url("fonts/ibmplexmono/IBMPlexMono-Regular.ttf");font-weight:400}
@font-face{font-family:"PlexMono";src:url("fonts/ibmplexmono/IBMPlexMono-Medium.ttf");font-weight:500}
@font-face{font-family:"PlexMono";src:url("fonts/ibmplexmono/IBMPlexMono-SemiBold.ttf");font-weight:600}
html,body{margin:0;background:#060708}canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../out/gfx/typetest/testimony_env.js" onerror="window.TENV=null"></script>
<script>
'use strict';
// Motion-typography style test for The Prize That Became a Prison: three looks for the author to choose from.
//   testimony  kinetic captions over Tim Hunt's 2026 testimony (real clip, cut by gfx/typetest_build.sh prep)
//   casefile   an animated dossier: the real photo, four facts, the sentence changing from death to life
//   years      a camera travelling a dark 3D timeline, 2014 to 2026, year numerals made of particles
// Contract (canvas_render.js): window.draw(mode, t) draws one frame from t alone; window.READY once loaded.
// mode 'all' plays the three looks back to back with straight cuts (the test reel); each look also renders alone.
// Fonts: Archivo (OFL) for words, IBM Plex Mono (OFL) for typed records. One accent, cold cyan, marks time only.
// No red anywhere: in this film red marks only the tote's seam. No labels, credits or invented facts.
const W = 1920, H = 1080, FPS = 24;
const cv = document.getElementById('c'), MAIN = cv.getContext('2d');
let ctx = MAIN;                      // swapped to an offscreen context while the dossier plane is drawn
const COL = { ink: '#eef0f2', grey: '#8d97a2', grey2: '#b7bec6', line: 'rgba(170,182,194,0.28)', acc: '#8ad8e4' };
const ACC = (a) => `rgba(138,216,228,${a})`, INK = (a) => `rgba(238,240,242,${a})`;
const SANS = 'Archivo', MONO = 'PlexMono';
const LOOKS = [{ id: 'testimony', n: 261 }, { id: 'casefile', n: 230 }, { id: 'years', n: 324 }];

// ---------- math ----------
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const ramp = (t, a, b) => cl((t - a) / (b - a));
const oExpo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
const oCubic = u => 1 - Math.pow(1 - u, 3);
const oQuint = u => 1 - Math.pow(1 - u, 5);
const ioCubic = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const ioQuint = u => u < .5 ? 16 * u * u * u * u * u : 1 - Math.pow(-2 * u + 2, 5) / 2;
const sm = u => (u = cl(u), u * u * (3 - 2 * u));
function bez(x1, y1, x2, y2) {         // cubic-bezier(x1,y1,x2,y2) as y(x), by bisection
  const B = (a, b, u) => 3 * a * u * (1 - u) * (1 - u) + 3 * b * u * u * (1 - u) + u * u * u;
  return x => { x = cl(x); let lo = 0, hi = 1, u = x; for (let i = 0; i < 24; i++) { if (B(x1, x2, u) < x) lo = u; else hi = u; u = (lo + hi) / 2; } return B(y1, y2, u); };
}
const ENTER = bez(.2, .8, .2, 1);      // the handbook's entrance curve
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- type helpers ----------
function setFont(w, s, fam = SANS, ls = 0) { ctx.font = `${w} ${s}px ${fam}`; ctx.letterSpacing = ls + 'px'; }
const tw = s => ctx.measureText(s).width;
// a word rising out of a mask that sits just under its baseline (entrances ease out, no overshoot)
function rise(text, x, y, size, p) {
  if (p <= 0) return;
  const e = oExpo(cl(p)), w = tw(text);
  ctx.save();
  ctx.beginPath(); ctx.rect(x - size * .25, y - size * 1.15, w + size * .5, size * 1.47); ctx.clip();
  ctx.globalAlpha *= cl(p * 2.4);
  ctx.fillText(text, x, y + (1 - e) * size * .9);
  ctx.restore();
}
// a key word landing: from 1.08x and out of focus to sharp, about its own centre
function slam(text, x, y, size, p) {
  if (p <= 0) return;
  const e = oQuint(cl(p)), w = tw(text), s = lerp(1.08, 1, e), b = (1 - e) * 14;
  ctx.save(); ctx.globalAlpha *= cl(p * 3.2);
  if (b > .3) ctx.filter = `blur(${b.toFixed(1)}px)`;
  ctx.translate(x + w / 2, y - size * .36); ctx.scale(s, s); ctx.fillText(text, -w / 2, size * .36);
  ctx.restore();
}
// per-letter rise, letters staggered (prefix widths keep the kerning)
function riseLetters(text, x, y, size, t, t0, stagger, dur) {
  for (let i = 0; i < text.length; i++) {
    if (text[i] === ' ') continue;
    const px = x + tw(text.slice(0, i));
    rise(text[i], px, y, size, ramp(t, t0 + i * stagger, t0 + i * stagger + dur));
  }
}

// ---------- texture ----------
const GRAIN = [];
function buildGrain() {
  for (let k = 0; k < 4; k++) {
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d'), id = g.createImageData(1024, 1024), r = rng(101 + k);
    for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 110; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0); GRAIN.push(c);
  }
}
function grain(t, amt) {   // fresh every frame (frame-seeded offset), overlay so mid grey is neutral
  const f = Math.round(t * FPS), r = rng(f * 7919 + 13), c = GRAIN[((f % 4) + 4) % 4];
  const ox = Math.floor(r() * 1024), oy = Math.floor(r() * 1024);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = amt;
  for (let y = -oy; y < H; y += 1024) for (let x = -ox; x < W; x += 1024) ctx.drawImage(c, x, y);
  ctx.restore();
}
function vignette(a, inner = .42) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * inner, W / 2, H / 2, H * 1.08);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// =====================================================================================================
// LOOK 1 · TESTIMONY. The clip is cut by typetest_build.sh into three lines (T.segs); word times are the ASR's,
// shifted per line onto the measured speech onsets (A +0.19 s, B +0.08 s, C +0.15 s, the second "12 years" measured).
// A lyrics-style stack on a darkened left column: run words rise, key words land; each key word punch-cuts the
// picture (which also hides the joins). Text stays inside y 70-900 and x 140-1100; Tim sits right of centre.
// =====================================================================================================
const TF = [];                       // the 261 frames of the cut, 1280x720
const T = {
  face: [700, 235],                  // Tim's face in the source frame (it stays within ~20 px through the three lines)
  shots: [                           // t (s), crop width in source px, where the face sits in the frame (0-1)
    { t: 0,      w: 900, ax: .70, ay: .40 },
    { t: 0.567,  w: 780, ax: .70, ay: .40 },   // "no"
    { t: 2.307,  w: 700, ax: .70, ay: .40 },   // "reunification"
    { t: 83 / 24, w: 860, ax: .70, ay: .41 },  // line B
    { t: 3.895,  w: 720, ax: .70, ay: .41 },   // "no story"
    { t: 152 / 24, w: 840, ax: .70, ay: .41 }, // line C
    { t: 7.020,  w: 700, ax: .70, ay: .40 },   // "12"
    { t: 9.040,  w: 900, ax: .69, ay: .42, last: 1 },  // the second "12 years": the statement
  ],
  segEnd: [83 / 24, 152 / 24, 261 / 24],
  lines: [
    { seg: 0, key: 0, words: [['There', 0.11], ['are', 0.51]] },
    { seg: 0, key: 1, words: [['no', 0.65], ['happy', 0.87]] },
    { seg: 0, key: 1, words: [['stories', 1.11]] },
    { seg: 0, key: 0, words: [['I', 1.47], ['can', 1.69], ['tell', 1.81], ['you', 2.01], ['about', 2.17]] },
    { seg: 0, key: 1, words: [['reunification.', 2.39]] },
    { seg: 1, key: 0, words: [['There', 3.618], ['is', 3.838]] },
    { seg: 1, key: 1, words: [['no', 3.978], ['story', 4.238]] },
    { seg: 1, key: 0, words: [['about', 4.60], ['Dawn', 4.838, { w: 700 }]] },
    { seg: 1, key: 0, words: [['rebuilding', 5.138], ['her', 5.498], ['life.', 5.798]] },
    { seg: 2, key: 0, words: [['It', 6.493], ['has', 6.733], ['been', 6.893]] },
    { seg: 2, key: 1, words: [['12', 7.103, { acc: 1 }], ['years.', 7.423]] },
  ],
  final: { t12: 9.123, tyears: 9.823 },
};
const LEAD = 2 / FPS;                // words arrive two frames before they are spoken
const TS = { run: { w: 500, s: 64 }, key: { w: 800, s: 128 } };
const XL = 140, YA = 700;            // left margin; baseline of the line being spoken

function tShot(t) { let s = T.shots[0]; for (const x of T.shots) if (t >= x.t - 1e-6) s = x; return s; }
function tFootage(t, sh) {
  const fi = cl(Math.floor(t * FPS + 1e-4), 0, 260), img = TF[fi];
  if (!img) { ctx.fillStyle = '#15181c'; ctx.fillRect(0, 0, W, H); return; }
  const dt = t - sh.t, w = sh.w * (1 - .02 * dt), h = w * 9 / 16;      // a slow push inside every shot
  const x0 = T.face[0] - sh.ax * w, y0 = T.face[1] - sh.ay * h;
  ctx.save();
  ctx.filter = sh.last ? 'saturate(0.25) brightness(0.5) contrast(1.1) blur(2px)' : 'saturate(0.3) brightness(0.86) contrast(1.1)';
  ctx.drawImage(img, x0, y0, w, h, 0, 0, W, H);
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(40,90,120,0.55)'; ctx.fillRect(0, 0, W, H); ctx.restore();
  const g = ctx.createLinearGradient(0, 0, 1280, 0);                   // the dark column the words live in
  g.addColorStop(0, 'rgba(5,6,8,0.90)'); g.addColorStop(.42, 'rgba(5,6,8,0.74)'); g.addColorStop(1, 'rgba(5,6,8,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function lineStyle(L) { return L.key ? TS.key : TS.run; }
function gap(prev, cur) { const a = lineStyle(prev).s, b = lineStyle(cur).s; return .95 * b + .24 * a + (cur.key || prev.key ? 4 : 12); }

function tStack(t, seg) {
  const lines = T.lines.filter(L => L.seg === seg);
  const act = lines.map(L => L.words[0][1] - LEAD - .26);   // the stack makes room before the line's first word lands
  // baseline of line i: YA minus the gaps of every later line that has started, each eased in over 0.42 s
  for (let i = 0; i < lines.length; i++) {
    if (t < act[i]) break;
    let y = YA;
    for (let j = i + 1; j < lines.length; j++) if (t >= act[j]) y -= gap(lines[j - 1], lines[j]) * ENTER(ramp(t, act[j], act[j] + .42));
    const L = lines[i], st = lineStyle(L);
    const next = i + 1 < lines.length ? act[i + 1] : 1e9;
    const dim = ramp(t, next, next + .3);
    const alpha = L.key ? lerp(1, .9, dim) : lerp(1, .46, dim);
    let x = XL;
    for (const [word, wt, o] of L.words) {
      setFont((o && o.w) || st.w, st.s, SANS, L.key ? -st.s * .015 : 0);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = o && o.acc ? COL.acc : COL.ink;
      const t0 = wt - LEAD;
      if (L.key) slam(word, x, y, st.s, ramp(t, t0, t0 + .24)); else rise(word, x, y, st.s, ramp(t, t0, t0 + .3));
      x += tw(word) + st.s * .26;
      ctx.globalAlpha = 1;
    }
  }
}
function tFinal(t) {                 // "12 years." the second time: the statement, held to the cut
  const life = 1 + .018 * ramp(t, T.final.t12 - LEAD, 10.875);
  ctx.save(); ctx.translate(XL, 600); ctx.scale(life, life); ctx.translate(-XL, -600);
  setFont(800, 380, SANS, -8); ctx.fillStyle = COL.acc;
  slam('12', XL - 6, 560, 380, ramp(t, T.final.t12 - LEAD, T.final.t12 - LEAD + .26));
  setFont(300, 210, SANS, -2); ctx.fillStyle = COL.ink;
  rise('years.', XL + 4, 790, 210, ramp(t, T.final.tyears - LEAD, T.final.tyears - LEAD + .4));
  ctx.restore();
}
function tWave(t) {                  // Tim's voice, live: the last 1.3 s of level as thin bars
  if (!window.TENV) return;
  const n = 64, i1 = Math.floor(t * 48), x0 = XL, y0 = 862;
  for (let k = 0; k < n; k++) {
    const i = i1 - (n - 1 - k); if (i < 0) continue;
    const db = TENV[Math.min(i, TENV.length - 1)], a = cl((db + 58) / 46), h = 2 + a * 30;
    ctx.fillStyle = k > n - 4 ? ACC(.9) : INK(.16 + .3 * (k / n));
    ctx.fillRect(x0 + k * 7, y0 - h / 2, 3, h);
  }
}
function drawTestimony(t) {
  const sh = tShot(t);
  tFootage(t, sh);
  vignette(.55);
  if (sh.last) tFinal(t);              // the statement stands alone: no waveform under it
  else { tStack(t, t < T.segEnd[0] ? 0 : t < T.segEnd[1] ? 1 : 2); tWave(t); }
  grain(t, .16);
}

// =====================================================================================================
// LOOK 2 · THE CASE FILE. Three cards on a textured dark ground, built in layers; a camera cuts between a wide and
// close-ups with depth of field. The sentence is typed, struck, and replaced by LIFE; the struck words stay small.
// =====================================================================================================
let PHOTO = null, GROUND = null;
const PCROP = [440, 30, 862, 1150];  // head and shoulders; the uniform's wings pin is below the crop
const CA = { x: 250, y: 130, w: 400, h: 533 }, CB = { x: 700, y: 130, w: 970, h: 533 }, CC = { x: 250, y: 700, w: 1420, h: 185 };
const CF = {
  shots: [   // t, zoom from-to, centre from-to, roll (rad), the plane's turn about the vertical (deg), the group in focus
    { t: 0.00, z: [1.6, 1.06], c: [[452, 400], [960, 404]], r: [-.012, 0], ry: [9, 6], ease: 1.25, focus: null },
    { t: 2.00, z: [1.78, 1.84], c: [[640, 380], [652, 384]], r: [.004, .004], ry: [-5, -4], focus: ['photo', 'name'] },
    { t: 2.46, z: [2.0, 2.08], c: [[1075, 552], [1090, 552]], r: [-.006, -.006], ry: [6, 7], focus: ['rows'] },
    { t: 2.92, z: [1.12, 1.08], c: [[960, 560], [960, 552]], r: [0, 0], ry: [-8, -6], focus: null },
    { t: 4.10, z: [1.38, 1.45], c: [[830, 730], [845, 732]], r: [.003, .003], ry: [4, 3], focus: ['sent'] },
    { t: 7.00, z: [1.9, 1.97], c: [[452, 372], [452, 376]], r: [0, 0], ry: [-4, -3], focus: ['photo'] },
    { t: 7.42, z: [1.0, 1.035], c: [[960, 515], [960, 508]], r: [0, 0], ry: [8, 5.5], focus: null },
  ],
  end: 230 / 24,
};
function cfCam(t) {
  let i = 0; for (let k = 0; k < CF.shots.length; k++) if (t >= CF.shots[k].t - 1e-6) i = k;
  const s = CF.shots[i], t1 = i + 1 < CF.shots.length ? CF.shots[i + 1].t : CF.end, u = ramp(t, s.t, t1);
  const e = s.ease ? oCubic(ramp(t, s.t, s.t + s.ease)) : u;
  return { z: lerp(s.z[0], s.z[1], e), cx: lerp(s.c[0][0], s.c[1][0], e), cy: lerp(s.c[0][1], s.c[1][1], e), r: lerp(s.r[0], s.r[1], e), ry: lerp(s.ry[0], s.ry[1], e) * Math.PI / 180, focus: s.focus, since: t - s.t };
}
function camApply(cam, k) {          // k < 1: a layer further back (moves and scales less); centred on the plane canvas
  const z = Math.pow(cam.z, k);
  ctx.translate(PW / 2, PH / 2); ctx.rotate(cam.r * k); ctx.scale(z, z);
  ctx.translate(-(W / 2 + (cam.cx - W / 2) * k), -(H / 2 + (cam.cy - H / 2) * k));
}
function blurFor(cam, group) {
  if (!cam.focus) return 0;
  if (cam.focus.includes(group)) return 7 * (1 - oCubic(ramp(cam.since, 0, .2)));   // the focus racks in after the cut
  return cam.z > 1.8 ? 8 : 6;
}
function withBlur(b, fn) { ctx.save(); if (b > .2) ctx.filter = `blur(${b}px)`; fn(); ctx.restore(); }
function buildGround() {
  const c = document.createElement('canvas'); c.width = 2800; c.height = 1800;
  const g = c.getContext('2d'), r = rng(7);
  g.fillStyle = '#07080a'; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 70; i++) {    // slow mottling, like a dark matte board under a lamp
    const x = r() * c.width, y = r() * c.height, rad = 120 + r() * 520, a = .012 + r() * .03;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(150,170,190,${a})`); gr.addColorStop(1, 'rgba(150,170,190,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const ox = 440, oy = 370;          // grid registered to the cards (world 0,0 sits at ox,oy)
  for (let x = ox % 64; x < c.width; x += 64) { const maj = ((x - ox) / 64) % 4 === 0; g.fillStyle = `rgba(160,175,190,${maj ? .075 : .04})`; g.fillRect(x, 0, 1, c.height); }
  for (let y = oy % 64; y < c.height; y += 64) { const maj = ((y - oy) / 64) % 4 === 0; g.fillStyle = `rgba(160,175,190,${maj ? .075 : .04})`; g.fillRect(0, y, c.width, 1); }
  g.fillStyle = 'rgba(200,210,220,0.22)';
  for (let x = ox % 256; x < c.width; x += 256) for (let y = oy % 256; y < c.height; y += 256) { g.fillRect(x - 6, y, 13, 1); g.fillRect(x, y - 6, 1, 13); }
  const id = g.getImageData(0, 0, c.width, c.height), d = id.data;   // fibre speckle
  for (let i = 0; i < d.length; i += 4) { const v = (r() - .5) * 9; d[i] += v; d[i + 1] += v; d[i + 2] += v; }
  g.putImageData(id, 0, 0);
  GROUND = c;
}
function card(b, p, blur) {          // corners fly in, edges draw from them, then the glass fills
  if (p <= 0) return;
  const { x, y, w, h } = b, pc = oExpo(ramp(p, 0, .45)), pe = oExpo(ramp(p, .15, .75)), pf = ramp(p, .3, .9);
  withBlur(blur, () => {
    if (pf > 0) {
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
      ctx.fillStyle = `rgba(12,15,19,${.84 * pf})`; ctx.fillRect(x, y, w, h); ctx.restore();
      ctx.fillStyle = `rgba(255,255,255,${.035 * pf})`; ctx.fillRect(x, y, w, 1);
    }
    ctx.fillStyle = COL.line;
    ctx.fillRect(x, y, w * pe, 1); ctx.fillRect(x + w - w * pe, y + h - 1, w * pe, 1);
    ctx.fillRect(x, y + h - h * pe, 1, h * pe); ctx.fillRect(x + w - 1, y, 1, h * pe);
    const a = 22, o = (1 - pc) * 34; ctx.strokeStyle = INK(.85 * cl(p * 3)); ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x - o, y - o + a); ctx.lineTo(x - o, y - o); ctx.lineTo(x - o + a, y - o);
    ctx.moveTo(x + w + o - a, y - o); ctx.lineTo(x + w + o, y - o); ctx.lineTo(x + w + o, y - o + a);
    ctx.moveTo(x + w + o, y + h + o - a); ctx.lineTo(x + w + o, y + h + o); ctx.lineTo(x + w + o - a, y + h + o);
    ctx.moveTo(x - o + a, y + h + o); ctx.lineTo(x - o, y + h + o); ctx.lineTo(x - o, y + h + o - a);
    ctx.stroke();
  });
}
function photo(t, blur) {
  const t0 = -.04, p = oExpo(ramp(t, t0, t0 + .4)); if (p <= 0) return;
  const { x, y, w, h } = CA, ins = 14, ix = x + ins, iy = y + ins, iw = w - ins * 2, ih = h - ins * 2;
  const oh = ih * p, cy = iy + ih / 2, s = lerp(1.16, 1, oExpo(ramp(t, t0, t0 + .8)));
  withBlur(blur, () => {
    ctx.save(); ctx.beginPath(); ctx.rect(ix, cy - oh / 2, iw, oh); ctx.clip();
    ctx.filter = (blur > .2 ? `blur(${blur}px) ` : '') + 'saturate(0.62) contrast(1.06) brightness(0.93)';
    const dw = iw * s, dh = ih * s;
    if (PHOTO) ctx.drawImage(PHOTO, PCROP[0], PCROP[1], PCROP[2], PCROP[3], ix + (iw - dw) / 2, iy + (ih - dh) / 2, dw, dh);
    ctx.filter = blur > .2 ? `blur(${blur}px)` : 'none';
    const g = ctx.createLinearGradient(0, iy, 0, iy + ih); g.addColorStop(0, 'rgba(10,14,20,0.10)'); g.addColorStop(1, 'rgba(10,14,20,0.42)');
    ctx.fillStyle = g; ctx.fillRect(ix, iy, iw, ih);
    ctx.restore();
    const ea = 1 - ramp(t, t0 + .3, t0 + .6);          // the two scan edges of the opening
    if (ea > 0) { ctx.fillStyle = ACC(.9 * ea); ctx.fillRect(ix, cy - oh / 2 - 1, iw, 2); ctx.fillRect(ix, cy + oh / 2 - 1, iw, 2); }
    ctx.strokeStyle = INK(.18 * p); ctx.lineWidth = 1; ctx.strokeRect(ix + .5, iy + .5, iw - 1, ih - 1);
  });
}
const ROWS = [
  { text: 'CHICAGO', t: .95, y: 494 },

    DRAW[LOOKS[i].id]((f - Math.round(T0[i] * FPS)) / FPS);
  } else DRAW[mode](t);
  ctx.restore();
};
