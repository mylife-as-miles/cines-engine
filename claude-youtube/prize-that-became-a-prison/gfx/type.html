<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Story typography for The Prize That Became a Prison. Every frame is a pure function of t (seconds).
// Contract (scripts/canvas_render.js): window.draw(mode, t), window.READY. Optional: window.LOOK ('A'|'B'|'C'),
// window.BG (an image URL drawn under the type, for previews; omitted for the alpha layers that go over the plates).
// Motion numbers from cinetic (references/copy-and-type.md §8, fx/TypePresets.tsx, fx/TypeFx.tsx, fx/Roll.tsx),
// converted from its 60 fps frames to seconds. No glow, no overshoot, no fade-out of a statement: lines leave with
// the cut. Red is never used here: in this film red marks only the seam.
const W = 1920, H = 1080, f60 = n => n / 60;
const cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
const sm = x => { x = cl(x); return x * x * (3 - 2 * x); };
function bez(x1, y1, x2, y2) {            // cubic-bezier(x1,y1,x2,y2) as y(x), solved by Newton then bisection
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = u => ((ax * u + bx) * u + cx) * u, sy = u => ((ay * u + by) * u + cy) * u, dx = u => (3 * ax * u + 2 * bx) * u + cx;
  return x => {
    x = cl(x); let u = x;
    for (let i = 0; i < 8; i++) { const e = sx(u) - x, d = dx(u); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; u -= e / d; }
    if (Math.abs(sx(u) - x) > 1e-5) { let lo = 0, hi = 1; u = x; for (let i = 0; i < 30; i++) { if (sx(u) < x) lo = u; else hi = u; u = (lo + hi) / 2; } }
    return sy(u);
  };
}
const E = {
  snapOut: bez(.137, .758, .128, .926), glide: bez(.172, .687, .393, .943), rise: bez(.17, .75, .29, .83),
  over: bez(.232, .902, .794, .997), out: bez(.16, 1, .3, 1), inOut: bez(.673, .077, .288, .943),
};

// ---- the three looks on the board; the author picks one ----
const LOOKS = {
  A: { name: 'Report',       // Inter Display: a clean investigative grotesk
    ink: '#e7e9ec', dim: 'rgba(231,233,236,0.62)',
    sup: { fam: 'InterD', w: 400, size: 40, track: 0.2, caps: true },
    sup2: { fam: 'InterD', w: 300, size: 92, track: 0.02, caps: true },
    hero: { fam: 'InterD', w: 300, size: 300, track: -0.01, caps: true },
    big: { fam: 'InterD', w: 300, size: 74, track: 0.04, caps: true },
    num: { fam: 'InterD', w: 100, size: 230, track: -0.02, caps: true } },
  B: { name: 'Cinema serif', // Cormorant Garamond: an engraved, film-title serif
    ink: '#ece8e1', dim: 'rgba(236,232,225,0.62)',
    sup: { fam: 'Cormorant', w: 600, size: 48, track: 0.2, caps: true },
    sup2: { fam: 'Cormorant', w: 400, size: 104, track: 0.04, caps: true },
    hero: { fam: 'Cormorant', w: 300, size: 340, track: 0.02, caps: true },
    big: { fam: 'Cormorant', w: 500, size: 84, track: 0.08, caps: true },
    num: { fam: 'Cormorant', w: 400, size: 250, track: 0.0, caps: true } },
  C: { name: 'Condensed',    // Bebas Neue with Oswald: tall, heavy, the hardest hit
    ink: '#e9eaec', dim: 'rgba(233,234,236,0.62)',
    sup: { fam: 'Oswald', w: 500, size: 40, track: 0.18, caps: true },
    sup2: { fam: 'Bebas', w: 400, size: 132, track: 0.03, caps: true },
    hero: { fam: 'Bebas', w: 400, size: 320, track: 0.03, caps: true },
    big: { fam: 'Bebas', w: 400, size: 120, track: 0.04, caps: true },
    num: { fam: 'Oswald', w: 300, size: 250, track: -0.01, caps: true } },
};
const look = () => LOOKS[window.LOOK || 'A'];
function font(ctx, st, scale = 1) {
  ctx.font = `${st.italic ? 'italic ' : ''}${st.w} ${(st.size * scale).toFixed(2)}px "${st.fam}"`;
  ctx.letterSpacing = `${(st.size * scale * st.track).toFixed(2)}px`;
}
// letterSpacing adds space after the last glyph too; measure without it for alignment
function width(ctx, text, st, scale = 1) { font(ctx, st, scale); return ctx.measureText(text).width - st.size * scale * st.track; }

// ---- motion ----
// Calm reveal, word by word: opacity over 28 f on snapOut, a rise of 0.33 line over 22 f on M.rise, words 11.5 f apart
// (x0.7-1.4 by the previous word's length). Returns nothing; draws at baseline y.
function reveal(ctx, text, x, y, st, t, t0, align = 'left', ink) {
  // each word sits exactly where fillText(text) would put it (kerned and tracked), the positions changeLine uses too,
  // so a line that later changes in place never jumps
  const L = look(), words = text.split(' '), total = width(ctx, text, st);
  const x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  let start = t0, idx = 0;
  ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.fillStyle = ink || L.ink;
  words.forEach((w, i) => {
    if (i) start += f60(11.5) * Math.min(1.4, Math.max(0.7, words[i - 1].length / 5));
    font(ctx, st); const cx = x0 + ctx.measureText(text.slice(0, idx)).width; idx += w.length + 1;
    const p = (t - start), a = E.snapOut(cl(p / f60(28))), r = 1 - E.rise(cl(p / f60(22)));
    if (p > 0) { ctx.globalAlpha = a; ctx.fillText(w, cx, y + r * 0.33 * st.size * 1.15); }
  });
  ctx.restore();
}
// A hero that lands solid: cuts in at x1.7 and settles over 35 f on M.oversize (log-space scale), opacity 45->100 % in 6 f.
function land(ctx, text, x, y, st, t, t0, opts = {}) {
  // cuts in slightly large (about 115 %) and settles over 35 f on M.oversize, scaled about the middle of the cap height
  // so it never leaves the frame; two frames of soft blur on arrival; opacity 45 -> 100 % in 6 f
  if (t < t0) return;
  const L = look(), p = cl((t - t0) / f60(35)), from = opts.from || 1.15, size = opts.scale || 1;
  const s = from * Math.pow(1 / from, E.over(p)) * size;     // one continuous settle (no lock punch: at 24 fps it jolted)
  const a = 0.45 + 0.55 * cl((t - t0) / f60(6)); font(ctx, st);
  const capMid = ctx.measureText('H').actualBoundingBoxAscent / 2;
  ctx.save(); ctx.translate(x, y - capMid); ctx.scale(s, s); ctx.globalAlpha = a; ctx.fillStyle = L.ink; ctx.textBaseline = 'alphabetic';
  if ((t - t0) * 24 < 2) ctx.filter = 'blur(2px)';
  ctx.fillText(text, -width(ctx, text, st) / 2, capMid); ctx.restore();
}
// YES -> WHEN?: hold, then YES erodes from its last letter (one every 3 f, each over 6 f, through a horizontal
// blur copy); the new letters start 6 f in, 4 f apart, rise 0.45 em over 20 f on snapOut; the slot reflows over 24 f.
function erode(ctx, a, b, x, y, st, t, t0) {
  const L = look(), tf = (t - t0) * 60;
  font(ctx, st); const wa = width(ctx, a, st), wb = width(ctx, b, st);
  const k = E.snapOut(cl((tf - (a.length - 1) * 3 - 5) / 24)), slot = wa + (wb - wa) * k;
  ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.fillStyle = L.ink;
  // old word, letters leaving last-first
  const at = (s, i) => ctx.measureText(s.slice(0, i)).width;
  const ax = x - slot / 2 + (slot - wa) / 2 * (1 - k);
  for (let i = 0; i < a.length; i++) {
    const order = a.length - 1 - i, q = cl((tf - order * 3) / 5), op = 1 - Math.min(1, 1.6 * q), cx = ax + at(a, i);
    if (op > 0) { ctx.globalAlpha = op; ctx.fillText(a[i], cx, y); }
    if (q > 0 && q < 0.7) { ctx.save(); ctx.globalAlpha = 0.45 * Math.sin(Math.PI * q / 0.7); ctx.filter = 'blur(6px)'; ctx.fillText(a[i], cx + 8, y); ctx.restore(); }
  }
  // new word, letters rising in order out of a slot at the baseline (clipped below it), once the old word has
  // mostly gone, so no two letters ever sit on the same spot
  const bx = x - slot / 2 + (slot - wb) / 2 * (1 - k);
  const start = (a.length - 1) * 3 + 4;                               // once the last old letter is below 10 %, so none overlap
  for (let i = 0; i < b.length; i++) {
    const r = cl((tf - start - i * 4) / 20), op = Math.min(1, 2.5 * r), cx = bx + at(b, i), lw = at(b, i + 1) - at(b, i);
    if (r > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(cx - st.size * 0.2, y - st.size * 1.2, lw + st.size * 0.4, st.size * 1.42); ctx.clip();
      ctx.globalAlpha = op; ctx.fillText(b[i], cx, y + (1 - E.snapOut(r)) * 0.45 * st.size); ctx.restore();
    }
  }
  ctx.restore();
}
// A left-aligned line that changes in place: the old line's letters leave right to left (one every 1.2 f, each over
// 5 f), then the new line's letters rise left to right (one every 1.5 f, each over 20 f), out of a slot at the baseline.
function changeLine(ctx, a, b, x, y, st, t, t0, ink) {
  const L = look(), tf = (t - t0) * 60; font(ctx, st);
  ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.fillStyle = ink || L.ink;
  const at = (s, i) => ctx.measureText(s.slice(0, i)).width;          // kerned position of glyph i, as fillText(s) sets it
  if (a) for (let i = 0; i < a.length; i++) {
    const q = cl((tf - (a.length - 1 - i) * 1.2) / 5), op = 1 - q;
    if (op > 0) { ctx.globalAlpha = op; ctx.fillText(a[i], x + at(a, i), y); }
  }
  const start = a ? (a.length - 1) * 1.2 + 6 : 0;                     // the old line is gone before the new one starts
  if (b) for (let i = 0; i < b.length; i++) {
    const r = cl((tf - start - i * 1.5) / 20), cx = x + at(b, i), lw = at(b, i + 1) - at(b, i);
    if (r > 0) { ctx.save(); ctx.beginPath(); ctx.rect(cx - st.size * 0.1, y - st.size * 1.2, lw + st.size * 0.2, st.size * 1.42); ctx.clip();
      ctx.globalAlpha = Math.min(1, 2.5 * r); ctx.fillText(b[i], cx, y + (1 - E.snapOut(r)) * 0.45 * st.size); ctx.restore(); }
  }
  ctx.restore();
}
// Rolling year digits (lining tabular figures, so nothing shifts sideways): from a to b one step, each changing digit
// rolls up inside a one-line mask over `dur` seconds, eased in and out.
const STRIP = document.createElement('canvas'), SLOT = document.createElement('canvas');
function roll(ctx, a, b, x, y, st, t, t0) {
  // An odometer. Each changing digit rolls up inside its own slot over 7 frames, eased in and out: the old digit and
  // the new one are one slot apart at full opacity, so they never sit on top of each other. The slot is the row's own
  // height (cap height plus a hair), its edges feathered over 12 % of a cap, and the strip carries a vertical motion
  // blur that peaks mid-roll, so the change reads as one quick roll (5 frames), not two stacked halves. The two digits are drawn at whole pixels into a strip that is then moved at sub-pixel offsets, so the roll
  // never steps. Unchanged digits never move (tabular figures).
  const L = look(), p = cl((t - t0) / (5 / 24)), r = p * p * (3 - 2 * p), sa = String(a), sb = String(b);
  font(ctx, st); ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.fillStyle = L.ink;
  const at = (s, i) => ctx.measureText(s.slice(0, i)).width, x0 = x - width(ctx, sb, st) / 2;
  font(ctx, st); const cap = Math.ceil(ctx.measureText('0').actualBoundingBoxAscent), lead = Math.ceil(0.08 * cap), h = cap + 2 * lead, pad = Math.ceil(0.12 * st.size);
  for (let i = 0; i < sb.length; i++) {
    const cx = x0 + at(sb, i);
    if (sa[i] === sb[i] || p >= 1) { ctx.globalAlpha = 1; ctx.fillText(sb[i], cx, y); continue; }
    if (p <= 0) { ctx.globalAlpha = 1; ctx.fillText(sa[i], cx, y); continue; }
    const w = Math.ceil(at(sb, i + 1) - at(sb, i)) + 2 * pad;
    STRIP.width = w; STRIP.height = 2 * h; const g = STRIP.getContext('2d'); font(g, st); g.fillStyle = L.ink; g.textBaseline = 'alphabetic';
    g.fillText(sa[i], pad, cap + lead); g.fillText(sb[i], pad, cap + lead + h);
    SLOT.width = w; SLOT.height = h; const m = SLOT.getContext('2d');
    const v = Math.sin(Math.PI * r) * 0.035 * h;                    // a vertical motion blur, strongest mid-roll
    m.globalAlpha = 1 / 3; for (const o of [-v, 0, v]) m.drawImage(STRIP, 0, -h * r + o); m.globalAlpha = 1;
    m.globalCompositeOperation = 'destination-in';
    const gr = m.createLinearGradient(0, 0, 0, h); const f = 0.12 * cap / h;
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(f, 'rgba(0,0,0,1)'); gr.addColorStop(1 - f, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    m.fillStyle = gr; m.fillRect(0, 0, w, h);
    ctx.globalAlpha = 1; ctx.drawImage(SLOT, cx - pad, y - cap - lead);
  }
  ctx.restore();
}

// The sentence card, one layout for the cold open and chapter 6: DEATH SENTENCE, then the reprieve (62 % of the main
// line, never smaller), then the date above them. The block is fitted to x <= 0.43 W so it stays clear of a figure
// standing centre or right. With `life`, the date fades first, then both lines change in place to LIFE IN PRISON (the
// sentence was reduced to life later, so no date stands over it).
function sentenceCard(ctx, t, life) {
  // A justified pair: DEATH SENTENCE fitted to the width of TWO-YEAR REPRIEVE at the secondary size (the compound kept
  // whole), the block from x 134 to about 817, clear of a figure centre or right; the date small above, first to arrive.
  // With `life`, the date and the reprieve leave letter by letter while DEATH SENTENCE changes in place.
  // the card's secondary line is 1.12x the film's secondary size (cap about 36 px), for phone legibility; the plate under
  // it is pushed to 1.2x against its left edge (PLATE.death_2017 / sentence_life), which carries the figure about 160 px
  // right of the block's end
  const L = look(), x = 0.07 * W, q = Object.assign({}, L.sup, { size: L.sup.size * 1.12 }), maxW = width(ctx, 'TWO-YEAR REPRIEVE', q);
  const big = Object.assign({}, L.big); big.size *= Math.min(1.15, maxW / width(ctx, 'DEATH SENTENCE', big));
  const y1 = 0.42 * H, y2 = y1 + big.size * 0.95, yd = y1 - big.size * 1.05;
  if (!life || t < 3.45) {
    reveal(ctx, '2017', x, yd, q, t, 0.0);
    reveal(ctx, 'DEATH SENTENCE', x, y1, big, t, 0.3);
    reveal(ctx, 'TWO-YEAR REPRIEVE', x, y2, q, t, 0.8);
  } else {
    changeLine(ctx, '2017', '', x, yd, q, t, 3.45);
    changeLine(ctx, 'DEATH SENTENCE', 'LIFE IN PRISON', x, y1, big, t, 3.45);
    changeLine(ctx, 'TWO-YEAR REPRIEVE', '', x, y2, q, t, 3.45);
  }
}
// ---- the film's type moments ----
// Each mode draws one moment; t is seconds from the moment's cue. Positions are fractions of the frame and sit on the
// plate's darkest plain area (checked on the stills).
const FRAME = document.createElement('canvas');
const YES_Y = 0.29 * H + 18;   // YES's baseline: cap top about 117 px (clear of YouTube's top bar), about 47 px above the case handle on the native 2560 bag plates
const CAL_X = 110 + 190;   // the calendar's centre: left edge at about 110 px, about 140 px clear of the case
const MOMENTS = {
  place_2014: (ctx, t) => { const L = look();      // checkin_hall wide, low left
    reveal(ctx, '2014', 0.072 * W, 0.80 * H, L.sup2, t, 0.0);
    reveal(ctx, 'CHINA', 0.074 * W, 0.80 * H + L.sup.size * 1.25 + 34, L.sup, t, 0.35); },
  yes: (ctx, t) => { const L = look();             // above the two bags (void bags / inspection match), twice
    if (t < 3.0) land(ctx, 'YES', 0.5 * W, YES_Y, L.hero, t, 0.0);
    else land(ctx, 'YES', 0.5 * W, YES_Y + 12, L.hero, t, 3.0, { from: 1.14, scale: 1.12 }); },   // the second: larger, lower, on a tighter frame
  yes_when: (ctx, t) => { const L = look();
    if (t < 0.9) land(ctx, 'YES', 0.5 * W, YES_Y, L.hero, 10, 0); else erode(ctx, 'YES', 'WHEN?', 0.5 * W, YES_Y, L.hero, t, 0.9); },
  death_2017: (ctx, t) => sentenceCard(ctx, t, false),   // cold open
  sentence_life: (ctx, t) => sentenceCard(ctx, t, true),  // chapter 6: the same card, then life
  calendar: (ctx, t) => { const L = look();        // ch 5, beside the empty pool: 2014, 2015, 2016, 2017, each held
    const hold = 1.7, k = Math.min(3, Math.floor(t / hold)), u = t - k * hold;
    const cs = Object.assign({}, L.num, { size: L.num.size * 0.8 });
    if (k === 0) land(ctx, '2014', CAL_X, 0.56 * H, cs, t, 0.0, { from: 1.3 });
    else roll(ctx, 2013 + k, 2014 + k, CAL_X, 0.56 * H, cs, u, 0.0); },
  counter: (ctx, t) => { const L = look();         // void cell, camera locked: twelve years, each one a beat
    // 2014 holds 1.2 s; then one year at a time, the gaps growing from 0.55 s to 1.0 s, so the years feel heavier as
    // they pile up; 2026 lands at about 10 s and holds (the moment runs 14 s or more)
    const ticks = [1.2]; for (let k = 1; k < 12; k++) ticks.push(ticks[k - 1] + 0.55 + 0.45 * (k - 1) / 10);
    let k = 0; while (k < 12 && t >= ticks[k]) k++;
    // 82 % of the number size, cap top about 114 px, about 25 px above the cell at the start of the pull-back. The year
    // is drawn at a fixed baseline into an offscreen frame and placed with a sub-pixel offset, so its slow descent as
    // the cell recedes never steps a pixel at a time.
    const st = Object.assign({}, L.num, { size: L.num.size * 0.82 }), base = 0.225 * H;
    const dy = 120 * (t > 10 ? (1 - Math.cos(Math.PI * cl((t - 10) / 4))) / 2 : 0);
    FRAME.width = W; FRAME.height = H; const o = FRAME.getContext('2d');
    if (k === 0) land(o, '2014', 0.5 * W, base, st, t, 0.0, { from: 1.25 });
    else roll(o, 2013 + k, 2014 + k, 0.5 * W, base, st, t - ticks[k - 1], 0.0);
    ctx.drawImage(FRAME, 0, dy); },
  title: (ctx, t) => { const L = look();           // over void bags in the beam
    // lands whole on the score's peak (cut in slightly large, settles), then holds while the score decays
    // two centred lines, measured so the wider one stays inside 70 % of the frame width
    const st = Object.assign({}, L.big, { size: L.big.size * 1.15, track: L.big.track + 0.02 });
    const fit = Math.min(1, 0.7 * W / width(ctx, 'BECAME A PRISON', st)); st.size *= fit;
    // the two lines land 0.3 s apart, then the block drifts 1.5 % larger through the hold, so it never sits dead
    const d = 1 + 0.015 * sm((t - 0.6) / 4.4), cy = 0.17 * H - 8 + st.size * 0.5;
    ctx.save(); ctx.translate(0.5 * W, cy); ctx.scale(d, d); ctx.translate(-0.5 * W, -cy);
    land(ctx, 'THE PRIZE THAT', 0.5 * W, 0.17 * H - 8, st, t, 0.0, { from: 1.12 });
    land(ctx, 'BECAME A PRISON', 0.5 * W, 0.17 * H - 8 + st.size * 1.12, st, t, 0.3, { from: 1.12 });
    ctx.restore(); },
  place: (ctx, t) => { const L = look();           // the other place and date supers, on 2014 / CHINA's pattern
    // A line at the large super size (fitted to `fit` x W if given), an optional second line at the secondary size.
    // pos=ll: low left like 2014 / CHINA (the chapter title keeps the top left); pos=tc: top centre (the Hong Kong wide's
    // strip of night sky). shade=1 lays the soft shade under it on a lit plate.
    // `pre` sets a secondary line above the large one (JULY over 2026), where one long line would reach the light.
    // URL hash: a=CHICAGO[&b=...][&pre=...][&pos=ll|tc][&fit=0.245][&y=0.16][&shade=1][&t0=0]
    const P = new URLSearchParams(location.hash.slice(1));
    const a = P.get('a') || 'CHICAGO', b = P.get('b') || '', pre = P.get('pre') || '', pos = P.get('pos') || 'll', t0 = +(P.get('t0') || 0);
    const big = Object.assign({}, L.sup2), fit = +(P.get('fit') || 0);
    if (fit) big.size *= Math.min(1, fit * W / width(ctx, a, big));
    const tc = pos === 'tc', x = tc ? 0.5 * W : 0.072 * W, y = tc ? +(P.get('y') || 0.16) * H : 0.80 * H;
    const yb = y + L.sup.size * 1.25 + 34 * big.size / L.sup2.size, align = tc ? 'center' : 'left';
    if (P.get('shade')) {
      const wa = Math.max(width(ctx, a, big), b ? width(ctx, b, L.sup) : 0), gx = tc ? x : x + wa / 2, gy = (y + (b ? yb : y)) / 2 - big.size * 0.3;
      ctx.save(); ctx.translate(gx, gy); ctx.scale(1.7, 1);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 330); g.addColorStop(0, `rgba(3,5,8,${0.42 * sm((t - t0) / 0.6)})`); g.addColorStop(1, 'rgba(3,5,8,0)');
      ctx.fillStyle = g; ctx.fillRect(-400, -400, 800, 800); ctx.restore();
    }
    reveal(ctx, a, x + (tc ? 0 : -2 * big.size / L.sup2.size), y, big, t, t0, align);
    if (b) reveal(ctx, b, x, yb, L.sup, t, t0 + 0.35, align);
    if (pre) reveal(ctx, pre, x, y - big.size * 0.98, L.sup, t, t0 + 0.2, align);
  },
  chapter: (ctx, t) => { const L = look();         // each chapter's title, a small super over its establishing shot
    // The number at the secondary size, a hairline drawing out beside it, then the title in italic sentence case (the
    // chapters' own voice, apart from the evidential capitals). Top left, the place and date supers keep the lower
    // left, so the two can share a wide. `side=r` mirrors it where the plate's top left is busy. With `out`, the
    // letters leave right to left and the hairline retracts, so the shot carries on clean.
    // URL hash: n=01&title=The+winner[&side=r][&out=4.2]
    const P = new URLSearchParams(location.hash.slice(1));
    const n = P.get('n') || '01', title = P.get('title') || 'The winner', right = P.get('side') === 'r', out = +(P.get('out') || 0);
    const num = L.sup, ti = { fam: L.sup.fam, w: 400, size: 100, track: 0.004, italic: true };
    const x0 = 0.072 * W, yN = 140, yT = yN + 90, wN = width(ctx, n, num), wT = width(ctx, title, ti);   // number cap top 108-110, title baseline 230
    const xr = W - x0, xN = right ? xr - wN : x0, xT = right ? xr - wT : x0;
    const leaving = out && t >= out, lu = leaving ? (t - out) : 0, env = sm(t / 0.6) * (1 - sm((lu - 0.25) / 0.4));
    // a soft shade under the block, so the type reads on a lit wall as well as a dark one; never a box
    const gx = right ? xr - 0.5 * Math.max(wT, 260) : x0 + 0.5 * Math.max(wT, 260), gy = yN + 40;
    ctx.save(); ctx.translate(gx, gy); ctx.scale(1.7, 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 330); g.addColorStop(0, `rgba(3,5,8,${0.42 * env})`); g.addColorStop(1, 'rgba(3,5,8,0)');
    ctx.fillStyle = g; ctx.fillRect(-400, -400, 800, 800); ctx.restore();
    // the hairline beside the number: draws out from the number, retracts as the title leaves
    font(ctx, num); const capN = ctx.measureText('0').actualBoundingBoxAscent;
    const draw = E.out(cl((t - 0.15) / 0.6)) * (1 - E.inOut(cl(lu / 0.3))), len = 96 * draw, gap = 24;
    if (len > 0.5) { ctx.save(); ctx.fillStyle = L.dim; ctx.fillRect(right ? xN - gap - len : xN + wN + gap, yN - capN / 2 - 1, len, 2); ctx.restore(); }
    if (!leaving) { reveal(ctx, n, xN, yN, num, t, 0.0, 'left', 'rgba(236,232,225,0.82)'); reveal(ctx, title, xT, yT, ti, t, 0.3); }
    else { changeLine(ctx, title, '', xT, yT, ti, t, out); changeLine(ctx, n, '', xN, yN, num, t, out + 0.12, 'rgba(236,232,225,0.82)'); }
  },
  date_gene: (ctx, t) => { const L = look();
    const g = ctx.createRadialGradient(0.19 * W, 0.85 * H, 0, 0.19 * W, 0.85 * H, 350); g.addColorStop(0, `rgba(3,5,8,${0.3 * sm(t / 0.5)})`); g.addColorStop(1, 'rgba(3,5,8,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    reveal(ctx, 'JANUARY 25, 2026', 0.07 * W, 0.86 * H, L.sup, t, 0.0); },
};

// The plate's own move under some moments (the final compositor applies the same numbers to the Blender plate):
// z zoom about (cx, cy) in frame fractions, and `spot`: a darkening outside a radius (frame-width fractions), the
// spotlight narrowing. The second YES is a straight cut to a tighter frame with the light closing in on the bags.
const PLATE = {
  yes: t => t < 3.0 ? { z: 1.0, cx: 0.5, cy: 0.5, spot: null }
                    : { z: 1.09, cx: 0.5, cy: 0.445, spot: { r: 0.52 - 0.17 * E.out(cl((t - 3.0) / 0.9)), dark: 0.62 } },
  // the sentence card's plates: in to 1.2x and held against their left edge (the clamp), so the figure sits right of
  // the card with room
  death_2017: t => ({ z: 1.2, cx: 0.4, cy: 0.5, spot: null }),
  sentence_life: t => ({ z: 1.2, cx: 0.4, cy: 0.5, spot: null }),
};
window.plateCam = (mode, t) => (PLATE[mode] ? PLATE[mode](t) : { z: 1, cx: 0.5, cy: 0.5, spot: null });
let bgImg = null;
window.draw = (mode, t) => {
  const ctx = document.getElementById('c').getContext('2d');
  ctx.clearRect(0, 0, W, H);
  if (bgImg) {
    const cam = window.plateCam(mode, t), s = Math.max(W / bgImg.width, H / bgImg.height) * cam.z;
    const dw = bgImg.width * s, dh = bgImg.height * s;
    const bx = Math.min(0, Math.max(W - dw, W * 0.5 - dw * cam.cx)), by = Math.min(0, Math.max(H - dh, H * 0.5 - dh * cam.cy));
    ctx.drawImage(bgImg, bx, by, dw, dh);
    if (cam.spot) {                                  // the light closing in: a soft dark surround, never black
      const g = ctx.createRadialGradient(W / 2, H * 0.58, W * cam.spot.r * 0.55, W / 2, H * 0.58, W * cam.spot.r);
      g.addColorStop(0, 'rgba(3,4,6,0)'); g.addColorStop(1, `rgba(3,4,6,${cam.spot.dark})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  MOMENTS[mode](ctx, t);
};
window.setBG = url => new Promise(r => { if (!url) { bgImg = null; return r(); } const i = new Image(); i.onload = () => { bgImg = i; r(); }; i.src = url; });
document.fonts.load('300 40px "InterD"').then(() => Promise.all([
  '100 40px "InterD"', '400 40px "InterD"', '600 40px "InterD"', '300 40px "Cormorant"', '400 40px "Cormorant"', '500 40px "Cormorant"',
  'italic 400 40px "Cormorant"', '400 40px "Bebas"', '300 40px "Oswald"', '500 40px "Oswald"'].map(f => document.fonts.load(f))))
  .then(() => { window.READY = true; });
</script></body></html>
