<!doctype html>
<html><head><meta charset="utf-8"><title>the seam</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// The film's only red: the seam (DECISIONS: red appears twice, both on the seam). Modes:
//   flash    cold open: the trace runs along the tote's front-lip seam in 0.55 s and is gone with the cut at 1.0 s
//   trace    chapter 3: the trace draws in full over 1.8 s and holds
//   cutaway  chapter 3: a schematic section of the bag wall; the leather and the lining part
//            to show a hidden space, outlined in red, and close again (the sound is a small metallic click). Schematic
//            only: no packets, no substance, nothing drawn as an object; no words.
//   cutaway_half  chapter 4's split frame: the same section fitted into the right half (x 962-1919, gfx/split.py), opening
//            on a match from the right-hand tote's top seam, and held open (it does not close).
// The seam path is read from a JSON in plate pixels (window.SEAM: {space:[w,h], seam:[[x,y],...]}): the prototype is
// gfx/shots/purses_seam_proto.json, replaced by Codex's projected purses.seam.json (REQUEST L3).
// Contract: window.draw(mode, t), window.READY; window.setBG(url) for previews over the plate.
const W = 1920, H = 1080, cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
const sm = x => { x = cl(x); return x * x * (3 - 2 * x); }, eo = x => 1 - Math.pow(1 - cl(x), 3);
const RED = '200,52,44';                       // a deep red (OKLCH C about 0.18), not neon
let bgImg = null;
function pts() {                       // plate pixels -> output; hidden samples (behind the handle tabs) become null
  const s = window.SEAM, k = W / s.space[0], occ = s.occluded || [];
  return s.seam.map(([x, y], i) => occ[i] ? null : [x * k, y * k]);
}
function trace(ctx, p, f, a = 1) {
  if (f <= 0) return; const n = Math.max(1, Math.floor((p.length - 1) * f));
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [w, al] of [[9, 0.10], [5, 0.22], [2.4, 0.95]]) {          // a soft bloom under a fine line
    ctx.strokeStyle = `rgba(${RED},${al * a})`; ctx.lineWidth = w; ctx.beginPath(); let pen = false;
    for (let i = 0; i <= n; i++) {                                    // a new subpath after each hidden run
      if (!p[i]) { pen = false; continue; }
      pen ? ctx.lineTo(...p[i]) : ctx.moveTo(...p[i]); pen = true;
    }
    ctx.stroke();
  }
  let hn = n; while (hn > 0 && !p[hn]) hn--;
  if (f < 1 && p[hn]) { const h = p[hn], g = ctx.createRadialGradient(h[0], h[1], 0, h[0], h[1], 18);
    g.addColorStop(0, `rgba(255,120,100,${0.7 * a})`); g.addColorStop(1, `rgba(${RED},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(h[0], h[1], 18, 0, 7); ctx.fill(); }
  ctx.restore();
}
function rng(seed) { let x = seed >>> 0; return () => ((x = (x * 1664525 + 1013904223) >>> 0) / 4294967296); }
function grain(ctx, t) {                 // per-frame grain (sigma about 1 luma), so the dark ground never bands or freezes
  const f = Math.round(t * 24), r = rng(9173 + f * 131), img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() + r() + r() - 1.5) * 2.4; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}
// Material patterns, made once: a pebble grain (soft cells of light and dark) and a fine twill for the lining
let _peb = null, _twl = null;
function PEBBLE() {
  if (_peb) return _peb; const c = document.createElement('canvas'); c.width = c.height = 160; const g = c.getContext('2d'), r = rng(31);
  for (let i = 0; i < 1100; i++) { const x = r() * 160, y = r() * 160, rad = 0.8 + r() * 1.6, d = r() < 0.5;
    const gr = g.createRadialGradient(x - rad * 0.3, y - rad * 0.3, 0, x, y, rad);
    gr.addColorStop(0, d ? 'rgba(0,0,0,0.0)' : 'rgba(255,236,210,0.10)'); gr.addColorStop(1, d ? 'rgba(0,0,0,0.13)' : 'rgba(255,236,210,0)');
    for (const [ox, oy] of [[0, 0], [160, 0], [-160, 0], [0, 160], [0, -160]]) { g.fillStyle = gr; g.save(); g.translate(ox, oy); g.beginPath(); g.arc(x, y, rad, 0, 7); g.fill(); g.restore(); } }
  return (_peb = c);
}
function TWILL() {
  if (_twl) return _twl; const c = document.createElement('canvas'); c.width = c.height = 12; const g = c.getContext('2d');
  g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = 1.2; for (let i = -12; i <= 24; i += 4) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 12, 12); g.stroke(); }
  g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = 1; for (let i = -10; i <= 26; i += 4) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 12, 12); g.stroke(); }
  return (_twl = c);
}
function cutaway(ctx, t, half) {
  // A section through the bag wall at the top seam, an extruded slab in an oblique view: the cut face shows the leather
  // over the lining; the top face recedes. It opens on a straight match cut from the tote: on frame 1 its red seam
  // sits where the tote's seam was (y 380, x 1262-1735 on the 1920 purses frame), then the view eases back to the
  // whole section (1.2 s). The lining swings down about its stitches to open a space, in which a flat, neutral, unlabelled
  // layer lies (schematic: something sewn in; no packets, no substance), then closes over 0.45 s.
  ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, W, H);
  const CX = half ? 1441 : W * 0.5;                                     // the centre of the view: the frame, or the right half
  const vg = ctx.createRadialGradient(CX, H * 0.5, 120 * (half ? 0.6 : 1), CX, H * 0.5, W * (half ? 0.36 : 0.62));
  vg.addColorStop(0, 'rgba(26,32,42,0.55)'); vg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const X0 = 330, X1 = 1560, Y = 520, D = [170, -136], LEA = 92, LIN = 40, hinge = [X0 + 120, Y + LEA];
  const sA = [X0 + 18, Y + 10], sB = [X1 - 14, Y + 10];               // the cut face's stitch row, end to end
  // where the tote's seam was on the cut: the full purses frame, or the right half of the split (gfx/split.py)
  const tA = half ? [1147, 424] : [1262, 380], tB = half ? [1673, 424] : [1735, 380];
  // the resting view: the whole section (full frame), or the section fitted into the right half about its centre
  const kf = half ? 0.585 : 1, of = half ? [1441 - 0.585 * 1030, 560 - 0.585 * 545] : [0, 0];
  const k0 = (tB[0] - tA[0]) / (sB[0] - sA[0]), e = sm(t / 1.2);       // start scale, eased to the resting view
  const k = k0 + (kf - k0) * e, ox = (tA[0] - k0 * sA[0]) * (1 - e) + of[0] * e, oy = (tA[1] - k0 * sA[1]) * (1 - e) + of[1] * e;
  const drift = 1 + 0.02 * sm(t / 5);
  const open = sm((t - 1.3) / 0.8) * (half ? 1 : 1 - sm((t - 3.6) / 0.45));   // opens, holds 1.5 s, closes (the split holds it open)
  ctx.save(); ctx.translate(CX, H / 2); ctx.scale(drift, drift); ctx.translate(-CX, -H / 2);
  ctx.translate(ox, oy); ctx.scale(k, k);
  const ang = 0.12 * open;
  const rot = (x, y) => { const dx = x - hinge[0], dy = y - hinge[1], c = Math.cos(ang), s2 = Math.sin(ang);
    return [hinge[0] + dx * c - dy * s2, hinge[1] + dx * s2 + dy * c]; };
  const poly = (pts) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); };
  // The materials carry the tote's own: cognac leather with a pebble grain, lit by a key from the upper left (a sheen
  // along the top face's near edge, the cut face darker), and a twill-woven lining. Edges are faint (15 %), not drawn.
  const leather = (pts, base, seed, light = null, pat = PEBBLE()) => {
    poly(pts); ctx.fillStyle = base; ctx.fill(); ctx.save(); poly(pts); ctx.clip();
    if (light) { const g = ctx.createLinearGradient(...light[0], ...light[1]); light[2].forEach(([o, c]) => g.addColorStop(o, c)); ctx.fillStyle = g; ctx.fill(); }
    ctx.globalAlpha = 0.35; ctx.fillStyle = ctx.createPattern(pat, 'repeat'); poly(pts); ctx.fill();
    ctx.restore(); poly(pts); ctx.strokeStyle = 'rgba(214,208,198,0.15)'; ctx.lineWidth = 1.2 / k; ctx.stroke();
  };
  const shade = (hex, k) => { const n = parseInt(hex.slice(1), 16); return '#' + [16, 8, 0].map(b => Math.round(((n >> b) & 255) * k).toString(16).padStart(2, '0')).join(''); };
  // a soft contact shadow under the whole section
  { ctx.save(); const g = ctx.createRadialGradient((X0 + X1) / 2 + 60, Y + LEA + LIN + 40, 40, (X0 + X1) / 2 + 60, Y + LEA + LIN + 40, (X1 - X0) * 0.6);
    g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.scale(1, 0.18);
    ctx.fillRect(X0 - 200, (Y + LEA + LIN - 80) / 0.18, X1 - X0 + 520, 600); ctx.restore(); }
  const slab = (pts, face, top, seed, pat) => {
    const T = [pts[0], pts[1], [pts[1][0] + D[0], pts[1][1] + D[1]], [pts[0][0] + D[0], pts[0][1] + D[1]]];
    const S = [pts[1], pts[2], [pts[2][0] + D[0], pts[2][1] + D[1]], [pts[1][0] + D[0], pts[1][1] + D[1]]];
    // the key from the upper left: a sheen along the top face's near edge, falling off into it and along it
    const sheen = [[pts[0][0], pts[0][1]], [pts[0][0] + D[0] * 0.9, pts[0][1] + D[1] * 0.9],
                   [[0, 'rgba(255,226,190,0.34)'], [0.12, 'rgba(255,226,190,0.12)'], [0.5, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.22)']]];
    const along = [[pts[0][0], pts[0][1]], [pts[1][0], pts[1][1]], [[0, 'rgba(255,240,220,0.06)'], [1, 'rgba(0,0,0,0.22)']]];
    const cut = [[pts[0][0], pts[0][1]], [pts[3][0], pts[3][1]], [[0, 'rgba(255,230,200,0.08)'], [1, 'rgba(0,0,0,0.25)']]];
    leather(T, top, seed, sheen, pat); leather(T, 'rgba(0,0,0,0)', seed, along, pat);
    leather(S, shade(face, 0.62), seed + 1, null, pat); leather(pts, face, seed + 2, cut, pat);
  };
  const lin = [[X0, Y + LEA], [X1, Y + LEA], [X1, Y + LEA + LIN], [X0, Y + LEA + LIN]].map(([x, y]) => x < hinge[0] ? [x, y] : rot(x, y));
  slab(lin, '#23262b', '#2c3036', 11, TWILL());
  if (open > 0.01) {                                                   // the space, and the flat layer sewn into it
    const a2 = cl(open * 1.6), p0 = [hinge[0] + 6, Y + LEA], p1 = [X1 - 30, Y + LEA], p2 = rot(X1 - 30, Y + LEA);
    const mid = (u, v, q) => [u[0] + (v[0] - u[0]) * q, u[1] + (v[1] - u[1]) * q];
    const l0 = mid(p0, p1, 0.08), l1 = mid(p0, p1, 0.92), l3 = mid(p0, p2, 0.08), l2 = mid(p0, p2, 0.92);
    const q = [mid(l0, l3, 0.25), mid(l1, l2, 0.25), mid(l1, l2, 0.7), mid(l0, l3, 0.7)];
    ctx.save(); ctx.globalAlpha = a2; poly(q); ctx.fillStyle = '#4a4d52'; ctx.fill(); ctx.fillStyle = ctx.createPattern(TWILL(), 'repeat'); ctx.fill(); ctx.strokeStyle = 'rgba(214,208,198,0.2)'; ctx.lineWidth = 1.2 / k; ctx.stroke(); ctx.restore();
  }
  slab([[X0, Y], [X1, Y], [X1, Y + LEA], [X0, Y + LEA]], '#4e3322', '#7a5235', 21, PEBBLE());   // the tote's cognac
  // the seam, in the film's red: a dashed running stitch along the cut face and along the receding top edge (one line
  // along the projected edge), stitch holes at each end, and stitches through both layers at the hinge
  ctx.save(); ctx.strokeStyle = `rgba(${RED},0.92)`; ctx.lineWidth = 2.2 / Math.max(k, 0.6); ctx.setLineDash([11, 11]);
  ctx.beginPath(); ctx.moveTo(...sA); ctx.lineTo(...sB); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X0 + 18 + D[0] * 0.08, Y + 10 + D[1] * 0.08); ctx.lineTo(X0 + 18 + D[0] * 0.92, Y + 10 + D[1] * 0.92); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle = 'rgba(8,6,5,0.85)';
  for (let x = sA[0]; x < sB[0]; x += 22) { ctx.beginPath(); ctx.arc(x, sA[1], 1.6, 0, 7); ctx.arc(x + 11, sA[1], 1.6, 0, 7); ctx.fill(); }
  for (let i = 0; i < 4; i++) { const x = X0 + 30 + i * 26; ctx.beginPath(); ctx.moveTo(x, Y + 3); ctx.lineTo(x, Y + LEA + LIN - 3); ctx.stroke(); }
  ctx.restore(); ctx.restore();
  grain(ctx, t);
}
window.draw = (mode, t) => {
  const ctx = document.getElementById('c').getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (!mode.startsWith('cutaway')) {               // plate and trace pushed together (2 % a second toward the seam), so they stay registered
    const z = 1 + 0.02 * t, fx = 1500, fy = 380; ctx.setTransform(z, 0, 0, z, fx * (1 - z), fy * (1 - z));
  }
  if (bgImg && !mode.startsWith('cutaway')) ctx.drawImage(bgImg, 0, 0, W, H);
  if (mode === 'flash') trace(ctx, pts(), sm(t / 0.6));
  else if (mode === 'trace') trace(ctx, pts(), sm(t / 1.8));
  else if (mode === 'cutaway') cutaway(ctx, t);
  else if (mode === 'cutaway_half') cutaway(ctx, t, true);
  if (!mode.startsWith('cutaway') && bgImg) { ctx.setTransform(1, 0, 0, 1, 0, 0); grain(ctx, t); }
};
window.setBG = url => new Promise(r => { if (!url) { bgImg = null; return r(); } const i = new Image(); i.onload = () => { bgImg = i; r(); }; i.src = url; });
fetch(window.SEAM_URL || (location.hash ? location.hash.slice(1) : '../frames/raw/evidence_table/purses.seam.json')).then(r => r.json()).then(j => { window.SEAM = j; window.READY = true; });
</script></body></html>
