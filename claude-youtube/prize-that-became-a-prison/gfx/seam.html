<script>
// The film's only red: the seam (DECISIONS: red appears twice, both on the seam). Modes:
//   flash    cold open: the trace runs along the tote's front-lip seam in 0.55 s and is gone with the cut at 1.0 s
//   trace    chapter 3: the trace draws in full over 1.8 s and holds
//   cutaway  chapter 3: a section of the bag wall, lit like the plates (a soft top key) and grained like them: cognac
//            leather over a pale woven lining. The lining swings down to open an empty cavity between the two layers,
//            holds it open 1.7 s, and closes again (the sound is a small metallic click). The cavity is dark and empty:
//            all that shows in it is the lining's own inner face in shadow, lit only from the open end; red marks only
//            the seam's stitches. Nothing is drawn inside the space (no packets, no substance, no object); no words.
//   cutaway_half  chapter 4's split frame: the same section fitted into the right half (x 962-1919, gfx/split.py), opening
//            on a match from the right-hand tote's top seam, and held open (it does not close).
// The seam path is read from a JSON in plate pixels (window.SEAM: {space:[w,h], seam:[[x,y],...]}): the prototype is

let bgImg = null;

// per-pixel noise that rides through three encodes; a finer or weaker grain here is wiped out by x264 (the reel 8 cut-away
// kept a quarter of it). Measured through this piece's encode (CRF 14) and the reel's (CRF 19), this lands at the plates'

// Material textures, made once and seeded (grey about 0.5, laid on with 'overlay', so each scales its material's own colour):
// the leather's pebble grain, the fibres of its cut section, and the lining's 2/1 twill.

let _peb = null, _fib = null, _twl = null;

}

    return a[i % K] * (1 - s) + a[(i + 1) % K] * s; };
  return (_fib = tex(w, h, (x, y) => 0.5 + 0.1 * ((v(y - 1, x) + 2 * v(y, x) + v(y + 1, x)) / 4 - 0.5) + 0.06 * (r() - 0.5)));

function TWILL() {           // a 2/1 twill of 3-unit threads: the warp floats over two wefts, so the ribs run on the diagonal

// The section, in its own units (output px at the full frame's resting view). The leather is a 42-unit sheet and the lining
// 24 (thick enough to read as a second layer on a phone); D is how far the top face recedes (an oblique view). The left end is
// the tote's top edge, where the leather's cut edge is bevelled round (radii RT, RB) and the lining stops just short of it
// (LI). The lining folds down about its top face at HX, right of the four stitches that hold the two layers, by up to ANG.
const SEC = { X0: 330, X1: 1560, Y: 524, D: [170, -136], LEA: 42, LIN: 24, RT: 13, RB: 8, LI: 4, HX: 450, ANG: 0.13 };
const rotAbout = a => { const hx = SEC.HX, hy = SEC.Y + SEC.LEA, c = Math.cos(a), s = Math.sin(a);

    ['multiply', lin([0, Y], [0, top], [[0, grey(255)], [0.05, grey(255)], [0.07, grey(208)], [0.15, grey(214)], [0.19, grey(255)], [1, grey(176)]])],
    ['multiply', KX],

    ['screen', lin([X0, 0], [X0 + 12, 0], [[0, warm(0.16)], [1, warm(0)]])],
    () => { ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = lin([0, top], [0, top - 4], [[0, pale(0.2 * open)], [1, pale(0)]]);

  const px = 1 / Math.max(k, 0.6);                                     // keeps the thread about 2 px wide when the view is small

    ctx.strokeStyle = `rgba(${RED},0.92)`; ctx.lineWidth = 2.1 * px; ctx.lineCap = 'butt';
    for (let i = 0; i + 1 < H2.length; i += 2) { ctx.beginPath(); ctx.moveTo(...H2[i]); ctx.lineTo(...H2[i + 1]); ctx.stroke(); }
    ctx.fillStyle = 'rgba(7,5,4,0.9)';

  };

  run(add([X0 + 18, Y], 0.06), add([X0 + 18, Y], 0.94), 15, 1.6, 0.7);
  for (let i = 0; i < 4; i++) {                                        // through both layers: the awl's channel, the thread in it
    const x = X0 + 30 + i * 26, a = [x, Y + 1.5], b = [x, Y + LEA + LIN - 1.5];
    ctx.strokeStyle = 'rgba(7,5,4,0.75)'; ctx.lineWidth = 4.2 * px; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    ctx.strokeStyle = `rgba(${RED},0.92)`; ctx.lineWidth = 2.1 * px; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  }

}
