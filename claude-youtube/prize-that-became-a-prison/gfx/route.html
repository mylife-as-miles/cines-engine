<!doctype html>
<html><head><meta charset="utf-8"><title>route map</title>
<style>
@font-face{font-family:"Archivo";src:url("fonts/archivo/Archivo%5Bwdth,wght%5D.ttf") format("truetype");font-weight:100 900}
html,body{margin:0;background:#04060a}canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// The route map (script version 2, chapters 2 and 4), rebuilt from design/gfx/route_map.html as a function of
// seconds. Modes:
//   leg1     Chicago -> Hong Kong, then 9 DAYS                               (ch 2, over the cabin and street)
//   mainland the solid leg into the mainland, ABOUT 9 MORE DAYS, then the dashed line toward Australia (ch 2)
//   split    from the mainland, two dashed lines: Australia and Qingdao; neither resolves (ch 4)
// The script names no city in mainland China, so the mainland is a region that warms, never a pin. No red: red marks
// only the seam. Type is the film's text system (Archivo; the accent, #8AD8E4, only on the day counts, which are time).
// Routes draw over about 1-2.4 s on an ease-in-out; labels rise word by word out of a mask under their line; the camera
// pushes slowly in log space toward where the route is going (cinetic's numbers).
const W = 1920, H = 1080, K = 8.7, XF = 0.85, LON_C = 170, LAT_C = 18;

const PU = (lat, lon) => P(lat, U(lon));
// The mainland is a region (no city is named for the days of travel). The sources name no departure airport ("the
// airport in China, on her way to Australia"), so each disputed onward flight rises out of the lit mainland from its own
// unmarked point (departA, departQ): no dot, no ring, no name. ausAim is never drawn: it is only where the Australia
// arc would make landfall (the Tiwi Islands' north coast), chosen so the arrowhead, stopped GAP px short of Australia's
// lit land, sits in the Banda Sea pointing down a clear channel between the islands at the continent.
const CITY = { chicago: [41.88, -87.63], hongkong: [22.32, 114.17], departA: [26.3, 110.6], departQ: [27.0, 104.5], ausAim: [-11.2, 130.3], australia: [-25.57, 134.36], qingdao: [36.07, 120.38] };

const span = (t, a, b) => sm((t - a) / (b - a));
// Land, and the cream a lit region lays over it (HSL lightness, medians measured on the rendered frame, relief in): the
// land keeps its tone (about 0.18) for the Pacific crossing; as the mainland lights to LIT of INK over LAND_C (about
// 0.38), FOCUS of near black dims all the other land to about 0.12, so the lit mainland stands about 3.2:1 over it.
// Australia, the claimed destination, is lit to AUS_LIT of the mainland's fill (about 0.23). The lit mainland has a
// cream outline, OUTLINE px at 60 %.
const INK = '#ece8e1', LAND_C = '#1f2833', LIT = 0.32, FOCUS = 0.40, AUS_LIT = 0.42, OUTLINE = 2;
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const LIT_C = (() => { const a = rgb(LAND_C), b = rgb(INK); return `rgb(${a.map((v, i) => Math.round(v + LIT * (b[i] - v))).join(',')})`; })();

}

// Each frame is drawn twice: GROUND (the map's fills alone: sea, land, lit regions) to a hidden canvas, then the full

// Two kinds of label, in the film's text system: a place name (`name`: Archivo 500 capitals, tracked) and a day count
// (`days`: time, so in the accent; the number heavy, the words light, at 400 because they sit on the lit mainland).
// Each word rises out of a mask that sits just under its capitals (an exponential ease-out, 0.36 s, 0.12 s apart), and

const MASK = document.createElement('canvas'), GND = document.createElement('canvas');
MASK.width = GND.width = W; MASK.height = GND.height = H;
function drawLabels(ctx) {

    m.setTransform(L.T); m.letterSpacing = L.spacing; m.textBaseline = 'middle';
    m.lineJoin = 'round'; m.lineWidth = HALO / L.zoom; m.strokeStyle = m.fillStyle = '#000';
    for (const [wd, x, y, a, font, r] of L.runs) { m.save(); m.beginPath(); m.rect(...r); m.clip(); m.font = font; m.globalAlpha = a; m.strokeText(wd, x, y); m.fillText(wd, x, y); m.restore(); }
    m.setTransform(1, 0, 0, 1, 0, 0); m.globalAlpha = 1; m.globalCompositeOperation = 'source-in'; m.drawImage(GND, 0, 0);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(MASK, 0, 0);

    ctx.setTransform(L.T); ctx.letterSpacing = L.spacing; ctx.textBaseline = 'middle'; ctx.fillStyle = L.col;
    ctx.shadowColor = 'rgba(3,5,9,0.85)'; ctx.shadowBlur = L.size * 0.3;
    for (const [wd, x, y, a, font, r] of L.runs) { ctx.save(); ctx.beginPath(); ctx.rect(...r); ctx.clip(); ctx.font = font; ctx.globalAlpha = a; ctx.fillText(wd, x, y); ctx.restore(); }
    ctx.restore();

}

  ctx.beginPath(); ctx.arc(x, y, hollow ? 7 : 5, 0, 7); hollow ? ctx.stroke() : ctx.fill();
  ctx.strokeStyle = 'rgba(236,232,225,0.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, hollow ? 13 : 12, 0, 7); ctx.stroke();
  if (ring > 0 && ring < 1) { ctx.strokeStyle = `rgba(236,232,225,${0.45 * (1 - ring)})`; ctx.beginPath(); ctx.arc(x, y, 12 + 26 * ring, 0, 7); ctx.stroke(); }

// The disputed flights' shared ending, in screen px: each dashed line stops GAP px short of where it points (the edge of
// Qingdao's dot; Australia's lit coast) in the same open arrowhead. Qingdao, named in the sources, is a small plain dot
// (QDOT px radius): no ring, no bullseye, nothing that reads as a destination reached.
const GAP = 44, QDOT = 5;
function pin(ctx, x, y, a) {          // a plain dot with the lines' dark edge, so it holds on the lit land and the coast
  if (GROUND || a <= 0) return; const s = 1 / ZOOM; ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(3,5,9,0.7)'; ctx.beginPath(); ctx.arc(x, y, (QDOT + 1.5) * s, 0, 7); ctx.fill();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, QDOT * s, 0, 7); ctx.fill(); ctx.restore();
}
// Land, lakes and regions are built once as paths in map units (Natural Earth 1:50m, see tools/prep_land.py; the lakes,
// design/gfx/lakes_pacific.json, at the land's own rounding) and stroked at a constant width on screen with round
// joins, so the coast never thickens or grows spikes as the camera pushes in.

function buildPaths() {

  // and Macau are separate features and are not in it); the same path is stroked as the lit mainland's outline
  for (const k in window.REG) { const fill = new Path2D(); add(fill, window.REG[k].ring, true);
    for (const r of window.REG[k].islands || []) add(fill, r, true); REGP[k] = { fill };

// taken out, over RELIEF_WIN (lon0, lon1, lat0, lat1 in the land's wrap), plate carree, grey 128 neutral; it is laid
// over the land in soft-light at RELIEF_A, so mountains take a fine grey light and shade and plains stay plain, in
// proportion to the land's own tone (so the lit mainland carries it as well as the dark land). The land stands a little
// above the sea (a soft shadow SHADOW px down from every coast); its own shape, blurred LIFT_R px and laid over it in

const leg1 = () => gc(CITY.chicago, CITY.hongkong);
// Both disputed onward flights leave from inside the lit mainland, each from its own unmarked point apart from the other
// (the sources name no departure airport), and each line's first part rises out of the land, so neither start reads as
// a pin and the two never meet as one bent line or fork at sea. Each is one gentle arc bowing east. The Australia line
// runs south over the islands and stops in the sea GAP px short of Australia's lit coast; the Qingdao line (a domestic
// flight) stays over the lit land and stops GAP px short of the city's dot. Neither arrives: both end the same way, on a
// dash, in the same open arrowhead, the same distance short of where they point. `z` is the zoom the gap is taken at.

const legA = (z = ZOOM) => trunc(bow(CITY.departA, CITY.ausAim, -0.12, 200), p => landDist(p, 'AUS'), GAP / z);

// One label system: place names at 44 px (Archivo capitals, cap height about 30 px), the day counts at 62 px; labels sit
// on open water or inside the lit land, never across another country, with no leader lines; every named point has a dot.
const NAME = 44, DAYS = 62;
// mainland: in on the mainland while it is named (0-2.4 s), then back and south as the Australia line draws (4.4-6.2 s),
// landing on the split's framing and pushing on into it. split: the two disputed lines fill the frame, centred on
// 120 E, 12.1 N at 1.69, with the slow push: framed so QINGDAO's top stays at y 116 or below the top edge's 110 and
// AUSTRALIA's lowest ink (its rise in included) at y 937 or above the safe line at 940, through the whole push. The
// pull-back's target is the split's opening frame with the push still to come taken out, so mainland's last frame
// (7.5 s) is split's first.
const MAIN_C = PU(34.5, 99.5), SPLIT_C = PU(12.1, 120), SPLIT_Z = 1.69, MAIN_END = 7.5;
const M0 = [W * 0.47, H * 0.41, 1.04], M1 = [MAIN_C[0], MAIN_C[1], 2.5], M2 = [SPLIT_C[0], SPLIT_C[1], SPLIT_Z * Math.exp(-PUSH * MAIN_END)];

// AUSTRALIA in the split's framing: only the continent's top end is in frame, too narrow at this zoom for the name, so
// the name sits on open water just west of it, right-aligned short of the Kimberley coast, in the band of open sea

const AUS_L = PU(-12.6, 122.3);
const MODES = {
  leg1(ctx, t) {
    camera(ctx, t, [W / 2, H * 0.41], [W * 0.47, H * 0.41], 1.0, 1.04, 6);   // framed low enough that the arc's top stays below y 110
    base(ctx); const L = leg1(), [cx, cy] = PU(...CITY.chicago), [hx, hy] = PU(...CITY.hongkong);
    dot(ctx, cx, cy, span(t, 0.1, 0.4), span(t, 0.1, 1.2)); label(ctx, 'CHICAGO', cx - 30 / ZOOM, cy + 44 / ZOOM, NAME, t, 0.2, 'right');
    solid(ctx, L, span(t, 0.6, 3.0));
    const [bx, by] = PU(22.8, 127.5);      // Hong Kong's block: open Philippine Sea east of Taiwan, level with the marker
    dot(ctx, hx, hy, span(t, 2.9, 3.1), span(t, 2.9, 4.0)); label(ctx, 'HONG KONG', bx, by, NAME, t, 3.0, 'left');

  mainland(ctx, t) {

    base(ctx, { CHN: span(t, 0.4, 1.6), AUS: AUS_LIT * span(t, 6.0, 6.7) }); const [hx, hy] = PU(...CITY.hongkong), [ax, ay] = AUS_L;
    solid(ctx, leg1(), 1, 1 - span(t, 0.2, 1.2)); dot(ctx, hx, hy, 1 - span(t, 0.2, 1.2), 1);
    const [lx, ly] = PU(38.2, 99.5);         // inside the lit mainland where it is widest (about 37 N), no leader; it leaves before the camera pulls back
    label(ctx, 'MAINLAND CHINA', lx, ly, NAME, t, 1.7, 'center', 'name', 4.2);
    label(ctx, 'ABOUT 9 MORE DAYS', lx, ly + 74 / ZOOM, DAYS, t, 2.2, 'center', 'days', 4.25);
    const A = legA(), fA = span(t, 4.6, 6.2);                           // rises out of the lit land, unmarked

  split(ctx, t) {

    base(ctx, { CHN: 1, AUS: AUS_LIT }); const [ax, ay] = AUS_L, [qx, qy] = PU(...CITY.qingdao);   // as mainland ends, so the cut holds
    const A = legA(), Q = legQ(), fA = span(t, 0.4, 2.4), fQ = span(t, 1.0, 2.4), zEnd = splitCam(2.4)[2];   // two unmarked starts
