<!doctype html>
<html><head><meta charset="utf-8"><title>laptop screen</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1500" height="1000"></canvas>
<script>
// The laptop screen in chapter 1 (script version 2): an invented, unbranded mail client and a search page, drawn at
// the display's own aspect (about 3:2) and pinned onto evidence_table `screen` / home `kitchen_over` by
// gfx/doc_composite.py. Nothing here is the real email or a real service: no logo, no product name, no organiser,
// no address; senders and results are greeked bars. The prize line cycles through the three versions the accounts
// give (cash, travel, both), so the picture itself says the wording is not known.
// Contract: window.draw(mode, t) with mode 'inbox' | 'email' | 'search'; window.READY.
const W = 1500, H = 1000, cl = x => x < 0 ? 0 : x > 1 ? 1 : x;
const sm = x => { x = cl(x); return x * x * (3 - 2 * x); };
const C = { bg: '#f4f5f7', panel: '#ffffff', side: '#eceef1', line: '#dde0e5', ink: '#1d2026', soft: '#6b717c',
            bar: '#c9cdd4', bar2: '#dfe2e7', accent: '#3d6fb5', unread: '#eef3fb' };
function rr(ctx, x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function txt(ctx, s, x, y, size, col = C.ink, w = 400) { ctx.font = `${w} ${size}px "Inter"`; ctx.fillStyle = col; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function chrome(ctx) {                      // a generic window: no traffic lights, no product name
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.side; ctx.fillRect(0, 0, W, 64);
  rr(ctx, 360, 14, 640, 36, 18, '#ffffff');                       // a search field, empty
  ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 64.5); ctx.lineTo(W, 64.5); ctx.stroke();
}
function sidebar(ctx, sw = 250) {
  ctx.fillStyle = C.side; ctx.fillRect(0, 65, sw, H - 65);
  rr(ctx, 24, 92, Math.min(160, sw - 48), 44, 22, C.accent);      // compose button, no word on it
  const items = ['Inbox', 'Starred', 'Sent', 'Drafts', 'Archive'];
  items.forEach((s, i) => { if (i === 0) rr(ctx, 12, 160 + i * 46, sw - 24, 40, 20, '#dbe4f2'); txt(ctx, s, 40, 187 + i * 46, 21, i === 0 ? C.ink : C.soft, i === 0 ? 600 : 400); });
}
function inboxRows(ctx, t, hi) {
  const r = rand(11);
  for (let i = 0; i < 12; i++) {
    const y = 80 + i * 74, isNew = i === 0;
    if (isNew) { ctx.fillStyle = C.unread; ctx.fillRect(250, y, W - 250, 74); }
    ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(250, y + 74.5); ctx.lineTo(W, y + 74.5); ctx.stroke();
    if (isNew) {
      rr(ctx, 280, y + 26, 150, 18, 9, '#9aa3b0');                // the sender: greeked, never a name
      txt(ctx, 'Congratulations — you have been selected', 470, y + 44, 24, C.ink, 700);
      txt(ctx, 'Your entry has been chosen as a winner. Open for details…', 470, y + 66 - 2, 18, C.soft);
      ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(262, y + 36, 5, 0, 7); ctx.fill();
    } else {
      rr(ctx, 280, y + 26, 90 + r() * 80, 16, 8, C.bar);
      rr(ctx, 470, y + 24, 220 + r() * 300, 16, 8, C.bar);
      rr(ctx, 470, y + 48, 380 + r() * 380, 12, 6, C.bar2);
      rr(ctx, W - 120, y + 28, 70, 12, 6, C.bar2);
    }
  }
  if (hi > 0) { ctx.save(); ctx.globalAlpha = 0.08 * hi; ctx.fillStyle = C.accent; ctx.fillRect(250, 80, W - 250, 74); ctx.restore(); }
}
// The prize line, in its three versions (story wording, not the email's). Each one rolls up and out as the next rolls
// up into its place, like a counter. Only position and opacity animate: each phrase is set once, at full opacity, into
// its own bitmap (so its weight can never change), the bitmaps move, and a window with soft top and bottom edges fades
// them only as they cross its edges. Nothing changes the glyphs themselves (an alpha fade on the whole phrase read as a
// change of weight: thin while faint, bold once solid).
const PRIZE = ['a cash prize.', 'an international trip.', 'a travel package with cash.'];
const PRIZE_PER = 2.2, ROLL = 0.45, ROLL_D = 52;        // a version every 2.2 s; the roll takes 0.45 s and travels 52 px (clear of the window)
const PIMG = {};
function phraseBitmap(s) {                              // the phrase at full opacity, baseline at 44, ink from x = 4
  if (!PIMG[s]) { const c = document.createElement('canvas'); c.width = 800; c.height = 64;
    txt(c.getContext('2d'), s, 4, 44, 30, C.ink, 600); PIMG[s] = c; }
  return PIMG[s];
}
let PWIN = null;
function prizeLine(ctx, t, x, y) {
  const pre = 'You have won ';
  txt(ctx, pre, x, y, 30, C.ink, 400);
  ctx.font = '400 30px "Inter"'; const px = x + ctx.measureText(pre).width;
  // which roll is under way: k = 0 rolls the first version in at the start, k = 1, 2 roll each version out for the next
  const k = Math.max(0, Math.min(PRIZE.length - 1, Math.round(t / PRIZE_PER)));
  const s = k === 0 ? sm(t / ROLL) : sm((t - (k * PRIZE_PER - ROLL / 2)) / ROLL);
  const wy0 = y - 42, wh = 66;                           // the window: opaque from y - 30 to y + 12, soft 10 px edges
  if (!PWIN) { PWIN = document.createElement('canvas'); PWIN.width = 800; PWIN.height = wh; }
  const g = PWIN.getContext('2d'); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, 800, wh);
  const put = (i, base) => g.drawImage(phraseBitmap(PRIZE[i]), 0, base - wy0 - 44);
  if (k > 0) put(k - 1, y - s * ROLL_D);                 // the outgoing version, rolling up and out
  put(k, y + (1 - s) * ROLL_D);                          // the incoming (or resting) version
  const gr = g.createLinearGradient(0, 0, 0, wh);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(12 / wh, 'rgba(0,0,0,1)');
  gr.addColorStop(54 / wh, 'rgba(0,0,0,1)'); gr.addColorStop(64 / wh, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'destination-in'; g.fillStyle = gr; g.fillRect(0, 0, 800, wh);
  ctx.drawImage(PWIN, Math.round(px) - 4, wy0);
}
// The letter sits close to a narrow sidebar (190 px, the body at x = 230), so the shot's push can end with the prize
// line at about 60 % of the frame and a sliver of the laptop's bezel still at the left edge.
const SB = 190, BX = 230;
function email(ctx, t) {
  chrome(ctx); sidebar(ctx, SB);
  ctx.fillStyle = C.panel; ctx.fillRect(SB, 65, W - SB, H - 65);
  txt(ctx, 'Congratulations — you have been selected', BX, 150, 34, C.ink, 700);
  ctx.fillStyle = '#9aa3b0'; ctx.beginPath(); ctx.arc(BX + 22, 214, 22, 0, 7); ctx.fill();     // sender avatar, blank
  txt(ctx, 'Notifications', BX + 60, 212, 21, C.ink, 600); txt(ctx, 'to me', BX + 60, 240, 18, C.soft);   // generic, kept soft by the composite's focus
  ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(BX, 262.5); ctx.lineTo(W - 60, 262.5); ctx.stroke();
  txt(ctx, 'Dear winner,', BX, 330, 28, C.ink);
  txt(ctx, 'We are delighted to tell you that your entry has been selected.', BX, 392, 28, C.ink);
  prizeLine(ctx, t, BX, 448);
  // the rest of the letter: plain, generic wording that the composite's focus band keeps out of focus, so it reads as
  // a letter, never as a quotation (nothing here is from the real email)
  const body = ['Our team will be in touch shortly to arrange the details of your prize.',
                'Please reply to this message to confirm your entry and your contact details.',
                'All arrangements will be made for you, at no cost to you.',
                'We look forward to hearing from you.', '', 'With warm regards,', 'The prize team'];
  body.forEach((line, i) => txt(ctx, line, BX, 520 + i * 44, 26, i > 4 ? C.soft : C.ink));
  rr(ctx, BX, 860, 200, 52, 26, C.accent); txt(ctx, 'Reply', BX + 65, 894, 22, '#ffffff', 600);
}
// The search, in two pages like a real one. The home page: the field in the upper middle of the screen, typed like a
// person (2-6 frames a letter in an irregular rhythm, a pause after each space), the suggestion list dropping under it.
// On Enter the results page replaces it: the field at the top, five results, a side column and a row of related
// searches, so the screen is full. Every result is generic, every source line greeked, nothing is a real site; the
// composite's focus keeps all but the query soft. The search times are exposed (window.SEARCH) for the shot's camera.
// The query is the one thing to read, on a phone too: 32 px medium, near-black, the same on both pages; the home field
// sits high enough that one fixed camera centre frames it at the start and the results field at the top at the end.
const Q = 'prize contest organizers', QSTART = 0.0, QFPS = 24, QT = [];   // the first letter is on screen by frame 3
{ const R = [2, 3, 2, 2, 4, 2, 3, 2, 6, 2, 3, 2]; let t0 = QSTART;
  for (let i = 0; i < Q.length; i++) { t0 += (R[i % R.length] + (Q[i - 1] === ' ' ? 4 : 0)) / QFPS; QT.push(t0); } }
const QDONE = QT[QT.length - 1], QENTER = QDONE + 0.45;
const QSIZE = 32, QH = 72, QINK = '#0f1114';
window.SEARCH = { done: QDONE, enter: QENTER };
function field(ctx, x, y, w, t, typedTo) {
  rr(ctx, x, y, w, QH, QH / 2, '#f1f3f5'); ctx.strokeStyle = '#dde0e5'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(x, y, w, QH, QH / 2); ctx.stroke();
  let shown = 0; while (shown < Q.length && t >= QT[shown]) shown++; if (typedTo) shown = Q.length;
  const s = Q.slice(0, shown); txt(ctx, s, x + 40, y + 47, QSIZE, QINK, 500);
  ctx.font = `500 ${QSIZE}px "Inter"`; const cx = x + 40 + ctx.measureText(s).width + 2;
  const blink = t < QDONE + 0.1 || Math.floor((t - QDONE) / 0.5) % 2 === 1;
  if (blink && !typedTo) { ctx.fillStyle = QINK; ctx.fillRect(cx, y + 17, 2, 38); }
  return shown;
}
function search(ctx, t) {
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.side; ctx.fillRect(0, 0, W, 64);
  rr(ctx, 360, 14, 640, 36, 18, '#ffffff');                             // the browser's address field, empty
  if (t < QENTER) {
    // the home page: a plain field, a row of generic shortcut tiles under it (greeked, no names)
    const fx = 200, fy = 210, fw = 860, shown = field(ctx, fx, fy, fw, t, false), dy = fy + QH + 12;
    // the suggestion list drops when the fourth letter lands, like a real one: opaque by its second frame, and the tiles
    // it covers are gone from its first, so nothing ever shows through it
    if (shown > 3) {
      ctx.save(); ctx.globalAlpha = (t - QT[3]) * QFPS < 0.5 ? 0.55 : 1; rr(ctx, fx, dy, fw, 4 * 54 + 16, 18, '#ffffff');
      ctx.strokeStyle = '#e3e6ea'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(fx, dy, fw, 4 * 54 + 16, 18); ctx.stroke();
      ['prize contest organizers reviews', 'prize contest winners list', 'prize contest travel package', 'prize contest how to claim']
        .forEach((sg, i) => { ctx.fillStyle = '#9aa0a8'; ctx.beginPath(); ctx.arc(fx + 40, dy + 36 + i * 54, 7, 0, 7); ctx.fill(); txt(ctx, sg, fx + 66, dy + 45 + i * 54, 26, C.soft); });
      ctx.restore();
    } else {
      const tx = fx + fw / 2 - (5 * 140 + 84) / 2;
      for (let i = 0; i < 6; i++) { const x = tx + i * 140; rr(ctx, x, dy + 54, 84, 84, 18, '#eef0f3'); rr(ctx, x + 12, dy + 160, 60, 10, 5, C.bar2); }
    }
  } else {
    // the results page, arriving a moment after Enter: the field at the top, results down the left, a side column
    const a = sm((t - QENTER) / 0.35), r = rand(23);
    field(ctx, 120, 96, 1000, t, true);
    ctx.strokeStyle = '#e3e6ea'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 196.5); ctx.lineTo(W, 196.5); ctx.stroke();
    for (let i = 0; i < 5; i++) rr(ctx, 120 + i * 120, 210, 90, 12, 6, i ? C.bar2 : '#9aa7bd');        // the result tabs, greeked
    ctx.save(); ctx.globalAlpha = a;
    const RES = [['Prize draw winners: how to claim', 'What to expect after a winning notice, and how prizes are delivered to winners.'],
                 ['Travel contest official rules', 'Eligibility, prize descriptions, travel dates and conditions for winners.'],
                 ['Is this contest legitimate?', 'Readers discuss notices from contest organizers and what they checked.'],
                 ['Sweepstakes and prize notices', 'How to tell a genuine prize from a scam: questions to ask the organizers.'],
                 ['Winners announced this month', 'A list of recent prize draws, with travel packages and cash awards.']];
    RES.forEach(([title, snip], i) => {
      const y = 262 + i * 128 + (1 - a) * 12;
      rr(ctx, 120, y, 200 + r() * 120, 12, 6, '#cfd8cf');                   // a source line, greeked
      txt(ctx, title, 120, y + 48, 28, '#2a4a86', 500);
      txt(ctx, snip, 120, y + 84, 20, C.soft); rr(ctx, 120, y + 98, 300 + r() * 260, 10, 5, C.bar2);
    });
    // a side column: a generic panel of greeked blocks
    rr(ctx, 1000, 262, 400, 560, 18, '#f6f7f9');
    rr(ctx, 1030, 292, 340, 170, 12, '#e6e9ee');
    for (let i = 0; i < 7; i++) rr(ctx, 1030, 490 + i * 42, 180 + r() * 150, 12, 6, i % 3 ? C.bar2 : C.bar);
    // related searches, a row of chips at the foot
    txt(ctx, 'Related searches', 120, 920, 22, C.soft, 600);
    ['contest winner notice', 'claim a prize abroad', 'travel prize rules', 'prize organizers'].forEach((c, i) => {
      rr(ctx, 120 + i * 220, 940, 200, 44, 22, '#eef0f3'); txt(ctx, c, 140 + i * 220, 969, 18, C.soft); });
    ctx.restore();
  }
}
window.draw = (mode, t) => {
  const ctx = document.getElementById('c').getContext('2d');
  ctx.clearRect(0, 0, W, H);
  if (mode === 'inbox') { chrome(ctx); sidebar(ctx); ctx.fillStyle = C.panel; ctx.fillRect(250, 65, W - 250, H - 65); inboxRows(ctx, t, sm((t - 1.2) / 0.3)); }
  else if (mode === 'email') email(ctx, t);
  else if (mode === 'search') search(ctx, t);
};
document.fonts.load('400 28px "Inter"').then(() => document.fonts.load('500 28px "Inter"')).then(() => document.fonts.load('700 28px "Inter"')).then(() => document.fonts.load('600 28px "Inter"')).then(() => { window.READY = true; });
</script></body></html>
