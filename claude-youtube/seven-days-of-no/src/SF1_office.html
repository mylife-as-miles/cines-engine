<!doctype html><meta charset="utf-8"><title>SF1 · Office, Monday</title>
<script src="../kit/pov.js"></script><script src="../kit/sets.js"></script>
<script>
/* SEVEN DAYS OF NO · STYLE FRAME 1 · MONDAY, 5:30 PM (refs 11 and 04)
   "Your boss walks over. Can you stay a bit late tonight?" The boss, clipboard at his side, mid-stride toward you and already
   asking; you stand by the back desk, caught between neutral and surprised. Clock at half past five. No words anywhere. */
window.addEventListener('load', async () => {
  const g = POV.stage('#000');
  const hasSets = typeof SETS !== 'undefined' && SETS.office;
  if (hasSets && SETS.ready) await SETS.ready();
  let S;
  if (hasSets) S = SETS.office(g, { clock: 17.5, chair: false });
  else { g.fillStyle = POV.C.officeWallBack; g.fillRect(0, 0, 1920, 837); g.fillStyle = POV.C.officeFloor; g.fillRect(0, 837, 1920, 243); S = { anchors: { left: { x: 318, y: 962 }, right: { x: 1618, y: 962 } } }; }
  const sh = POV.C.officeFloorShadow;
  const A = S.anchors;
  // the boss: walking in from the right, clipboard at his side, mid-question
  POV.figure(g, 'boss', { x: 1470, y: A.right.y, facing: -1, pose: 'walk', phase: 0.18, holding: 'clipboard', expr: 'neutral',
    face: { brows: { lift: 0.07, arch: 0.3 } }, mouth: 0.55, look: [0.55, 0.05], turn: 0.25, shadow: sh });
  // you: standing, turned toward him, eyebrows up, the smile gone
  POV.figure(g, 'hero', { x: A.left.x + 30, y: A.left.y, facing: 1, pose: 'stand', expr: 'surprised', face: { mouth: { k: 'o', w: 0.06, h: 0.07 }, eyes: { r: 1.05, pupil: 0.9 } },
    look: [0.75, -0.05], turn: 0.18, shadow: sh });
  if (hasSets && SETS.officeFront) SETS.officeFront(g, { chair: false });
  window.FRAME_READY = true;
});
</script>
