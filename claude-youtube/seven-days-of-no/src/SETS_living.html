<!doctype html>
<html><head><meta charset="utf-8"><title>SET living</title>
<style>html,body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="../kit/pov.js"></script>
<script src="../kit/sets.js"></script>
<script>
// ?tod=evening|morning|dusk &table=0 &bird=0.4  &zoom=1.15&cx=1200&cy=600  &anchors=1  &front=1  &perf=1
const q = new URLSearchParams(location.search);
const g = document.getElementById('c').getContext('2d');
SETS.ready().then(() => {
  const opts = { tod: q.get('tod') || 'evening', table: q.get('table') !== '0', bird: q.get('bird') != null ? +q.get('bird') : null,
    cam: { zoom: +(q.get('zoom') || 1), x: +(q.get('cx') || 960), y: +(q.get('cy') || 540) } };
  const S = SETS.living(g, opts);
  if (q.get('front') === '1') SETS.livingFront(g, opts);
  if (q.get('anchors') === '1') {
    g.font = SETS.font(800, 22); g.fillStyle = '#d0006f';
    for (const [k, a] of Object.entries(S.anchors)) { g.beginPath(); g.arc(a.x, a.y, 9, 0, 7); g.fill(); g.fillText(k, a.x + 12, a.y - 10); }
  }
  if (q.get('perf') === '1') {
    let t0 = performance.now(); for (let i = 0; i < 30; i++) { SETS.living(g, opts); SETS.livingFront(g, opts); }
    const ms = (performance.now() - t0) / 30;
    g.fillStyle = '#000'; g.fillRect(0, 0, 420, 50); g.fillStyle = '#fff'; g.font = SETS.font(800, 28); g.fillText('cached frame ' + ms.toFixed(2) + ' ms', 12, 36);
  }
  window.FRAME_READY = true;
});
</script></body></html>
