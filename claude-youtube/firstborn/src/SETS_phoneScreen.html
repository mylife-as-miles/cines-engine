<!doctype html><meta charset="utf-8"><title>SETS · Phone screens (bank, call, transfer banner)</title>
<script src="../kit/pov.js"></script><script src="../kit/sets.js"></script>
<script>
/* FIRSTBORN IN AN AFRICAN HOME · Sets kit test page: Phone screens (bank, call, transfer banner).
   node tools/shoot.js src/SETS_phoneScreen.html frames/SET_phoneScreen.png 1920 1080 300
   Query: ?o={...} set options (JSON) · &fig=1 stand the hero at the anchors (scale check) · &anchors=1 mark the anchors · &bench=1 time 48 frames */
function draw(g, o, q) {

  SETS.plain(g, { color: '#F2B587' });
  SETS.phoneScreen(g, Object.assign({ bg: false, mode: 'bank', x: 400, scale: 0.98, app: 'My Bank', balance: 250000, amount: 250000, rows: [{ label: 'School fees', amount: 85000 }, { label: 'Rent', amount: 120000 }, { label: 'Just a small thing', amount: 30000 }] }, o));
  SETS.phoneScreen(g, { bg: false, mode: 'call', x: 1000, scale: 0.98, contact: 'Mum', t: o.t });
  SETS.phoneScreen(g, { bg: false, mode: 'lock', x: 1580, scale: 0.98, time: '9:41', notes: [{ icon: 'transfer', title: 'Transfer', body: 'To Mum: ₦50,000.00' }], banner: { icon: 'transfer', title: 'Transfer to Mum…', body: '₦50,000.00 from your account', k: 1 } });
  return null;
}
window.addEventListener('load', async () => {
  const q = new URLSearchParams(location.search);
  const g = POV.stage('#000'); await SETS.ready();
  const o = Object.assign({ t: 0.3 }, JSON.parse(q.get('o') || '{}'));
  if (q.get('bench')) {
    const t0 = performance.now(); draw(g, o, q); const first = performance.now() - t0; const ms = [];
    for (let i = 0; i < 48; i++) { g.setTransform(1, 0, 0, 1, 0, 0); const a = performance.now(); draw(g, Object.assign({}, o, { t: i / 24, k: 1 }), q); ms.push(performance.now() - a); }
    g.getImageData(0, 0, 1, 1);
    window.BENCH = { first: +first.toFixed(1), mean: +(ms.reduce((s, v) => s + v, 0) / ms.length).toFixed(2), max: +Math.max(...ms).toFixed(2) };
    return;
  }
  const S = draw(g, o, q);
  if (S && S.anchors && q.get('anchors')) for (const k in S.anchors) { const a = S.anchors[k]; g.save(); g.fillStyle = '#E5534B'; g.beginPath(); g.arc(a.x, a.y, 8, 0, 6.283); g.fill(); g.font = '700 22px sans-serif'; g.fillStyle = '#1c1c1c'; g.fillText(k, a.x + 12, a.y - 6); g.restore(); }
  window.FRAME_READY = true;
});
</script>
