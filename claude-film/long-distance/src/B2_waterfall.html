/* LONG DISTANCE · LOOK B "GRAIN AND GLOSS" · B2 THE WATERFALL (INT. APARTMENT - LIVING ROOM, night)

   the salt. On it, the picture she has just sent: the two of them at a waterfall, her long hair, her head tipped against his.

   The two pictures bracket him. One is grain (cheap flash, noise, a crooked crop, real paper); the other is gloss (drawn after the
   film grain: clean gradients, mirror symmetry, water whiter than anything else in the film, both faces lit by one light that
   belongs to their faces rather than to the place). One warm lamp over the counter; the screen's cold light on his face. */
