    ln([[0.27, -0.045], [0.264, -0.028]], 'rgba(27,25,24,0.8)', 1.4); ln([[0.3, -0.043], [0.296, -0.026]], 'rgba(27,25,24,0.8)', 1.4);

    g.fillStyle = 'rgba(28,24,22,0.75)'; const no = L1(0.393, 0.176); g.beginPath(); g.ellipse(no[0], no[1], 4.5, 2.6, 0.3, 0, 7); g.fill();

    ln([[0.3, 0.33], [0.33, 0.31]], 'rgba(34,26,24,0.45)', 2); }

  // =====================================================================
  // 6. THE QUILT (height field) with its stitched squares. Hers: flat, square, turned down in a straight line. His: rucked over him.
  // =====================================================================
  // his body under the quilt: shoulder, the dip of the waist, the hip, the thighs drawn up toward the seam
  const body = [[-0.42, 2.5, 0.27, 0.13], [-0.44, 2.36, 0.25, 0.14], [-0.46, 2.18, 0.21, 0.13], [-0.46, 1.98, 0.28, 0.17], [-0.38, 1.8, 0.24, 0.14], [-0.24, 1.66, 0.2, 0.12], [-0.1, 1.52, 0.17, 0.11], [-0.02, 1.36, 0.15, 0.1]];
