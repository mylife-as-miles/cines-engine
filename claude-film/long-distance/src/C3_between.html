    const hair = LC.smooth(L([[0.12, -0.6], [0.36, -0.48], [0.48, -0.24], [0.5, 0.04], [0.48, 0.3, 1], [0.38, 0.31, 1], [0.36, 0.1], [0.32, -0.08], [0.22, -0.24], [0.08, -0.33], [0.02, -0.36, 1], [-0.12, -0.31], [-0.28, -0.2], [-0.36, 0.02], [-0.38, 0.32, 1], [-0.5, 0.33, 1], [-0.52, 0.04], [-0.46, -0.3], [-0.26, -0.54]]));
    LC.fill(g, hair, SM.hair); LC.crescent(g, hair, 1, -0.3, 5, SM.hairL); LC.crescent(g, hair, 1, -0.3, 2, '#A0826C');
    within(hair, () => { [[[0.12, -0.5], [0.34, -0.34], [0.4, 0.08]], [[-0.02, -0.52], [-0.3, -0.38], [-0.42, 0.1]], [[0.0, -0.36], [-0.24, -0.26], [-0.34, 0.06]]].forEach(c => strokeQ(L, c, 'rgba(110,86,70,0.4)', 1.5)); });
    const ear = LC.smooth(L([[0.3, -0.06], [0.36, -0.08], [0.4, 0.02], [0.38, 0.14], [0.32, 0.15]])); LC.fill(g, ear, SM.skin); LC.crescent(g, ear, 1, -0.3, 2, SM.skinL);
    strokeQ(L, [[0.05, -0.175], [0.15, -0.195], [0.26, -0.165]], '#3A2820', 4); strokeQ(L, [[-0.31, -0.165], [-0.23, -0.185], [-0.14, -0.175]], '#3A2820', 3.4);
    // eyes on him: almond whites, the irises at the inner corners, the lids heavy with tiredness
    [[0.15, -0.06, 0.06, 1], [-0.22, -0.065, 0.044, 0.78]].forEach(([x, y, r, k]) => {
      const e = LC.smooth(L([[x - r, y + 0.002], [x - r * 0.35, y - 0.04 * k], [x + r * 0.4, y - 0.038 * k], [x + r, y], [x + r * 0.2, y + 0.026 * k], [x - r * 0.5, y + 0.024 * k]]));
      LC.fill(g, e, '#E9DFD4'); within(e, () => { const ir = L1(x - r * 0.3, y - 0.008); g.fillStyle = '#3A2A20'; g.beginPath(); g.arc(ir[0], ir[1], 0.034 * sU * k, 0, 7); g.fill(); g.fillStyle = '#16100C'; g.beginPath(); g.arc(ir[0], ir[1], 0.014 * sU * k, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.arc(ir[0] + 2, ir[1] - 2, 1.6, 0, 7); g.fill(); });
      strokeQ(L, [[x - r, y + 0.002], [x - r * 0.25, y - 0.044 * k], [x + r, y]], '#21160F', 3);
      strokeQ(L, [[x - r * 0.6, y - 0.07 * k], [x, y - 0.078 * k], [x + r * 0.7, y - 0.064 * k]], 'rgba(130,90,72,0.45)', 1.4); });
    // nose toward him; the mouth closed, level, held
    LC.fill(g, LC.smooth(L([[-0.1, 0.0], [-0.15, 0.08], [-0.2, 0.16], [-0.18, 0.2], [-0.11, 0.2], [-0.08, 0.13]])), LC.mix(SM.skinS, SM.skin, 0.35));
    LC.fill(g, LC.smooth(L([[-0.05, -0.02], [-0.12, 0.08], [-0.17, 0.16], [-0.12, 0.19], [-0.06, 0.12]])), SM.skin);
    g.fillStyle = '#7E5444'; const ns = L1(-0.15, 0.192); g.beginPath(); g.ellipse(ns[0], ns[1], 3.8, 2.1, -0.2, 0, 7); g.fill();
    LC.fill(g, LC.smooth(L([[-0.19, 0.326], [-0.1, 0.314], [0.0, 0.316], [0.07, 0.326], [0.0, 0.354], [-0.12, 0.352]])), SM.lip);
    strokeQ(L, [[-0.19, 0.328], [-0.06, 0.326], [0.07, 0.328]], '#5E3328', 1.8); }

  // =====================================================================
  // 4. FINISH, and the line in the picture
  // =====================================================================
  f.finish({ letterbox: LC.ASPECT, grain: 0.045, fibre: 0, vignette: 0, halation: 0.4, beforePost: c => { LC.vignette(c, 0.3, '#2E2620', 1100, 480, 520, 1250); c.save(); c.globalCompositeOperation = 'multiply'; c.fillStyle = LC.lin(c, 0, 0, W, 0, [[0, '#7A7068', 0.55], [0.45, '#FFFFFF', 0], [1, '#FFFFFF', 0]]); c.fillRect(0, 0, W, H); c.restore(); } });
  LC.caption(ctx, 'Her', ['We’ve never taken this photo.', 'We’ve never been to a waterfall.'], { y: 990, size: 40, lead: 1.3 });
  LC.slate(ctx, 3, 'THE SCREEN BETWEEN THEM  ·  INT. APARTMENT  ·  DAY');
  window.FRAME_READY = true;
})();
