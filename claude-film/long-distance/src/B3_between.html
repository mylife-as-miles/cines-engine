    const sg = p.createLinearGradient(PQ[0][0], PQ[0][1], PQ[0][0] + 120, PQ[0][1] + 160); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.1)'); sg.addColorStop(0.6, 'rgba(255,255,255,0)'); p.fillStyle = sg; p.fillRect(780, 300, 240, 420);
    p.restore(); p.strokeStyle = 'rgba(220,226,232,0.4)'; p.lineWidth = 1.2; p.stroke(quadPath(bodyQ, 26));
    // only her thumb is in front of it
    p.save(); p.globalCompositeOperation = 'destination-out'; p.drawImage(thumb.canvas, thumb.x, thumb.y); p.restore();
  }
  g.drawImage(phoneL.canvas, 0, 0);
  GG.drawHead(g, thumb, { shadow: { dx: 4, dy: 6, blur: 6, alpha: 0.4 }, tex: 0.4, texSeed: 74 });
  // the screen's light on her chin and on the coat (smooth)
  GG.glow(g, 900, 510, 300, '#BFF3F6', 0.24, 'screen', 1);
  E.save(); E.globalAlpha = 0.45; E.drawImage(phoneL.canvas, 0, 0); E.restore();

  f.finish({ grain: 0.1, fibre: 0.09, vignette: 0.42, halation: 0.35, seed: 7, afterPost: (c) => { c.drawImage(phoneL.canvas, 0, 0);
    GG.subtitle(c, 'Her', ['We’ve never taken this photo.', 'We’ve never been to a waterfall.'], { y: H - 62, size: 44 }); } });
  window.FRAME_READY = true;
})();
