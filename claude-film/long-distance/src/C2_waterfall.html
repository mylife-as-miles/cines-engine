<script>
/* LONG DISTANCE · LOOK C "HALF EMPTY" · C2 THE WATERFALL (INT. APARTMENT, living room, night)
   A frontal, centred elevation of the kitchen wall of the small flat: tidy for one, furnished for two. The tiles stop on the centre line.
   His half is lit by one warm pendant just beyond him: the fridge, the photo-booth strip under its magnet, the tiles, and him, his back
   to us, the pan lowered at his side, the fork standing in it; he has stopped chewing. Her half is dark plaster: the pale rectangle where
   a frame used to hang, two mugs on the shelf (hers with a ring of dust round its base), and on the counter, where she would stand beside
   him, the phone propped against the salt. It shines by its own cold light: the waterfall, her long hair, her head tipped against his,
   exactly as in the strip's last frame. The two pictures hang either side of the centre line; he has turned his back on the real one. */
(async () => {
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), { W, H } = OTM, P = LC.P;
  const f = OTM.frame(ctx, { seed: 21 });
  const g = f.world, E = f.emissive;
  const cam = LC.camera({ x: 0, y: 1.28, z: 0, f: 1500, cx: 960, cy: 662 });
  const p = cam.p, Q = a => LC.pathPts(cam.pts(a));
  const WZ = 2.62, CT = 0.92, CF = 2.02;
  const ICE = '#CBEEF7';
  const N = { plaster: '#433C36', tileL: '#9A8E7C', grout: '#5A5146', counter: '#4E463E', counterFront: '#2E2925', fridge: '#5C544B',
    shirt: '#2C2622', shirtR: '#C9A77E', skin: '#5E4436', skinD: '#3A2A22', skinL: '#C69373', hair: '#15110E', hairL: '#B98758' };
  const LAMP = [-0.54, 1.95, 1.92];

  // =====================================================================
  // 1. THE WALL: lit warm from his side, falling to dark on hers
  // =====================================================================
  g.fillStyle = N.plaster; g.fillRect(0, 0, W, H);
  { const c = p(LAMP[0], 1.35, WZ);
    LC.bands(g, null, c[0], c[1], [1800, 1300, 920, 600], ['#2F2A26', '#3B352F', '#4A423A', '#585046'], { sy: 0.8, soft: 22 });
    g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = LC.lin(g, 940, 0, 1920, 0, [[0, '#FFFFFF', 0], [0.4, '#4E4945', 0.62], [1, '#2A2725', 0.95]]); g.fillRect(940, 0, 980, H); g.restore(); }
  LC.mottle(g, null, { x: 0, y: 0, w: W, h: H }, 3, '#000000', 0.12, 0.004);
  // the pale rectangle where a frame used to hang, and its nail
  const PR = [0.3, 0.78, 1.6, 2.02];
  const prP = Q([[PR[0], PR[3], WZ], [PR[1], PR[3], WZ], [PR[1], PR[2], WZ], [PR[0], PR[2], WZ]]);
  { g.save(); g.clip(prP); g.globalCompositeOperation = 'screen'; g.fillStyle = 'rgba(52,48,44,0.5)'; g.fill(prP); g.restore();
    const nl = p((PR[0] + PR[1]) / 2, PR[3] - 0.035, WZ); g.fillStyle = '#191614'; g.beginPath(); g.arc(nl[0], nl[1], 3.2, 0, 7); g.fill(); g.fillStyle = 'rgba(0,0,0,0.3)'; g.fillRect(nl[0] - 1, nl[1] + 2, 2, 9); }
  // tiles on his half only; they end on the centre line
  const TT = 1.58;
  { const tileClip = Q([[-1.8, TT, WZ], [0, TT, WZ], [0, CT, WZ], [-1.8, CT, WZ]]);
    g.save(); g.clip(tileClip);
    const c = p(LAMP[0], 1.15, WZ);
    LC.bands(g, null, c[0], c[1], [1200, 800, 520, 300], ['#5E564B', '#6E6457', '#807464', '#938572'], { sy: 0.75, soft: 12 });
    g.globalCompositeOperation = 'multiply'; g.fillStyle = LC.lin(g, 0, 0, 960, 0, [[0.65, '#FFFFFF', 0], [1, '#8A8580', 0.5]]); g.fillRect(0, 0, 960, H); g.globalCompositeOperation = 'source-over';
    g.strokeStyle = N.grout; g.lineWidth = 1.5; g.globalAlpha = 0.65;
    for (let x = 0; x >= -1.8; x -= 0.1) { const a = p(x, CT, WZ), b = p(x, TT, WZ); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    for (let y = CT; y <= TT + 0.001; y += 0.1) { const a = p(-1.8, y, WZ), b = p(0, y, WZ); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    g.restore();
    const e0 = p(0, TT, WZ), e1 = p(0, CT, WZ); g.fillStyle = '#A89A84'; g.fillRect(e0[0] - 2, e0[1], 4, e1[1] - e0[1]);
    const t0 = p(-1.8, TT, WZ), t1 = p(0, TT, WZ); g.fillRect(t0[0], t0[1] - 2, t1[0] - t0[0] + 2, 4); }

  // =====================================================================
  // 2. HER HALF: the shelf and the two mugs (hers ringed with dust)
  // =====================================================================
  const SH = { x0: 0.12, x1: 0.88, y: 1.44, d: 0.2, t: 0.032 };
  LC.softShadow(g, Q([[SH.x0 + 0.02, SH.y - SH.t, WZ], [SH.x1, SH.y - SH.t, WZ], [SH.x1, SH.y - SH.t - 0.05, WZ], [SH.x0 + 0.02, SH.y - SH.t - 0.05, WZ]]), '#100E0C', 8, 0.55, 8, 4);

  function mug(x, z, side, body, dust) {
    const k = cam.k(z), r = 0.041 * k, b = p(x, SH.y, z), t = p(x, SH.y + 0.095, z), ey = r * 0.2;
    if (dust) { g.strokeStyle = 'rgba(160,150,138,0.5)'; g.lineWidth = 3; g.beginPath(); g.ellipse(b[0], b[1], r + 5, ey + 2.5, 0, 0, 7); g.stroke(); g.strokeStyle = 'rgba(160,150,138,0.18)'; g.lineWidth = 7; g.beginPath(); g.ellipse(b[0], b[1], r + 9, ey + 4, 0, 0, 7); g.stroke(); }
    const hx = b[0] + side * r; g.strokeStyle = LC.mix(body, '#000000', 0.3); g.lineWidth = 0.011 * k; g.beginPath(); g.ellipse(hx, (t[1] + b[1]) / 2 - 2, 0.022 * k, 0.028 * k, 0, -Math.PI / 2, Math.PI / 2, side < 0); g.stroke();

    g.strokeStyle = LC.mix(body, '#FFE6C4', 0.22); g.lineWidth = 1.6; g.beginPath(); g.ellipse(t[0], t[1], r, ey, 0, Math.PI, Math.PI * 1.9); g.stroke();
  }

  LC.fill(g, Q([[-1.8, CT, CF], [1.8, CT, CF], [1.8, CT - 0.035, CF], [-1.8, CT - 0.035, CF]]), '#5E544A');
  LC.fill(g, Q([[-1.8, CT - 0.035, CF], [1.8, CT - 0.035, CF], [1.8, 0, CF], [-1.8, 0, CF]]), N.counterFront);
  [-1.2, -0.6, 0, 0.6, 1.2].forEach(x => { const a = p(x, CT - 0.05, CF), b = p(x, 0, CF); g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(a[0] - 1.5, a[1], 3, b[1] - a[1]); });
  g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = LC.lin(g, 940, 0, 1920, 0, [[0, '#FFFFFF', 0], [0.35, '#65605B', 0.55], [1, '#34302D', 0.85]]); g.fillRect(940, p(0, CT, WZ)[1], 980, H); g.restore();

  // =====================================================================
  // 4. THE SALT, AND THE PHONE PROPPED AGAINST IT where she would stand. It makes its own light.
  // =====================================================================
  const SALT = [0.425, 2.26], PHC = [0.34, 2.1];
  const ph = LC.phone3d(cam, { c: [PHC[0], CT + 0.112, PHC[1]], w: 0.108, h: 0.236, t: 0.009, yaw: -0.2, pitch: 0.27 });
  const scr = ph.Fs.map(q => [q[0], q[1]]), bk = ph.Bs.map(q => [q[0], q[1]]);
  const phC = [(scr[0][0] + scr[2][0]) / 2, (scr[0][1] + scr[2][1]) / 2];
  // its cold light: a pool on the counter, a breath on the wall behind (added light, never paint)
  { const add = (clip, cx, cy, rx, sy, a) => { const Lr = LC.layer(); Lr.fillStyle = LC.rad(Lr, cx, cy, 0, rx, [[0, ICE, a], [0.35, ICE, a * 0.5], [1, ICE, 0]]); Lr.save(); Lr.translate(cx, cy); Lr.scale(1, sy); Lr.translate(-cx, -cy); Lr.fillRect(cx - rx, cy - rx, rx * 2, rx * 2); Lr.restore();
      g.save(); if (clip) g.clip(clip); g.globalCompositeOperation = 'screen'; g.drawImage(Lr.canvas, 0, 0); g.restore(); };
    add(ctop, phC[0] - 30, scr[3][1] + 8, 340, 0.22, 0.22);
    add(Q([[-0.02, 1.55, WZ], [1.8, 1.55, WZ], [1.8, CT, WZ], [-0.02, CT, WZ]]), phC[0] - 20, phC[1] - 30, 300, 0.8, 0.07); }
  // salt: a glass shaker, its steel cap, the screen caught in the glass
  { const k = cam.k(SALT[1]), b = p(SALT[0], CT, SALT[1]), t = p(SALT[0], CT + 0.1, SALT[1]), r = 0.028 * k;
    const glass = new Path2D(); glass.moveTo(b[0] - r, t[1] + 0.022 * k); glass.lineTo(b[0] - r * 0.92, b[1]); glass.ellipse(b[0], b[1], r * 0.92, 3, 0, Math.PI, 0, true); glass.lineTo(b[0] + r, t[1] + 0.022 * k); glass.closePath();
    LC.fill(g, glass, 'rgba(110,118,118,0.4)');
    g.save(); g.clip(glass); g.fillStyle = 'rgba(214,214,208,0.55)'; g.fillRect(b[0] - r, t[1] + 0.045 * k, r * 2, b[1] - t[1]); g.restore();
    g.strokeStyle = 'rgba(203,238,247,0.8)'; g.lineWidth = 2; g.beginPath(); g.moveTo(b[0] - r * 0.72, t[1] + 0.03 * k); g.lineTo(b[0] - r * 0.64, b[1] - 3); g.stroke();
    g.fillStyle = '#7A7C7B'; g.fill(LC.rrect(b[0] - r * 1.02, t[1], r * 2.04, 0.024 * k, 4)); g.fillStyle = 'rgba(203,238,247,0.6)'; g.fillRect(b[0] - r, t[1] + 2, r * 0.6, 0.02 * k); }
  // body, then the screen with the picture as it arrived (a single heart for a name)
  LC.softShadow(g, LC.pathPts([scr[3], scr[2], [scr[2][0] + 40, scr[2][1] + 5], [scr[3][0] + 40, scr[3][1] + 5]]), '#0C0A09', 6, 0.6);
  LC.fill(g, LC.pathPts([scr[1], bk[1], bk[2], scr[2]]), '#141416');
  LC.fill(g, LC.pathPts([scr[0], bk[0], bk[1], scr[1]]), '#202023');
  LC.fill(g, LC.rquad(scr, 12), '#0B0C0E');
  const pic = LC.photoView(LC.waterfall({ w: 360, h: 780, tight: true }));
  const ins = (q, kx, ky) => { const cx = (q[0][0] + q[2][0]) / 2, cy2 = (q[0][1] + q[2][1]) / 2; return q.map(v => [cx + (v[0] - cx) * kx, cy2 + (v[1] - cy2) * ky]); };
  const sq = ins(scr, 0.9, 0.955);
  { g.save(); g.clip(LC.rquad(sq, 9)); LC.quadImage(g, pic, sq, 40, [ph.Fs[0][2], ph.Fs[1][2]]);
    g.globalCompositeOperation = 'screen'; g.fillStyle = 'rgba(150,210,232,0.08)'; g.fill(LC.rquad(sq, 9));
    g.globalCompositeOperation = 'source-over'; g.fillStyle = LC.lin(g, sq[0][0], sq[0][1], sq[2][0], sq[2][1], [[0.18, '#FFFFFF', 0], [0.3, '#FFFFFF', 0.07], [0.4, '#FFFFFF', 0]]); g.fillRect(0, 0, W, H); g.restore(); }
  E.save(); E.fillStyle = OTM.rgba(ICE, 0.75); E.fill(LC.rquad(sq, 9)); E.restore();

  // =====================================================================
  // 5. THE FRIDGE on his side; on its door, under a magnet, the photo-booth strip
  // =====================================================================
  const FZ = 1.97, FX0 = -1.34, FX1 = -0.7;
  { const door = Q([[FX0, 1.96, FZ], [FX1, 1.96, FZ], [FX1, 0, FZ], [FX0, 0, FZ]]);
    { const side = Q([[FX1, 1.96, FZ], [FX1, 1.96, WZ], [FX1, CT, WZ], [FX1, CT, FZ]]); LC.fill(g, side, '#6A5E50');
      g.save(); g.clip(side); g.fillStyle = LC.lin(g, 0, p(FX1, 1.96, FZ)[1], 0, p(FX1, CT, FZ)[1], [[0, '#2E2925', 0.6], [0.35, '#2E2925', 0], [1, '#2E2925', 0.25]]); g.fillRect(0, 0, W, H); g.restore(); }
    LC.fill(g, door, '#3E3833');
    const c = p(LAMP[0] + 0.02, 1.4, FZ); LC.bands(g, door, c[0] + 60, c[1], [760, 520, 320], ['#433D37', '#4C453E', '#564E46'], { sy: 1.3, soft: 10 });
    const fr = p(FX0, 0.98, FZ), fr2 = p(FX1, 0.98, FZ); g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(fr[0], fr[1] - 2, fr2[0] - fr[0], 4);
    const hd0 = p(FX1 - 0.045, 1.62, FZ), hd1 = p(FX1 - 0.045, 1.08, FZ); g.fillStyle = '#2A2521'; g.fill(LC.rrect(hd0[0] - 7, hd0[1], 14, hd1[1] - hd0[1], 6)); g.fillStyle = 'rgba(255,214,160,0.32)'; g.fillRect(hd0[0] + 2, hd0[1] + 4, 3, hd1[1] - hd0[1] - 8); }
  // the strip: a print, lit only by the room (it makes no light of its own)
  { const k = cam.k(FZ), sw = 0.072 * k;
    const st = LC.boothStrip({ w: Math.round(sw * 2) });
    const sc = sw / st.width, sx = p(-0.86, 1.5, FZ);
    g.save(); g.translate(sx[0], sx[1]); g.rotate(0.05);
    LC.softShadow(g, (() => { const q = new Path2D(); q.rect(-sw / 2, 0, sw, st.height * sc); return q; })(), '#000000', 3, 0.55, 2, 3);
    g.drawImage(st, -sw / 2, 0, sw, st.height * sc);
    g.globalCompositeOperation = 'multiply'; g.fillStyle = LC.lin(g, -sw / 2, 0, sw / 2, 0, [[0, '#B89A78'], [1, '#D9BC96']]); g.fillRect(-sw / 2, 0, sw, st.height * sc); g.globalCompositeOperation = 'source-over';
    g.fillStyle = 'rgba(0,0,0,0.16)'; g.fillRect(-sw / 2, st.height * sc - 9, sw, 9);
    g.fillStyle = '#4A302A'; g.beginPath(); g.arc(1, 7, 12, 0, 7); g.fill(); g.fillStyle = 'rgba(255,220,190,0.28)'; g.beginPath(); g.arc(-3, 3, 4.5, 0, 7); g.fill();
    g.restore(); }

  // =====================================================================

  // =====================================================================
  { const k = cam.k(LAMP[2]), r = 0.15 * k, rim = p(LAMP[0], 1.98, LAMP[2]), top = p(LAMP[0], 2.17, LAMP[2]);
    g.strokeStyle = '#100E0D'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(rim[0], 0); g.lineTo(rim[0], top[1]); g.stroke();
    const dome = new Path2D(); dome.moveTo(rim[0] - r, rim[1]); dome.bezierCurveTo(rim[0] - r, rim[1] - r * 0.9, rim[0] - r * 0.25, top[1], rim[0], top[1]); dome.bezierCurveTo(rim[0] + r * 0.25, top[1], rim[0] + r, rim[1] - r * 0.9, rim[0] + r, rim[1]); dome.closePath();
    LC.fill(g, dome, '#1E1B18'); g.save(); g.clip(dome); g.fillStyle = LC.lin(g, rim[0] - r, 0, rim[0] + r, 0, [[0, '#000000', 0.2], [0.35, '#FFE2B8', 0.07], [1, '#000000', 0.35]]); g.fillRect(rim[0] - r, top[1], r * 2, rim[1] - top[1]); g.restore();
    g.fillStyle = '#F6D7A6'; g.beginPath(); g.ellipse(rim[0], rim[1], r * 0.97, r * 0.1, 0, 0, Math.PI); g.fill();
    E.save(); E.fillStyle = OTM.rgba('#FFD9A0', 0.55); E.beginPath(); E.ellipse(rim[0], rim[1] + 4, r * 1.0, r * 0.22, 0, 0, 7); E.fill(); E.restore(); }

  // =====================================================================
  // 7. HIM: his back to us, the lamp just beyond him (so his back is in its own shade, rimmed warm at the top),
  //    his head turned to the phone. The pan has sunk to his side, the fork standing in it. We get his face only as a lost profile,
  //    the line of the cheek and jaw lit cold from below by the screen.
  // =====================================================================
  const HW = [-0.39, 1.655, 1.78], HC = p(...HW), U = 0.235 * cam.k(HW[2]);
  const M = LC.frameM(HC[0], HC[1], U, 0), L = pts => LC.mapPts(M, pts), L1 = (x, y) => LC.ap(M, [x, y]);
  const WR = (path, dx, dy, w, col, o) => LC.crescent(g, path, dx, dy, w, col, o);
  // the pan: held level at his left side, forgotten; the noodles in it, the fork standing in them
  const PANC = L1(-2.05, 2.36), prx = 0.62 * U, pry = 0.13 * U;
  { const bowl = new Path2D(); bowl.moveTo(PANC[0] - prx, PANC[1]); bowl.ellipse(PANC[0], PANC[1], prx, pry, 0, Math.PI, 0, true); bowl.lineTo(PANC[0] + prx * 0.9, PANC[1] + 0.2 * U); bowl.ellipse(PANC[0], PANC[1] + 0.2 * U, prx * 0.9, pry * 0.9, 0, 0, Math.PI); bowl.closePath();
    LC.fill(g, bowl, '#151413');
    const rimE = new Path2D(); rimE.ellipse(PANC[0], PANC[1], prx, pry, 0, 0, 7); LC.fill(g, rimE, '#24211F');
    g.save(); g.clip(rimE); g.fillStyle = '#6E5236'; g.beginPath(); g.ellipse(PANC[0] + prx * 0.05, PANC[1] + pry * 0.25, prx * 0.7, pry * 0.6, 0, 0, 7); g.fill();
    g.strokeStyle = 'rgba(206,160,104,0.55)'; g.lineWidth = 1.8; for (let i = 0; i < 9; i++) { g.beginPath(); g.ellipse(PANC[0] - prx * 0.45 + i * prx * 0.11, PANC[1] + pry * 0.2, prx * 0.14, pry * 0.32, 0.4 * i, 0, Math.PI * 1.3); g.stroke(); }
    g.restore();
    g.strokeStyle = 'rgba(255,212,160,0.5)'; g.lineWidth = 2.2; g.beginPath(); g.ellipse(PANC[0], PANC[1], prx, pry, 0, Math.PI * 1.05, Math.PI * 1.75); g.stroke();
    const fk0 = L1(-1.86, 1.72), fk1 = L1(-1.96, 2.36); g.strokeStyle = '#8A8682'; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.moveTo(fk0[0], fk0[1]); g.lineTo(fk1[0], fk1[1]); g.stroke();
    g.strokeStyle = 'rgba(255,220,180,0.5)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(fk0[0] - 1, fk0[1]); g.lineTo(fk1[0] - 1, fk1[1] - 6); g.stroke();
    const hdl = LC.smooth(L([[-1.44, 2.3], [-1.18, 2.22], [-1.16, 2.3], [-1.42, 2.38]])); LC.fill(g, hdl, '#121110'); }
  // torso: a dark shape against the lit tiles, rimmed warm along the shoulders, cold down the side turned to the phone
  const torso = LC.smooth(L([[-0.22, 0.6], [-0.62, 0.74], [-0.96, 0.92], [-1.06, 1.16], [-1.02, 1.7], [-0.92, 2.4], [-0.9, 3.6], [0.84, 3.6], [0.84, 2.4], [0.9, 1.7], [0.92, 1.12], [0.8, 0.88], [0.46, 0.72], [0.18, 0.6]]));
  LC.softShadow(g, torso, '#0E0B0A', 20, 0.5, 14, 8);
  LC.fill(g, torso, N.shirt);
  { g.save(); g.clip(torso);
