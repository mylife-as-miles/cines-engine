  const crs = (pts, w, a) => { g.save(); g.strokeStyle = `rgba(30,34,40,${a})`; g.lineWidth = w; g.lineCap = 'round'; g.filter = 'blur(3px)'; g.stroke(LA.smooth(pts, true)); g.restore(); };
  crs([[gN[0] - 0.01 * kG, gN[1] + 0.12 * kG], [gN[0] + 0.03 * kG, gN[1] + 0.35 * kG], [gN[0] + 0.0 * kG, gN[1] + 0.6 * kG]], 10, 0.3);

    g.strokeStyle = '#363C46'; g.lineWidth = 0.012 * kk; g.beginPath(); g.ellipse(c[0] + 0.005 * kk, c[1] + 0.004 * kk, 0.075 * kk, 0.022 * kk, 0.08, Math.PI * 0.05, Math.PI * 0.95); g.stroke(); g.restore(); }
  // the bag: old, floral, faded, the zip broken open at one end; his thumb on it
  { const bc = BAG, bu = N([hisL[0], 0, hisL[2]]), bv = UP; const bw = 0.11, bh = 0.065;
    const Q = (a, b) => S(V(V(bc, bu, a * bw), bv, b * bh)); const kb = K(bc);
    const body = LA.smooth([Q(-1, -0.85), Q(-1.06, 0.45), Q(-0.75, 1.0), Q(0.75, 1.04), Q(1.06, 0.45), Q(1, -0.85), Q(0, -1.04)]);

    const t0 = Q(-0.78, 1.0), t1 = Q(0.2, 1.06); LA.limb(g, t0, t1, 0.024 * kb, 0.021 * kb, '#9A6A4E', { lit: '#B58467', litSide: -1, litA: 0.9 });

  f.finish({ letterbox: 0, grain: 0.05, fibre: 0, vignette: 0, halation: 0.45, beforePost: c => {
