<!doctype html><meta charset="utf-8"><title>Autopilot · YouTube thumbnails, round 2</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script src="../film/load.js"></script>
<script>
/* AUTOPILOT · YouTube thumbnails, round 2 (1280x720), in the idiom of One Too Many's: one hook, heavy outlined type,
   a question the viewer has to click to answer. Drawn from the film's own frames by the film's engine.
   ?v=c  the mirror, big and tilted on black, her face being swallowed by the shadow; AUTO / PILOT.
   ?v=d  the forgotten phone on the empty counter, full now: 4 missed calls, nobody named (A054); NOBODY ANSWERED.
   ?v=e  the poster: HIS PHONE WAS ON THE COUNTER. (Daniel's own words at the car) over a huge AUTO / PILOT, the mirror
   None of them shows what happened, or where Emily is.
   node tools/shoot.js "src/THUMB_youtube2.html?v=c" frames/THUMB_youtube_c.png 1280 720 3000 */
(async () => {
  const v = new URLSearchParams(location.search).get('v') || 'c';
  await FILM_LOAD('../', ['Q05', 'Q02']);
  const W = 1280, H = 720;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; document.body.appendChild(cv);
  const g = cv.getContext('2d');
  const frame = (id, t) => { const c = OTM.makeCanvas(1920, 1080); FILM.renderAt(FILM.lib[id].start + t, c.getContext('2d')); return c; };
  const R = OTM.rng('thumb2' + v);
  // heavy YouTube type: a thick black outline under the fill, a soft drop shadow
  function bold(text, x, y, size, fill, o = {}) {
    g.save(); g.font = `400 ${size}px "${o.font || 'Archivo Black'}"`; g.textAlign = o.align || 'left'; g.textBaseline = 'alphabetic';
    g.letterSpacing = (o.track || 0) + 'px'; g.lineJoin = 'round'; g.miterLimit = 2;
    g.shadowColor = 'rgba(0,0,0,0.75)'; g.shadowBlur = 24; g.shadowOffsetY = 8;
    g.lineWidth = o.stroke == null ? size * 0.16 : o.stroke; g.strokeStyle = '#050505'; g.strokeText(text, x, y);
    g.shadowColor = 'transparent'; g.fillStyle = fill; g.fillText(text, x, y); g.restore();
  }
  function glowText(text, x, y, size, fill, glow, o = {}) {
    g.save(); g.font = `400 ${size}px "${o.font}"`; g.textAlign = o.align || 'left'; g.letterSpacing = (o.track || 0) + 'px';
    for (const [b, a] of [[60, 0.55], [26, 0.6], [8, 0.7]]) { g.shadowColor = glow; g.shadowBlur = b; g.globalAlpha = a; g.fillStyle = fill; g.fillText(text, x, y); }
    g.shadowBlur = 0; g.globalAlpha = 1; g.fillStyle = fill; g.fillText(text, x, y); g.restore();
  }
  function grain(a) {
    const n = OTM.makeCanvas(320, 180), ng = n.getContext('2d'), im = ng.createImageData(320, 180);
    for (let i = 0; i < im.data.length; i += 4) { const k = 128 + (R() - 0.5) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = k; im.data[i + 3] = 255; }
    ng.putImageData(im, 0, 0); g.save(); g.globalAlpha = a; g.globalCompositeOperation = 'overlay'; g.imageSmoothingEnabled = false; g.drawImage(n, 0, 0, W, H); g.restore();
  }
  function vignette(a, cx = W / 2, cy = H / 2) { const vg = g.createRadialGradient(cx, cy, H * 0.25, cx, cy, W * 0.78); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = vg; g.fillRect(0, 0, W, H); }
  const rr = (x, y, w, h, r) => { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; };

  if (v === 'c') {
    const f = frame('Q05', 40.4);
    g.fillStyle = '#030607'; g.fillRect(0, 0, W, H);
    // a cold halo behind the mirror, as if the low sun were behind it
    const halo = g.createRadialGradient(780, 280, 40, 780, 280, 700); halo.addColorStop(0, 'rgba(255,236,196,0.32)'); halo.addColorStop(0.45, 'rgba(160,140,110,0.1)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = halo; g.fillRect(0, 0, W, H);
    // the mirror, close and tilted, clipped to its own rounded glass: a crop inside the glass at 1.5x, so her face
    // reads at feed size (the glass runs x 425-1475, y 235-600 in the frame; her face is about x 1060-1180)
    const S = 1.5, cx0 = 1030, cy0 = 418, cw = 840, ch = 352, mw = cw * S, mh = ch * S;
    g.save(); g.translate(752, 296); g.rotate(-0.06); g.filter = 'brightness(1.12) contrast(1.06)';
    g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 60; g.shadowOffsetY = 26; g.fillStyle = '#0b0d0e'; g.fill(rr(-mw / 2 - 20, -mh / 2 - 18, mw + 40, mh + 36, 250)); g.shadowColor = 'transparent';
    g.save(); g.clip(rr(-mw / 2, -mh / 2, mw, mh, 240));
    g.drawImage(f, cx0 - cw / 2, cy0 - ch / 2, cw, ch, -mw / 2, -mh / 2, mw, mh);
    // the shade swallowing her: an edge through the middle of her face, then black
    const fx = (1140 - cx0) * S;
    const sh = g.createLinearGradient(fx - 20, 0, fx + 140, 0); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.84)'); g.fillStyle = sh; g.fillRect(-mw / 2, -mh / 2, mw, mh);
    g.restore();
    g.lineWidth = 6; g.strokeStyle = 'rgba(255,236,206,0.35)'; g.stroke(rr(-mw / 2 - 4, -mh / 2 - 4, mw + 8, mh + 8, 244));
    g.restore();
    vignette(0.7, 800, 300);
    bold('AUTO', 50, 560, 150, '#FFFFFF');
    bold('PILOT.', 50, 690, 150, '#FFD23F');
  } else if (v === 'd') {
    const k = frame('Q02', 27.0);
    // the empty kitchen, out of focus behind the phone
    g.filter = 'blur(5px) brightness(0.7)'; g.drawImage(k, 380, 60, 1540, 866, -30, -10, W + 60, H + 20); g.filter = 'none';
    const dk = g.createLinearGradient(0, 0, W, 0); dk.addColorStop(0, 'rgba(0,0,0,0.25)'); dk.addColorStop(0.55, 'rgba(0,0,0,0.05)'); dk.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = dk; g.fillRect(0, 0, W, H);
    // the phone, close and tilted, lighting up with the calls nobody is there to hear
    g.save(); g.translate(360, 372); g.rotate(-0.07);
    const pw = 330, ph = 676;
    g.shadowColor = 'rgba(0,0,0,0.85)'; g.shadowBlur = 50; g.shadowOffsetY = 24; g.fillStyle = '#0a0c0d'; g.fill(rr(-pw / 2, -ph / 2, pw, ph, 56)); g.shadowColor = 'transparent';
    g.fillStyle = '#1c2124'; g.fill(rr(-pw / 2 + 6, -ph / 2 + 6, pw - 12, ph - 12, 50));
    const sx = -pw / 2 + 16, sy = -ph / 2 + 16, sw = pw - 32, shh = ph - 32;
    g.save(); g.clip(rr(sx, sy, sw, shh, 42));
    const scr = g.createLinearGradient(0, sy, 0, sy + shh); scr.addColorStop(0, '#1a2a30'); scr.addColorStop(1, '#0b1215'); g.fillStyle = scr; g.fillRect(sx, sy, sw, shh);
    g.fillStyle = '#000'; g.fill(rr(-46, sy + 14, 92, 26, 13));
    g.fillStyle = '#EEF3F0'; g.textAlign = 'center'; g.font = '300 106px "Libre Franklin"'; g.fillText('2:14', 0, sy + 180);
    // the notification: four missed calls, nobody named. A054 has it ring with nobody there to hear it, and leaves who
    // rang unsaid; a name (the nursery) would tell the audience where Emily isn't before the film does.
    const ny = sy + 226, nh = 84;
    g.fillStyle = 'rgba(232,240,236,0.95)'; g.fill(rr(sx + 18, ny, sw - 36, nh, 26));
    g.fillStyle = '#E04A3A'; g.beginPath(); g.arc(sx + 62, ny + nh / 2, 24, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.font = '700 25px "Libre Franklin"'; g.fillText('4', sx + 62, ny + nh / 2 + 9);
    g.textAlign = 'left'; g.fillStyle = '#111'; g.font = '700 27px "Libre Franklin"'; g.fillText('Missed calls', sx + 98, ny + nh / 2 + 10);
    // the charging glyph the film plants at 6:14, full now: green, at the foot of the lock screen
    const by = sy + shh - 150; g.lineWidth = 4; g.strokeStyle = '#7BE6A0'; g.strokeRect(-46, by, 84, 38); g.fillStyle = '#7BE6A0'; g.fillRect(40, by + 11, 7, 16);
    g.fillStyle = 'rgba(123,230,160,0.9)'; g.fillRect(-40, by + 6, 72, 26);
    g.fillStyle = '#0b1215'; g.beginPath(); g.moveTo(-2, by + 6); g.lineTo(-14, by + 21); g.lineTo(-2, by + 21); g.lineTo(-8, by + 33); g.lineTo(10, by + 15); g.lineTo(-2, by + 15); g.lineTo(4, by + 6); g.closePath(); g.fill();
    g.textAlign = 'center'; g.fillStyle = '#9CF2BA'; g.font = '600 24px "Libre Franklin"'; g.fillText('100%', 0, by + 72);
    // the screen's glow and a glare across the glass
    const gl = g.createLinearGradient(sx, sy, sx + sw, sy + shh); gl.addColorStop(0.2, 'rgba(255,255,255,0)'); gl.addColorStop(0.32, 'rgba(255,255,255,0.10)'); gl.addColorStop(0.38, 'rgba(255,255,255,0)'); g.fillStyle = gl; g.fillRect(sx, sy, sw, shh);
    g.restore();
    // the cable, plugged in, running off across the counter
    g.strokeStyle = '#DADFDB'; g.lineWidth = 9; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, ph / 2 - 4); g.bezierCurveTo(10, ph / 2 + 60, -160, ph / 2 + 40, -330, ph / 2 + 110); g.stroke();
    g.fillStyle = '#E8ECE8'; g.fillRect(-12, ph / 2 - 16, 24, 22);
    g.restore();
    vignette(0.55, 420, 360);
    // the type keeps out of the bottom-right corner, where YouTube puts the running time
    bold('NOBODY', 1240, 236, 104, '#FFFFFF', { align: 'right' });
    bold('ANSWERED.', 1240, 356, 104, '#FF3B30', { align: 'right' });
    bold('AUTOPILOT', 1236, 466, 60, '#FFFFFF', { align: 'right', track: 6, stroke: 9 });
  } else {
    const f = frame('Q05', 40.4);
    g.fillStyle = '#040707'; g.fillRect(0, 0, W, H);
    // the mirror on the right, floating in the dark, her face going into the shade
    const S = 1.25, cx0 = 1100, cy0 = 420, cw = 680, ch = 340, mw = cw * S, mh = ch * S;   // a crop inside the glass, as in C
    g.save(); g.translate(900, 392); g.rotate(-0.05); g.filter = 'brightness(1.1)';
    g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 50; g.fillStyle = '#0b0d0e'; g.fill(rr(-mw / 2 - 14, -mh / 2 - 12, mw + 28, mh + 24, 206)); g.shadowColor = 'transparent';
    g.save(); g.clip(rr(-mw / 2, -mh / 2, mw, mh, 196));
    g.drawImage(f, cx0 - cw / 2, cy0 - ch / 2, cw, ch, -mw / 2, -mh / 2, mw, mh);
    const fx = (1140 - cx0) * S;
    const sh = g.createLinearGradient(fx - 20, 0, fx + 140, 0); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.82)'); g.fillStyle = sh; g.fillRect(-mw / 2, -mh / 2, mw, mh);
    g.restore(); g.lineWidth = 4; g.strokeStyle = 'rgba(255,236,206,0.3)'; g.stroke(rr(-mw / 2 - 3, -mh / 2 - 3, mw + 6, mh + 6, 198)); g.restore();
    vignette(0.6, 900, 400);
    // the poster's type
    g.save(); g.fillStyle = '#E6E0D2'; g.font = '600 42px "Barlow Condensed"'; g.letterSpacing = '5px'; g.fillText('HIS PHONE WAS ON THE COUNTER.', 60, 96); g.restore();
    g.save(); g.font = '400 330px "Six Caps"'; g.letterSpacing = '8px'; g.fillStyle = '#F1ECE1'; g.fillText('AUTO', 52, 408); g.restore();
    glowText('PILOT', 52, 690, 330, '#9CF2BA', 'rgba(123,230,160,0.9)', { font: 'Six Caps', track: 8 });
  }
  window.FRAME_READY = true;
})();
</script>
