<!doctype html><meta charset="utf-8"><title>B3 THE DOOR</title>
<script src="../kit/otm.js"></script><script src="../kit/look_b.js"></script>
<script>
// AUTOPILOT · LOOK B "BRIGHT DAY" · 03 THE DOOR
// EXT. NURSERY CAR PARK - DUSK. The colour has gone out of the world. Daniel is on his knees beside the car's open rear door, folded
// forward, head down, one arm reaching in past the door's edge. The door and his body hide the doorway completely (and the doorway
// itself is only shadow). The sun is low on the left: it sinks out of the door's dark glass. The empty swing's long shadow reaches
// across the tarmac to his knees.
(async () => {
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), { W, H } = OTM;
  const f = OTM.frame(ctx, { seed: 31 });
  const g = f.world, E = f.emissive;
  const P = LB.cam({ x: 0, y: 0.9, z: 0, f: 1600, cx: 960, cy: 470 });
  const Q = pts => LB.poly(pts.map(p => P(p[0], p[1], p[2])));
  const fillQ = (pts, col) => { g.fillStyle = col; g.fill(Q(pts)); };

  // ---------- palette: desaturated violet dusk (every colour of the day, drained) ----------
  const K = {
    sky0: '#29253F', sky1: '#352F52', sky2: '#443D64', sky3: '#5A5278', sky4: '#776C8F', sky5: '#968AA6',
    tree: '#3A3452', bldg: '#5C5373', bldgTop: '#4C4463', mural: '#6E6589', ply: '#9089A3', notice: '#B9B2C7', bldgWin: '#463F60',
    tarmac: '#8A7F9C', tarmacFar: '#7A7091', line: '#978DAC', kerb: '#968CAA', rubber: '#6F6588',
    swing: '#3A3352', chain: '#4A4262', cast: '#4D446A',
    car: '#8E7889', carShade: '#685770', carDeep: '#43384F', carLow: '#59496A', glass: '#2C2639', tyre: '#3B344B', rim: '#8D83A3', lamp: '#BDB4CB',
    door: '#9C8697', doorShade: '#74607A', doorway: '#16121E',
    sunRef: '#F4F0F8', collar: '#BDB5CF', sole: '#625A78',
  };

  // ======================= SKY: posterised dusk bands, a little brighter toward the low sun on the left =======================
  [[0, K.sky0], [0.1, K.sky1], [0.18, K.sky2], [0.245, K.sky3], [0.29, K.sky4], [0.33, K.sky5]].forEach(([t, col]) => { g.fillStyle = col; g.fillRect(0, t * H, W, H); });
  g.save(); g.globalCompositeOperation = 'screen'; { const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, 'rgba(170,150,170,0.32)'); gr.addColorStop(0.55, 'rgba(170,150,170,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, 420); } g.restore();

  // ======================= BACKGROUND: a low treeline, the nursery far off (its painted animals drained), the boarded front door =======================
  const BZ = 26;
  g.fillStyle = K.tree;
  for (let i = 0; i < 40; i++) { const x = -26 + i * 1.4, r = 0.8 + 0.55 * OTM.vnoise(i * 0.7, 3, 7), c = P(x, 3.2 + 0.45 * OTM.vnoise(i * 0.9, 1, 9), BZ + 3), s = P.k(BZ + 3); g.fill(LB.ell(c[0], c[1], r * s, r * s * 0.72)); }
  { const a = P(0, 3.05, BZ + 3); g.fillRect(0, a[1], W, 300); }
  const BX0 = -24, BX1 = 28, BH = 2.8;
  fillQ([[BX0, 0, BZ], [BX1, 0, BZ], [BX1, BH, BZ], [BX0, BH, BZ]], K.bldg);
  fillQ([[BX0, BH, BZ], [BX1, BH, BZ], [BX1, BH + 0.3, BZ], [BX0, BH + 0.3, BZ]], K.bldgTop);
  for (let x = -22.5; x < 27; x += 2.8) { if (x > 11.6 && x < 15.6) continue; fillQ([[x, 1.05, BZ - 0.01], [x + 1.3, 1.05, BZ - 0.01], [x + 1.3, 2.25, BZ - 0.01], [x, 2.25, BZ - 0.01]], K.bldgWin); }
  g.save(); g.clip(Q([[BX0, 0, BZ], [BX1, 0, BZ], [BX1, BH, BZ], [BX0, BH, BZ]])); g.fillStyle = K.mural;
  const sB = P.k(BZ), at = (x, y) => P(x, y, BZ - 0.005);
  // an elephant (between the swings and the car)
  { const a = at(-6.4, 0.25); g.fill(LB.ell(a[0], a[1] - 0.62 * sB, 0.78 * sB, 0.55 * sB)); g.fill(LB.ell(a[0] + 0.78 * sB, a[1] - 0.82 * sB, 0.36 * sB, 0.4 * sB));
    g.fill(LB.capsule(a[0] + 1.02 * sB, a[1] - 0.7 * sB, 0.09 * sB, a[0] + 1.1 * sB, a[1] - 0.12 * sB, 0.07 * sB));
    [-0.5, -0.15, 0.25, 0.55].forEach(dx => g.fill(LB.rr(a[0] + dx * sB - 0.08 * sB, a[1] - 0.3 * sB, 0.16 * sB, 0.3 * sB, 0.05 * sB))); }
  // a giraffe (behind the swings)
  { const a = at(-13.4, 0.25); g.fill(LB.ell(a[0], a[1] - 0.75 * sB, 0.5 * sB, 0.28 * sB)); g.fill(LB.capsule(a[0] + 0.32 * sB, a[1] - 0.85 * sB, 0.1 * sB, a[0] + 0.62 * sB, a[1] - 2.2 * sB, 0.08 * sB)); g.fill(LB.ell(a[0] + 0.72 * sB, a[1] - 2.26 * sB, 0.2 * sB, 0.11 * sB, 0.2));
    [-0.3, 0.3].forEach(dx => g.fill(LB.rr(a[0] + dx * sB - 0.05 * sB, a[1] - 0.6 * sB, 0.1 * sB, 0.6 * sB, 0.04 * sB))); }
  // a duck (far right, by the boarded door)
  { const a = at(17.6, 0.3); g.fill(LB.ell(a[0], a[1] - 0.4 * sB, 0.5 * sB, 0.32 * sB)); g.fill(LB.ell(a[0] - 0.42 * sB, a[1] - 0.82 * sB, 0.24 * sB, 0.24 * sB)); g.fill(LB.poly([[a[0] - 0.62 * sB, a[1] - 0.84 * sB], [a[0] - 0.86 * sB, a[1] - 0.78 * sB], [a[0] - 0.62 * sB, a[1] - 0.74 * sB]])); }
  g.restore();
  // the boarded main entrance and its notice (far right)
  fillQ([[12.8, 0, BZ - 0.01], [14.4, 0, BZ - 0.01], [14.4, 2.2, BZ - 0.01], [12.8, 2.2, BZ - 0.01]], K.ply);
  fillQ([[13.4, 1.38, BZ - 0.02], [13.82, 1.38, BZ - 0.02], [13.82, 1.72, BZ - 0.02], [13.4, 1.72, BZ - 0.02]], K.notice);

  // ======================= GROUND =======================
  { const gp = Q([[-40, 0, 1], [40, 0, 1], [40, 0, BZ], [-40, 0, BZ]]); const yA = P(0, 0, BZ)[1]; LB.grad(g, gp, 0, yA, 0, H, [[0, K.tarmacFar], [0.3, K.tarmac], [1, '#837898']]); }
  // the playground's rubber surface on the left and its kerb running back; a low railing round it
  fillQ([[-30, 0, 1], [-0.95, 0, 1], [-2.6, 0, 16], [-30, 0, 16]], K.rubber);
  { const a = P(-0.95, 0.001, 2.2), b = P(-2.6, 0.001, 16); g.strokeStyle = K.kerb; g.lineWidth = 5; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  for (let i = 0; i <= 26; i++) { const z = 12.5, x = -16 + i * 0.52, a = P(x, 0, z), b = P(x, 0.95, z); g.strokeStyle = '#584F72'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  { const a = P(-16, 0.95, 12.5), b = P(-2.45, 0.95, 12.5); g.strokeStyle = '#584F72'; g.lineWidth = 4; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  // parking bays
  const bayLine = (x0, z0, x1, z1, w) => { const n = [z1 - z0, -(x1 - x0)], L = Math.hypot(...n), k = w / 2 / L; g.fillStyle = K.line; g.fill(Q([[x0 - n[0] * k, 0.001, z0 - n[1] * k], [x1 - n[0] * k, 0.001, z1 - n[1] * k], [x1 + n[0] * k, 0.001, z1 + n[1] * k], [x0 + n[0] * k, 0.001, z0 + n[1] * k]])); };
  [-1.3, 2.8, 6.9].forEach(x => bayLine(x, 3.6, x + 0.5, 10.2, 0.12));
  bayLine(-1.0, 10.1, 14, 11.2, 0.12);

  // ======================= THE LOW SUN (left, just in front of us) and the long shadows =======================
  const sh = [0.988, 0.154], tanE = 0.27;           // shadows run right and a little away; the sun is ~15 degrees up
  const onGround = (x, y, z) => [x + sh[0] * y / tanE, 0.002, z + sh[1] * y / tanE];
  const cast = (draw) => { const L = LB.layer(); L.fillStyle = '#000'; L.strokeStyle = '#000'; draw(L); g.save(); g.globalCompositeOperation = 'multiply'; g.filter = 'blur(1.6px)'; g.drawImage(LB.tint(L.canvas, K.cast), 0, 0); g.restore(); };
  const gLine = (L, a3, b3, w) => { const A = P(...onGround(...a3)), B = P(...onGround(...b3)); L.lineWidth = w; L.lineCap = 'round'; L.beginPath(); L.moveTo(A[0], A[1]); L.lineTo(B[0], B[1]); L.stroke(); };
  const gPoly = (L, pts3) => L.fill(Q(pts3.map(p => onGround(...p))));

  // swing set (left): the beam runs back in depth between two A-frames; the swings hang side-on, still
  const SX = -2.6, SZ0 = 4.4, SZ1 = 7.2, BEAM = 2.2, SPL = 0.62;
  const swings = [{ z: 5.1, seat: 0.46, bucket: false }, { z: 6.35, seat: 0.48, bucket: false }];
  // car geometry (needed for shadows)
  const phi = 0.08, eu = [Math.cos(phi), Math.sin(phi)], en = [Math.sin(phi), -Math.cos(phi)], O = [-0.98, 5.95], CW = 1.72;
  const C3 = (u, v, n) => [O[0] + u * eu[0] + n * en[0], v, O[1] + u * eu[1] + n * en[1]];
  const CP = (u, v, n) => P(...C3(u, v, n || 0));
  const theta = 0.7, HU = 2.0, DL = 0.86;            // door open ~40 degrees: its edge lands exactly on the doorway's rear edge
  const dd = [Math.cos(theta) * eu[0] + Math.sin(theta) * en[0], Math.cos(theta) * eu[1] + Math.sin(theta) * en[1]];
  const hinge = C3(HU, 0, 0);
  const D3 = (s, v) => [hinge[0] + s * dd[0], v, hinge[2] + s * dd[1]];
  const DP = (s, v) => P(...D3(s, v));
  const kn = C3(3.2, 0, 0.5);                        // Daniel's knees
  cast(L => {
    // A-frame legs and beam
    [SZ0, SZ1].forEach(z => [-SPL, SPL].forEach(dx => gLine(L, [SX + dx, 0, z], [SX, BEAM, z], 0.075 * P.k(z) * 0.9)));
    gLine(L, [SX, BEAM, SZ0], [SX, BEAM, SZ1], 0.09 * P.k(6));
    // the swings: chains and seats; the near (bucket) seat's shadow ends at Daniel's knees
    swings.forEach(s => {
      [-0.17, 0.17].forEach(dx => gLine(L, [SX + dx, s.seat + 0.12, s.z], [SX + dx, BEAM, s.z], 2.2));
      gPoly(L, [[SX - 0.2, s.seat, s.z - 0.2], [SX + 0.2, s.seat, s.z - 0.2], [SX + 0.2, s.seat + (s.bucket ? 0.26 : 0.05), s.z + 0.2], [SX - 0.2, s.seat + (s.bucket ? 0.26 : 0.05), s.z + 0.2]]);
    });
    // the car's long shadow, and the door's
    gPoly(L, [C3(0.15, 0, 0.02), C3(0.15, 0.95, 0.02), C3(1.72, 1.43, 0.02), C3(3.2, 1.49, 0.02), C3(3.78, 1.0, 0.02), C3(3.78, 1.0, -CW), C3(3.78, 0, -CW)]);
    gPoly(L, [D3(0, 0), D3(DL, 0), D3(DL, 1.4), D3(0.02, 1.49)]);
    // Daniel's own
    gPoly(L, [[kn[0] - 0.25, 0, kn[2]], [kn[0] + 0.45, 0, kn[2] + 0.05], [kn[0] + 0.3, 1.0, kn[2]], [kn[0] - 0.2, 1.05, kn[2]]]);
  });

  // ---- the swing set itself (dark against the sky and the far wall) ----
  {
    [SZ1, SZ0].forEach(z => { const s = P.k(z), top = P(SX, BEAM, z); [-SPL, SPL].forEach(dx => { const ft = P(SX + dx, 0, z); g.fillStyle = K.swing; g.fill(LB.capsule(top[0], top[1], 0.045 * s, ft[0], ft[1], 0.05 * s)); }); });
    { const a = P(SX, BEAM, SZ0), b = P(SX, BEAM, SZ1); g.strokeStyle = K.swing; g.lineCap = 'round'; g.lineWidth = 0.09 * P.k(SZ0); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
    swings.forEach(sw => {
      const s = P.k(sw.z);
      [-0.17, 0.17].forEach(dx => { const a = P(SX + dx * 0.2, BEAM, sw.z - dx), b = P(SX + dx * 0.2, sw.seat + 0.1, sw.z - dx); g.strokeStyle = K.chain; g.lineWidth = Math.max(1.6, 0.016 * s); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); });
      const c = P(SX, sw.seat, sw.z);
      g.fillStyle = K.swing;
      if (sw.bucket) g.fill(LB.spline([[c[0] - 0.2 * s, c[1] - 0.42 * s, 1], [c[0] - 0.12 * s, c[1] - 0.42 * s, 1], [c[0] - 0.1 * s, c[1] - 0.1 * s], [c[0] + 0.06 * s, c[1] - 0.04 * s], [c[0] + 0.16 * s, c[1] - 0.16 * s, 1], [c[0] + 0.22 * s, c[1] - 0.14 * s, 1], [c[0] + 0.16 * s, c[1] + 0.04 * s], [c[0] - 0.02 * s, c[1] + 0.09 * s], [c[0] - 0.18 * s, c[1] + 0.02 * s], [c[0] - 0.24 * s, c[1] - 0.2 * s]], true));
      else g.fill(LB.rr(c[0] - 0.22 * s, c[1] - 0.025 * s, 0.44 * s, 0.05 * s, 4));
    });
  }

  // ======================= THE CAR (side-on, front to the left; its cherry red drained to mauve) =======================
  LB.blob(g, LB.poly([CP(0.3, 0, 0.06), CP(3.6, 0, 0.06), CP(3.6, 0, -0.5), CP(0.3, 0, -0.5)]), '#231D30', 0.7, 9);
  const prof = [[0.1, 0.26, 1], [0.02, 0.42], [0.03, 0.62], [0.22, 0.8], [0.95, 0.91], [1.16, 0.96], [1.72, 1.43], [2.2, 1.5], [3.2, 1.49], [3.58, 1.36], [3.78, 0.98], [3.82, 0.6], [3.8, 0.42], [3.72, 0.26, 1]];
  const body = LB.spline(prof.map(p => { const q = CP(p[0], p[1], 0); return p[2] ? [q[0], q[1], 1] : q; }), true);
  { const nearF = [[0.1, 0.26], [0.02, 0.42], [0.03, 0.62], [0.22, 0.8]]; g.fillStyle = K.car; g.fill(LB.poly(nearF.map(p => CP(p[0], p[1], 0)).concat(nearF.slice().reverse().map(p => CP(p[0] + 0.06, p[1], -CW))))); }
  g.fillStyle = K.carShade; g.fill(body);
  g.save(); g.clip(body);
  g.fillStyle = '#78667C'; g.fill(LB.poly([CP(0, 0.7), CP(4, 0.76), CP(4, 1.0), CP(0, 1.0)]));
  g.fillStyle = K.carLow; g.fill(LB.poly([CP(0, 0.2), CP(4, 0.2), CP(4, 0.44), CP(0, 0.44)]));
  const gWin = pts => { const p = LB.spline(pts.map(q => { const r = CP(q[0], q[1]); return q[2] ? [r[0], r[1], 1] : r; }), true); g.fillStyle = K.glass; g.fill(p); g.save(); g.clip(p); g.fillStyle = 'rgba(140,125,170,0.32)'; g.fill(LB.poly([CP(0, 1.3), CP(4, 1.34), CP(4, 1.6), CP(0, 1.6)])); g.restore(); };
  gWin([[1.3, 1.0, 1], [1.96, 1.0, 1], [1.96, 1.42, 1], [1.74, 1.42, 1]]);
  gWin([[2.97, 1.0, 1], [3.55, 1.0, 1], [3.6, 1.1], [3.4, 1.38, 1], [2.97, 1.42, 1]]);
  // the doorway of the rear door: nothing but shadow (we do not see inside)
  g.fillStyle = K.doorway; g.fill(LB.poly([CP(2.0, 0.28), CP(2.9, 0.28), CP(2.9, 1.5), CP(2.0, 1.5)]));
  { const a = CP(1.2, 0.3), b = CP(1.2, 0.99); g.strokeStyle = K.carDeep; g.lineWidth = 2.5; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); const hh = CP(1.78, 0.86); g.fillStyle = K.carDeep; g.fill(LB.rr(hh[0] - 20, hh[1] - 4, 40, 8, 4)); }
  g.restore();
  { const m = CP(1.3, 1.02, 0.12); g.fillStyle = K.carShade; g.fill(LB.rr(m[0] - 28, m[1] - 19, 42, 27, 9)); }
  { const c = CP(0.08, 0.66, -0.18); g.fillStyle = K.lamp; g.fill(LB.ell(c[0], c[1], 10, 19)); }
  { const pts = [CP(1.72, 1.43), CP(2.2, 1.5), CP(3.2, 1.49), CP(3.58, 1.36)]; g.strokeStyle = '#A897B1'; g.lineWidth = 3; g.lineCap = 'round'; g.stroke(LB.spline(pts, false)); }
  [0.72, 3.06].forEach(u => {
    const c = CP(u, 0.33, 0.03), s = P.k(C3(u, 0.33, 0)[2]), r = 0.33 * s;
    g.fillStyle = K.carDeep; g.fill(LB.ell(c[0], c[1] - 3, r * 1.12, r * 1.12));
    g.fillStyle = K.tyre; g.fill(LB.ell(c[0], c[1], r, r));
    g.fillStyle = K.rim; g.fill(LB.ell(c[0], c[1], r * 0.56, r * 0.56));
    g.fillStyle = '#7A7093'; g.fill(LB.ell(c[0] + r * 0.06, c[1] + r * 0.04, r * 0.4, r * 0.4));
    g.fillStyle = K.tyre; g.fill(LB.ell(c[0], c[1], r * 0.14, r * 0.14));
  });

  // ======================= DANIEL: on his knees at the doorway, folded forward, head down, one arm reaching in =======================
  {
    const s = P.k(kn[2]), hu = 0.45 * s;
    const K0 = P(...kn);
    const T = (x, y) => [K0[0] + x * hu, K0[1] - y * hu];
    const parts = [];
    // both knees down; both shins flat on the tarmac behind him, toward us; soles up
    parts.push(LB.capsule(...T(-0.22, 0.16), hu * 0.17, ...T(0.5, 0.02), hu * 0.14));          // far shin (higher, further)
    parts.push(LB.capsule(...T(0.08, 0.06), hu * 0.18, ...T(0.86, -0.22), hu * 0.15));         // near shin
    parts.push(LB.ell(...T(0.6, 0.02), hu * 0.17, hu * 0.11, -0.35));                          // far shoe
    parts.push(LB.ell(...T(0.96, -0.2), hu * 0.2, hu * 0.12, -0.35));                          // near shoe
    // thighs upright, side by side, hips
    parts.push(LB.roundPoly([T(-0.4, 0.1), T(0.3, 0.0), T(0.38, 1.02), T(-0.26, 1.08)], hu * 0.18));
    // the back: slumped, rounded, leaning a little toward the car
    parts.push(LB.spline([T(-0.32, 1.0), T(0.4, 0.98), T(0.5, 1.48), T(0.38, 1.92), T(0.08, 2.14), T(-0.32, 2.12), T(-0.6, 1.88), T(-0.52, 1.44)], true));
    // near arm: hanging away from his side, the hand open on his thigh
    parts.push(LB.capsule(...T(0.36, 1.9), hu * 0.14, ...T(0.64, 1.36), hu * 0.12));
    parts.push(LB.capsule(...T(0.64, 1.36), hu * 0.12, ...T(0.5, 0.86), hu * 0.105));
    parts.push(LB.ell(...T(0.44, 0.8), hu * 0.15, hu * 0.1, 0.6));
    // far arm: reaching forward into the car, past the door's edge (the door, drawn after, hides the rest)
    parts.push(LB.capsule(...T(-0.48, 1.9), hu * 0.15, ...T(-1.3, 1.64), hu * 0.13));
    // head: bowed low, hanging in front of his shoulders, the back of it toward us
    const hc = T(-0.42, 2.14);
    parts.push(LB.ell(hc[0], hc[1], hu * 0.5, hu * 0.49, 0.45));
    parts.push(LB.ell(hc[0] + hu * 0.4, hc[1] + hu * 0.24, hu * 0.08, hu * 0.12, 0.45));
    LB.blob(g, LB.ell(...T(0.3, -0.06), hu * 1.0, hu * 0.13), '#1A1626', 0.6, 6);
    LB.figure(g, parts, { light: { dx: -1, dy: -0.4 }, shadeW: hu * 0.2, liftW: hu * 0.09, liftAlpha: 0.6, lift: '#302B44', rim: '#A79CC0', rimW: 2.2, rimAlpha: 0.6 });
    // soles, a shade paler
    g.fillStyle = K.sole; g.fill(LB.ell(...T(1.05, -0.18), hu * 0.1, hu * 0.08, -0.35)); g.fill(LB.ell(...T(0.68, 0.04), hu * 0.09, hu * 0.07, -0.35));
    // the keys he let go of, on the tarmac
    { const k = T(-0.75, -0.16); g.fillStyle = '#B7AEC8'; g.fill(LB.ell(k[0], k[1], 6, 3, 0.2)); g.fillStyle = '#8F86A6'; g.fill(LB.rr(k[0] + 4, k[1] - 2.5, 13, 4.5, 2)); g.fillStyle = '#3A3350'; g.fill(LB.rr(k[0] - 16, k[1] - 4, 12, 8, 3)); }
  }

  // ======================= THE OPEN REAR DOOR: outer face lit low from the left; the sun sinking out of its dark glass =======================
  {
    const face = LB.poly([DP(0, 0.3), DP(DL, 0.3), DP(DL, 0.98), DP(DL - 0.03, 1.4), DP(0.02, 1.49), DP(0, 0.98)]);
    g.fillStyle = K.door; g.fill(face);
    g.save(); g.clip(face);
