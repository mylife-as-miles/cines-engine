<!doctype html><meta charset="utf-8"><title>B1 THE COUNTER</title>
<script src="../kit/otm.js"></script><script src="../kit/look_b.js"></script>
<script>
// AUTOPILOT · LOOK B "BRIGHT DAY" · 01 THE COUNTER
// INT. KITCHEN - MOMENTS LATER (just after 6:14 A.M.). Low on the counter: the phone, plugged in beside the kettle, sits in the
// kettle's cool shadow so its screen and green battery icon glow. Beyond (soft focus): Daniel heads upstairs, back turned;
// his work bag waits by the front door in a patch of early sun, its outside pocket open and empty.
(async () => {
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), { W, H } = OTM;
  const f = OTM.frame(ctx, { seed: 11 });
  const g = f.world, E = f.emissive;
  const P = LB.cam({ x: 0.08, y: 1.2, z: 0, f: 1400, cx: 960, cy: 410 });
  const Qp = pts => LB.poly(pts.map(p => P(p[0], p[1], p[2])));

  const K = {
    kWall: '#FFE0A0', kWallShade: '#F5C27F', ceil: '#FFE9BD',
    floor: '#E8A15E', floorSun: '#FFD48A', floorLine: '#CF8748', floorLineSun: '#F2B66C',
    hWall: '#C3C4F4', hWallSun: '#E7E2FF', hWallDark: '#A9A8E6', hCeil: '#D6D3FA',
    door: '#3A74DA', doorShade: '#2C5DBD', glass: '#FFF3CF', brass: '#F8C24B', mat: '#C2574A',
    bag: '#C27840', bagSun: '#EBA25F', bagShade: '#9A592D', pocket: '#B26B37', pocketIn: '#4F2A16',
    tread: '#E3A86E', riser: '#F8E6D0', rail: '#9A5A35', baluster: '#FFFFFF', landing: '#FFEBD2', landWin: '#BFE6FF',
    fridge: '#F9E4C6', fridgeShade: '#E8C9A6',
    counter: '#FFF4E4', counterSun: '#FFF9EE', counterEdge: '#F0DCC6', counterShadow: '#C9B3D6',
    cab: '#4B78DA', cabShade: '#3961C2', handle: '#F8C24B',
    kettle: '#F2553F', kettleShade: '#BE3A31', kettleHi: '#FF9A7E', chrome: '#EEEBF4', chromeShade: '#B7B2C9', kettleBase: '#2B2838',
    shadowFloor: '#B4706A',
  };

  // ======================= BACKGROUND (drawn into its own layer, then softened: depth of field) =======================
  const bg = LB.layer(); const B = bg;
  const bq = (pts, col) => { B.fillStyle = col; B.fill(Qp(pts)); };
  const KZ = 3.6, HX0 = -2.0, HX1 = 0.42, HZ1 = 9.5;     // kitchen far wall depth; hall x-range; hall end
  B.fillStyle = K.ceil; B.fillRect(0, 0, W, H);
  // kitchen far wall with the wide opening into the hall
  bq([[-6, 0, KZ], [6, 0, KZ], [6, 3.2, KZ], [-6, 3.2, KZ]], K.kWall);
  // ---- the hall, seen through the opening ----
  B.save(); B.clip(Qp([[HX0, 0, KZ], [HX1, 0, KZ], [HX1, 2.35, KZ], [HX0, 2.35, KZ]]));
  B.fillStyle = K.hCeil; B.fillRect(0, 0, W, H);
  bq([[HX0, 0, KZ], [HX0, 0, HZ1], [HX0, 4, HZ1], [HX0, 4, KZ]], K.hWall);              // hall left wall (front door is in it)
  bq([[HX1, 0, KZ], [HX1, 0, HZ1], [HX1, 4, HZ1], [HX1, 4, KZ]], K.hWallDark);          // hall right wall (stairs run along it)
  bq([[HX0, 0, KZ], [HX1, 0, KZ], [HX1, 0, HZ1], [HX0, 0, HZ1]], K.floor);              // hall floor
  B.strokeStyle = K.floorLine; B.lineWidth = 1.6;
  for (let x = HX0; x < HX1; x += 0.15) { const a = P(x, 0, KZ), b = P(x, 0, HZ1); B.beginPath(); B.moveTo(a[0], a[1]); B.lineTo(b[0], b[1]); B.stroke(); }
  // landing at the top of the stairs: a bright wall and window (where he is going)
  const SX0 = -0.95, SX1 = HX1, SZ0 = 4.9, N = 14, RISE = 0.19, GO = 0.25, SZ1 = SZ0 + N * GO;
  bq([[HX0, 2.4, SZ1 + 0.6], [HX1, 2.4, SZ1 + 0.6], [HX1, 5, SZ1 + 0.6], [HX0, 5, SZ1 + 0.6]], K.landing);
  bq([[-0.2, 3.05, SZ1 + 0.59], [0.36, 3.05, SZ1 + 0.59], [0.36, 4.4, SZ1 + 0.59], [-0.2, 4.4, SZ1 + 0.59]], K.landWin);
  { const a = P(-0.2, 3.05, SZ1 + 0.59), b = P(0.36, 4.4, SZ1 + 0.59); f.emissive.fillStyle = 'rgba(200,235,255,0.22)'; f.emissive.fillRect(a[0], b[1], b[0] - a[0], a[1] - b[1]); }
  // the upstairs ceiling slopes over the stair; a soft band of landing light down the right wall
  B.save(); B.clip(Qp([[HX1, 0, KZ], [HX1, 0, HZ1], [HX1, 5, HZ1], [HX1, 5, KZ]]));
  B.fillStyle = '#C9C2F2'; B.fill(Qp([[HX1, 2.2, SZ1 + 0.6], [HX1, 3.6, SZ0 + 1.0], [HX1, 5, SZ0 + 1.0], [HX1, 5, SZ1 + 0.6]])); B.restore();
  // stairs (far to near)
  for (let i = N; i >= 1; i--) {
    const z0 = SZ0 + (i - 1) * GO, y0 = (i - 1) * RISE, y1 = i * RISE;
    bq([[SX0, y1, z0], [SX1, y1, z0], [SX1, y1, z0 + GO], [SX0, y1, z0 + GO]], K.tread);
    bq([[SX0, y0, z0], [SX1, y0, z0], [SX1, y1, z0], [SX0, y1, z0]], K.riser);
  }
  // stair string (side panel) on the open left side
  bq([[SX0, 0, SZ0], [SX0, 0.12, SZ0 - 0.02], [SX0, N * RISE + 0.12, SZ1], [SX0, N * RISE - 0.1, SZ1]], '#FFF6EA');
  B.fillStyle = '#FFFFFF'; B.fill(Qp([[SX0, -0.02, SZ0], [SX0, 0.2, SZ0], [SX0, N * RISE + 0.1, SZ1], [SX0, N * RISE - 0.15, SZ1]]));
  // bannister: balusters + rail on the left side, newel post at the bottom
  const railY = i => i * RISE + 0.9;
  for (let i = 1; i <= N; i++) { const z = SZ0 + (i - 0.5) * GO, a = P(SX0 + 0.03, i * RISE, z), b = P(SX0 + 0.03, railY(i - 0.5), z); B.strokeStyle = K.baluster; B.lineWidth = Math.max(2, 0.035 * P.k(z)); B.beginPath(); B.moveTo(a[0], a[1]); B.lineTo(b[0], b[1]); B.stroke(); }
  { const a = P(SX0 + 0.03, railY(0), SZ0 - 0.05), b = P(SX0 + 0.03, railY(N), SZ1); B.strokeStyle = K.rail; B.lineCap = 'round'; B.lineWidth = 0.06 * P.k(SZ0 + 1.5); B.beginPath(); B.moveTo(a[0], a[1]); B.lineTo(b[0], b[1]); B.stroke(); }
  { const s = P.k(SZ0), a = P(SX0 + 0.03, 0, SZ0 - 0.05), b = P(SX0 + 0.03, 1.1, SZ0 - 0.05); B.fillStyle = K.rail; B.fill(LB.rr(a[0] - 0.045 * s, b[1], 0.09 * s, a[1] - b[1], 4)); B.fill(LB.ell(a[0], b[1], 0.065 * s, 0.05 * s)); }
  // front door in the hall's left wall (seen obliquely), glass glowing with morning outside
  const DZ0 = 4.15, DZ1 = 5.0;
  bq([[HX0 + 0.002, 0, DZ0 - 0.07], [HX0 + 0.002, 0, DZ1 + 0.07], [HX0 + 0.002, 2.13, DZ1 + 0.07], [HX0 + 0.002, 2.13, DZ0 - 0.07]], '#FFF6EA');
  bq([[HX0 + 0.004, 0, DZ0], [HX0 + 0.004, 0, DZ1], [HX0 + 0.004, 2.05, DZ1], [HX0 + 0.004, 2.05, DZ0]], K.door);
  bq([[HX0 + 0.005, 1.25, DZ0 + 0.12], [HX0 + 0.005, 1.25, DZ1 - 0.12], [HX0 + 0.005, 1.9, DZ1 - 0.12], [HX0 + 0.005, 1.9, DZ0 + 0.12]], K.glass);
  { const q = [P(HX0, 1.25, DZ0 + 0.12), P(HX0, 1.25, DZ1 - 0.12), P(HX0, 1.9, DZ1 - 0.12), P(HX0, 1.9, DZ0 + 0.12)]; E.fillStyle = 'rgba(255,240,200,0.6)'; E.fill(LB.poly(q)); }
  bq([[HX0 + 0.005, 0.15, DZ0 + 0.12], [HX0 + 0.005, 0.15, DZ1 - 0.12], [HX0 + 0.005, 1.05, DZ1 - 0.12], [HX0 + 0.005, 1.05, DZ0 + 0.12]], K.doorShade);
  bq([[HX0 + 0.006, 1.1, DZ0 + 0.25], [HX0 + 0.006, 1.1, DZ1 - 0.25], [HX0 + 0.006, 1.16, DZ1 - 0.25], [HX0 + 0.006, 1.16, DZ0 + 0.25]], K.brass);
  bq([[HX0 + 0.05, 0.003, DZ0 + 0.02], [HX0 + 0.7, 0.003, DZ0 + 0.02], [HX0 + 0.7, 0.003, DZ1 - 0.02], [HX0 + 0.05, 0.003, DZ1 - 0.02]], K.mat);
  // the sun patch: kitchen window off-frame right, light falls through the opening onto the hall floor, the bag and the shoes
  const patch = [[0.55, 0, 2.9], [0.55, 0, 4.2], [-1.98, 0, 5.4], [-1.98, 0, 4.0]];
  B.save(); B.clip(Qp([[HX0, 0, KZ], [HX1, 0, KZ], [HX1, 0, HZ1], [HX0, 0, HZ1]]));
  B.fillStyle = K.floorSun; B.fill(Qp(patch));
  B.save(); B.clip(Qp(patch)); B.strokeStyle = K.floorLineSun; B.lineWidth = 1.6;
  for (let x = HX0; x < HX1; x += 0.15) { const a = P(x, 0, KZ), b = P(x, 0, HZ1); B.beginPath(); B.moveTo(a[0], a[1]); B.lineTo(b[0], b[1]); B.stroke(); }
  // the window's cross bar, cast across the patch
  B.fillStyle = K.floor; B.fill(Qp([[0.55, 0, 3.5], [0.55, 0, 3.6], [-1.98, 0, 4.8], [-1.98, 0, 4.7]]));
  B.restore(); B.restore();
  // light climbing the bottom of the left wall and door
  B.save(); B.clip(Qp([[HX0, 0, KZ], [HX0, 0, HZ1], [HX0, 4, HZ1], [HX0, 4, KZ]])); B.fillStyle = 'rgba(255,236,190,0.55)'; B.fill(Qp([[HX0, 0, 4.0], [HX0, 0, 5.4], [HX0, 0.22, 5.55], [HX0, 0.22, 4.15]])); B.restore();
  // Emily's little shoes and the work bag, by the door
  {
    const z = 4.25, s = P.k(z);
    // tiny pink trainers
    [[-1.62, 0], [-1.5, 0.05]].forEach(([x, dz], i) => {
      const a = P(x, 0, z - 0.2 + dz), w = 0.1 * s, h = 0.055 * s;
      LB.blob(B, LB.ell(a[0], a[1], w * 0.7, h * 0.25), K.shadowFloor, 0.4, 3);
      B.fillStyle = '#FF8FB4'; B.fill(LB.rr(a[0] - w * 0.5, a[1] - h, w, h, [h * 0.6, h * 0.9, 2, 2]));
      B.fillStyle = '#FFFFFF'; B.fill(LB.rr(a[0] - w * 0.5, a[1] - h * 0.28, w, h * 0.28, 2));
      B.fillStyle = '#FFD23F'; B.fill(LB.rr(a[0] - w * 0.15, a[1] - h * 0.86, w * 0.3, h * 0.2, 2));
    });
    // the bag: leather messenger, flap closed, the outside slip pocket gaping open and empty
    const x0 = -1.38, x1 = -0.9, hh = 0.34, zb = z - 0.05, a = P(x0, 0, zb), b = P(x1, hh, zb), w = b[0] - a[0], h = a[1] - b[1];
    LB.blob(B, LB.ell(a[0] + w * 0.5, a[1], w * 0.62, h * 0.12), K.shadowFloor, 0.55, 5);
    B.strokeStyle = K.bagShade; B.lineWidth = 0.035 * s; B.lineCap = 'round';
    B.beginPath(); B.moveTo(a[0] + w * 0.04, b[1] + h * 0.18); B.bezierCurveTo(a[0] - w * 0.25, b[1] - h * 0.35, a[0] + w * 0.15, b[1] - h * 0.9, a[0] + w * 0.6, b[1] - h * 0.62); B.stroke();
    const body = LB.rr(a[0], b[1], w, h, [w * 0.12, w * 0.12, w * 0.06, w * 0.06]);
    B.fillStyle = K.bagSun; B.fill(body);
    B.save(); B.clip(body); B.fillStyle = K.bag; B.fillRect(a[0] - 4, b[1], w * 0.2, h); B.fillStyle = K.bagShade; B.fillRect(a[0] - 4, a[1] - h * 0.1, w + 8, h * 0.12); B.restore();
    const flap = LB.rr(a[0] - 1, b[1] - 1, w + 2, h * 0.5, [w * 0.12, w * 0.12, w * 0.1, w * 0.1]);
    B.fillStyle = K.bag; B.fill(flap);
    B.fillStyle = K.brass; [0.3, 0.7].forEach(k => { B.fill(LB.rr(a[0] + w * k - w * 0.045, b[1] + h * 0.34, w * 0.09, h * 0.2, 2)); });
    // outside pocket: open top edge, dark and empty inside
    const px = a[0] + w * 0.16, pw = w * 0.68, py = b[1] + h * 0.56, ph = h * 0.38;
    // the gaping mouth of the pocket (dark, nothing in it), then the pocket face sagging open below it
    B.fillStyle = '#3A1D0E'; B.fill(LB.ell(px + pw / 2, py + h * 0.02, pw * 0.47, h * 0.085));
    B.fillStyle = K.pocket; B.fill(LB.spline([[px, py + 2, 1], [px + pw * 0.5, py + h * 0.07], [px + pw, py + 2, 1], [px + pw, py + ph, 1], [px, py + ph, 1]], true));
    B.fillStyle = 'rgba(255,236,190,0.5)'; B.fill(LB.spline([[px + 3, py + 3], [px + pw * 0.5, py + h * 0.075], [px + pw - 3, py + 3], [px + pw * 0.5, py + h * 0.11]], true));
  }
  // ---- DANIEL: back turned, climbing, a little hunched (t-shirt and pyjama bottoms: it is before his shower) ----
  {
    const z = SZ0 + 2.55 * GO, s = P.k(z), hu = 0.45 * s;           // head unit = head diameter
    const ft = P(-0.38, 3 * RISE, z);                                  // baseline: right foot on step 3
    const bx = ft[0], by = ft[1];
    const T = (x, y) => [bx + x * hu, by - y * hu];
    const parts = [];
    // legs (pyjama bottoms, a little baggy): left foot up on step 4, right foot on step 3 with the heel lifting
    const hipL = T(-0.2, 1.95), kneeL = T(-0.3, 1.38), footL = T(-0.25, 0.58);
    const hipR = T(0.2, 1.93), kneeR = T(0.25, 1.02), footR = T(0.21, 0.12);
    parts.push(LB.limb(hipL, kneeL, footL, hu * 0.24, hu * 0.2, hu * 0.16));
    parts.push(LB.limb(hipR, kneeR, footR, hu * 0.24, hu * 0.2, hu * 0.16));
    parts.push(LB.ell(footL[0] - hu * 0.02, footL[1] + hu * 0.04, hu * 0.16, hu * 0.085));
    parts.push(LB.ell(footR[0] + hu * 0.01, footR[1] + hu * 0.0, hu * 0.14, hu * 0.1));
    // torso: a soft bean, the upper back rounded forward (tired), a gentle waist
    parts.push(LB.spline([T(-0.42, 1.92), T(-0.47, 2.45), T(-0.6, 3.05), T(-0.48, 3.36), T(-0.16, 3.46), T(0.18, 3.46), T(0.5, 3.36), T(0.62, 3.05), T(0.49, 2.45), T(0.43, 1.92), T(0.0, 1.86)], true));
    // t-shirt sleeves: short flares at the shoulders
    parts.push(LB.roundPoly([T(-0.62, 3.22), T(-0.4, 3.32), T(-0.5, 2.82), T(-0.8, 2.86)], hu * 0.07));
    parts.push(LB.roundPoly([T(0.64, 3.22), T(0.42, 3.32), T(0.52, 2.82), T(0.8, 2.88)], hu * 0.07));
    // arms: left hand reaching up to the rail (pulling himself up), right arm loose, a slight bend
    const shL = T(-0.55, 3.08), shR = T(0.55, 3.08);
    const railHand = P(SX0 + 0.03, railY(3.5) + 0.02, SZ0 + 3.5 * GO);
    parts.push(LB.limb(shL, T(-0.86, 2.62), [railHand[0] + hu * 0.06, railHand[1] + hu * 0.02], hu * 0.12, hu * 0.105, hu * 0.095));
    parts.push(LB.ell(railHand[0] + hu * 0.04, railHand[1] + hu * 0.01, hu * 0.12, hu * 0.1));
    parts.push(LB.limb(shR, T(0.7, 2.56), T(0.62, 2.08), hu * 0.12, hu * 0.105, hu * 0.095));
    parts.push(LB.ell(T(0.6, 2.0)[0], T(0.6, 2.0)[1], hu * 0.12, hu * 0.13));
    // head: big and round, sunk low between the shoulders (the hunch); ears a touch high (head bowed); a soft bed-head tuft
    const hc = T(0.02, 3.6);
    parts.push(LB.ell(hc[0], hc[1], hu * 0.5, hu * 0.5));
    parts.push(LB.ell(hc[0] - hu * 0.49, hc[1] - hu * 0.04, hu * 0.08, hu * 0.12));
    parts.push(LB.ell(hc[0] + hu * 0.49, hc[1] - hu * 0.04, hu * 0.08, hu * 0.12));
    parts.push(LB.spline([[hc[0] - hu * 0.16, hc[1] - hu * 0.46], [hc[0] - hu * 0.12, hc[1] - hu * 0.62], [hc[0] - hu * 0.02, hc[1] - hu * 0.66], [hc[0] - hu * 0.04, hc[1] - hu * 0.56], [hc[0] + hu * 0.06, hc[1] - hu * 0.6, 1], [hc[0] + hu * 0.16, hc[1] - hu * 0.54], [hc[0] + hu * 0.12, hc[1] - hu * 0.44]], true));
    LB.blob(B, LB.ell(footR[0], footR[1] + hu * 0.1, hu * 0.3, hu * 0.06), '#9A6A60', 0.45, 4);
    LB.blob(B, LB.ell(footL[0], footL[1] + hu * 0.1, hu * 0.3, hu * 0.06), '#9A6A60', 0.45, 4);
    LB.figure(B, parts, { light: { dx: 0.25, dy: -1 }, shadeW: hu * 0.2, liftW: 0, rim: '#FFE6C8', rimW: 1.8, rimAlpha: 0.7 });
  }
  B.restore();
  // opening jambs: the edge of the kitchen wall
  B.strokeStyle = K.kWallShade; B.lineWidth = 10;
  [[HX0, KZ], [HX1, KZ]].forEach(([x, z]) => { const a = P(x, 0, z), b = P(x, 2.35, z); B.beginPath(); B.moveTo(a[0], a[1]); B.lineTo(b[0], b[1]); B.stroke(); });
  { const a = P(HX0, 2.35, KZ), b = P(HX1, 2.35, KZ); B.beginPath(); B.moveTo(a[0], a[1]); B.lineTo(b[0], b[1]); B.stroke(); }
  // kitchen floor (near), and its sun stripe running into the hall
  { const nf = Qp([[-6, 0, 0.5], [6, 0, 0.5], [6, 0, KZ], [-6, 0, KZ]]); const yA = P(0, 0, KZ)[1];
    LB.grad(B, nf, 0, yA, 0, H, [[0, '#DE9660'], [0.45, '#CF845A'], [1, '#B86E55']]);
    B.save(); B.clip(nf); B.strokeStyle = 'rgba(160,90,60,0.35)'; B.lineWidth = 1.6;
    for (let x = -6; x < 6; x += 0.15) { const a = P(x, 0, 0.6), b = P(x, 0, KZ); B.beginPath(); B.moveTo(a[0], a[1]); B.lineTo(b[0], b[1]); B.stroke(); }
    B.fillStyle = K.floorSun; B.fill(Qp([[1.6, 0, 1.9], [1.6, 0, 3.3], [0.55, 0, 4.2], [0.55, 0, 2.9]])); B.restore(); }
  // a wooden threshold strip where the kitchen floor meets the hall
  bq([[HX0, 0.004, KZ - 0.07], [HX1, 0.004, KZ - 0.07], [HX1, 0.004, KZ + 0.02], [HX0, 0.004, KZ + 0.02]], '#F3C28A');
  bq([[HX0, 0.004, KZ - 0.075], [HX1, 0.004, KZ - 0.075], [HX1, 0.004, KZ - 0.06], [HX0, 0.004, KZ - 0.06]], '#B86F45');
  // the fridge behind the counter, with a crayon sun pinned to it (Emily's)
  {
    const z = 3.45; const a = P(0.85, 0, z), b = P(1.55, 1.85, z);
    B.fillStyle = K.fridge; B.fill(LB.rr(a[0], b[1], b[0] - a[0], a[1] - b[1], 22));
    B.save(); B.clip(LB.rr(a[0], b[1], b[0] - a[0], a[1] - b[1], 22)); B.fillStyle = K.fridgeShade; B.fillRect(a[0], b[1], (b[0] - a[0]) * 0.14, a[1] - b[1]); B.restore();
    B.fillStyle = K.fridgeShade; B.fillRect(a[0], P(0.85, 1.25, z)[1], b[0] - a[0], 4);
    const d0 = P(1.0, 1.32, z - 0.01), d1 = P(1.28, 1.66, z - 0.01);
    B.fillStyle = '#FFFFFF'; B.fill(LB.rr(d0[0], d1[1], d1[0] - d0[0], d0[1] - d1[1], 4));
    const cxs = (d0[0] + d1[0]) / 2, cys = (d0[1] + d1[1]) / 2, rs = (d1[0] - d0[0]) * 0.18;
    B.strokeStyle = '#FFB21F'; B.lineWidth = 3; B.lineCap = 'round';
    for (let i = 0; i < 9; i++) { const an = i / 9 * Math.PI * 2; B.beginPath(); B.moveTo(cxs + Math.cos(an) * rs * 1.4, cys + Math.sin(an) * rs * 1.4); B.lineTo(cxs + Math.cos(an) * rs * 2.1, cys + Math.sin(an) * rs * 2.1); B.stroke(); }
    B.fillStyle = '#FFC93A'; B.beginPath(); B.arc(cxs, cys, rs, 0, 7); B.fill();
    B.fillStyle = '#F2553F'; B.beginPath(); B.arc(cxs, d1[1] - 2, 5, 0, 7); B.fill();
  }
