<!doctype html><meta charset="utf-8"><title>B1 THE COUNTER</title>
<script src="../kit/otm.js"></script><script src="../kit/look_b.js"></script>
<script>
// AUTOPILOT · LOOK B "BRIGHT DAY" · 01 THE COUNTER
// INT. KITCHEN - MOMENTS LATER (just after 6:14 A.M.). The phone leans on the kettle, charging, its battery icon glowing.
// Daniel heads upstairs, back turned. His work bag waits by the front door in a patch of early sun, its outside pocket empty.
(async () => {
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), { W, H } = OTM;
  const f = OTM.frame(ctx, { seed: 11 });
  const g = f.world, E = f.emissive;
  const P = LB.cam({ x: 0, y: 1.08, z: 0, f: 1350, cx: 960, cy: 455 });
  const Q = pts => LB.poly(pts.map(p => P(p[0], p[1], p[2])));
  const fillQ = (pts, col) => { g.fillStyle = col; g.fill(Q(pts)); };

  // ---------- palette (morning) ----------
  const K = {
    farWall: '#F6B48A', farWallSun: '#FFE2A8', leftWall: '#E99B78', ceiling: '#F9C9A2',
    floor: '#E09A5C', floorSun: '#FFCF80', floorLine: '#C9824A',
    door: '#2F6FD8', doorSun: '#5B98F7', doorShade: '#2459B8', glass: '#FFF1C9', brass: '#F8C24B',
    bag: '#C47A40', bagSun: '#E79F5C', bagShade: '#9C5B2C', pocket: '#B06A35', pocketIn: '#5E3219',
    stairWallL: '#E7A0A6', stairWallR: '#D98A98', stairFar: '#FFE6C4', tread: '#FFF4E6', riser: '#EBD3C0', rail: '#9A5A35',
    counter: '#FFF3E2', counterEdge: '#F1DCC5', counterShade: '#E3C8AF',
    cab: '#4B78DA', cabLine: '#3C64C0', cabShade: '#3657AE', handle: '#F8C24B',
    kettle: '#F2553F', kettleShade: '#C63A2C', kettleHi: '#FF9479', chrome: '#ECE9F2', chromeShade: '#B6B1C8', kettleBase: '#2B2838',
    sun: '#FFF4D2', shadow: '#7A3F5C',
  };

  // ---------- room: ceiling, walls, floor ----------
  const FZ = 4.6, LX = -2.5, RX = 1.75, CY = 2.45;
  g.fillStyle = K.ceiling; g.fillRect(0, 0, W, H);
  fillQ([[LX, 0, FZ], [RX, 0, FZ], [RX, CY, FZ], [LX, CY, FZ]], K.farWall);                    // far wall
  fillQ([[LX, 0, 0.3], [LX, 0, FZ], [LX, CY, FZ], [LX, CY, 0.3]], K.leftWall);                 // left wall
  fillQ([[LX, 0, 0.3], [RX + 2, 0, 0.3], [RX + 2, 0, FZ], [LX, 0, FZ]], K.floor);              // floor
  fillQ([[LX, CY, 0.3], [LX, CY, FZ], [RX, CY, FZ], [RX + 2, CY, 0.3]], K.ceiling);
  // floorboards converging to the vanishing point
  g.save(); g.clip(Q([[LX, 0, 0.3], [RX + 2, 0, 0.3], [RX + 2, 0, FZ], [LX, 0, FZ]]));
  g.strokeStyle = K.floorLine; g.lineWidth = 2;
  for (let x = LX; x < RX + 2; x += 0.16) { const a = P(x, 0, 0.35), b = P(x, 0, FZ); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  g.restore();
  // skirting on far wall and left wall
  fillQ([[LX, 0, FZ - 0.001], [RX, 0, FZ - 0.001], [RX, 0.1, FZ - 0.001], [LX, 0.1, FZ - 0.001]], '#FFEBD6');
  fillQ([[LX + 0.001, 0, 0.3], [LX + 0.001, 0, FZ], [LX + 0.001, 0.1, FZ], [LX + 0.001, 0.1, 0.3]], '#F7D9C2');

  // ---------- the sun: window off-frame right, light travels left, down and away ----------
  const sunD = [-0.86, -0.42, 0.30];
  const win = [[RX, 0.95, 1.55], [RX, 0.95, 3.25], [RX, 2.15, 3.25], [RX, 2.15, 1.55]];
  // where a window corner lands on the floor (y=0), clipped by the far wall / left wall
  const hitFloor = p => { const t = p[1] / -sunD[1]; return [p[0] + sunD[0] * t, 0, p[2] + sunD[2] * t]; };
  const patchF = win.map(hitFloor);
  g.save(); g.clip(Q([[LX, 0, 0.3], [RX + 2, 0, 0.3], [RX + 2, 0, FZ], [LX, 0, FZ]]));
  g.fillStyle = K.floorSun; g.fill(Q(patchF));
  g.strokeStyle = '#F2B66A'; g.lineWidth = 2; g.save(); g.clip(Q(patchF));
  for (let x = LX; x < RX + 2; x += 0.16) { const a = P(x, 0, 0.35), b = P(x, 0, FZ); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
  g.restore();
  // window bars cast on the floor
  const barF = [[RX, 1.55, 1.55], [RX, 1.55, 3.25]].map(hitFloor), barF2 = [[RX, 0.95, 2.4], [RX, 2.15, 2.4]].map(hitFloor);
  g.strokeStyle = K.floor; g.lineWidth = 14; [[barF[0], barF[1]], [barF2[0], barF2[1]]].forEach(([a, b]) => { const A = P(...a), B = P(...b); g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke(); });
  g.restore();
  // the part of the light that climbs the far wall (z = FZ)
  const hitWall = p => { const t = (FZ - p[2]) / sunD[2]; return [p[0] + sunD[0] * t, p[1] + sunD[1] * t, FZ]; };
  const wallPatch = [hitWall(win[1]), hitWall(win[2]), hitWall(win[3]), hitWall(win[0])];
  g.save(); g.clip(Q([[LX, 0, FZ], [RX, 0, FZ], [RX, CY, FZ], [LX, CY, FZ]]));
  g.fillStyle = K.farWallSun; g.fill(Q(wallPatch.map(p => [p[0], Math.max(0, p[1]), FZ])));
  g.restore();

  // ---------- front door (far wall, left) ----------
  const DX0 = -2.15, DX1 = -1.3, DH = 2.05;
  fillQ([[DX0 - 0.08, 0, FZ], [DX1 + 0.08, 0, FZ], [DX1 + 0.08, DH + 0.08, FZ], [DX0 - 0.08, DH + 0.08, FZ]], '#FFF2E4'); // frame
  fillQ([[DX0, 0, FZ], [DX1, 0, FZ], [DX1, DH, FZ], [DX0, DH, FZ]], K.door);
  // sun on the door's lower half
  g.save(); g.clip(Q([[DX0, 0, FZ], [DX1, 0, FZ], [DX1, DH, FZ], [DX0, DH, FZ]])); g.fillStyle = K.doorSun; g.fill(Q(wallPatch.map(p => [p[0], Math.max(0, p[1]), FZ]))); g.restore();
  // panels
  const panel = (x0, y0, x1, y1, col) => { const a = P(x0, y0, FZ), b = P(x1, y1, FZ); g.fillStyle = col; g.fill(LB.rr(a[0], b[1], b[0] - a[0], a[1] - b[1], 6)); };
  panel(DX0 + 0.12, 1.25, DX1 - 0.12, 1.9, K.glass);                                // glass panel: bright morning outside
  E.fillStyle = 'rgba(255,240,200,0.55)'; { const a = P(DX0 + 0.12, 1.25, FZ), b = P(DX1 - 0.12, 1.9, FZ); E.fillRect(a[0], b[1], b[0] - a[0], a[1] - b[1]); }
  panel(DX0 + 0.12, 0.18, DX1 - 0.12, 0.95, 'rgba(20,30,90,0.16)');
  // letterbox + knob
  panel(-1.95, 1.02, -1.5, 1.1, K.brass);
  { const k = P(DX1 - 0.1, 1.0, FZ); g.fillStyle = K.brass; g.beginPath(); g.arc(k[0], k[1], 7, 0, 7); g.fill(); }
  // doormat
  fillQ([[-2.2, 0.002, FZ - 0.55], [-1.25, 0.002, FZ - 0.55], [-1.25, 0.002, FZ - 0.05], [-2.2, 0.002, FZ - 0.05]], '#B4513F');

  // ---------- stairwell (far wall, centre): enclosed stairs rising away ----------
  const SX0 = -0.62, SX1 = 0.32, SZ0 = FZ, NSTEP = 14, RISE = 0.19, GO = 0.25;
  // far end of the stairwell and its walls
  const STOP = SZ0 + NSTEP * GO + 0.4;
  fillQ([[SX0, 0, SZ0], [SX0, 0, STOP], [SX0, 4.6, STOP], [SX0, 4.6, SZ0]], K.stairWallL);
  fillQ([[SX1, 0, SZ0], [SX1, 0, STOP], [SX1, 4.6, STOP], [SX1, 4.6, SZ0]], K.stairWallR);
  fillQ([[SX0, 2.2, STOP], [SX1, 2.2, STOP], [SX1, 4.6, STOP], [SX0, 4.6, STOP]], K.stairFar);   // the landing wall, lit
  // light from the landing window falling down the left wall
  g.save(); g.clip(Q([[SX0, 0, SZ0], [SX0, 0, STOP], [SX0, 4.6, STOP], [SX0, 4.6, SZ0]]));
  g.fillStyle = '#FFD2B8'; g.fill(Q([[SX0, 1.8, STOP], [SX0, 3.6, SZ0 + 1.2], [SX0, 4.6, SZ0 + 1.2], [SX0, 4.6, STOP]])); g.restore();
  // steps, far to near so near ones overlap
  for (let i = NSTEP; i >= 1; i--) {
    const z0 = SZ0 + (i - 1) * GO, y0 = (i - 1) * RISE, y1 = i * RISE;
    fillQ([[SX0, y1, z0], [SX1, y1, z0], [SX1, y1, z0 + GO], [SX0, y1, z0 + GO]], K.tread);   // tread
    fillQ([[SX0, y0, z0], [SX1, y0, z0], [SX1, y1, z0], [SX0, y1, z0]], K.riser);             // riser
    // nosing line
    const a = P(SX0, y1, z0), b = P(SX1, y1, z0); g.strokeStyle = '#DCC1AA'; g.lineWidth = 2; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  // handrail on the right wall
  { const a = P(SX1 - 0.03, 0.95, SZ0), b = P(SX1 - 0.03, 0.95 + NSTEP * RISE, SZ0 + NSTEP * GO);
    g.strokeStyle = K.rail; g.lineCap = 'round'; g.lineWidth = 9; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }

  // ---------- DANIEL: back turned, climbing, slightly hunched ----------
  {
    const z = SZ0 + 2.6 * GO, s = P.k(z);             // he stands on steps 3 and 4
    const base = P(-0.14, 2 * RISE + RISE, z);       // between his feet, on step 3
    const hu = 0.43 * s;                             // head unit (diameter), he is ~4.3 heads tall
    const bx = base[0], by = base[1];
    const parts = [];
    // legs: left foot up on step 4, right foot on step 3
    const hipL = [bx - hu * 0.26, by - hu * 1.65], hipR = [bx + hu * 0.24, by - hu * 1.62];
    const kneeL = [bx - hu * 0.30, by - hu * 1.02], footL = [bx - hu * 0.28, by - hu * 0.62];
    const kneeR = [bx + hu * 0.24, by - hu * 0.82], footR = [bx + hu * 0.27, by - hu * 0.06];
    parts.push(LB.limb(hipL, kneeL, footL, hu * 0.25, hu * 0.21, hu * 0.17));
    parts.push(LB.limb(hipR, kneeR, footR, hu * 0.25, hu * 0.21, hu * 0.17));
    parts.push(LB.ell(footL[0], footL[1] + hu * 0.04, hu * 0.2, hu * 0.11));      // heel of the raised foot
    parts.push(LB.ell(footR[0], footR[1] + hu * 0.02, hu * 0.2, hu * 0.1));
    // torso: rounded, wider at the shoulders, hunched forward (the upper back bulges)
    const tTop = by - hu * 3.1, tBot = by - hu * 1.5;
    parts.push(LB.spline([
      [bx - hu * 0.5, tBot], [bx - hu * 0.56, tBot - hu * 0.6], [bx - hu * 0.66, tTop + hu * 0.28], [bx - hu * 0.52, tTop + hu * 0.02],
      [bx - hu * 0.1, tTop - hu * 0.1], [bx + hu * 0.34, tTop - hu * 0.04], [bx + hu * 0.64, tTop + hu * 0.18],
      [bx + hu * 0.62, tBot - hu * 0.6], [bx + hu * 0.5, tBot], [bx, tBot + hu * 0.12]], true));
    // arms: right hand on the rail (screen right), left arm hanging and swinging back a little
    const shR = [bx + hu * 0.5, tTop + hu * 0.2], shL = [bx - hu * 0.52, tTop + hu * 0.22];
    const railPt = P(SX1 - 0.03, 0.95 + 2.6 * RISE + 0.45 * RISE, z + 0.35);
    parts.push(LB.limb(shR, [bx + hu * 0.82, tTop + hu * 0.78], [railPt[0] - hu * 0.05, railPt[1] + hu * 0.04], hu * 0.17, hu * 0.14, hu * 0.12));
    parts.push(LB.ell(railPt[0] - hu * 0.02, railPt[1] + hu * 0.02, hu * 0.15, hu * 0.12));
    parts.push(LB.limb(shL, [bx - hu * 0.74, tTop + hu * 0.82], [bx - hu * 0.7, tTop + hu * 1.42], hu * 0.17, hu * 0.14, hu * 0.12));
    parts.push(LB.ell(bx - hu * 0.69, tTop + hu * 1.5, hu * 0.14, hu * 0.16));
    // head: big round, sitting forward (hunch) so it overlaps the shoulder line; ears; bed-head tufts at the crown
    const hx = bx + hu * 0.04, hy = tTop - hu * 0.32;
    parts.push(LB.ell(hx, hy, hu * 0.5, hu * 0.49));
    parts.push(LB.ell(hx - hu * 0.5, hy + hu * 0.04, hu * 0.09, hu * 0.13));
    parts.push(LB.ell(hx + hu * 0.5, hy + hu * 0.04, hu * 0.09, hu * 0.13));
    parts.push(LB.poly([[hx - hu * 0.2, hy - hu * 0.44], [hx - hu * 0.12, hy - hu * 0.66], [hx - hu * 0.02, hy - hu * 0.46]]));
    parts.push(LB.poly([[hx - hu * 0.04, hy - hu * 0.48], [hx + hu * 0.1, hy - hu * 0.7], [hx + hu * 0.14, hy - hu * 0.47]]));
    parts.push(LB.poly([[hx + hu * 0.1, hy - hu * 0.47], [hx + hu * 0.3, hy - hu * 0.6], [hx + hu * 0.26, hy - hu * 0.4]]));
    // soft contact shadow on the treads
    LB.blob(g, LB.ell(footR[0], footR[1] + hu * 0.12, hu * 0.36, hu * 0.07), '#8E5A6A', 0.35, 6);
    LB.blob(g, LB.ell(footL[0], footL[1] + hu * 0.14, hu * 0.36, hu * 0.07), '#8E5A6A', 0.35, 6);
    LB.figure(g, parts, { light: { dx: -0.4, dy: -1 }, shadeW: hu * 0.22, liftW: hu * 0.12, rim: '#FFD9B8', rimW: 2.5, rimAlpha: 0.85 });
  }

  // ---------- the bag by the door (in the sun), outside pocket open and empty ----------
  {
    const z = FZ - 0.28, x0 = -1.24, x1 = -0.8, hgt = 0.33;
    const a = P(x0, 0, z), b = P(x1, hgt, z); const w = b[0] - a[0], h = a[1] - b[1];
    LB.blob(g, LB.ell(a[0] + w * 0.5, a[1], w * 0.62, h * 0.12), '#7A3F2A', 0.45, 8);
    // strap
    g.strokeStyle = K.bagShade; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(a[0] + w * 0.08, b[1] + h * 0.2); g.bezierCurveTo(a[0] + w * 0.1, b[1] - h * 0.95, a[0] + w * 0.9, b[1] - h * 0.95, a[0] + w * 0.92, b[1] + h * 0.2); g.stroke();
    g.fillStyle = K.bag; g.fill(LB.rr(a[0], b[1], w, h, [16, 16, 8, 8]));
    g.save(); g.clip(LB.rr(a[0], b[1], w, h, [16, 16, 8, 8])); g.fillStyle = K.bagSun; g.fillRect(a[0] + w * 0.55, b[1], w, h); g.restore();
    // outside pocket: flap lifted, the slot inside dark and empty
    const px = a[0] + w * 0.2, pw = w * 0.6, py = b[1] + h * 0.34, ph = h * 0.56;
    g.fillStyle = K.pocket; g.fill(LB.rr(px, py, pw, ph, 8));
    g.fillStyle = K.pocketIn; g.fill(LB.rr(px + pw * 0.14, py + 3, pw * 0.72, ph * 0.22, 4));
    g.fillStyle = K.bagShade; g.fill(LB.rr(px - 2, py - ph * 0.36, pw + 4, ph * 0.34, [10, 10, 3, 3]));   // the flap, flipped up
    g.fillStyle = K.brass; g.beginPath(); g.arc(px + pw / 2, py - ph * 0.12, 3.5, 0, 7); g.fill();
  }

  // ---------- foreground: counter, kettle, phone ----------
  const CT = 0.92, CZ0 = 0.6, CZ1 = 1.18, CX0 = -0.08;
  // cabinet front (the counter's face to camera)
  fillQ([[CX0, -1, CZ0], [3, -1, CZ0], [3, CT - 0.035, CZ0], [CX0, CT - 0.035, CZ0]], K.cab);
  { // door panel seams + brass handles
    const a = P(CX0, CT - 0.035, CZ0), b = P(0.55, CT - 0.035, CZ0);
    g.strokeStyle = K.cabLine; g.lineWidth = 6; g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(b[0], H); g.stroke();
    g.beginPath(); g.moveTo(a[0], a[1] + 120); g.lineTo(W, a[1] + 120); g.stroke();
    g.fillStyle = K.handle; g.fill(LB.rr(b[0] - 150, a[1] + 54, 110, 16, 8)); g.fill(LB.rr(b[0] + 40, a[1] + 54, 110, 16, 8));
  }
  // counter top + thick front edge
  fillQ([[CX0, CT, CZ0], [3, CT, CZ0], [3, CT, CZ1], [CX0, CT, CZ1]], K.counter);
  fillQ([[CX0, CT - 0.035, CZ0], [3, CT - 0.035, CZ0], [3, CT, CZ0], [CX0, CT, CZ0]], K.counterEdge);
  // the counter's left end: a rounded corner shadow line
  { const a = P(CX0, CT, CZ0), b = P(CX0, CT, CZ1); g.strokeStyle = K.counterShade; g.lineWidth = 3; g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }

  // kettle (retro dome), behind and right of the phone
  const KX = 0.43, KZ = 0.94;
  {
    const s = P.k(KZ), c = P(KX, CT, KZ), r = 0.115 * s, hgt = 0.2 * s;
    const cx = c[0], cb = c[1];
    // contact shadow + long shadow to the left (soft key from the right window, bounced)
    LB.blob(g, LB.ell(cx - r * 0.25, cb - 4, r * 1.25, r * 0.16), K.shadow, 0.35, 10);
    // base ring
    g.fillStyle = K.kettleBase; g.fill(LB.rr(cx - r * 0.98, cb - r * 0.16, r * 1.96, r * 0.2, 10));
    // body
    const body = LB.spline([[cx - r * 0.95, cb - r * 0.12], [cx - r * 1.05, cb - hgt * 0.45], [cx - r * 0.8, cb - hgt * 0.92], [cx - r * 0.4, cb - hgt * 1.08],
      [cx + r * 0.4, cb - hgt * 1.08], [cx + r * 0.8, cb - hgt * 0.92], [cx + r * 1.05, cb - hgt * 0.45], [cx + r * 0.95, cb - r * 0.12]], true);
    // spout (left, toward the phone)
    const spout = LB.spline([[cx - r * 0.8, cb - hgt * 0.38], [cx - r * 1.32, cb - hgt * 0.62], [cx - r * 1.55, cb - hgt * 0.95], [cx - r * 1.4, cb - hgt * 0.98], [cx - r * 1.18, cb - hgt * 0.78], [cx - r * 0.78, cb - hgt * 0.62]], true);
    g.fillStyle = K.kettle; g.fill(spout); g.fill(body);
    // cel shade on the left side (away from the window light, which is right)
    g.save(); g.clip(body); g.fillStyle = K.kettleShade; g.fill(LB.ell(cx - r * 1.05, cb - hgt * 0.5, r * 0.62, hgt * 0.75)); g.restore();
    g.save(); g.clip(spout); g.fillStyle = K.kettleShade; g.fillRect(cx - r * 2, cb - hgt * 0.75, r * 1.2, hgt); g.restore();
    // highlight: a soft window reflection on the right shoulder
    g.save(); g.clip(body); g.fillStyle = K.kettleHi; g.fill(LB.ell(cx + r * 0.55, cb - hgt * 0.72, r * 0.18, hgt * 0.2, -0.5));
    g.fillStyle = '#FFE4D8'; g.fill(LB.ell(cx + r * 0.62, cb - hgt * 0.8, r * 0.06, hgt * 0.08, -0.5)); g.restore();
    // chrome lid + knob
    g.fillStyle = K.chrome; g.fill(LB.ell(cx, cb - hgt * 1.07, r * 0.48, r * 0.11));
    g.fillStyle = K.kettleBase; g.fill(LB.rr(cx - r * 0.1, cb - hgt * 1.07 - r * 0.24, r * 0.2, r * 0.22, 6));
    // handle: chrome arc over the top
    g.strokeStyle = K.chromeShade; g.lineWidth = r * 0.16; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx - r * 0.62, cb - hgt * 0.98); g.bezierCurveTo(cx - r * 0.5, cb - hgt * 1.62, cx + r * 0.5, cb - hgt * 1.62, cx + r * 0.62, cb - hgt * 0.98); g.stroke();
    g.strokeStyle = K.chrome; g.lineWidth = r * 0.08; g.beginPath(); g.moveTo(cx - r * 0.5, cb - hgt * 1.12); g.bezierCurveTo(cx - r * 0.4, cb - hgt * 1.56, cx + r * 0.4, cb - hgt * 1.56, cx + r * 0.52, cb - hgt * 1.12); g.stroke();
  }

  // the phone: leaning back against the kettle's belly, plugged in, screen lit with the battery icon
  {
    const z = 0.72, s = P.k(z);
    const b0 = P(0.13, CT, z), b1 = P(0.205, CT, z);           // bottom corners
    const tz = z + 0.07, t0 = P(0.135, CT + 0.142, tz), t1 = P(0.208, CT + 0.142, tz);
    const phone = LB.roundPoly([[b0[0], b0[1]], [b1[0], b1[1]], [t1[0], t1[1]], [t0[0], t0[1]]], 18);
    LB.blob(g, LB.ell((b0[0] + b1[0]) / 2 + 30, b0[1] - 2, 110, 12), K.shadow, 0.4, 8);
    // cable: from the port, a loop on the counter, away behind the kettle
    g.strokeStyle = '#FFFFFF'; g.lineWidth = 7; g.lineCap = 'round';
    const port = [(b0[0] + b1[0]) / 2, b0[1] - 6];
    g.beginPath(); g.moveTo(port[0], port[1]); g.bezierCurveTo(port[0] - 10, port[1] + 50, port[0] + 140, port[1] + 40, port[0] + 190, port[1] + 10);
    g.bezierCurveTo(port[0] + 240, port[1] - 18, port[0] + 260, port[1] - 40, port[0] + 300, port[1] - 52); g.stroke();
    g.fillStyle = '#1D1B29'; g.fill(phone);
    // screen
    const inset = (p, q, k) => [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
    const cxp = (b0[0] + b1[0] + t0[0] + t1[0]) / 4, cyp = (b0[1] + b1[1] + t0[1] + t1[1]) / 4;
    const sc = p => inset(p, [cxp, cyp], 0.1);
    const scr = LB.roundPoly([sc([b0[0], b0[1] - 6]), sc([b1[0], b1[1] - 6]), sc(t1), sc(t0)], 12);
    LB.radial(g, scr, cxp, cyp, 4, 150, [[0, '#24365E'], [1, '#141B33']]);
    // battery icon: big, glowing green, lightning bolt
    const bw = 64, bh = 30, bxx = cxp - bw / 2 - 3, byy = cyp - 6;
    g.save(); g.translate(cxp, cyp); g.transform(1, 0, -0.02, 1, 0, 0); g.translate(-cxp, -cyp);
    g.lineWidth = 4; g.strokeStyle = '#D9FFE6'; g.stroke(LB.rr(bxx, byy - bh / 2, bw, bh, 7));
    g.fillStyle = '#D9FFE6'; g.fill(LB.rr(bxx + bw + 2, byy - 6, 6, 12, 2));
    g.fillStyle = LB.C.phoneGreen; g.fill(LB.rr(bxx + 5, byy - bh / 2 + 5, 14, bh - 10, 3));
    g.fillStyle = '#FFFFFF'; g.fill(LB.poly([[bxx + bw * 0.56, byy - 12], [bxx + bw * 0.4, byy + 2], [bxx + bw * 0.5, byy + 2], [bxx + bw * 0.44, byy + 13], [bxx + bw * 0.62, byy - 3], [bxx + bw * 0.52, byy - 3]]));
    g.restore();
    OTM.text(g, '7%', cxp, byy + 52, { family: 'Libre Franklin', weight: 700, size: 22, color: '#BFF5D0', align: 'center' });
    // emissive: the screen glows and the icon blooms green
    E.fillStyle = 'rgba(80,140,255,0.35)'; E.fill(scr);
    E.fillStyle = 'rgba(80,240,140,1)'; E.fill(LB.rr(bxx - 6, byy - bh / 2 - 6, bw + 18, bh + 12, 10));
    // glass sheen on the screen
    g.save(); g.clip(scr); g.globalAlpha = 0.12; g.fillStyle = '#FFFFFF'; g.fill(LB.poly([[t0[0], t0[1]], [t0[0] + 60, t0[1]], [b0[0] + 10, b0[1]], [b0[0] - 40, b0[1]]])); g.restore();
  }

  // ---------- sun shafts through the air (soft, screen) ----------
  LB.shaft(g, [[W + 40, -60], [W + 40, 380], [P(...patchF[1])[0], P(...patchF[1])[1]], [P(...patchF[0])[0] - 120, P(...patchF[0])[1] - 220]], '#FFE9B8', 0.12, 18);

  // ---------- caption (Daniel V.O., carried over the cut) ----------
  f.finish({ grain: 0.035, fibre: 0, vignette: 0, halation: 0.75, letterbox: 1.7778, beforePost: c => LB.vignette(c, '#5A2A3A', 0.38, 0.45, 1.15) });
  LB.caption(ctx, ['When did you realise?'], { y: 1010, size: 44 });
  window.FRAME_READY = true;
})();
