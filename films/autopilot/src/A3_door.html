<!doctype html><meta charset="utf-8"><title>A3 The Door</title>
<script src="../kit/otm.js"></script><script src="../kit/figures.js"></script><script src="../kit/look_a.js"></script>
<script>
(async()=>{
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), {W, H, S} = OTM, P = LA.P;
  const f = OTM.frame(ctx, {seed: 33});
  const g = f.world, E = f.emissive;
  const sm = LA.smooth;
  const DEBUG = /debug/.test(location.search);

  // ================= camera and the last sun =================
  const cam = LA.cam({eye: [1.75, 1.0, 0], yaw: -0.2, pitch: -0.006, fov: 0.92});
  const q = a => cam.pts(a), qp = a => cam.poly(a);
  const face = (pts3, color, rough, seed, alpha) => LA.fillPts(g, qp(pts3), color, rough == null ? 0.6 : rough, seed == null ? 5 : seed, alpha);
  // very low, behind the camera's right shoulder: everything that faces it goes copper; shadows run away to the left
  const EL = 0.085, SUN = [-0.86 * Math.cos(EL), -Math.sin(EL), -0.51 * Math.cos(EL)];
  const shadowOf = p => { const t = p[1] / -SUN[1]; return [p[0] + SUN[0] * t, 0.002, p[2] + SUN[2] * t]; };

  const COP = {hot: '#F6CE93', hi: '#E7A061', mid: '#C27445', lo: '#8E4A2E'};
  const SHD = '#2C2741', SHD2 = '#241F37';

  // ================= sky: the east, already dusk; flat bands =================
  const SKY = ['#25243F', '#2F2D4D', '#3B3858', '#4D4562', '#61536A'];
  g.fillStyle = SKY[0]; g.fillRect(0, 0, W, H);
  const hz = q([[ -20, 1.02, 600]])[0][1];
  [[hz - 360, SKY[1]], [hz - 230, SKY[2]], [hz - 130, SKY[3]], [hz - 60, SKY[4]]].forEach(([y, c], i) => {
    const p = LA.polyP([[-20, y + 24], [W * 0.45, y + 6], [W + 20, y - 18], [W + 20, H], [-20, H]], 2.0, 300 + i); g.fillStyle = c; g.fill(p);
    LA.seam(g, p, SKY[i], 4);
  });

  // ================= the nursery, across the car park =================
  const ZN = 17.5;
  face([[-16, 0, ZN], [10, 0, ZN], [10, 3.05, ZN], [-16, 3.05, ZN]], '#83503F', 0.8, 10);          // brick, upper wall in the last copper
  face([[-16, 0, ZN - 0.01], [10, 0, ZN - 0.01], [10, 1.55, ZN - 0.01], [-16, 1.85, ZN - 0.01]], '#5A3A40', 1.6, 13);   // the shadow has already climbed the lower wall
  face([[-16, 3.05, ZN], [10, 3.05, ZN], [10, 3.4, ZN + 0.8], [-16, 3.4, ZN + 0.8]], '#3A2C42', 0.6, 11);
  face([[-16, 2.82, ZN - 0.02], [10, 2.82, ZN - 0.02], [10, 3.05, ZN - 0.02], [-16, 3.05, ZN - 0.02]], '#6A3E36', 0.5, 12);
  // windows (dark), the front door boarded with plywood, a notice taped on it
  [[-13.6, 1.0], [-10.6, 1.0], [-2.6, 1.0], [4.2, 1.0], [7.2, 1.0]].forEach(([x, y], i) => face([[x, y, ZN - 0.03], [x + 1.5, y, ZN - 0.03], [x + 1.5, y + 1.2, ZN - 0.03], [x, y + 1.2, ZN - 0.03]], '#251F31', 0.4, 20 + i));
  face([[-7.3, 0, ZN - 0.03], [-6.1, 0, ZN - 0.03], [-6.1, 2.15, ZN - 0.03], [-7.3, 2.15, ZN - 0.03]], '#A5795A', 0.5, 25);
  face([[-6.88, 1.3, ZN - 0.04], [-6.52, 1.3, ZN - 0.04], [-6.52, 1.62, ZN - 0.04], [-6.88, 1.62, ZN - 0.04]], '#CDB596', 0.3, 26);
  // painted animals (flat house paint, muted by dusk): an elephant, a giraffe. No rose anywhere.
  (() => {
    const wp = (x, y) => q([[x, y, ZN - 0.035]])[0];
    const mk = (pts, col, sd) => LA.fillP(g, sm(pts.map(([x, y, c]) => { const p = wp(x, y); return c ? [p[0], p[1], 1] : p; })).path(0.9, sd), col);
    // elephant: body, head, trunk curled up, ear, legs
    mk([[-12.2, 0.55, 1], [-12.25, 1.35], [-11.8, 1.85], [-10.9, 1.95], [-10.2, 1.7], [-9.95, 1.2], [-10.0, 0.55, 1], [-10.4, 0.55, 1], [-10.45, 0.95], [-11.6, 0.95], [-11.7, 0.55, 1]], '#5F6286', 31);
    mk([[-10.25, 1.75], [-9.6, 1.85], [-9.35, 1.45], [-9.4, 1.0], [-9.15, 0.85], [-9.0, 1.0], [-9.15, 1.15], [-9.1, 1.5], [-9.55, 1.25], [-10.0, 1.3]], '#5F6286', 32);
    mk([[-10.3, 1.85], [-9.95, 1.95], [-9.85, 1.4], [-10.2, 1.3]], '#55577A', 33);
    // giraffe: tall, neck up the wall
    mk([[2.1, 0.3, 1], [2.2, 1.15], [2.7, 1.25], [3.3, 2.45], [3.6, 2.62], [3.75, 2.5], [3.55, 2.35], [3.05, 1.15], [3.25, 0.3, 1], [3.05, 0.3, 1], [2.95, 0.9], [2.45, 0.9], [2.35, 0.3, 1]], '#9C7748', 34);
  })();

  // ================= tarmac: the last pool of light around the car, dusk beyond =================
  const TAR = [[-40, 0, 0.6], [40, 0, 0.6], [40, 0, ZN - 0.05], [-40, 0, ZN - 0.05]];
  const tarPts = qp(TAR), tarP = LA.polyP(tarPts, 0.5, 50);
  LA.fillP(g, tarP, '#4A3447');                                              // the far car park, fallen into dusk
  LA.within(g, tarP, () => {
    // the lit pool: copper, two flat bands, edged by the shadow of the trees behind us
    face([[-30, 0.001, 0.6], [30, 0.001, 0.6], [30, 0.001, 9.6], [-6, 0.001, 9.0], [-30, 0.001, 7.0]], '#7B4635', 1.6, 51);
    face([[-30, 0.0015, 0.6], [30, 0.0015, 0.6], [30, 0.0015, 7.6], [-3, 0.0015, 7.0], [-30, 0.0015, 5.2]], '#93573A', 1.6, 52);
  });
  // a parking bay line, pale paint
  face([[-1.9, 0.003, 2.0], [-1.8, 0.003, 2.0], [-0.85, 0.003, 9.6], [-0.95, 0.003, 9.6]], '#C88F64', 0.5, 60);
  face([[3.3, 0.003, 1.0], [3.4, 0.003, 1.0], [4.2, 0.003, 8.0], [4.1, 0.003, 8.0]], '#C88F64', 0.5, 61);

  // ================= the swings (off frame, right): only their long shadows reach across =================
  const SW = (() => {
    const out = {legs: [], chains: [], seats: []};
    const a = [3.05, 2.05], b = [4.65, 0.75];                     // top bar ends (x, z), 2.1 m high
    const bar = [b[0] - a[0], b[1] - a[1]], bl = Math.hypot(...bar), bn = [-bar[1] / bl, bar[0] / bl];
    [a, b].forEach(e => [-0.62, 0.62].forEach(k => out.legs.push([[e[0] + bn[0] * k, 0, e[1] + bn[1] * k], [e[0], 2.1, e[1]]])));
    out.bar = [[a[0], 2.1, a[1]], [b[0], 2.1, b[1]]];
    [0.3, 0.7].forEach(t => { const x = a[0] + bar[0] * t, z = a[1] + bar[1] * t;
      [-0.2, 0.2].forEach(k => out.chains.push([[x + bar[0] / bl * k, 0.46, z + bar[1] / bl * k], [x + bar[0] / bl * k, 2.1, z + bar[1] / bl * k]]));
      out.seats.push([[x - bar[0] / bl * 0.24, 0.46, z - bar[1] / bl * 0.24], [x + bar[0] / bl * 0.24, 0.46, z + bar[1] / bl * 0.24]]); });
    return out;
  })();
  const shadowStripe = (p0, p1, w0, w1, sd) => {
    const A = q([shadowOf(p0)])[0], B = q([shadowOf(p1)])[0], d = LA.norm(B[0] - A[0], B[1] - A[1]), n = [-d[1], d[0]];
    return LA.polyP([[A[0] + n[0] * w0, A[1] + n[1] * w0], [B[0] + n[0] * w1, B[1] + n[1] * w1], [B[0] - n[0] * w1, B[1] - n[1] * w1], [A[0] - n[0] * w0, A[1] - n[1] * w0]], 0.8, sd);
  };
  LA.within(g, tarP, () => {
    g.save(); g.fillStyle = SHD;
    SW.legs.forEach(([p0, p1], i) => g.fill(shadowStripe(p0, p1, 9, 2.5, 400 + i)));
    SW.chains.forEach(([p0, p1], i) => g.fill(shadowStripe(p0, p1, 1.8, 0.8, 410 + i)));
    SW.seats.forEach(([p0, p1], i) => { const s0 = q([shadowOf(p0)])[0], s1 = q([shadowOf(p1)])[0];
      g.fill(LA.polyP([[s0[0], s0[1] - 7], [s1[0], s1[1] - 7], [s1[0] + 10, s1[1] + 9], [s0[0] + 10, s0[1] + 9]], 0.8, 420 + i)); });
    g.restore();
  });

  // ================= the car: silver hatchback, right side to us, right-rear door open =================
  const C = [0.3, 0, 6.5], A = 0.25;
  const DF = [Math.cos(A), 0, -Math.sin(A)], NR = [-Math.sin(A), 0, -Math.cos(A)];
  const CW = (s, u, w) => [C[0] + s * DF[0] + (0.875 + (w || 0)) * NR[0], u, C[2] + s * DF[2] + (0.875 + (w || 0)) * NR[2]];
  const CWL = (s, u) => [C[0] + s * DF[0] - 0.875 * NR[0], u, C[2] + s * DF[2] - 0.875 * NR[2]];
  const sideS = (pts, w) => sm(pts.map(([s, u, c]) => { const p = q([CW(s, u, w || 0)])[0]; return c ? [p[0], p[1], 1] : p; }));
  // its long shadow on the tarmac, away to the left
  (() => {
    const base = [CW(-2.05, 0), CW(2.05, 0), CWL(2.05, 0), CWL(-2.05, 0)];
    const tops = [CW(-1.3, 1.46), CW(0.36, 1.44), CWL(-1.3, 1.46), CWL(0.36, 1.44), CW(-2.02, 0.98), CWL(-2.02, 0.98), CW(2.02, 0.76), CWL(2.02, 0.76)].map(shadowOf);
    LA.within(g, tarP, () => LA.fillP(g, LA.polyP(LA.hull(q(base.concat(tops))), 1.4, 70), SHD));
  })();
  // far-side roofline seen over the near side (a sliver of the roof)
  LA.fillPts(g, q([CW(0.4, 1.44), CW(-1.28, 1.47), CWL(-1.28, 1.47), CWL(0.4, 1.44)]), '#5D5272', 0.5, 71);
  // body: one smooth cut-paper silhouette (profile), then its planes
  const PROFILE = [[-2.02, 0.3, 1], [-2.09, 0.44], [-2.09, 0.66], [-2.06, 0.86], [-2.0, 0.99], [-1.78, 1.3], [-1.46, 1.45], [-0.6, 1.49], [0.36, 1.45], [0.78, 1.2], [1.16, 0.98], [1.74, 0.87], [2.04, 0.76], [2.11, 0.56], [2.06, 0.31, 1],
    [1.7, 0.29, 1], [1.62, 0.52], [1.46, 0.66], [1.3, 0.7], [1.13, 0.66], [0.98, 0.52], [0.9, 0.29, 1], [-0.86, 0.29, 1], [-0.94, 0.52], [-1.1, 0.66], [-1.26, 0.7], [-1.42, 0.66], [-1.58, 0.52], [-1.66, 0.29, 1]];
  const bodyP = sideS(PROFILE).path(0.7, 72);
  LA.fillP(g, bodyP, '#AC7E6C');                                   // silver, warmed by the raking copper
  LA.within(g, bodyP, () => {
    // below the shoulder the panel turns under, away from the sun: a cooler second paper
    LA.fillP(g, sideS([[-2.3, 0.0, 1], [2.3, 0.0, 1], [2.3, 0.6], [0, 0.66], [-2.3, 0.7]]).path(1.0, 73), '#73586A');
    // the rear quarter and tail turn away: dusk
    LA.fillP(g, sideS([[-2.4, 0.0, 1], [-1.78, 0.0, 1], [-1.9, 0.7], [-1.82, 1.32], [-1.5, 1.6, 1], [-2.4, 1.6, 1]]).path(0.8, 74), '#544762');
  });
  // the shoulder line: the sun lies along it as a thin white-hot crease
  LA.fillP(g, sideS([[-1.92, 0.995, 1], [1.12, 0.955], [1.8, 0.835], [1.8, 0.81], [1.12, 0.93], [-1.92, 0.97, 1]], 0.01).path(0.5, 75), COP.hot);
  // windows: one dark reflective band (the daylight opening), pillars cut into it; nothing inside can be seen
  const DLO = sideS([[1.08, 1.0, 1], [0.42, 1.4], [-1.25, 1.42], [-1.62, 1.08], [-1.7, 1.0, 1]], -0.03);
  const dloP = DLO.path(0.5, 76);
  LA.fillP(g, dloP, '#24223A');
  LA.within(g, dloP, () => LA.fillP(g, sideS([[1.3, 1.0, 1], [0.2, 1.0], [0.6, 1.5, 1], [1.3, 1.5, 1]], -0.03).path(0.8, 77), '#35324F'));   // the sky's sheen on the front glass
  // pillars: B (dark), C (body colour, broad)
  LA.fillP(g, sideS([[0.08, 0.99, 1], [0.08, 1.43, 1], [-0.05, 1.43, 1], [-0.05, 0.99, 1]], -0.02).path(0.3, 78), '#1E1C2A');
  LA.fillP(g, sideS([[-1.0, 0.99, 1], [-1.06, 1.44, 1], [-1.3, 1.44], [-1.66, 1.06], [-1.72, 0.99, 1]], -0.02).path(0.4, 79), '#6C5468');
  // the door OPENING (debug: magenta). The open door and Daniel must cover every pixel of it.
  const openingP = LA.polyP(q([CW(-0.03, 0.28, 0), CW(-0.03, 1.43, -0.04), CW(-0.97, 1.43, -0.04), CW(-0.97, 0.28, 0)]), 0.3, 80);
  LA.fillP(g, openingP, DEBUG ? '#FF00FF' : '#0D0C17');
  // wheels: tyre, a dim rim
  [[1.3, 81], [-1.26, 82]].forEach(([s, sd]) => {
    const c2 = q([CW(s, 0.31, 0.03)])[0], rx = Math.abs(q([CW(s + 0.31, 0.31, 0.03)])[0][0] - c2[0]), ry = c2[1] - q([CW(s, 0.62, 0.03)])[0][1];
    LA.fillP(g, S().ellipse(c2[0], c2[1], rx, ry, 0).path(0.6, sd), '#18161F');
    LA.fillP(g, S().ellipse(c2[0] + rx * 0.08, c2[1], rx * 0.62, ry * 0.64, 0).path(0.4, sd + 10), '#5A5068');
    LA.fillP(g, S().ellipse(c2[0] + rx * 0.08, c2[1], rx * 0.18, ry * 0.2, 0).path(0.3, sd + 20), '#2E2A3B');
  });
  // front door shut line, handle, side mirror
  g.save(); g.strokeStyle = '#5E4652'; g.lineWidth = 2;
  [[1.06, 0.97, 1.0, 0.33], [0.07, 0.96, 0.07, 0.31]].forEach(([s0, u0, s1, u1]) => { const A2 = q([CW(s0, u0, 0.005)])[0], B2 = q([CW(s1, u1, 0.005)])[0]; g.beginPath(); g.moveTo(A2[0], A2[1]); g.lineTo(B2[0], B2[1]); g.stroke(); });
  g.restore();
  LA.fillP(g, sideS([[0.42, 0.87, 1], [0.64, 0.87, 1], [0.64, 0.83, 1], [0.42, 0.83, 1]], 0.01).path(0.2, 84), '#5A4250');
  LA.fillP(g, sideS([[1.02, 0.99], [0.9, 1.04], [0.74, 1.05], [0.78, 0.95]], 0.24).path(0.4, 85), '#4A3B4E');

  // ================= DANIEL: on his knees at the door's edge, one arm reaching into the car =================
  const KN = [-1.02, 0, 5.24];                                      // his near knee on the tarmac
  const kn = q([KN])[0], K = cam.scaleAt(cam.view(KN)[2]) * 0.235;
  const T = (x, y) => [kn[0] + x * K, kn[1] + y * K];
  const pts = a => a.map(p => { const t = T(p[0], p[1]); return p[2] ? [t[0], t[1], 1] : t; });
  // his shadow on the tarmac (away to the left), drawn first
  LA.within(g, tarP, () => LA.fillP(g, LA.polyP(LA.hull(q([[-1.3, 0, 5.3], [-0.7, 0, 5.1], shadowOf([-1.0, 1.15, 5.3]), shadowOf([-0.6, 1.0, 5.15])])), 1.2, 100), SHD));
  const DAN = {
    shins: sm(pts([[-2.4, -0.02], [-2.42, -0.32], [-1.75, -0.4], [-0.6, -0.56], [0.12, -0.66], [0.44, -0.42], [0.42, 0.0, 1]])),
    shoes: sm(pts([[-2.55, -0.05], [-2.5, -0.36], [-2.05, -0.44], [-1.82, -0.3], [-1.86, -0.04, 1]])),
    thighs: sm(pts([[-0.42, -0.5], [-0.56, -1.28], [-0.48, -1.98], [0.1, -2.12], [0.72, -1.98], [0.62, -1.2], [0.46, -0.52]])),
    torso: sm(pts([[-0.5, -1.86], [-0.36, -2.6], [-0.06, -3.36], [0.42, -3.92], [0.98, -4.16], [1.36, -4.02], [1.56, -3.66], [1.52, -3.0], [1.18, -2.4], [0.8, -1.98]])),
    neck: S().capsule(...T(1.12, -3.98), 0.26 * K, ...T(1.45, -4.22), 0.22 * K),
    head: sm(pts([[1.32, -4.12], [1.3, -4.5], [1.5, -4.88], [1.86, -5.02], [2.16, -4.86], [2.28, -4.5], [2.16, -4.12], [1.86, -3.94], [1.56, -3.96]])),
    hair: sm(pts([[1.26, -4.3], [1.3, -4.64], [1.5, -4.94], [1.86, -5.08], [2.18, -4.92], [2.3, -4.6], [2.2, -4.48], [1.98, -4.6], [1.7, -4.48], [1.5, -4.26, 1], [1.44, -4.08]])),
    ear: S().ellipse(...T(1.62, -4.32), 0.08 * K, 0.13 * K, 0.6),
    // the near arm: up and forward, into the car past the door's edge (the door will hide it)
    arm: S().capsule(...T(1.05, -3.76), 0.3 * K, ...T(2.05, -3.3), 0.24 * K).add(S().capsule(...T(2.05, -3.3), 0.22 * K, ...T(3.1, -2.85), 0.18 * K)),
    tie: sm(pts([[1.5, -3.72], [1.6, -3.7], [1.72, -2.86], [1.66, -2.74], [1.58, -2.86]])),
  };
  const dsk = '#4A3A40', shirt = '#4F4A66', trou = '#25222F', shoe = '#18161F', hairC = '#16141E', tieC = '#2E2A3E';
  const dParts = [[DAN.shins, trou, 31], [DAN.shoes, shoe, 32], [DAN.thighs, trou, 33], [DAN.arm, shirt, 34], [DAN.torso, shirt, 35], [DAN.tie, tieC, 36], [DAN.neck, dsk, 37], [DAN.head, dsk, 38], [DAN.hair, hairC, 39], [DAN.ear, dsk, 40]];
  const danAll = S(); dParts.forEach(([s]) => danAll.add(s)); const danP = danAll.path(0.6, 41);
  dParts.forEach(([s, c, sd]) => LA.fillP(g, s.path(0.6, sd), c));
  // the shirt's back seam and a fold at the waist (paper on paper)
  g.save(); g.strokeStyle = '#3F3A55'; g.lineWidth = 2; g.lineCap = 'round'; { const a = T(0.1, -3.4), b = T(-0.2, -2.6), c = T(-0.3, -2.0); g.beginPath(); g.moveTo(a[0], a[1]); g.quadraticCurveTo(b[0], b[1], c[0], c[1]); g.stroke(); } g.restore();
  // the open door beside him throws its copper back onto his near side: a soft bounce rim, nothing more
  LA.rim(g, danP, LA.norm(1, -0.25), 2.2, '#B97A5C', null, 0.9);
  LA.rim(g, DAN.shoes.path(0.6, 32), LA.norm(0, -1), 1.6, COP.mid, null, 0.8);

  // ================= the open rear door (drawn over his reaching arm) =================
  const TH = 0.8, HINGE = CW(-0.035, 0, 0.02);
  const DD = [-DF[0] * Math.cos(TH) + NR[0] * Math.sin(TH), 0, -DF[2] * Math.cos(TH) + NR[2] * Math.sin(TH)];
  const DN = [NR[0] * Math.cos(TH) + DF[0] * Math.sin(TH), 0, NR[2] * Math.cos(TH) + DF[2] * Math.sin(TH)];
  const DW = (t, u, o) => [HINGE[0] + DD[0] * t + DN[0] * (o || 0), u, HINGE[2] + DD[2] * t + DN[2] * (o || 0)];
  const doorS = (a, o) => sm(a.map(([t, u, c]) => { const p = q([DW(t, u, o || 0)])[0]; return c ? [p[0], p[1], 1] : p; }));
  // its shadow on the tarmac (falls over the place he kneels)
  LA.within(g, tarP, () => LA.fillP(g, LA.polyP(LA.hull(q([DW(0, 0.0), DW(0.94, 0.0), shadowOf(DW(0.94, 0.32)), shadowOf(DW(0, 0.3)), shadowOf(DW(0.94, 0.7)), shadowOf(DW(0, 0.7))])), 1.0, 90), SHD2, 0.7));
  // the free edge's thickness (the door's rear face), in shade
  LA.fillPts(g, q([DW(0.94, 0.32, 0), DW(0.94, 0.32, -0.1), DW(0.96, 0.99, -0.1), DW(0.91, 1.39, -0.08), DW(0.91, 1.39, 0)]), '#3A3150', 0.4, 91);
  const doorBody = doorS([[-0.04, 0.3, 1], [0.94, 0.32, 1], [0.96, 0.99], [0.91, 1.39, 1], [0.0, 1.42, 1]]);
  const doorP = doorBody.path(0.6, 92);
  LA.fillP(g, doorP, '#D99A6C');                                     // the brightest large plane: full in the last sun
  LA.occlude(E, doorP);
  LA.within(g, doorP, () => LA.fillP(g, doorS([[-0.1, 0.2, 1], [1.0, 0.2, 1], [1.0, 0.58], [-0.1, 0.62]]).path(1.0, 93), '#B97A59'));
  // the glass: a dark mirror of the west behind us. In it: the empty swings against the sun, and the sun sinking out of it.
  const glassD = doorS([[0.07, 1.0, 1], [0.88, 1.01, 1], [0.84, 1.34], [0.09, 1.36, 1]], 0.005);
  const glassDP = glassD.path(0.4, 95);
  LA.fillP(g, glassDP, '#2D2A45');
  LA.within(g, glassDP, () => {
    LA.fillP(g, doorS([[-0.1, 1.0, 1], [1.1, 1.0, 1], [1.1, 1.15], [-0.1, 1.12]], 0.006).path(0.9, 96), '#6B4A5B');
    LA.fillP(g, doorS([[-0.1, 1.0, 1], [1.1, 1.0, 1], [1.1, 1.07], [-0.1, 1.055]], 0.007).path(0.9, 97), '#B0643F');
    // the swing frame, reflected: an A-frame and two hanging seats, ink against the copper
    g.save(); g.strokeStyle = '#2A2238'; g.lineCap = 'round';
    const rg = (t, u) => q([DW(t, u, 0.008)])[0];
    g.lineWidth = 3.2; [[0.3, 1.0, 0.36, 1.2], [0.42, 1.0, 0.36, 1.2], [0.66, 1.0, 0.72, 1.2], [0.78, 1.0, 0.72, 1.2], [0.36, 1.2, 0.72, 1.2]].forEach(([t0, u0, t1, u1]) => { const A2 = rg(t0, u0), B2 = rg(t1, u1); g.beginPath(); g.moveTo(A2[0], A2[1]); g.lineTo(B2[0], B2[1]); g.stroke(); });
    g.lineWidth = 1.3; [0.47, 0.51, 0.58, 0.62].forEach(t => { const A2 = rg(t, 1.2), B2 = rg(t, 1.06); g.beginPath(); g.moveTo(A2[0], A2[1]); g.lineTo(B2[0], B2[1]); g.stroke(); });
    g.lineWidth = 3.4; [[0.46, 0.52], [0.57, 0.63]].forEach(([t0, t1]) => { const A2 = rg(t0, 1.06), B2 = rg(t1, 1.06); g.beginPath(); g.moveTo(A2[0], A2[1]); g.lineTo(B2[0], B2[1]); g.stroke(); });
    g.restore();
    // the sun: a white-hot half disc, already half under the beltline
    const sc = q([DW(0.56, 1.005, 0.009)])[0], sr = 11;
    const sunP = new Path2D(); sunP.ellipse(sc[0], sc[1], sr * 1.05, sr, 0, Math.PI, 0); sunP.closePath();
    LA.sunPlane(g, E, sunP, {layers: [{w: 7, color: COP.hi}, {w: 3.5, color: COP.hot}], glow: 1.0, glowColor: '#FFD9A0'});
  });
  // window frame line, handle
  g.save(); g.strokeStyle = '#A9694C'; g.lineWidth = 2.4; g.stroke(glassDP); g.restore();
  LA.fillP(g, doorS([[0.6, 0.875, 1], [0.8, 0.875, 1], [0.8, 0.835, 1], [0.6, 0.835, 1]], 0.012).path(0.2, 98), '#8E5640');
  LA.rim(g, doorP, LA.norm(1, -0.5), 2.6, COP.hot, null, 1);

  LA.finish(f, ctx, {letterbox: 2.0, halation: 0.5, grain: 0.07, fibre: 0.07, vig: {color: '#0F0E1C', a: 0.5, inner: 0.42, outer: 1.12}});
  LA.slate(ctx, 'AUTOPILOT  ·  LOOK A  ·  WHITE HEAT  ·  03', 'THE DOOR  ·  EXT. NURSERY CAR PARK  ·  DUSK', 2.0);
  window.FRAME_READY = true;
})();
