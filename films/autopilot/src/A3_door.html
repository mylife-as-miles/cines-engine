<!doctype html><meta charset="utf-8"><title>A3 The Door</title>
<script src="../kit/otm.js"></script><script src="../kit/figures.js"></script><script src="../kit/look_a.js"></script>
<script>
(async()=>{
  await OTM.loadFonts('../fonts/fonts.css');
  await document.fonts.load('300 40px "Oswald"');
  const ctx = OTM.stage(), {W, H, S} = OTM, P = LA.P;
  const f = OTM.frame(ctx, {seed: 33});
  const g = f.world, E = f.emissive;
  const sm = LA.smooth;
  const DEBUG = /debug/.test(location.search);

  // ================= camera and the last sun =================
  // Low, at the car's front-right quarter, looking back at the open right-rear door (behind the driver's seat).
  // From here the open door's outer skin covers the whole door opening: the inside of the car is never seen.
  const cam = LA.cam({eye: [1.55, 1.02, 0], yaw: -0.3, pitch: -0.01, fov: 0.88});
  const q = a => cam.pts(a), qp = a => cam.poly(a);
  const face = (pts3, color, rough, seed, alpha) => LA.fillPts(g, qp(pts3), color, rough == null ? 0.6 : rough, seed == null ? 5 : seed, alpha);
  // the sun: almost down, behind the camera's right shoulder. Shadows run away to the left; the door's glass faces it.
  const EL = 0.1, SUN = [-0.8 * Math.cos(EL), -Math.sin(EL), 0.6 * Math.cos(EL)];
  const shadowOf = p => { const t = p[1] / -SUN[1]; return [p[0] + SUN[0] * t, 0.002, p[2] + SUN[2] * t]; };
  const COP = {hot: '#F6CE93', hi: '#E7A061', mid: '#C27445', lo: '#8E4A2E'};
  const SHD = '#2E2843';

  // ================= sky: the east, already dusk (flat bands, no gradient) =================
  const SKY = ['#24233E', '#2D2B4B', '#383556', '#48415F', '#5A4D66'];
  g.fillStyle = SKY[0]; g.fillRect(0, 0, W, H);
  const hz = q([[-20, 1.02, 600]])[0][1];
  [[hz - 380, SKY[1]], [hz - 250, SKY[2]], [hz - 150, SKY[3]], [hz - 70, SKY[4]]].forEach(([y, c], i) => {
    const p = LA.polyP([[-20, y + 22], [W * 0.45, y + 6], [W + 20, y - 16], [W + 20, H], [-20, H]], 2.0, 300 + i); g.fillStyle = c; g.fill(p);
    LA.seam(g, p, SKY[i], 4);
  });

  // ================= the nursery, far across the car park =================
  const ZN = 24;
  face([[-22, 0, ZN], [14, 0, ZN], [14, 2.75, ZN], [-22, 2.75, ZN]], '#7A4A3E', 0.8, 10);
  face([[-22, 0, ZN - 0.01], [14, 0, ZN - 0.01], [14, 1.9, ZN - 0.01], [-22, 2.15, ZN - 0.01]], '#4B3240', 1.8, 13);   // dusk has climbed the wall
  face([[-22, 2.75, ZN], [14, 2.75, ZN], [14, 3.05, ZN + 0.8], [-22, 3.05, ZN + 0.8]], '#33283E', 0.6, 11);
  face([[-22, 2.55, ZN - 0.02], [14, 2.55, ZN - 0.02], [14, 2.75, ZN - 0.02], [-22, 2.75, ZN - 0.02]], '#5E3833', 0.5, 12);
  [[-19.5], [-16.0], [-2.2], [3.6], [7.4]].forEach(([x], i) => face([[x, 0.9, ZN - 0.03], [x + 1.6, 0.9, ZN - 0.03], [x + 1.6, 2.1, ZN - 0.03], [x, 2.1, ZN - 0.03]], '#221C2E', 0.4, 20 + i));
  // the front door, boarded with a sheet of plywood; the notice taped at eye level
  face([[-10.6, 0, ZN - 0.03], [-9.4, 0, ZN - 0.03], [-9.4, 2.1, ZN - 0.03], [-10.6, 2.1, ZN - 0.03]], '#8E6A54', 0.5, 25);
  face([[-10.2, 1.3, ZN - 0.04], [-9.8, 1.3, ZN - 0.04], [-9.8, 1.62, ZN - 0.04], [-10.2, 1.62, ZN - 0.04]], '#B9A48A', 0.3, 26);
  // painted animals on the wall, muted by dusk (an elephant, a giraffe); no rose anywhere
  (() => {
    const wp = (x, y) => q([[x, y, ZN - 0.035]])[0];
    const mk = (pts, col, sd) => LA.fillP(g, sm(pts.map(([x, y, c]) => { const p = wp(x, y); return c ? [p[0], p[1], 1] : p; })).path(0.9, sd), col);
    mk([[-15.0, 0.5, 1], [-15.05, 1.3], [-14.6, 1.8], [-13.7, 1.9], [-13.0, 1.65], [-12.75, 1.15], [-12.8, 0.5, 1], [-13.2, 0.5, 1], [-13.25, 0.9], [-14.4, 0.9], [-14.5, 0.5, 1]], '#4F5072', 31);
    mk([[-13.05, 1.7], [-12.4, 1.8], [-12.15, 1.4], [-12.2, 0.95], [-11.95, 0.8], [-11.8, 0.95], [-11.95, 1.1], [-11.9, 1.45], [-12.35, 1.2], [-12.8, 1.25]], '#4F5072', 32);
    mk([[1.0, 0.3, 1], [1.1, 1.1], [1.6, 1.2], [2.2, 2.3], [2.5, 2.45], [2.65, 2.33], [2.45, 2.2], [1.95, 1.1], [2.15, 0.3, 1], [1.95, 0.3, 1], [1.85, 0.85], [1.35, 0.85], [1.25, 0.3, 1]], '#7D6043', 34);
  })();

  // ================= tarmac: the last pool of copper around the car, dusk beyond =================
  const tarP = LA.polyP(qp([[-40, 0, 0.6], [40, 0, 0.6], [40, 0, ZN - 0.05], [-40, 0, ZN - 0.05]]), 0.5, 50);
  LA.fillP(g, tarP, '#46314A');
  LA.within(g, tarP, () => {
    face([[-30, 0.001, 0.6], [30, 0.001, 0.6], [30, 0.001, 11.0], [-6, 0.001, 10.0], [-30, 0.001, 8.0]], '#73443A', 1.6, 51);
    face([[-30, 0.0015, 0.6], [30, 0.0015, 0.6], [30, 0.0015, 8.2], [-3, 0.0015, 7.6], [-30, 0.0015, 5.6]], '#8E553B', 1.6, 52);
  });
  face([[-2.0, 0.003, 2.4], [-1.9, 0.003, 2.4], [-0.95, 0.003, 9.6], [-1.05, 0.003, 9.6]], '#B98560', 0.5, 60);

  // ================= the swings stand off frame, right. Only their long shadows reach across the tarmac =================
  const SW = (() => {
    const out = {legs: [], chains: [], seats: []};
    const a = [2.9, 2.3], b = [3.9, 1.4];
    const bar = [b[0] - a[0], b[1] - a[1]], bl = Math.hypot(...bar), bd = [bar[0] / bl, bar[1] / bl], bn = [-bd[1], bd[0]];
    [a, b].forEach(e => [-0.62, 0.62].forEach(k => out.legs.push([[e[0] + bn[0] * k, 0, e[1] + bn[1] * k], [e[0], 2.1, e[1]]])));
    [0.3, 0.7].forEach(t => { const x = a[0] + bar[0] * t, z = a[1] + bar[1] * t;
      [-0.21, 0.21].forEach(k => out.chains.push([[x + bd[0] * k, 0.46, z + bd[1] * k], [x + bd[0] * k, 2.1, z + bd[1] * k]]));
      out.seats.push([[x - bd[0] * 0.25, 0.46, z - bd[1] * 0.25], [x + bd[0] * 0.25, 0.46, z + bd[1] * 0.25]]); });
    return out;
  })();
  const stripe = (p0, p1, w0, w1, sd) => {
    const A = q([shadowOf(p0)])[0], B = q([shadowOf(p1)])[0], d = LA.norm(B[0] - A[0], B[1] - A[1]), n = [-d[1], d[0]];
    return LA.polyP([[A[0] + n[0] * w0, A[1] + n[1] * w0], [B[0] + n[0] * w1, B[1] + n[1] * w1], [B[0] - n[0] * w1, B[1] - n[1] * w1], [A[0] - n[0] * w0, A[1] - n[1] * w0]], 0.8, sd);
  };
  LA.within(g, tarP, () => {
    g.save(); g.fillStyle = SHD;
    SW.legs.forEach(([p0, p1], i) => g.fill(stripe(p0, p1, 10, 2.6, 400 + i)));
    SW.chains.forEach(([p0, p1], i) => g.fill(stripe(p0, p1, 1.9, 0.8, 410 + i)));
    SW.seats.forEach(([p0, p1], i) => { const s0 = q([shadowOf(p0)])[0], s1 = q([shadowOf(p1)])[0];
      g.fill(LA.polyP([[s0[0] - 4, s0[1] - 6], [s1[0] + 4, s1[1] - 6], [s1[0] + 14, s1[1] + 7], [s0[0] + 6, s0[1] + 7]], 0.8, 420 + i)); });
    g.restore();
  });

  // ================= the car: a silver hatchback, right side to us, its right-rear door open =================
  const C = [0.3, 0, 6.5], A = 0.25;
  const DF = [Math.cos(A), 0, -Math.sin(A)], NR = [-Math.sin(A), 0, -Math.cos(A)];
  const CW = (s, u, w) => [C[0] + s * DF[0] + (0.875 + (w || 0)) * NR[0], u, C[2] + s * DF[2] + (0.875 + (w || 0)) * NR[2]];
  const CWL = (s, u) => [C[0] + s * DF[0] - 0.875 * NR[0], u, C[2] + s * DF[2] - 0.875 * NR[2]];
  const sideS = (pts, w) => sm(pts.map(([s, u, c]) => { const p = q([CW(s, u, w || 0)])[0]; return c ? [p[0], p[1], 1] : p; }));
  (() => {
    const base = [CW(-2.05, 0), CW(2.05, 0), CWL(2.05, 0), CWL(-2.05, 0)];
    const tops = [CW(-1.3, 1.46), CW(0.36, 1.44), CWL(-1.3, 1.46), CWL(0.36, 1.44), CW(-2.02, 0.98), CWL(-2.02, 0.98), CW(2.02, 0.76), CWL(2.02, 0.76)].map(shadowOf);
    LA.within(g, tarP, () => LA.fillP(g, LA.polyP(LA.hull(q(base.concat(tops))), 1.4, 70), SHD));
  })();
  LA.fillPts(g, q([CW(0.4, 1.44), CW(-1.28, 1.47), CWL(-1.28, 1.47), CWL(0.4, 1.44)]), '#584E6E', 0.5, 71);
  const PROFILE = [[-2.02, 0.3, 1], [-2.09, 0.44], [-2.09, 0.66], [-2.06, 0.86], [-2.0, 0.99], [-1.78, 1.3], [-1.46, 1.45], [-0.6, 1.49], [0.36, 1.45], [0.78, 1.2], [1.16, 0.98], [1.74, 0.87], [2.04, 0.76], [2.11, 0.56], [2.06, 0.31, 1],
    [1.7, 0.29, 1], [1.62, 0.52], [1.46, 0.66], [1.3, 0.7], [1.13, 0.66], [0.98, 0.52], [0.9, 0.29, 1], [-0.86, 0.29, 1], [-0.94, 0.52], [-1.1, 0.66], [-1.26, 0.7], [-1.42, 0.66], [-1.58, 0.52], [-1.66, 0.29, 1]];
  const bodyP = sideS(PROFILE).path(0.7, 72);
  LA.fillP(g, bodyP, '#A97B6A');
  LA.within(g, bodyP, () => {
    LA.fillP(g, sideS([[-2.3, 0.0, 1], [2.3, 0.0, 1], [2.3, 0.6], [0, 0.66], [-2.3, 0.7]]).path(1.0, 73), '#71566A');
    LA.fillP(g, sideS([[-2.4, 0.0, 1], [-1.78, 0.0, 1], [-1.9, 0.7], [-1.82, 1.32], [-1.5, 1.6, 1], [-2.4, 1.6, 1]]).path(0.8, 74), '#504360');
  });
  LA.fillP(g, sideS([[-1.92, 0.995, 1], [1.12, 0.955], [1.8, 0.835], [1.8, 0.81], [1.12, 0.93], [-1.92, 0.97, 1]], 0.01).path(0.5, 75), COP.hot);
  const dloP = sideS([[1.08, 1.0, 1], [0.42, 1.4], [-1.25, 1.42], [-1.62, 1.08], [-1.7, 1.0, 1]], -0.03).path(0.5, 76);
  LA.fillP(g, dloP, '#23213A');
  LA.within(g, dloP, () => LA.fillP(g, sideS([[1.3, 1.0, 1], [0.2, 1.0], [0.6, 1.5, 1], [1.3, 1.5, 1]], -0.03).path(0.8, 77), '#33304D'));
  LA.fillP(g, sideS([[0.08, 0.99, 1], [0.08, 1.43, 1], [-0.05, 1.43, 1], [-0.05, 0.99, 1]], -0.02).path(0.3, 78), '#1D1B29');
  LA.fillP(g, sideS([[-1.0, 0.99, 1], [-1.06, 1.44, 1], [-1.3, 1.44], [-1.66, 1.06], [-1.72, 0.99, 1]], -0.02).path(0.4, 79), '#6A5367');
  // the door opening. Only in ?debug is it magenta (to prove the open door covers every pixel of it); otherwise it is body-dark.
  const openingP = LA.polyP(q([CW(-0.03, 0.28, 0), CW(-0.03, 1.42, -0.04), CW(-0.97, 1.42, -0.04), CW(-0.97, 0.28, 0)]), 0.3, 80);
  LA.fillP(g, openingP, DEBUG ? '#FF00FF' : '#23213A');
  [[1.3, 81], [-1.26, 82]].forEach(([s, sd]) => {
    const c2 = q([CW(s, 0.31, 0.03)])[0], rx = Math.abs(q([CW(s + 0.31, 0.31, 0.03)])[0][0] - c2[0]), ry = c2[1] - q([CW(s, 0.62, 0.03)])[0][1];
    LA.fillP(g, S().ellipse(c2[0], c2[1], rx, ry, 0).path(0.6, sd), '#18161F');
    LA.fillP(g, S().ellipse(c2[0] + rx * 0.08, c2[1], rx * 0.62, ry * 0.64, 0).path(0.4, sd + 10), '#57506A');
    LA.fillP(g, S().ellipse(c2[0] + rx * 0.08, c2[1], rx * 0.18, ry * 0.2, 0).path(0.3, sd + 20), '#2E2A3B');
  });
  g.save(); g.strokeStyle = '#5C4552'; g.lineWidth = 2;
  [[1.06, 0.97, 1.0, 0.33], [0.07, 0.96, 0.07, 0.31]].forEach(([s0, u0, s1, u1]) => { const A2 = q([CW(s0, u0, 0.005)])[0], B2 = q([CW(s1, u1, 0.005)])[0]; g.beginPath(); g.moveTo(A2[0], A2[1]); g.lineTo(B2[0], B2[1]); g.stroke(); });
  g.restore();
  LA.fillP(g, sideS([[0.42, 0.87, 1], [0.64, 0.87, 1], [0.64, 0.83, 1], [0.42, 0.83, 1]], 0.01).path(0.2, 84), '#5A4250');
  LA.fillP(g, sideS([[1.02, 0.99], [0.9, 1.04], [0.74, 1.05], [0.78, 0.95]], 0.24).path(0.4, 85), '#4A3B4E');

  // ================= DANIEL: on his knees beside the open door, one arm extended into the car =================
  const KN = [-1.45, 0, 5.25];
  const kn = q([KN])[0], K = cam.scaleAt(cam.view(KN)[2]) * 0.235;
  const T = (x, y) => [kn[0] + x * K, kn[1] + y * K];
  const pts = a => a.map(p => { const t = T(p[0], p[1]); return p[2] ? [t[0], t[1], 1] : t; });
  LA.within(g, tarP, () => LA.fillP(g, LA.polyP(LA.hull(q([[-1.75, 0, 5.32], [-1.1, 0, 5.12], shadowOf([-1.35, 1.2, 5.35]), shadowOf([-1.0, 1.0, 5.2])])), 1.2, 100), SHD));
  const DAN = {
    shins: sm(pts([[-2.4, -0.02], [-2.42, -0.32], [-1.75, -0.4], [-0.6, -0.56], [0.12, -0.66], [0.44, -0.42], [0.42, 0.0, 1]])),
    shoes: sm(pts([[-2.55, -0.05], [-2.5, -0.36], [-2.05, -0.44], [-1.82, -0.3], [-1.86, -0.04, 1]])),
    thighs: sm(pts([[-0.42, -0.5], [-0.52, -1.3], [-0.45, -2.0], [0.12, -2.12], [0.66, -1.98], [0.58, -1.2], [0.46, -0.52]])),
    torso: sm(pts([[-0.48, -1.88], [-0.4, -2.7], [-0.22, -3.45], [0.12, -3.95], [0.6, -4.18], [1.02, -4.08], [1.24, -3.78], [1.26, -3.1], [1.0, -2.45], [0.72, -1.98]])),
    neck: S().capsule(...T(0.8, -4.05), 0.26 * K, ...T(1.0, -4.35), 0.22 * K),
    head: sm(pts([[0.66, -4.44], [0.66, -4.84], [0.86, -5.18], [1.2, -5.28], [1.48, -5.1], [1.56, -4.76], [1.46, -4.42], [1.2, -4.26], [0.9, -4.3]])),
    hair: sm(pts([[0.6, -4.62], [0.66, -4.96], [0.86, -5.24], [1.2, -5.34], [1.5, -5.16], [1.6, -4.84], [1.5, -4.72], [1.3, -4.86], [1.04, -4.74], [0.86, -4.52, 1], [0.78, -4.38]])),
    ear: S().ellipse(...T(0.92, -4.62), 0.08 * K, 0.13 * K, 0.6),
    arm: S().capsule(...T(0.95, -3.85), 0.3 * K, ...T(1.95, -3.45), 0.24 * K).add(S().capsule(...T(1.95, -3.45), 0.22 * K, ...T(3.1, -3.0), 0.18 * K)),
    tie: sm(pts([[1.16, -3.85], [1.26, -3.83], [1.36, -2.98], [1.3, -2.86], [1.22, -2.98]])),
  };
  const dsk = '#4A3A40', shirt = '#4E4965', trou = '#24212E', shoe = '#17151E', hairC = '#15131C', tieC = '#2C283C';
  const dParts = [[DAN.shins, trou, 31], [DAN.shoes, shoe, 32], [DAN.thighs, trou, 33], [DAN.arm, shirt, 34], [DAN.torso, shirt, 35], [DAN.tie, tieC, 36], [DAN.neck, dsk, 37], [DAN.head, dsk, 38], [DAN.hair, hairC, 39], [DAN.ear, dsk, 40]];
  const danAll = S(); dParts.forEach(([s]) => danAll.add(s)); const danP = danAll.path(0.6, 41);
  dParts.forEach(([s, c, sd]) => LA.fillP(g, s.path(0.6, sd), c));
  g.save(); g.strokeStyle = '#3E3954'; g.lineWidth = 2; g.lineCap = 'round'; { const a = T(0.0, -3.5), b = T(-0.25, -2.7), c = T(-0.3, -2.05); g.beginPath(); g.moveTo(a[0], a[1]); g.quadraticCurveTo(b[0], b[1], c[0], c[1]); g.stroke(); } g.restore();
  // the last sun reaches him from the right: a thin copper rim on the side that faces the door, his back already in dusk
  LA.rim(g, danP, LA.norm(1, -0.35), 2.6, COP.hi, null, 1);
  LA.rim(g, danP, LA.norm(1, -0.35), 1.2, COP.hot, null, 0.9);
  LA.rim(g, DAN.shoes.path(0.6, 32), LA.norm(0.6, -1), 1.6, COP.mid, null, 0.8);

  // ================= the open rear door, drawn over his reaching arm =================
  const TH = 0.8, HINGE = CW(-0.035, 0, 0.02);
  const DD = [-DF[0] * Math.cos(TH) + NR[0] * Math.sin(TH), 0, -DF[2] * Math.cos(TH) + NR[2] * Math.sin(TH)];
  const DN = [NR[0] * Math.cos(TH) + DF[0] * Math.sin(TH), 0, NR[2] * Math.cos(TH) + DF[2] * Math.sin(TH)];
  const DW = (t, u, o) => [HINGE[0] + DD[0] * t + DN[0] * (o || 0), u, HINGE[2] + DD[2] * t + DN[2] * (o || 0)];
  const doorS = (a, o) => sm(a.map(([t, u, c]) => { const p = q([DW(t, u, o || 0)])[0]; return c ? [p[0], p[1], 1] : p; }));
  LA.fillPts(g, q([DW(0.94, 0.3, 0), DW(0.94, 0.3, -0.1), DW(0.96, 0.99, -0.1), DW(0.91, 1.43, -0.08), DW(0.91, 1.43, 0)]), '#3A3150', 0.4, 91);
  const doorP = doorS([[-0.1, 0.26, 1], [0.94, 0.28, 1], [0.96, 0.99], [0.91, 1.44, 1], [-0.1, 1.47, 1]]).path(0.6, 92);
  LA.fillP(g, doorP, '#D69769');
  LA.occlude(E, doorP);
  LA.within(g, doorP, () => LA.fillP(g, doorS([[-0.2, 0.2, 1], [1.0, 0.2, 1], [1.0, 0.58], [-0.2, 0.62]]).path(1.0, 93), '#B57658'));
  // the glass: a dark mirror of the west behind us. In it, the empty swings against the sun, and the sun sinking out of it.
  const glassDP = doorS([[0.07, 1.0, 1], [0.88, 1.01, 1], [0.84, 1.36], [0.06, 1.39, 1]], 0.005).path(0.4, 95);
  LA.fillP(g, glassDP, '#2C2944');
  LA.within(g, glassDP, () => {
    LA.fillP(g, doorS([[-0.1, 1.0, 1], [1.1, 1.0, 1], [1.1, 1.15], [-0.1, 1.12]], 0.006).path(0.9, 96), '#674858');
    LA.fillP(g, doorS([[-0.1, 1.0, 1], [1.1, 1.0, 1], [1.1, 1.07], [-0.1, 1.055]], 0.007).path(0.9, 97), '#AC613E');
    g.save(); g.strokeStyle = '#272036'; g.lineCap = 'round';
    const rg = (t, u) => q([DW(t, u, 0.008)])[0];
    g.lineWidth = 3; [[0.3, 1.0, 0.36, 1.21], [0.42, 1.0, 0.36, 1.21], [0.66, 1.0, 0.72, 1.21], [0.78, 1.0, 0.72, 1.21], [0.36, 1.21, 0.72, 1.21]].forEach(([t0, u0, t1, u1]) => { const A2 = rg(t0, u0), B2 = rg(t1, u1); g.beginPath(); g.moveTo(A2[0], A2[1]); g.lineTo(B2[0], B2[1]); g.stroke(); });
    g.lineWidth = 1.2; [0.47, 0.51, 0.58, 0.62].forEach(t => { const A2 = rg(t, 1.21), B2 = rg(t, 1.065); g.beginPath(); g.moveTo(A2[0], A2[1]); g.lineTo(B2[0], B2[1]); g.stroke(); });
