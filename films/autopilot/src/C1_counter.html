<!doctype html><meta charset="utf-8"><title>C1 · The Counter</title>
<script src="../kit/otm.js"></script><script src="../kit/look_c.js"></script>
<script>
/* AUTOPILOT · LOOK C "THROUGH GLASS" · C1 THE COUNTER (INT. KITCHEN, moments after 6:14 A.M.)
   The phone, propped against the back-garden window beside the kettle, charging at 7%.
   Its black glass is the pane: it reflects what is behind the camera. The hall, the sun through the front door,
   the work bag waiting by that door with its outside pocket empty, and Daniel climbing the stairs toward the landing
   window, leaving the frame. The kettle's chrome, out of focus in the foreground, says it again, bent round.
   Warmth exists only inside the glass. */
(async () => {
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), { W, H } = OTM, P = LC.P;
  const f = OTM.frame(ctx, { seed: 21 });
  const g = f.world, E = f.emissive;
  const TOP = 138, BOT = 942;

  // ---------------- layout (frame px) ----------------
  const RAIL = { y0: 672, y1: 728 };          // window bottom rail; the worktop meets it at y1
  const MULL = { x0: 1452, x1: 1500 };        // mullion, behind the kettle
  const REVEAL = 86;                           // plastered reveal at the left edge
  const PH = { tl: [652, 168], tr: [914, 175], br: [928, 731], bl: [638, 735] };

  // =====================================================================
  // 1. THE GARDEN, through the glass: the house's shadow still lies over it; only the tall trees have the sun
  // =====================================================================
  const gd = LC.layer();
  gd.fillStyle = LC.lin(gd, 0, TOP, 0, 400, [[0, '#CCD8D4'], [1, '#E0E3D8']]); gd.fillRect(0, 0, W, H);
  // far tree line: overlapping crowns, cool bodies; the sun rising behind the house only touches their tops
  const R1 = OTM.rng('trees'); const crowns = [];
  for (let i = 0; i < 34; i++) { const x = -80 + i * 62 + R1() * 30, y = 236 + R1() * 70 + Math.sin(i * 0.7) * 26, r = 60 + R1() * 60; const pts = [];
    for (let a = 0; a < 24; a++) { const t = a / 24 * Math.PI * 2, rr = r * (0.82 + 0.3 * OTM.vnoise(Math.cos(t) * 2 + i, Math.sin(t) * 2, 5)); pts.push([x + Math.cos(t) * rr, y + 40 + Math.sin(t) * rr * 0.85]); }
    crowns.push({ p: LC.pathPts(pts), c: OTM.mix('#5B766A', '#48625A', R1()) }); }
  crowns.forEach(c => { gd.fillStyle = '#C2A773'; gd.fill(c.p); });
  crowns.forEach(c => { gd.save(); gd.translate(4, 9); gd.fillStyle = c.c; gd.fill(c.p); gd.restore(); });
  gd.fillStyle = '#4F695E'; gd.fillRect(0, 360, W, 120);
  // the fence, weathered boards in shade, a thin line of sun on its top rail
  const FT = 338, FB = 604;
  for (let x = -20; x < W + 40; x += 48) { gd.fillStyle = OTM.mix('#A2AEA5', '#94A199', ((x / 48) | 0) % 2 ? 0.15 : 0.8); gd.fillRect(x, FT + ((x * 7) % 9), 46, FB - FT); gd.fillStyle = 'rgba(38,48,44,0.35)'; gd.fillRect(x + 45, FT, 3, FB - FT); }
  gd.fillStyle = 'rgba(48,60,56,0.5)'; gd.fillRect(0, FT + 64, W, 8); gd.fillRect(0, FB - 64, W, 8);
  gd.fillStyle = 'rgba(226,186,124,0.75)'; gd.fillRect(0, FT - 4, W, 7);
  // lawn in shade
  gd.fillStyle = LC.lin(gd, 0, FB, 0, RAIL.y0 + 40, [[0, '#5A7162'], [1, '#475E50']]); gd.fillRect(0, FB, W, RAIL.y0 + 60 - FB);
  // a young tree, and a child's swing hanging still from its branch
  gd.fillStyle = '#3D5047'; gd.beginPath(); gd.moveTo(316, FB + 34); gd.bezierCurveTo(308, 500, 326, 420, 298, 280); gd.lineTo(328, 280); gd.bezierCurveTo(350, 420, 338, 500, 344, FB + 34); gd.closePath(); gd.fill();
  gd.beginPath(); gd.moveTo(318, 372); gd.bezierCurveTo(280, 344, 232, 338, 168, 342); gd.lineTo(166, 354); gd.bezierCurveTo(226, 350, 270, 358, 316, 388); gd.closePath(); gd.fill();
  const R2 = OTM.rng('canopy');
  for (let i = 0; i < 26; i++) { const a = R2() * Math.PI * 2, d = R2(); gd.fillStyle = OTM.mix('#3C5046', '#4C6256', R2()); gd.beginPath(); gd.ellipse(300 + Math.cos(a) * 200 * d, 210 + Math.sin(a) * 100 * d, 90 + R2() * 50, 70 + R2() * 30, 0, 0, Math.PI * 2); gd.fill(); }
  gd.strokeStyle = '#4A5650'; gd.lineWidth = 3; gd.beginPath(); gd.moveTo(206, 348); gd.lineTo(209, 540); gd.moveTo(262, 346); gd.lineTo(259, 540); gd.stroke();
  gd.fillStyle = '#6E6152'; gd.fillRect(198, 536, 72, 10);
  const garden = LC.blurred(gd.canvas, 7);

  // =====================================================================
  // 2. THE HALL, as the phone's glass sees it: rendered from the phone looking back at the front of the house, then mirrored
  // =====================================================================
  const RW = 536, RH = 1160;
  const hallRender = (() => {
    const h = LC.layer(RW, RH);
    const cam = LC.camera({ x: 0, y: 1.0, z: 0, pitch: 0.10, f: 1900, cx: RW / 2, cy: RH / 2 });
    const Q = (pts, c, a) => LC.quad(h, cam, pts, c, a);
    const XL = -0.85, XS = 0.10, XR = 1.0, ZD = 9.2, CEIL = 2.62;
    h.fillStyle = '#100B08'; h.fillRect(0, 0, RW, RH);
    // stairwell walls, end wall, passage ceiling (all near-black: a black mirror only shows what is lit)
    Q([[XL, 0, ZD], [XR, 0, ZD], [XR, 5.4, ZD], [XL, 5.4, ZD]], '#1E150F');
    Q([[XL, CEIL, 3], [XS, CEIL, 3], [XS, CEIL, ZD], [XL, CEIL, ZD]], '#150F0B');
    Q([[XL, 0, 3], [XL, CEIL, 3], [XL, CEIL, ZD], [XL, 0, ZD]], '#1A120D');
    Q([[XR, 0, 3], [XR, 5.4, 3], [XR, 5.4, ZD], [XR, 0, ZD]], '#171009');
    // the landing window at the head of the stairs, full of the morning
    const LW = { x0: 0.40, x1: 0.98, y0: 3.0, y1: 4.25 };
    { const a = cam.p(LW.x0, LW.y1, ZD), b = cam.p(LW.x1, LW.y0, ZD);
      h.fillStyle = LC.lin(h, 0, a[1], 0, b[1], [[0, P.sunWhite], [0.6, P.sunCream], [1, P.honey]]); h.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
      h.fillStyle = '#2A1C12'; const m = cam.p((LW.x0 + LW.x1) / 2, 0, ZD)[0]; h.fillRect(m - 4, a[1], 8, b[1] - a[1]); const mh = cam.p(0, (LW.y0 + LW.y1) / 2, ZD)[1]; h.fillRect(a[0], mh - 5, b[0] - a[0], 10);
      h.fillStyle = '#1C130D'; h.fillRect(a[0] - 8, a[1] - 8, b[0] - a[0] + 16, 8); h.fillRect(a[0] - 8, b[1], b[0] - a[0] + 16, 10); }
    // the light it pours down the stairwell
    { const a = cam.p(LW.x0, LW.y1, ZD), b = cam.p(LW.x1, LW.y0, ZD), c = cam.p(0.3, 0.9, 4.6), d = cam.p(1.0, 0.9, 4.6);
      LC.beam(h, [[a[0], a[1] + 40], [b[0], a[1] + 40], [d[0] + 40, d[1]], [c[0] - 30, c[1]]], P.honey, 0.16, 0.0, [0, a[1]], [0, c[1]]); }
    // the front door: architrave, leaf, two glazed panels and the fanlight, blazing
    const DX0 = -0.75, DX1 = 0.05, DT = 2.05;
    Q([[DX0 - 0.09, 0, ZD - 0.01], [DX1 + 0.09, 0, ZD - 0.01], [DX1 + 0.09, 2.54, ZD - 0.01], [DX0 - 0.09, 2.54, ZD - 0.01]], '#0C0907');
    Q([[DX0, 0, ZD - 0.02], [DX1, 0, ZD - 0.02], [DX1, DT, ZD - 0.02], [DX0, DT, ZD - 0.02]], '#1A1612');
    const glow = (x0, x1, y0, y1) => { const a = cam.p(x0, y1, ZD - 0.03), b = cam.p(x1, y0, ZD - 0.03);
      h.fillStyle = LC.rad(h, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, 2, Math.max(b[0] - a[0], b[1] - a[1]) * 0.75, [[0, P.sunWhite], [0.6, P.sunCream], [1, P.honey]]); h.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]); };
    glow(DX0 + 0.1, DX0 + 0.37, 1.14, 1.9); glow(DX1 - 0.37, DX1 - 0.1, 1.14, 1.9); glow(DX0, DX1, 2.11, 2.45);
    [-0.55, -0.35, -0.15].forEach(x => { const a = cam.p(x, 2.11, ZD - 0.04), b = cam.p(x, 2.45, ZD - 0.04); h.strokeStyle = '#2A1D13'; h.lineWidth = 4; h.beginPath(); h.moveTo(a[0], a[1]); h.lineTo(b[0], b[1]); h.stroke(); });
    Q([[-0.47, 0.93, ZD - 0.03], [-0.23, 0.93, ZD - 0.03], [-0.23, 0.99, ZD - 0.03], [-0.47, 0.99, ZD - 0.03]], '#7A5A30');
    // shafts from the door glass along the passage, and the long patches they lay on the boards
    { const s0 = cam.p(DX0 + 0.1, 1.9, ZD), s1 = cam.p(DX1 - 0.1, 1.9, ZD), fl = cam.p(-0.85, 0, 6.3), fr = cam.p(0.1, 0, 6.3);
      LC.beam(h, [s0, s1, fr, fl], P.honey, 0.13, 0.0, [0, s0[1]], [0, fl[1]]); }
    Q([[XL, 0, 5.2], [XS, 0, 5.2], [XS, 0, ZD], [XL, 0, ZD]], '#1E140D');
    { const pl = LC.layer(RW, RH); const PQ = (pts, c) => LC.quad(pl, cam, pts, c);
      PQ([[-0.74, 0, 5.9], [-0.40, 0, 5.9], [-0.31, 0, 8.3], [-0.64, 0, 8.3]], '#A87240'); PQ([[-0.30, 0, 5.9], [0.04, 0, 5.9], [0.04, 0, 8.3], [-0.22, 0, 8.3]], '#A87240');
      PQ([[-0.69, 0, 6.2], [-0.45, 0, 6.2], [-0.36, 0, 8.0], [-0.60, 0, 8.0]], '#D7A465'); PQ([[-0.25, 0, 6.2], [0.0, 0, 6.2], [0.0, 0, 8.0], [-0.24, 0, 8.0]], '#D7A465');
      h.drawImage(LC.blurred(pl.canvas, 5, false), 0, 0); }
    // the stairs: dark risers, the nosings catching the light as warm lines
    for (let k = 13; k >= 0; k--) {
      const z = 4.4 + 0.25 * k, y0 = 0.2 * k, y1 = 0.2 * (k + 1);
      Q([[XS, y1, z], [XR, y1, z], [XR, y1, z + 0.25], [XS, y1, z + 0.25]], y1 < 1.0 ? '#2A1C12' : '#140E0A');
      Q([[XS, y0, z], [XR, y0, z], [XR, y1, z], [XS, y1, z]], '#120C08');
      const a = cam.p(XS + 0.12, y1, z - 0.01), b = cam.p(XR, y1, z - 0.01); h.strokeStyle = OTM.rgba('#D9A466', 0.35 + 0.04 * k); h.lineWidth = Math.max(2, 0.025 * cam.k(z)); h.beginPath(); h.moveTo(a[0], a[1]); h.lineTo(b[0], b[1]); h.stroke();
    }
    // string and banister
    Q([[XS, 0, 4.4], [XS, 0.3, 4.4], [XS, 3.1, 7.9], [XS, 2.8, 7.9]], '#0E0A07');
    const rail = z => 0.8 * Math.max(0, (z - 4.4)) + 0.92;
    for (let z = 4.55; z < 7.9; z += 0.14) { const a = cam.p(XS + 0.02, rail(z) - 0.86, z), b = cam.p(XS + 0.02, rail(z), z); h.strokeStyle = '#080605'; h.lineWidth = Math.max(2, 0.035 * cam.k(z)); h.beginPath(); h.moveTo(a[0], a[1]); h.lineTo(b[0], b[1]); h.stroke(); }
    { const pts = []; for (let z = 4.4; z <= 7.95; z += 0.1) pts.push(cam.p(XS + 0.02, rail(z), z)); h.lineCap = 'round'; h.strokeStyle = '#0C0806'; h.lineWidth = 12; h.beginPath(); pts.forEach((q, i) => i ? h.lineTo(q[0], q[1]) : h.moveTo(q[0], q[1])); h.stroke(); }
    // a lampshade in the hall, dark against the fanlight
    { const c = cam.p(-0.36, 2.2, 7.6), k = cam.k(7.6); h.fillStyle = '#0B0807'; h.beginPath(); h.moveTo(c[0] - 0.17 * k, c[1]); h.lineTo(c[0] + 0.17 * k, c[1]); h.lineTo(c[0] + 0.12 * k, c[1] - 0.2 * k); h.lineTo(c[0] - 0.12 * k, c[1] - 0.2 * k); h.closePath(); h.fill(); h.fillRect(c[0] - 1.5, c[1] - 0.6 * k, 3, 0.42 * k); }

    // ---- the work bag by the front door, in the door's light: a leather satchel, its outside pocket hanging open and empty ----
    { const z = 6.35, x = -0.50, k = cam.k(z), b = cam.p(x, 0, z), bw = 0.50 * k, bh = 0.37 * k, X0 = b[0] - bw / 2, Y1 = b[1];
      h.fillStyle = 'rgba(8,5,4,0.8)'; h.beginPath(); h.ellipse(b[0], Y1 + 2, bw * 0.62, bh * 0.09, 0, 0, Math.PI * 2); h.fill();
      // body: slightly tapered, the far side lit by the door, the near face in its own shade
      const body = LC.rquad([[X0 + bw * 0.04, Y1 - bh], [X0 + bw * 0.96, Y1 - bh], [X0 + bw, Y1], [X0, Y1]], 0.05 * k);
      h.fillStyle = LC.lin(h, X0, 0, X0 + bw, 0, [[0, '#7A4C27'], [0.45, '#40281A'], [1, '#2A190E']]); h.fill(body);
      // flap over the top third, its edge catching the light
      const flap = LC.rquad([[X0 + bw * 0.02, Y1 - bh - 2], [X0 + bw * 0.98, Y1 - bh - 2], [X0 + bw * 0.98, Y1 - bh * 0.6], [X0 + bw * 0.02, Y1 - bh * 0.6]], 0.05 * k);
      h.fillStyle = '#2A190E'; h.fill(flap); h.fillStyle = 'rgba(242,190,120,0.9)'; h.fillRect(X0 + bw * 0.05, Y1 - bh - 3, bw * 0.9, 3.5);
      h.fillStyle = 'rgba(242,190,120,0.55)'; h.fillRect(X0 + bw * 0.05, Y1 - bh * 0.6, bw * 0.9, 2);
      // the outside slip pocket: a flat panel, mouth open, a dark slot under a lit lip, nothing inside
      const px = X0 + bw * 0.12, py = Y1 - bh * 0.5, pw = bw * 0.76, ph = bh * 0.44;
      h.fillStyle = LC.lin(h, px, 0, px + pw, 0, [[0, '#A06A38'], [0.55, '#62401F'], [1, '#43291A']]); h.fill(LC.rrect(px, py, pw, ph, 0.025 * k));
      h.fillStyle = '#040202'; h.beginPath(); h.moveTo(px + 3, py + 1); h.quadraticCurveTo(px + pw / 2, py + 0.085 * k, px + pw - 3, py + 1); h.closePath(); h.fill();
      h.strokeStyle = '#F6C886'; h.lineWidth = 3.5; h.beginPath(); h.moveTo(px + 3, py + 1); h.quadraticCurveTo(px + pw / 2, py + 0.085 * k, px + pw - 3, py + 1); h.stroke();
      // a short carry handle on top
      h.strokeStyle = '#1E120A'; h.lineWidth = 0.032 * k; h.lineCap = 'round'; h.beginPath(); h.moveTo(b[0] - bw * 0.14, Y1 - bh - 2); h.bezierCurveTo(b[0] - bw * 0.12, Y1 - bh - 0.13 * k, b[0] + bw * 0.12, Y1 - bh - 0.13 * k, b[0] + bw * 0.14, Y1 - bh - 2); h.stroke();
      h.strokeStyle = 'rgba(242,190,120,0.7)'; h.lineWidth = 2.5; h.beginPath(); h.moveTo(b[0] - bw * 0.1, Y1 - bh - 0.105 * k); h.bezierCurveTo(b[0] - bw * 0.04, Y1 - bh - 0.125 * k, b[0] + bw * 0.04, Y1 - bh - 0.125 * k, b[0] + bw * 0.1, Y1 - bh - 0.105 * k); h.stroke();
    }

    // ---- Daniel on the stairs: back turned, climbing toward the landing window; grey tee, pyjama trousers, bare feet ----
    { const z = 5.0, k = cam.k(z), base = cam.p(0.64, 1.0, z);       // origin: the higher tread (y = 1.0) under his left foot
      h.save(); h.translate(base[0], base[1]); h.scale(k, -k);          // metres, y up; we see his back, so his right is +x
      const S = (pts) => h.fill(LC.smooth(pts)); h.fillStyle = '#060404';
      // left leg: stepping up onto the higher tread, the knee forward and away from us
      S([[-0.215, 0.93], [-0.01, 0.93], [-0.02, 0.62], [-0.045, 0.42], [-0.06, 0.14], [-0.05, 0.03, 1], [-0.2, 0.02, 1], [-0.2, 0.2], [-0.205, 0.46], [-0.225, 0.7]]);
      // right leg: long, back on the lower tread, heel lifted off it
      S([[0.01, 0.93], [0.215, 0.93], [0.215, 0.62], [0.2, 0.3], [0.19, -0.02], [0.175, -0.13], [0.09, -0.14], [0.075, 0.1], [0.05, 0.45], [0.03, 0.7]]);
      S([[0.085, -0.13], [0.18, -0.12], [0.19, -0.19], [0.175, -0.24], [0.1, -0.23], [0.08, -0.18]]);
      // torso in the tee, leaning into the climb
      S([[-0.235, 0.9], [0.235, 0.9], [0.26, 1.15], [0.28, 1.4], [0.245, 1.52], [0.11, 1.57], [0.0, 1.575], [-0.11, 1.57], [-0.245, 1.52], [-0.28, 1.38], [-0.255, 1.12]]);
      // right arm hanging, a little behind him; left arm reaching forward to the rail
      S([[0.22, 1.51], [0.305, 1.45], [0.325, 1.2], [0.315, 0.98], [0.305, 0.83], [0.255, 0.81], [0.24, 0.99], [0.225, 1.24]]);
      S([[-0.22, 1.51], [-0.305, 1.46], [-0.375, 1.33], [-0.445, 1.23], [-0.5, 1.17], [-0.47, 1.105], [-0.39, 1.15], [-0.3, 1.25], [-0.225, 1.33]]);
      // neck, head bowed a little toward the steps, ears
      S([[-0.06, 1.54], [0.06, 1.54], [0.065, 1.65], [-0.065, 1.65]]);
      S([[-0.104, 1.62], [0.104, 1.62], [0.118, 1.745], [0.104, 1.855], [0.0, 1.9], [-0.104, 1.855], [-0.118, 1.745]]);
      S([[0.11, 1.715], [0.137, 1.73], [0.136, 1.68], [0.112, 1.668]]); S([[-0.11, 1.715], [-0.137, 1.73], [-0.136, 1.68], [-0.112, 1.668]]);
      // the lifted sole, a pale sliver
      h.fillStyle = '#4E382C'; S([[0.095, -0.15], [0.175, -0.14], [0.183, -0.19], [0.17, -0.225], [0.105, -0.215]]);
      // rim from the landing window ahead and above: crown, shoulder tops, the top edge of the reaching arm
      h.lineCap = 'round'; h.strokeStyle = '#F6CD92'; h.lineWidth = 0.018;
      h.beginPath(); h.moveTo(-0.096, 1.858); h.quadraticCurveTo(0, 1.925, 0.096, 1.858); h.stroke();
      h.lineWidth = 0.013; h.beginPath(); h.moveTo(-0.068, 1.578); h.quadraticCurveTo(-0.17, 1.572, -0.246, 1.525); h.moveTo(0.068, 1.578); h.quadraticCurveTo(0.17, 1.572, 0.244, 1.525); h.stroke();
      h.lineWidth = 0.011; h.beginPath(); h.moveTo(-0.305, 1.462); h.quadraticCurveTo(-0.4, 1.33, -0.495, 1.18); h.stroke();
      h.restore();
    }
    return h.canvas;
  })();
  // a black mirror shows only what is lit: crush the darks, keep the glow
  const hall = (() => { const c = OTM.makeCanvas(RW, RH), x = c.getContext('2d'); x.drawImage(hallRender, 0, 0); const id = x.getImageData(0, 0, RW, RH), d = id.data;
    for (let i = 0; i < d.length; i += 4) for (let k = 0; k < 3; k++) d[i + k] = 255 * Math.pow(d[i + k] / 255, 1.35);
    x.putImageData(id, 0, 0); return LC.flipX(LC.blurred(c, 1.1, false)); })();

  // =====================================================================
  // 3. THE WINDOW GLASS: garden, the kitchen's ghost in the glass, glare and dust
  // =====================================================================
  g.drawImage(garden, 0, 0);
  const glassClip = new Path2D(); glassClip.rect(REVEAL, 0, W - REVEAL, RAIL.y0);
  { // the room behind the camera, faint in the window: the hall door's warm slot, the dark bulk of the kitchen low down
    const gh = LC.layer(); gh.fillStyle = 'rgba(255,214,150,1)'; gh.fillRect(968, 300, 120, 380); gh.fillStyle = 'rgba(255,244,220,1)'; gh.fillRect(998, 360, 54, 150);
    const ghB = LC.blurred(gh.canvas, 14, false); g.save(); g.clip(glassClip); g.globalCompositeOperation = 'screen'; g.globalAlpha = 0.13; g.drawImage(ghB, 0, 0); g.restore();
    g.save(); g.clip(glassClip); g.fillStyle = LC.lin(g, 0, 470, 0, RAIL.y0, [[0, P.ink, 0], [1, P.ink, 0.16]]); g.fillRect(0, 470, W, RAIL.y0 - 470); g.restore();
  }
  LC.glare(g, glassClip, { x: 520, y: 420, angle: -0.98, color: '#F6F3EA', bands: [{ d: -250, w: 130, a: 0.06 }, { d: -176, w: 22, a: 0.09 }, { d: 300, w: 220, a: 0.04 }, { d: 405, w: 26, a: 0.06 }] });
  LC.specks(g, glassClip, { x: REVEAL, y: TOP, w: W - REVEAL, h: RAIL.y0 - TOP }, 'winDust', { n: 300, color: '#FFFFFF', rMin: 0.5, rMax: 1.4, aMin: 0.05, aMax: 0.24, scratch: 0.14 });

  { const bl = LC.layer(); bl.drawImage(garden, 0, 0); bl.globalCompositeOperation = 'destination-in'; bl.fillStyle = LC.lin(bl, 0, TOP, 0, 520, [[0, '#000000', 1], [1, '#000000', 0]]); bl.fillRect(0, 0, W, H);
    E.save(); E.globalAlpha = 0.28; E.drawImage(bl.canvas, 0, 0); E.restore(); }
  // =====================================================================
  // 4. THE WINDOW FRAME (painted timber, contre-jour)
  // =====================================================================
  const fFace = '#6F7E78', fEdge = '#B5C2BC', fDark = '#46524F';

  // =====================================================================

    e.fillStyle = LC.lin(e, 0, 0, 0, Y(32), [[0, '#8C9893'], [1, '#56625E']]); e.fillRect(0, 0, 1024, Y(32));  // ceiling, lit by the window
    e.fillStyle = '#C3CCC7'; e.beginPath(); e.ellipse(X(-8), Y(57), 26, 11, 0, 0, Math.PI * 2); e.fill();     // a pale pendant shade

    e.fillStyle = '#323B3A'; [-55, 60].forEach(a => e.fillRect(X(a), Y(32), 2, Y(12) - Y(32)));

    // the fridge: a tall pale slab
    R(-24, -9, 34, -44, '#AAB4B0'); R(-11.5, -10.5, 18, 4, '#5A6462'); R(-24, -9, 9.5, 8.5, '#7E8885');

    R(10.5, 16.5, 12, -6, P.amberLight); R(11.5, 15.5, 10.5, 3, P.sunWhite); R(12.5, 14.5, 2, -5, P.honey);

    const win = (a0, a1) => { e.fillStyle = LC.lin(e, 0, Y(72), 0, Y(0), [[0, '#F4F7F5'], [0.45, '#E2EAE5'], [0.75, '#B3C3BA'], [1, '#869A8F']]); e.fillRect(X(a0), Y(72), X(a1) - X(a0), Y(0) - Y(72)); };

  });
  const samp = LC.sampler(envC);
  const rOf = y => { const t = (KB - y) / H_; if (t < 0 || t > 0.985) return 0; if (t >= 0.38) return KR * Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.38) / 0.62, 2))); const u = (0.38 - t) / 0.38; return KR * (1 - 0.1 * Math.pow(u, 5)); };

  // reflection of the kettle in the satin worktop, and its contact shadow
  { const sh = LC.layer(); sh.fillStyle = 'rgba(6,9,9,0.75)'; sh.beginPath(); sh.ellipse(KX, KB + 26, KR * 1.05, 14, 0, 0, Math.PI * 2); sh.fill();

  g.fillStyle = '#0F1212'; g.fillRect(KX - KR * 0.96, KB - 2, KR * 1.92, 16);
  g.strokeStyle = 'rgba(196,210,204,0.5)'; g.lineWidth = 2; g.beginPath(); g.ellipse(KX, KB + 14, KR * 0.96, 20, 0, 0.12, Math.PI - 0.12); g.stroke();

    g.strokeStyle = 'rgba(236,242,238,0.8)'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(B[0] + 2, B[1] - 1, 5, 9, ang + 0.3, Math.PI * 0.9, Math.PI * 1.7); g.stroke(); }

      E.fillStyle = OTM.rgba('#FFFFFF', a * 0.8); E.beginPath(); E.ellipse(x, y, rx * 0.5, ry * 0.5, 0, 0, Math.PI * 2); E.fill(); };
    g.save(); g.clip(kettlePath); sp(KX - KR * 0.78, KT + H_ * 0.36, 16, 34, 1); sp(KX - KR * 0.78, KT + H_ * 0.36, 6, 16, 1); sp(KX + KR * 0.8, KT + H_ * 0.33, 14, 30, 0.95); sp(KX + KR * 0.8, KT + H_ * 0.33, 5, 13, 1); sp(KX - KR * 0.4, KT + H_ * 0.1, 14, 8, 0.8); g.restore(); }
  g.fillStyle = '#101313'; g.beginPath(); g.moveTo(KX - 30, KT + 26); g.quadraticCurveTo(KX - 36, KT - 10, KX, KT - 15); g.quadraticCurveTo(KX + 36, KT - 10, KX + 30, KT + 26); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(214,226,220,0.6)'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(KX - 27, KT - 2); g.quadraticCurveTo(KX - 2, KT - 16, KX + 24, KT - 5); g.stroke();
  E.fillStyle = 'rgba(255,236,206,0.4)'; E.beginPath(); E.ellipse(KX + 46, KT + 220, 8, 18, 0, 0, Math.PI * 2); E.fill();

  // 8. FINISH

  f.finish({ letterbox: 2.39, grain: 0.055, fibre: 0, vignette: 0, halation: 0.55, matteColor: P.matte,

  LC.slate(ctx, 'AUTOPILOT  ·  LOOK C  ·  THROUGH GLASS', 'C1  ·  THE COUNTER  ·  INT. KITCHEN, MORNING');
  window.FRAME_READY = true;
})();
