<!doctype html><meta charset="utf-8"><title>Crownfall: Aethelgard, Prologue</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;color:#9b9488;font:14px system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage canvas{max-width:100vw;max-height:100vh;width:auto;height:auto;aspect-ratio:16/9}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:10px 16px;background:linear-gradient(transparent,#000c);opacity:0;transition:opacity .3s}
  body:hover #bar{opacity:1}
  #bar input{flex:1} button,label{background:#222;color:#ddd;border:1px solid #444;border-radius:4px;padding:4px 10px}
</style>
<div id="stage"></div>
<div id="bar"><button id="play">Play</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="time">0:00</span><label><input id="subs" type="checkbox"> Subtitles</label></div>
<audio id="mix" src="../audio/prologue-mix.m4a" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="kit.js"></script>
<script src="mapdata.js"></script>
<script src="map.js"></script>
<script src="scenes/s1.js"></script>
<script src="scenes/s2.js"></script>
<script src="scenes/s3.js"></script>
<script src="scenes/s4.js"></script>
<script src="scenes/s5.js"></script>
<script src="scenes/s6.js"></script>
<script src="scenes/s7.js"></script>
<script src="scenes/s8.js"></script>
<script src="prologue.js"></script>
<script>
  // Space plays and pauses; the arrows skip five seconds. The picture follows the soundtrack's clock.
  const mix = document.getElementById('mix'), seek = document.getElementById('seek'), time = document.getElementById('time'), btn = document.getElementById('play');
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  document.getElementById('subs').onchange = e => { FILM.opts.subs = e.target.checked; };
  FILM.loadFonts('../fonts/fonts.css').then(() => KIT.whenImages()).then(() => {
    FILM.mount(document.getElementById('stage'));
    const tick = () => { const t = mix.currentTime; FILM.renderAt(t); seek.value = String(Math.round(t / FILM.total * 1000)); time.textContent = fmt(t); requestAnimationFrame(tick); };
    tick();
  });
  const toggle = () => { if (mix.paused) { mix.play(); btn.textContent = 'Pause'; } else { mix.pause(); btn.textContent = 'Play'; } };
  btn.onclick = toggle;
  seek.oninput = () => { mix.currentTime = seek.value / 1000 * FILM.total; };
  addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } if (e.code === 'ArrowRight') mix.currentTime += 5; if (e.code === 'ArrowLeft') mix.currentTime -= 5; });
</script>
