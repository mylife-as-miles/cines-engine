<script>
  // ?subs=1 draws the subtitles; ?scene=N draws only scene N (any time, for working on one scene); ?paint=1 adds the painterly finish (work in progress)
  const q = new URLSearchParams(location.search);
  FILM.opts.subs = q.get('subs') === '1'; FILM.opts.sceneOnly = q.has('scene') ? +q.get('scene') : -1; FILM.opts.paint = q.get('paint') === '1';
  FILM.loadFonts('../fonts/fonts.css').then(() => KIT.whenImages()).then(() => { FILM.mountHeadless(); window.FILM_READY = true; }).catch(e => { window.FILM_ERROR = String(e); });
</script>
