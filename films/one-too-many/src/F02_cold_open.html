<!doctype html><meta charset="utf-8"><title>F02 cold open</title>
<script src="../kit/otm.js"></script><script src="../kit/figures.js"></script><script src="../kit/dialogue.js"></script>
<script>
(async()=>{
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), {C, W, H, S, mix, rgba} = OTM;
  const f = OTM.frame(ctx, {seed: 8});   // seed 8: the lightbox under his hand is mid ember, not the pale hot core
  const g = f.world, em = f.emissive;
  const DEBUG = location.hash === '#debug';
  const R = OTM.rng('yard-11'); const rr = (a, b) => a + (b - a) * R();
  const ditherPat = col => { const c = OTM.makeCanvas(4, 4), d = c.getContext('2d'); d.fillStyle = col; [[0,0],[2,2],[2,0],[0,2],[1,1],[3,3]].forEach(([x,y],i)=>{ if (i<4||i%2) d.fillRect(x,y,1,1); }); return g.createPattern(c, 'repeat'); };
  // flat posterised bands from a list of shapes (outer -> inner), each seam printed with a dither
  function bandsOf(c, list, seed) { list.forEach((b, i) => { const p = b.shape.path(b.rough == null ? 2 : b.rough, (seed || 40) + i); c.fillStyle = b.col; c.fill(p); if (i) { c.save(); c.strokeStyle = ditherPat(list[i - 1].col); c.lineWidth = 5; c.stroke(p); c.restore(); } }); }
  const layer = () => OTM.makeCanvas(W, H).getContext('2d');

  // ======================= LAYOUT =======================
  const HG = 750;                  // ground line at the house
  const FIRE = [1300, 470];        // the one light: the burning house
  const NIGHT = C.yardNight;
  const glow = k => mix(NIGHT, C.fireOuter, k);
  const smokeCol = mix(C.ink, NIGHT, 0.35);

  // ======================= SKY =======================
  g.fillStyle = NIGHT; g.fillRect(0, 0, W, H);
  {
    const wave = (y0, amp, seed) => { const pts = [[-20, -20], [W + 20, -20]]; for (let x = W + 20; x >= -20; x -= 40) pts.push([x, y0 + amp * Math.sin(x * 0.004 + seed) + amp * 0.5 * Math.sin(x * 0.011 + seed * 2)]); return S().poly(pts); };
    const zen = mix(C.ink, NIGHT, 0.62);
    g.fillStyle = zen; g.fill(wave(58, 14, 1).path(2, 21));
    g.save(); g.strokeStyle = ditherPat(zen); g.lineWidth = 5; g.stroke(wave(58, 14, 1).path(2, 21)); g.restore();
  }
  // the neighbours beyond the fence: a low run of dark roofs and chimneys, one paper darker than the sky, and two poplars
  {
    const far = mix(C.ink, NIGHT, 0.45), sh = S();
    const roofs = [[-30, 150, 560, 52], [120, 300, 536, 0], [300, 470, 548, 70], [470, 640, 566, 0], [640, 820, 552, 56], [820, 1060, 574, 0]];
    roofs.forEach(([x0, x1, top, peak]) => { if (peak) sh.poly([[x0, 640], [x0, top + 20], [(x0 + x1) / 2, top - peak * 0.4], [x1, top + 20], [x1, 640]]); else sh.poly([[x0, 640], [x0 + 18, top], [x1 - 18, top], [x1, 640]]); });
    [[190, 520, 18, 34], [420, 548, 14, 30], [930, 556, 16, 28]].forEach(([x, y, w, h]) => sh.rect(x, y - h, w, h + 30));
    const poplar = (x, top, w) => sh.add(OTM.fig.smooth([[x, top], [x + w * 0.5, top + 90], [x + w * 0.55, top + 200], [x + w * 0.3, 640], [x - w * 0.3, 640], [x - w * 0.55, top + 200], [x - w * 0.5, top + 90]], true));
    poplar(96, 400, 92); poplar(296, 462, 60);
    const tp = sh.path(1.8, 66);
    OTM.silhouette(g, tp, {fill: far, light: {dx: 1, dy: -0.25}, rimColor: glow(0.2), rimW: 2.5});
  }

  // ======================= SMOKE: billows leaning right on the heat; each billow's belly lit from the fire below =======================
  {
    const lobes = [];
    for (let i = 0; i <= 30; i++) {
      const t = i / 30, x = 1330 + 260 * t + 420 * t * t, y = 330 - 640 * t + 20 * Math.sin(t * 8), r = 80 + 200 * t, spread = 1.4 - 0.8 * t;
      for (let k = 0; k < 3; k++) lobes.push({x: x + rr(-0.6, 0.6) * r * spread, y: y + rr(-0.2, 0.2) * r, r: r * rr(0.5, 0.75)});
    }
    lobes.sort((p, q) => p.y - q.y);   // far (high, old) smoke first; the low billows near the roof lie over them
    lobes.forEach((l, i) => {
      const p = S().circle(l.x, l.y, l.r).path(2.5, 300 + i);
      const lvl = l.y > 200 ? 2 : l.y > 40 ? 1 : 0;
      const body = [mix(NIGHT, C.ink, 0.45), mix(NIGHT, C.fireOuter, 0.1), mix(NIGHT, C.fireOuter, 0.2)][lvl];
      const belly = [mix(NIGHT, C.fireOuter, 0.08), mix(NIGHT, C.fireOuter, 0.2), mix(NIGHT, C.fireOuter, 0.36)][lvl];
      OTM.silhouette(g, p, {fill: body, light: {dx: -0.3, dy: 0.95}, rimColor: belly, rimW: l.r * 0.32});
    });
  }

  // ======================= FENCE (left of the house, behind Scott): countable boards =======================
  const FTOP = 610, FB = HG + 4, BW = 50, BG = 11;
  for (let i = 0, x = -14; x < 960; i++, x += BW + BG) {
    const top = FTOP + rr(-5, 5), dist = Math.abs(FIRE[0] - (x + BW / 2));
    const near = dist < 520 ? 2 : dist < 860 ? 1 : 0;
    const face = [glow(0.12), glow(0.24), glow(0.4)][near];
    const p = S().poly([[x, top + 6], [x + BW * 0.5, top - 3], [x + BW, top + 6], [x + BW, FB], [x, FB]]).path(1.1, 200 + i);
    g.fillStyle = face; g.fill(p);
    if (near) OTM.silhouette(g, p, {fill: 'rgba(0,0,0,0)', light: {dx: 1, dy: -0.1}, rimColor: near === 2 ? mix(C.fireOuter, C.fireMid, 0.5) : C.fireOuter, rimW: 3});
  }
  g.fillStyle = C.ink; g.fill(S().poly([[-20, HG - 4], [980, HG - 6], [980, HG + 16], [-20, HG + 14]]).path(2, 9));

  // ======================= HOUSE: one ink shape (drawn as a group, pushed back and right) =======================
  const HK = 0.88, HCX = 1300, HSHIFT = 70;
  const houseT = c => { c.translate(HCX + HSHIFT, HG); c.scale(HK, HK); c.translate(-HCX, -HG); };
  g.save(); houseT(g); em.save(); houseT(em);
  const house = S();
  const HX0 = 950, HX1 = 1640, EAVE = 410;
  house.poly([[HX0, EAVE], [HX1, EAVE], [HX1, HG + 6], [HX0, HG + 6]]);                        // two storeys
  house.poly([[HX0 - 28, EAVE + 6], [HX0 + 112, 252], [HX1 - 112, 252], [HX1 + 28, EAVE + 6]]); // roof
  house.poly([[1442, 262], [1442, 178], [1494, 178], [1494, 262]]); house.rect(1434, 168, 68, 15); // chimney
  house.poly([[HX1 - 4, 560], [1858, 604], [1858, 614], [1842, 614], [1842, HG + 6], [HX1 - 4, HG + 6]]); // single-storey kitchen
  g.fillStyle = C.ink; g.fill(house.path(1.0, 13));

  // ---- five windows breathing flat three-tone fire ----
  const wins = [
    {x: 1004, y: 452, w: 106, h: 118, up: true}, {x: 1242, y: 452, w: 106, h: 118, curtain: true}, {x: 1480, y: 452, w: 106, h: 118, up: true},
    {x: 1040, y: 608, w: 160, h: 108, burst: true}, {x: 1690, y: 628, w: 88, h: 86},
  ];
  wins.forEach((wd, i) => {
    const wp = S().rect(wd.x, wd.y, wd.w, wd.h).path(1.6, 30 + i);
    g.save(); g.clip(wp);
    g.fillStyle = C.fireOuter; g.fillRect(wd.x - 10, wd.y - 10, wd.w + 20, wd.h + 20);
    OTM.flame(g, wd.x + wd.w * 0.5, wd.y + wd.h + 8, wd.w * 1.3, wd.h * 1.08, 11 + i * 7, 0.3 + i);
    OTM.flame(g, wd.x + wd.w * 0.25, wd.y + wd.h + 8, wd.w * 0.7, wd.h * 0.75, 51 + i * 5, 1.7 + i);
    g.fillStyle = C.ink;   // what is left of the glass: ink teeth round the frame
    for (let k = 0; k < 8; k++) {
      const side = k % 4, u = R(); let a, b, c;
      if (side === 0) { a = [wd.x + u * wd.w, wd.y]; b = [a[0] + rr(10, 22), wd.y]; c = [a[0] + rr(0, 12), wd.y + rr(12, 26)]; }
      else if (side === 1) { a = [wd.x + wd.w, wd.y + u * wd.h]; b = [wd.x + wd.w, a[1] + rr(10, 20)]; c = [wd.x + wd.w - rr(10, 22), a[1] + rr(0, 10)]; }
      else if (side === 2) { a = [wd.x + u * wd.w, wd.y + wd.h]; b = [a[0] + rr(10, 20), wd.y + wd.h]; c = [a[0] + rr(0, 12), wd.y + wd.h - rr(10, 20)]; }
      else { a = [wd.x, wd.y + u * wd.h]; b = [wd.x, a[1] + rr(10, 22)]; c = [wd.x + rr(10, 22), a[1] + rr(0, 10)]; }
      g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...c); g.closePath(); g.fill();
    }
    g.fillRect(wd.x + wd.w / 2 - 3, wd.y, 6, wd.h * rr(0.3, 0.55));   // a broken mullion
    g.restore();
    em.fillStyle = C.fireMid; em.fillRect(wd.x, wd.y, wd.w, wd.h);
    if (wd.up) { OTM.flame(g, wd.x + wd.w * 0.55, wd.y + 6, wd.w * 0.9, rr(70, 110), 90 + i * 13, 0.9 + i); em.fillStyle = C.fireOuter; em.fillRect(wd.x, wd.y - 90, wd.w, 90); }
  });

  // ---- the upstairs curtain, blown out of the window and up on the heat: a wavy ribbon tapering to a burning tip ----
  {
    const w = wins[1];
    const spine = []; for (let i = 0; i <= 16; i++) { const u = i / 16; spine.push([w.x + 24 + 112 * u + 13 * Math.sin(u * 7.5), w.y + 10 - 118 * u + 8 * Math.sin(u * 5)]); }
    const half = u => 34 * (1 - u) + 7 * u;
    const left = [], right = [];
    spine.forEach((p, i) => { const q = spine[Math.min(i + 1, 16)], o = spine[Math.max(i - 1, 0)]; let dx = q[0] - o[0], dy = q[1] - o[1]; const l = Math.hypot(dx, dy); dx /= l; dy /= l; const hw = half(i / 16) * (1 + 0.18 * Math.sin(i * 1.9));
      left.push([p[0] - dy * hw, p[1] + dx * hw]); right.push([p[0] + dy * hw, p[1] - dx * hw]); });
    const cp = S().poly([...left, ...right.slice().reverse()]).path(1.2, 5);
    g.fillStyle = mix(C.fireCore, C.fireMid, 0.3); g.fill(cp);
    // one fold printed as a darker flat band along one side of the wave
    g.save(); g.clip(cp); g.fillStyle = mix(C.fireCore, C.fireMid, 0.66);
    g.fill(S().poly([...spine.slice(0, 14), ...left.slice(0, 14).reverse()]).path(1, 6)); g.restore();
    const tip = spine[16];
    OTM.flame(g, tip[0] + 2, tip[1] + 14, 24, 34, 311, 2.1);
    em.save(); em.globalAlpha = 0.45; em.fillStyle = C.fireMid; em.fill(cp); em.restore();
  }
  // ---- glass breaking: nine shards thrown out of the big downstairs window ----
  {
    const w = wins[3], ox = w.x + w.w * 0.4, oy = w.y + w.h * 0.45;
    for (let i = 0; i < 9; i++) {
      const a = Math.PI * (0.62 + 0.55 * R()), d = rr(70, 190), s = rr(7, 15), cx = ox + Math.cos(a) * d, cy = oy + Math.sin(a) * d * 0.6 - rr(0, 30), rot = rr(0, 6);
      const sh = S().poly([[cx + Math.cos(rot) * s, cy + Math.sin(rot) * s], [cx + Math.cos(rot + 2.3) * s * 0.6, cy + Math.sin(rot + 2.3) * s * 0.6], [cx + Math.cos(rot + 4.1) * s * 0.8, cy + Math.sin(rot + 4.1) * s * 0.8]]);
      g.fillStyle = i % 3 ? C.fireMid : C.fireCore; g.fill(sh.path(0.3, i)); em.fillStyle = C.fireMid; em.fill(sh.path(0.3, i));
    }
  }

  g.restore(); em.restore();

  // ======================= LAWN: fire light printed in bands, falling off towards us =======================
  g.fillStyle = C.grass; g.fillRect(0, HG + 8, W, H - HG);
  const lawn = k => mix(C.grass, C.fireOuter, k);
  g.save(); g.beginPath(); g.rect(0, HG + 8, W, H - HG); g.clip();
  bandsOf(g, [
    {shape: S().ellipse(1200, HG, 1900, 420, 0), col: lawn(0.09), rough: 2.5},
    {shape: S().ellipse(900, HG + 6, 1250, 300, 0.02), col: lawn(0.22), rough: 2.5},
    {shape: S().ellipse(1370, HG, 620, 64, 0), col: lawn(0.4), rough: 2},
  ], 50);
  // the downstairs windows lay their fire on the grass: two flat trapezoids, each split by its broken mullion's shadow
  const toHouse = (x, y) => [HCX + HSHIFT + (x - HCX) * HK, HG + (y - HG) * HK];
  [[wins[3], 1.0], [wins[4], 0.7]].forEach(([w, k]) => {
    const a = toHouse(w.x, HG)[0], b = toHouse(w.x + w.w, HG)[0], m = (a + b) / 2, sp = (b - a) * 0.5;
    const L1 = 84 * k, L2 = 40 * k;
    const trap = S().poly([[a - 4, HG + 8], [b + 4, HG + 8], [b + sp * 0.5, HG + L1], [a - sp * 0.8, HG + L1]]);
    g.fillStyle = lawn(0.34); g.fill(trap.path(2, 91));
    const core = S().poly([[a + 6, HG + 8], [b - 6, HG + 8], [b + sp * 0.12, HG + L2], [a - sp * 0.3, HG + L2]]);
    g.fillStyle = lawn(0.5); g.fill(core.path(1.5, 92));
    g.fillStyle = lawn(0.16); g.fill(S().poly([[m - 3, HG + 8], [m + 3, HG + 8], [m - 6 * k, HG + L1], [m - 16 * k, HG + L1]]).path(0.8, 93));
  });
  g.restore();
  g.fillStyle = C.ink; g.fill(S().rect(HCX + HSHIFT - 0.5 * HK * 950, HG - 2, HK * 960, 15).path(1.5, 3));   // the house's footing shadow

  // ======================= EMBERS (fire sparks, not the Extra) =======================
  OTM.embers(g, 1040, 40, 820, 520, 120, 'emb1', C.fireMid);
  OTM.embers(g, 1140, 0, 740, 330, 36, 'emb2', C.fireCore);
  OTM.embers(em, 1040, 40, 820, 520, 60, 'emb1', C.fireMid);
  OTM.embers(g, 820, 160, 260, 420, 9, 'emb3', C.fireMid);   // a few strays carried over the fence towards him

  if (DEBUG) { g.fillStyle = '#f0f'; g.beginPath(); g.arc(FIRE[0], FIRE[1], 8, 0, 7); g.fill(); }

  // ======================= SCOTT =======================
  // Slumped back on his right arm, knees up, phone to his left ear, elbow on his knee.
  // Three windows of negative space: under the thighs, inside the phone arm, behind the propping arm.
  const SC = 180, HIP = [720, 978], FACING = -1;
  const U = (u, v) => [HIP[0] + FACING * SC * u, HIP[1] + SC * v];   // figure units (facing +x) -> world px
  const toW = p => U(p[0], p[1]);
  const L = -0.12, NECK = 0.3, HEAD = 0.04;
  const fwd = [Math.cos(L), Math.sin(L)], upv = [Math.sin(L), -Math.cos(L)];
  const T = (v, u) => [fwd[0] * v + upv[0] * u, fwd[1] * v + upv[1] * u];
  const S0 = T(-0.05, 2.12);
  const kang = (p, q) => Math.atan2(q[0] - p[0], q[1] - p[1]);    // kit limb angle: from straight down, + = forward
  const UPPER = 1.42, FORE = 1.22;
  const legN = {a: 2.5, b: 2.13}, legF = {a: 2.42, b: 2.0};
  const kneeN = [Math.sin(legN.a) * 1.85, Math.cos(legN.a) * 1.85];
  const basePose = {x: HIP[0], y: HIP[1], scale: SC, facing: FACING, anchor: 'hip', lean: L, neck: NECK, head: HEAD, legN, legF};
  // the head does not depend on the arms: probe it, put the phone against the left ear, then bring the hand up to the phone
  const hc = OTM.fig.profile('scott', basePose).joints.head, ha = HEAD + L * 0.3;
  const HM = (x, y) => [hc[0] + FACING * SC * (Math.cos(ha) * x - Math.sin(ha) * y), hc[1] + SC * (Math.sin(ha) * x + Math.cos(ha) * y)];
  const toU = p => [(p[0] - HIP[0]) / (FACING * SC), (p[1] - HIP[1]) / SC];
  const pTop = HM(-0.2, -0.08), pBot = HM(0.2, 0.56);
  const pAng = Math.atan2(pBot[1] - pTop[1], pBot[0] - pTop[0]), pLen = Math.hypot(pBot[0] - pTop[0], pBot[1] - pTop[1]);
  const pC = [(pTop[0] + pBot[0]) / 2, (pTop[1] + pBot[1]) / 2], PW = 0.15 * SC;
  const pM = [Math.cos(pAng), Math.sin(pAng), -Math.sin(pAng), Math.cos(pAng), pC[0], pC[1]];
  const apM = q => [pM[0] * q[0] + pM[2] * q[1] + pM[4], pM[1] * q[0] + pM[3] * q[1] + pM[5]];
  const phoneShape = S().rect(-pLen / 2, -PW / 2, pLen, PW).transform(pM);
  // phone arm (his LEFT, the near side): forearm up, elbow down and forward (resting on the thigh), wrist just past the slab's foot
  const axisW = [(pBot[0] - pTop[0]) / pLen, (pBot[1] - pTop[1]) / pLen];
  const Wph = toU([pBot[0] + axisW[0] * 0.12 * SC, pBot[1] + axisW[1] * 0.12 * SC]);
  const Eph = (() => { const dx = Wph[0] - S0[0], dy = Wph[1] - S0[1], d = Math.min(Math.hypot(dx, dy), UPPER + FORE - 0.01), ex = [dx / d, dy / d];
    const a = (UPPER * UPPER - FORE * FORE + d * d) / (2 * d), h = Math.sqrt(Math.max(0, UPPER * UPPER - a * a));
    const n = [-ex[1], ex[0]], n2 = [ex[1], -ex[0]], pick = (n[0] + n[1] > n2[0] + n2[1]) ? n : n2;   // the down-and-forward solution
    return [S0[0] + ex[0] * a + pick[0] * h, S0[1] + ex[1] * a + pick[1] * h]; })();
  const aN = kang(S0, Eph), bN = kang(Eph, Wph) - aN;
  const foreAng = Math.atan2(Wph[1] - Eph[1], Wph[0] - Eph[0]);
  const hAim = toU(HM(0.0, 0.24));
  const armPhone = {a: aN, b: bN, hand: 'hold', w: Math.atan2(hAim[1] - Wph[1], hAim[0] - Wph[0]) - foreAng};
  const pose = Object.assign({}, basePose, {armN: armPhone, armF: armPhone});
  const scott = OTM.fig.profile('scott', pose);
  const J = scott.joints;
  const body = S().add(scott.shape);

  // free arm (his RIGHT): a straight strut back to the grass
  const wristR = [-1.34, 0.27];
  const dR = Math.hypot(wristR[0] - S0[0], wristR[1] - S0[1]);
  const ER = (() => { const mx = (S0[0] + wristR[0]) / 2, my = (S0[1] + wristR[1]) / 2; const nx = (wristR[1] - S0[1]) / dR, ny = -(wristR[0] - S0[0]) / dR; const k = Math.sqrt(Math.max(0, ((UPPER + FORE) / 2) ** 2 - (dR / 2) ** 2)); return [mx - nx * k, my - ny * k]; })();
  const pS = toW(S0), pE = toW(ER), pW = toW(wristR);
  body.capsule(pS[0], pS[1], 0.28 * SC, pE[0], pE[1], 0.18 * SC);
  body.capsule(pE[0], pE[1], 0.17 * SC, pW[0], pW[1], 0.125 * SC);
  const GY = HIP[1] + 0.45 * SC;
  const hs = 0.74 * SC;
  const handR = OTM.fig.hand('flat', {spread: 0.1}).transform([hs, 0, 0, hs * 0.34, pW[0] - 0.08 * SC, GY - 0.1 * SC]);
  body.add(handR);
  // the torn right sleeve: the shirt ends in a ragged, scorched edge halfway down the forearm (teeth caught by the fire rim)
  {
    const fl = Math.hypot(pW[0] - pE[0], pW[1] - pE[1]), d = [(pW[0] - pE[0]) / fl, (pW[1] - pE[1]) / fl], n = [-d[1], d[0]];
    const P = (along, side) => [pE[0] + d[0] * along + n[0] * side, pE[1] + d[1] * along + n[1] * side];
    const hw = 0.235 * SC, end = 0.44 * fl, teeth = [0, 0.14, -0.03, 0.2, 0.02, 0.15, -0.04, 0.11, 0];
    const sleeve = [P(-0.3 * SC, -hw), P(-0.3 * SC, hw)];
    teeth.forEach((k, i) => sleeve.push(P(end + k * SC * (i % 2 ? 1 : 0.4), hw - (2 * hw) * i / (teeth.length - 1))));
    body.poly(sleeve); }
  // and a scorched, ragged shirt hem at the small of his back
  const flap = (q, dir, len, wid) => { const d = [Math.cos(dir), Math.sin(dir)], n = [-d[1], d[0]]; body.poly([[q[0] + n[0] * wid, q[1] + n[1] * wid], [q[0] + d[0] * len * SC, q[1] + d[1] * len * SC], [q[0] - n[0] * wid, q[1] - n[1] * wid]]); };
  flap(toW(T(-0.54, -0.3)), 0.9, 0.2, 7); flap(toW(T(-0.46, -0.34)), 1.25, 0.16, 6);

  body.add(phoneShape);

  // his shadow, thrown towards us across the lit grass (the fire is behind him)
  OTM.castShadow(g, body, [1, 0, 0.42, -0.16, -0.42 * GY, 1.16 * GY], 0.9);

  const bodyP = body.path(0.8, 11);
  // the fire rims his back
  OTM.silhouette(g, bodyP, {light: {dx: 0.84, dy: -0.55}, rimColor: mix(C.fireMid, C.fireCore, 0.18), rimW: 4.5, rimSoft: true});
  // the sock feet: the high fire catches the tops of the feet too (clipped to the feet only)
  { const fx = U(1.25, 0)[0]; g.save(); g.beginPath(); g.rect(0, GY - 0.62 * SC, fx, H); g.clip();
    OTM.silhouette(g, bodyP, {fill: 'rgba(0,0,0,0)', light: {dx: 0.35, dy: -1}, rimColor: mix(C.fireMid, C.fireCore, 0.1), rimW: 3}); g.restore(); }

  // ---- ON THE PHONE: the screen faces his cheek; its light throws a hard phone-white band onto cheek and ear, the slab is a dark
  //      paper laid over that band, and his ink hand wraps it (palm on the back, four fingertips over the rear edge, thumb up the front). ----
  {
    const up = (() => { const a = [pM[2], pM[3]]; return a[1] < 0 ? 1 : -1; })();     // local y sign of the slab's front (cheek-side, upper) edge
    const FY = up * PW / 2, RY = -up * PW / 2, X0 = -pLen / 2, X1 = pLen / 2, s = SC;
    const P = (x, y) => apM([x, y]);
    const hm = [FACING * SC * Math.cos(ha), SC * Math.sin(ha), -FACING * SC * Math.sin(ha), SC * Math.cos(ha), hc[0], hc[1]];
    const headP = OTM.fig.headProfile(OTM.fig.CHAR.scott.face).transform(hm).path(0.6, 11);
    const t = layer();
    // the band: angular, running with the slab (light of a flat screen, not a round cup); wider on the cheek side, two hard steps
    const band = (ef, er, et) => S().poly([P(X0 - et, RY - up * er), P(X0 - et, FY + up * ef * 0.6), P(X1 * 0.2, FY + up * ef), P(X1, FY + up * ef * 1.15), P(X1, RY - up * er)]);
    t.fillStyle = rgba(C.phoneWhite, 0.42); t.fill(band(0.13 * s, 0.07 * s, 0.07 * s).path(1.2, 5));
    t.fillStyle = rgba(C.phoneWhite, 0.92); t.fill(band(0.05 * s, 0.008 * s, 0.012 * s).path(0.8, 6));
    // the ear behind the top of the slab: a lit crescent of helix
    const ear = HM(-0.27, 0.06), er = 0.12 * SC;
    const et = layer(); et.fillStyle = C.phoneWhite; et.fill(S().ellipse(ear[0], ear[1], er * 0.62, er, 0.3 * FACING).path(0.6, 8));
    et.globalCompositeOperation = 'destination-out'; et.fill(S().ellipse(ear[0] - FACING * 5, ear[1] + 3, er * 0.5, er * 0.84, 0.3 * FACING).path(0.6, 9));
    t.drawImage(et.canvas, 0, 0);
    t.globalCompositeOperation = 'destination-in'; t.fill(headP);
    g.drawImage(t.canvas, 0, 0);
    
    // the slab: one paper lighter than ink; its screen edge glows along the cheek side
    g.fillStyle = mix(C.ink, NIGHT, 0.6); g.fill(phoneShape.path(0.4, 3));
    g.save(); g.strokeStyle = C.phoneWhite; g.lineCap = 'round'; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(...P(X0 + 4, FY)); g.lineTo(...P(X1 - 4, FY)); g.stroke();
    g.restore();
    em.save(); em.strokeStyle = C.phoneWhite; em.lineWidth = 3; em.globalAlpha = 0.6; em.beginPath(); em.moveTo(...P(X0 + 4, FY)); em.lineTo(...P(X1 - 4, FY)); em.stroke(); em.restore();
    // the hand, in ink, over the slab
    const hand = S();
    hand.add(OTM.fig.smooth([[X0 + pLen * 0.36, RY - up * 0.03 * s], [X0 + pLen * 0.34, FY + up * 0.035 * s], [X1 + 0.02 * s, FY + up * 0.05 * s], [X1 + 0.16 * s, FY + up * 0.02 * s], [X1 + 0.18 * s, RY - up * 0.01 * s], [X1 + 0.02 * s, RY - up * 0.06 * s]].map(q => P(q[0], q[1])), true));
    [0.3, 0.44, 0.58, 0.72].forEach((u, i) => { const x = X0 + pLen * u; const a = P(x, RY + up * 0.02 * s), b = P(x - 0.05 * s, RY - up * (0.07 + 0.012 * (i % 2)) * s);
      hand.capsule(a[0], a[1], 0.034 * s, b[0], b[1], 0.03 * s); });
    { const a = P(X1 - pLen * 0.1, FY + up * 0.02 * s), b = P(X0 + pLen * 0.42, FY + up * 0.045 * s); hand.capsule(a[0], a[1], 0.042 * s, b[0], b[1], 0.032 * s); }   // thumb up the front edge
    { const a = P(X1 + 0.1 * s, (FY + RY) / 2), b = toW(Wph); hand.capsule(a[0], a[1], 0.12 * s, b[0], b[1], 0.13 * s); }       // wrist into the forearm
    g.fillStyle = C.ink; g.fill(hand.path(0.6, 14));
    OTM.silhouette(g, hand.path(0.6, 14), {fill: 'rgba(0,0,0,0)', light: {dx: 0.84, dy: -0.55}, rimColor: mix(C.fireMid, C.fireCore, 0.18), rimW: 3});
  }

  // ---- the only hint: under his free right hand the paper is wearing through to ember. A hand-shaped f.knockout in two shallow
  //      steps (a thin core and a fainter skirt); the hand itself is carved back out of the hole, so only a sliver shows. ----
  {
    const bb = handR.bbox(), cxh = bb.x + bb.w / 2;
    const under = (grow, drop) => handR.transform([grow, 0, 0, 1, -cxh * (grow - 1), drop]);
    f.knockout(under(1.07, 9).path(1.0, 4), 0.16);
    f.knockout(under(1.02, 4).path(1.0, 5), 0.42);
    const hh = f.holes; hh.save(); hh.globalCompositeOperation = 'destination-out'; hh.globalAlpha = 1; hh.fill(handR.path(0.8, 11)); hh.restore();
  }

  // ======================= FOREGROUND GRASS: a few ink blades at the very bottom =======================
  {
    const blades = S(); const rb = OTM.rng('blades');
    const tuft = (x0, x1, n, hmin, hmax) => { for (let i = 0; i < n; i++) { const x = x0 + (x1 - x0) * rb(), h = hmin + (hmax - hmin) * rb(), lean = (rb() - 0.35) * 0.5, w = 3 + rb() * 4;
      blades.poly([[x - w, H + 4], [x + lean * h, H - h], [x + w, H + 4]]); } };
    tuft(0, 210, 26, 20, 70); tuft(1150, 1520, 34, 14, 50); tuft(1520, 1920, 70, 40, 150); tuft(1700, 1920, 30, 90, 210); tuft(560, 760, 10, 10, 30);
    g.fillStyle = C.ink; g.fill(blades.path(0.4, 3));
  }

  // ======================= TYPE =======================
  OTM.say(g, 'dispatcher', 'How many got out?', 960, 184, {timer: '00:03:24', align: 'center'});
  // Scott's guillotined line, in his face (Libre Franklin 500, ash in the yard). The dash is sliced by an invisible vertical edge,
  // its cut-off end drops away below, and the caret waits a clear step after the cut. (Local helper: the kit's frozen frame parks
  // the falling piece at the caret's foot, where the two read as an 'L'.)
  function scottCut(c, word, xRight, y, size) {
    const F = Object.assign({}, OTM.FACE.scott, {size, color: C.ash});
    const w = OTM.layout(c, word, F).width, th = Math.max(4, size * 0.08);
    const stub = size * 0.62, piece = size * 0.34, caretGap = size * 0.46, caretW = Math.max(2, size * 0.03);
    const total = w + size * 0.08 + stub + caretGap + caretW;
    const x0 = xRight - total;
    OTM.text(c, word, x0, y, F);
    const dx = x0 + w + size * 0.08, dy = y - size * 0.34, cut = dx + stub;
    c.save(); c.fillStyle = F.color;
    c.fillRect(dx, dy, stub, th);                                                          // what is left of the dash, cut clean
    c.save(); c.globalAlpha = 0.42; c.translate(cut + size * 0.04, dy + size * 0.5); c.rotate(0.5); c.fillRect(0, 0, piece, th); c.restore();   // the piece, falling
    c.globalAlpha = 0.75; c.fillRect(cut + caretGap, y - size * 0.86, caretW, size * 1.04);   // the caret: a thin cursor, taller than the caps, waiting
    c.restore();
    return {x: x0, w: total};
  }
  const nose = HM(0.55, 0.1);
  scottCut(g, 'I', nose[0] - 110, nose[1] + 34, 76);

  if (DEBUG) {
    const pts = Object.assign({}, J, {pS, pE, pW, pTop, pBot, Eph: toW(Eph), Wph: toW(Wph)});
    Object.entries(pts).forEach(([k, p]) => { g.fillStyle = '#f0f'; g.beginPath(); g.arc(p[0], p[1], 5, 0, 7); g.fill(); OTM.text(g, k, p[0] + 8, p[1] - 8, {family: 'Barlow Condensed', size: 20, color: '#fff'}); });
  }
  f.finish({letterbox: 1.7778, vignette: 0.55, halation: 0.6});
  OTM.slate(ctx, 'ONE TOO MANY  ·  STYLE FRAME 02', 'COLD OPEN  ·  EXT. BACK YARD  ·  NIGHT', 1.7778);
  window.FRAME_READY = true;
})();
</script>
