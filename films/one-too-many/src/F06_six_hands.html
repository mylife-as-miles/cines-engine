<!doctype html><meta charset="utf-8"><title>F06</title>
<script src="../kit/otm.js"></script><script src="../kit/figures.js"></script><script src="../kit/dialogue.js"></script>
<script>
(async()=>{
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), {C, W, H, S} = OTM;
  const f = OTM.frame(ctx, {seed: 6});
  const g = f.world, E = f.emissive;
  const D2R = Math.PI / 180;
  const hand = OTM.fig.hand, smooth = OTM.fig.smooth;

  // ================= camera (low, from Angelo's place, looking across toward Scott) =================
  // world: top-down clock coords. e = east, n = north, y = up from tabletop (m). Table radius 0.62 at origin.
  const CAM = { clock: 357, R: 1.22, y: 0.45, face: 170 };
  const FL = 1320, CXs = 960, YH = 330;
  const ce = CAM.R * Math.sin(CAM.clock * D2R), cn = CAM.R * Math.cos(CAM.clock * D2R);
  const fw = [Math.sin(CAM.face * D2R), Math.cos(CAM.face * D2R)], rt = [Math.cos(CAM.face * D2R), -Math.sin(CAM.face * D2R)];
  const cam = (e, n) => { const a = e - ce, b = n - cn; return [a * rt[0] + b * rt[1], a * fw[0] + b * fw[1]]; };
  const P3 = (e, y, n) => { const [X, Z] = cam(e, n); return [CXs + FL * X / Z, YH - FL * (y - CAM.y) / Z, Z]; };
  const pxm = (e, n) => FL / cam(e, n)[1];
  const CL = (deg, r) => [r * Math.sin(deg * D2R), r * Math.cos(deg * D2R)];      // clock -> [e, n]
  const LAMP = { e: 0.16, y: 0.8, n: -0.27 };   // hung toward the far side: the hottest ring falls on the sixth card
  const LAMP_S = P3(LAMP.e, LAMP.y, LAMP.n);
  const RT = 0.62;

  // the seven-place ring from F05 (51.4 deg). Angelo's place is bare; the sixth card sits at Scott's right.
  const PLACE = { christof: 47.1, kay: 98.6, extra: 150, scott: 201.4, marina: 252.9, deena: 304.3, angelo: 355.7 };
  const SEAT = { christof: 56, kay: 111, scott: 188, marina: 243, deena: 300, extra: 150 };
  const RCARD = 0.4;

  // ================= helpers =================
  const tmpC = OTM.makeCanvas(W, H), tg = tmpC.getContext('2d');
  function rim(path, dir, w, color, alpha, clip) {
    tg.setTransform(1, 0, 0, 1, 0, 0); tg.globalCompositeOperation = 'source-over'; tg.globalAlpha = 1; tg.clearRect(0, 0, W, H);
    tg.fillStyle = color; tg.fill(path); tg.globalCompositeOperation = 'destination-out'; tg.translate(-dir[0] * w, -dir[1] * w); tg.fill(path);
    g.save(); if (clip) g.clip(clip); g.globalAlpha = alpha == null ? 1 : alpha; g.drawImage(tmpC, 0, 0); g.restore();
  }
  const norm = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
  const dirTo = (from, to) => norm(to[0] - from[0], to[1] - from[1]);
  const polyPath = (pts, rough, seed) => S().poly(pts).path(rough == null ? 0.8 : rough, seed || 3);
  function circ3(e0, n0, r, nseg, y) { const pts = []; for (let i = 0; i < nseg; i++) { const a = i / nseg * Math.PI * 2; pts.push(P3(e0 + Math.cos(a) * r, y || 0, n0 + Math.sin(a) * r)); } return pts; }
  const _dp = {};
  function dither(color) { if (_dp[color]) return _dp[color]; const c = OTM.makeCanvas(4, 4), q = c.getContext('2d'); q.fillStyle = color; [[0, 0], [2, 2], [2, 0], [0, 2], [1, 1], [3, 3]].forEach(([x, y], i) => { if (i < 4 || i % 2) q.fillRect(x, y, 1, 1); }); return (_dp[color] = g.createPattern(c, 'repeat')); }
  // shadow of a 3D point on the tabletop (from the pendant)
  const onTable = (e, y, n) => { const k = LAMP.y / (LAMP.y - y); return [LAMP.e + (e - LAMP.e) * k, LAMP.n + (n - LAMP.n) * k]; };

  // hand flat on the wood. wrist [e,n], finger dir [de,dn], side +1 right / -1 left. Knuckle hump, flat fingers.
  function tableHand(pose, wrist, fd, side, L, o) {
    o = o || {}; const hs = hand(pose, { spread: o.spread == null ? 0.12 : o.spread, curl: o.curl || 0 });
    fd = norm(fd[0], fd[1]); const nL = [-fd[1], fd[0]];    // left of the finger direction, seen from above (east-north frame)
    const flat = S(), hump = S(); const pts3 = [];
    hs.polys.forEach(poly => {
      const lo = [], hi = [], p3 = [];
      poly.forEach(([u, v]) => {
        const e = wrist[0] + fd[0] * u * L + nL[0] * (-v) * L * side, n = wrist[1] + fd[1] * u * L + nL[1] * (-v) * L * side;
        const yh = (o.thick || 0.034) * Math.max(0, 1 - Math.pow(OTM.clamp(u / 0.62, 0, 1), 2.2)) + 0.006;
        lo.push(P3(e, 0.004, n)); hi.push(P3(e, yh, n)); p3.push([e, yh, n]);
      });
      flat.poly(lo); hump.poly(hi); pts3.push(p3);
    });
    return { shape: S().add(flat).add(hump), pts3 };
  }
  // 3D tapered limb
  function limb(sh, a, b, ra, rb) { const A = P3(...a), B = P3(...b); sh.capsule(A[0], A[1], ra * pxm(a[0], a[2]), B[0], B[1], rb * pxm(b[0], b[2])); return [A, B]; }

  // a hand pressing the card at a place: fingertips on the card's outer half, palm on bare wood
  function pressHand(id, side, o) {
    o = o || {};
    const [cx, cn2] = CL(PLACE[id], RCARD); const inward = norm(-cx, -cn2);
    const tw = o.twist || 0; const fd = norm(inward[0] * Math.cos(tw) - inward[1] * Math.sin(tw), inward[0] * Math.sin(tw) + inward[1] * Math.cos(tw));
    const L = o.len || 0.19; const reach = o.reach == null ? -0.02 : o.reach;           // fingertips stop this far past the card centre
    const wrist = [cx + inward[0] * reach - fd[0] * L * 0.98, cn2 + inward[1] * reach - fd[1] * L * 0.98];
    const h = tableHand(o.pose || 'open', wrist, fd, side, L, { spread: o.spread, thick: o.thick });
    const arm = S(), segs = [];
    const W3 = [wrist[0], 0.035, wrist[1]];
    const out = norm(-fd[0], -fd[1]);
    const E3 = o.elbow || [wrist[0] + out[0] * 0.24 + (o.eSide || 0) * fd[1], o.eY || 0.13, wrist[1] + out[1] * 0.24 - (o.eSide || 0) * fd[0]];
    const fr = o.fr || [0.03, 0.04]; limb(arm, W3, E3, fr[0], fr[1]); segs.push([W3, E3, fr[0], fr[1]]);
    if (o.shoulder) { limb(arm, E3, o.shoulder, 0.042, 0.05); segs.push([E3, o.shoulder, 0.042, 0.05]); }
    if (o.shoulder2D) { const Es = P3(...E3); arm.capsule(Es[0], Es[1], 0.042 * pxm(E3[0], E3[2]), o.shoulder2D[0], o.shoulder2D[1], o.shoulder2D[2] || 0.05 * pxm(E3[0], E3[2])); }
    return { hand: h, arm, segs, W3, E3, fd, wrist };
  }
  function shadowOf(Hh) {
    const sh = S();
    Hh.hand.pts3.forEach(poly => sh.poly(poly.map(([e, y, n]) => { const q = onTable(e, y, n); return P3(q[0], 0, q[1]); })));
    Hh.segs.forEach(([a, b, ra, rb]) => { if (a[1] > 0.3 || b[1] > 0.3) b = [a[0] + (b[0] - a[0]) * 0.5, a[1] + (b[1] - a[1]) * 0.5, a[2] + (b[2] - a[2]) * 0.5]; const A = onTable(...a), B = onTable(...b); const As = P3(A[0], 0, A[1]), Bs = P3(B[0], 0, B[1]); sh.capsule(As[0], As[1], ra * pxm(A[0], A[1]), Bs[0], Bs[1], rb * pxm(B[0], B[1])); });
    return sh;
  }

  // ================= far figures =================
  const L2 = { x: LAMP_S[0], y: LAMP_S[1] };
  function placeProfile(id, pose, headAt) {
    const f0 = OTM.fig.profile(id, Object.assign({}, pose, { x: 0, y: 0 }));
    return OTM.fig.profile(id, Object.assign({}, pose, { x: headAt[0] - f0.joints.head[0], y: headAt[1] - f0.joints.head[1] }));
  }
  const hang = { armN: { a: 0.04, b: 0.06, hand: 'relaxed' }, armF: { a: 0.0, b: 0.04, hand: 'relaxed' } };
  const head3 = (id, lean, y) => { const [e, n] = CL(SEAT[id], 0.8 - lean); return [e, y || 0.38, n]; };
  const hScale = (e, n) => 0.235 * pxm(e, n);
  const kH = head3('kay', 0.16), kS = P3(...kH);
  const KAY = placeProfile('kay', Object.assign({ facing: 1, anchor: 'hip', scale: hScale(kH[0], kH[2]), lean: 0.4, neck: 0.16, head: 0.14 }, hang), kS);
  const mH = head3('marina', 0.14), mS = P3(...mH);
  const MAR = placeProfile('marina', Object.assign({ facing: -1, anchor: 'hip', scale: hScale(mH[0], mH[2]), lean: 0.36, neck: 0.1, head: 0.16 }, hang), mS);
  // Scott front-on, both arms accounted for: right arm hangs by his side, left reaches for his card
  function scottBust(o) {
    const D = OTM.fig.CHAR.scott; const sh = S(); const sw = 0.98;
    sh.add(smooth([[0, -0.52], [0.3, -0.44], [0.38, -0.12], [0.36, 0.16], [0.26, 0.38], [0.0, 0.5], [-0.26, 0.38], [-0.36, 0.16], [-0.38, -0.12], [-0.3, -0.44]], true));
    sh.ellipse(0.39, 0.06, 0.06, 0.12, 0.2); sh.ellipse(-0.39, 0.06, 0.06, 0.12, -0.2);
    sh.capsule(0, 0.35, 0.19, 0, 0.66, 0.22);
    sh.add(smooth([[-0.2, 0.6], [-0.5, 0.78], [-(sw - 0.1), 0.9], [-sw, 1.12], [-sw + 0.02, 1.6], [-0.86, 2.4], [-0.8, 3.6, 1], [0.8, 3.6, 1], [0.86, 2.4], [sw - 0.02, 1.6], [sw, 1.12], [sw - 0.1, 0.9], [0.5, 0.78], [0.2, 0.6]], true));
    sh.add(smooth([[-0.4, -0.06], [-0.42, -0.38], [-0.2, -0.6], [0.05, -0.62], [0.08, -0.76, 1], [0.13, -0.6], [0.36, -0.5], [0.42, -0.2], [0.38, -0.06], [0.3, -0.3], [0.0, -0.36], [-0.3, -0.3]], true));
    // his right arm (screen left) hangs straight down by his side, out of the game
    sh.capsule(-(sw - 0.12), 1.2, 0.25, -(sw + 0.06), 2.5, 0.18); sh.capsule(-(sw + 0.06), 2.5, 0.17, -(sw + 0.02), 3.6, 0.14);
    const k = o.scale, t = o.tilt || 0; const M = [k * Math.cos(t), k * Math.sin(t), -k * Math.sin(t), k * Math.cos(t), o.x, o.y];
    const ap = p => [M[0] * p[0] + M[2] * p[1] + M[4], M[1] * p[0] + M[3] * p[1] + M[5]];
    return { shape: sh.transform(M), shoulderL: ap([sw - 0.15, 1.15]), k };
  }
  const sH = head3('scott', 0.1, 0.36), sS = P3(...sH);
  const SCO = scottBust({ x: sS[0], y: sS[1], scale: hScale(sH[0], sH[2]), tilt: -0.05 });

  // ================= back wall: one posterised spill, and the dark doorway at Scott's right =================
  // the sixth arm is laid out first so the doorway can swallow its upper arm exactly
  const X_W = (() => { const [cx, cn2] = CL(PLACE.extra, RCARD); return [cx, cn2]; })();
  const X_ELB = [CL(140, 0.66)[0], 0.26, CL(140, 0.66)[1]], X_SH = [CL(132, 0.9)[0], 0.5, CL(132, 0.9)[1]];
  const xE = P3(...X_ELB), xSh = P3(...X_SH);
  g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
  const spill = (x, y, rx, ry, col, seed) => { g.fillStyle = col; g.fill(S().ellipse(x, y, rx, ry, -0.03).path(2.6, seed)); };
  // the brightest patch of wall is the one nobody sits in front of
  spill(1000, 520, 1120, 330, '#1A130F', 11);
  spill(960, 540, 780, 240, '#2B1E15', 12);
  spill(930, 560, 430, 170, '#4E3520', 13);
  const DOOR = { x0: xSh[0] - 110, x1: xE[0] + 3, top: -10, bot: 700 };
  g.fillStyle = C.ink; g.fill(polyPath([[DOOR.x0, DOOR.top], [DOOR.x1, DOOR.top], [DOOR.x1 + 2, DOOR.bot], [DOOR.x0 - 2, DOOR.bot]], 0.9, 21));
  g.fillStyle = OTM.rgba(C.tungstenMid, 0.6); g.fill(polyPath([[DOOR.x1, 250], [DOOR.x1 + 4, 250], [DOOR.x1 + 6, DOOR.bot], [DOOR.x1 + 2, DOOR.bot]], 0.4, 22));

  // ================= the table: three hard rings =================
  const tableEdge = circ3(0, 0, RT, 180);
  const tablePath = polyPath(tableEdge, 1.2, 4);
  const notTable = new Path2D(); notTable.rect(0, 0, W, H); notTable.addPath(tablePath);
  // far bodies go down first; the tabletop cuts them at its far lip
  g.save(); g.clip(notTable, 'evenodd');
  [[KAY.shape, 50], [MAR.shape, 51], [SCO.shape, 52]].forEach(([sh, s]) => { const p = sh.path(0.8, s); g.fillStyle = C.ink; g.fill(p); const bb = sh.bbox(); rim(p, dirTo([bb.x + bb.w / 2, bb.y + bb.h * 0.25], [L2.x, L2.y]), 4, C.tungsten); });
  g.restore();
  OTM.fig.drawDetails(g, KAY, { beadColor: C.rainSilver });

  const bands = [[RT + 0.6, C.tungstenLow], [0.46, C.tungstenMid], [0.23, C.tungsten]];
  g.save(); g.clip(tablePath);
  bands.forEach(([r, col], i) => {
    const p = polyPath(circ3(LAMP.e, LAMP.n, r, 150), 1.6, 30 + i); g.fillStyle = col; g.fill(p);
    if (i > 0) { g.save(); g.strokeStyle = dither(bands[i - 1][1]); g.lineWidth = 5; g.stroke(p); g.restore(); }
  });
  g.restore();
  // the far lip catches a hairline
  { const c0 = P3(0, 0, 0)[1]; const arc = tableEdge.filter(p => p[1] < c0); arc.sort((a, b) => a[0] - b[0]); g.save(); g.strokeStyle = OTM.rgba(C.tungstenMid, 0.7); g.lineWidth = 2; g.beginPath(); arc.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.restore(); }

  // ================= six cards =================
  const CWm = 0.078, CHm = 0.11;   // a touch over real size so they read at this distance
  function drawCard(id, jit) {
    const [ce2, cn2] = CL(PLACE[id], RCARD); const a = Math.atan2(-cn2, -ce2) + (jit || 0);
    const u = [Math.cos(a), Math.sin(a)], v = [-u[1], u[0]];
    const corner = (s, t) => P3(ce2 + u[0] * s + v[0] * t, 0.002, cn2 + u[1] * s + v[1] * t);
    const quad = i => [corner(CHm / 2 - i, CWm / 2 - i), corner(CHm / 2 - i, -CWm / 2 + i), corner(-CHm / 2 + i, -CWm / 2 + i), corner(-CHm / 2 + i, CWm / 2 - i)];
    // shadow: a hair of dark under the outer edge
    g.fillStyle = OTM.rgba(C.ink, 0.5); g.fill(polyPath(quad(-0.002).map(p => [p[0] + 2, p[1] + 2]), 0.2, 6));
    g.fillStyle = C.cardPaper; g.fill(polyPath(quad(0), 0.25, 7));
    g.fillStyle = C.cardBlue; g.fill(polyPath(quad(0.0058), 0.15, 8));
    g.strokeStyle = OTM.rgba(C.cardPaper, 0.45); g.lineWidth = 1; g.stroke(polyPath(quad(0.011), 0, 9));
  }
  ['christof', 'kay', 'extra', 'scott', 'marina', 'deena'].forEach((id, i) => drawCard(id, [0.06, -0.1, 0.03, 0.08, -0.06, 0.1][i]));

  // ================= six hands =================
  const kayShoulder = KAY.joints.shoulder;
  const marShoulder = MAR.joints.shoulder;
  const HK = pressHand('kay', 1, { shoulder2D: kayShoulder, eSide: 0.03, twist: 0.3, eY: 0.16 });
  const HM = pressHand('marina', 1, { shoulder2D: marShoulder, eSide: -0.04, twist: -0.25, eY: 0.16 });
  const HS = pressHand('scott', -1, { shoulder2D: SCO.shoulderL, eSide: -0.02, twist: -0.12, eY: 0.14 });
  // Christof, near and huge at the left edge: curls, jaw, one shoulder, the arm that reaches
  const CHR = (() => {
    const D = OTM.fig.CHAR.christof, s0 = 310, hx = 70, hy = 470, t = 0.3;
    const HM = [s0 * Math.cos(t), s0 * Math.sin(t), -s0 * Math.sin(t), s0 * Math.cos(t), hx, hy];
    const sh = S().add(OTM.fig.headProfile(D.face).transform(HM)).add(OTM.fig.hairProfile('christof', {}, 2).transform(HM));
    sh.capsule(hx - 40, hy + 120, 95, hx - 90, hy + 330, 120);                       // neck into the shoulder
    sh.add(smooth([[-60, hy + 210], [140, hy + 250], [260, hy + 330], [300, hy + 420], [250, H + 40], [-60, H + 40]], true));
    const headOnly = S().add(OTM.fig.headProfile(D.face).transform(HM)).add(OTM.fig.hairProfile('christof', {}, 2).transform(HM));
    return { shape: sh, head: headOnly, joints: { shoulder: [215, hy + 345, 62] } };
  })();
  const HC = pressHand('christof', 1, { elbow: [CL(60, 0.6)[0], 0.1, CL(60, 0.6)[1]], shoulder2D: CHR.joints.shoulder, twist: 0.2, len: 0.2 });
  const HD = pressHand('deena', -1, { elbow: [CL(302, 0.58)[0], 0.1, CL(302, 0.58)[1]], shoulder2D: [1868, 845, 64], twist: -0.2, len: 0.178 });
  // the sixth: a right hand out of the dark at Scott's right. No shoulder, no rim, no shadow.
  const HX = pressHand('extra', 1, { elbow: X_ELB, twist: 0.32, len: 0.2, spread: 0.14, fr: [0.034, 0.046] });
  limb(HX.arm, X_ELB, X_SH, 0.046, 0.052);

  // five shadows on the wood; the sixth throws none
  g.save(); g.clip(tablePath); g.globalAlpha = 0.5; g.fillStyle = C.ink;
  [HK, HM, HS, HC, HD].forEach(Hh => g.fill(shadowOf(Hh).path(1.0, 9)));
  g.restore();

  // draw order: far to near
  function lit(sh, seed, w, cut) {
    const p = sh.path(0.7, seed); g.fillStyle = C.ink; g.fill(p);
    const bb = sh.bbox(); rim(p, dirTo([bb.x + bb.w / 2, bb.y + bb.h / 2], [L2.x, L2.y]), w || 3.5, C.tungsten, 1, cut);
    return p;
  }
  lit(S().add(HK.arm).add(HK.hand.shape), 61, 3.2);
  lit(S().add(HS.arm).add(HS.hand.shape), 62, 3.2);
  lit(S().add(HM.arm).add(HM.hand.shape), 63, 3.2);
  // the sixth: ink only
  { const p = S().add(HX.arm).add(HX.hand.shape).path(0.7, 77); g.fillStyle = C.ink; g.fill(p); }
  // Marina's ring glints
  { const hm = HM.hand; const w = HM.wrist, fd = HM.fd; const nL = [-fd[1], fd[0]];
    [[0.5, -0.06], [0.48, 0.05]].forEach(([u, v]) => { const e = w[0] + fd[0] * u * 0.19 + nL[0] * (-v) * 0.19, n = w[1] + fd[1] * u * 0.19 + nL[1] * (-v) * 0.19; const q = P3(e, 0.03, n); g.fillStyle = '#E8C46A'; g.beginPath(); g.arc(q[0], q[1], 2.6, 0, 7); g.fill(); }); }
  { const p = S().add(CHR.shape).path(0.7, 66); g.fillStyle = C.ink; g.fill(p);
    const hp = CHR.head.path(0.7, 67); rim(hp, dirTo([90, 420], [L2.x, L2.y]), 5, C.tungsten); }
  { const lowClip = new Path2D(); lowClip.rect(420, 0, W, H); lit(S().add(HC.arm).add(HC.hand.shape), 64, 4.5, lowClip); }
  // Deena's near shoulder fills the bottom-right corner, so her arm visibly leads back to a body
  const deenaBody = S().add(smooth([[1760, 900], [1800, 830], [1880, 790], [W + 60, 770], [W + 60, H + 60], [1730, H + 60]], true));
  lit(S().add(HD.arm).add(HD.hand.shape).add(deenaBody), 65, 4.5);

  // ================= Angelo: long fingers round the fanned deck (foreground, bottom centre) =================
  {
    const px = 1085, py = 1175, n = 13, R0 = 268, cw = 112, chh = 160;
    for (let i = 0; i < n; i++) {
      const a = (-52 + i * (88 / (n - 1))) * D2R;
      g.save(); g.translate(px, py); g.rotate(a);
      g.fillStyle = C.cardPaper; g.beginPath(); g.roundRect(-cw / 2, -R0, cw, chh, 8); g.fill();
      g.fillStyle = OTM.mix(C.cardBlue, C.ink, 0.4); g.beginPath(); g.roundRect(-cw / 2 + 6, -R0 + 6, cw - 12, chh - 12, 4); g.fill();
      g.strokeStyle = OTM.rgba(C.cardPaper, 0.22); g.lineWidth = 1.2; g.strokeRect(-cw / 2 + 11, -R0 + 11, cw - 22, chh - 22);
      g.fillStyle = C.tungsten; g.fillRect(-cw / 2 + 3, -R0 - 0.5, cw - 6, 2.5);
      g.restore();
    }
    // the hand: heel at the pivot (cut by the frame), thumb pinning the root,
    // four long separated fingers laid across the right of the spread, gripping it
    const hs = S();
    hs.add(smooth([[985, 1100], [1000, 1028], [1050, 990], [1125, 982], [1180, 1005], [1205, 1100]], true));
    hs.capsule(1045, 1012, 22, 985, 985, 16); hs.capsule(985, 985, 15, 940, 978, 12);           // thumb along the root
    const F = [
      [[1112, 992, 17], [1146, 948, 13.5], [1160, 912, 11.5], [1152, 890, 10]],
      [[1138, 1000, 17], [1188, 962, 13.5], [1216, 930, 11.5], [1214, 906, 10]],
      [[1160, 1014, 16], [1218, 990, 13], [1254, 966, 11], [1258, 944, 9.5]],
      [[1176, 1036, 14.5], [1228, 1026, 12], [1264, 1010, 10], [1272, 990, 8.5]],
    ];
