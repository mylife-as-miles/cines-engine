<!doctype html><meta charset="utf-8"><title>F07</title>
<script src="../kit/otm.js"></script><script src="../kit/figures.js"></script><script src="../kit/dialogue.js"></script>
<script>
(async()=>{
  await OTM.loadFonts('../fonts/fonts.css');
  const ctx = OTM.stage(), {C, W, H, S} = OTM;
  const f = OTM.frame(ctx, {seed: 7});
  const g = f.world, E = f.emissive;
  const R0 = OTM.rng('f07');

  // ---------------- camera / lamp geometry (world = table plane, px) ----------------
  const CX = 780, CY = 508;            // table centre = lamp nadir = optical centre
  const PXM = 500;                     // px per metre on the table plane
  const R = Math.round(0.66 * PXM);    // table radius
  const DCAM = 4.2 * PXM;              // camera height above the table
  const LAMP = 0.85 * PXM;             // lamp height above the table
  const kz = z => DCAM / (DCAM - z);
  const P = (x, y, z) => { const k = kz(z || 0); return [CX + (x - CX) * k, CY + (y - CY) * k]; };
  const onTable = (x, y, z) => { const t = z / (LAMP - z); return [x + (x - CX) * t, y + (y - CY) * t]; };
  const warp = (shape, fn) => { const s = new OTM.Shape(); s.polys = shape.polys.map(p => p.map(([x, y]) => fn(x, y))); return s; };
  const pol = (a, r) => [CX + Math.cos(a) * r, CY + Math.sin(a) * r];
  const deg = d => d * Math.PI / 180;
  const sm = t => t * t * (3 - 2 * t);
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  // ---------------- seating: four bodies, one empty seat at Scott's right ----------------
  const SC = Math.round(0.226 * PXM), RB = Math.round(0.84 * PXM);
  OTM.fig.CHAR.scott.armK = 1.08;    // runtime tweak in this page only: a little extra stretch
  const ROT = 0.27;                    // the whole set turned off-axis: the stretched link becomes a diagonal
  const EMPTY = ROT;
  function seatUp(id, a, twist) {
    const s = {id, a}; const p = pol(a, RB); s.x = p[0]; s.y = p[1]; s.dir = a + Math.PI + twist;
    const D = OTM.fig.CHAR[id]; const cs = Math.cos(s.dir), sn = Math.sin(s.dir);
    s.sh = side => [s.x - side * D.shoulderK * sn * SC, s.y + side * D.shoulderK * cs * SC];
    s.reach = (1.25 + 1.15) * D.armK * SC * 0.985; return s;
  }
  // taut link: both arms at full stretch, the clasp at the outer crossing of the two reach circles (the pentagon's empty vertex)
  function taut(A, sa, B, sb, k) {
    const p = A.sh(sa), q = B.sh(sb), ra = A.reach * k, rb = B.reach * k, d = dist(p, q);
    const a = (ra * ra - rb * rb + d * d) / (2 * d), h = Math.sqrt(Math.max(0, ra * ra - a * a));
    const m = [p[0] + (q[0] - p[0]) * a / d, p[1] + (q[1] - p[1]) * a / d], n = [-(q[1] - p[1]) / d, (q[0] - p[0]) / d];
    const c1 = [m[0] + n[0] * h, m[1] + n[1] * h], c2 = [m[0] - n[0] * h, m[1] - n[1] * h];
    return dist(c1, [CX, CY]) > dist(c2, [CX, CY]) ? c1 : c2;
  }
  // choose Scott/Angelo's seat angle so the taut clasp lands right on the table's edge
  let best = null; const APEX = R - 0.17 * PXM;
  for (let a = 40; a <= 75; a += 0.5) {
    const sc = seatUp('scott', deg(a) + ROT, -0.4), an = seatUp('angelo', deg(-a) + ROT, 0.4);
    const c = taut(an, -1, sc, 1, 0.97); const r = dist(c, [CX, CY]);
    if (!best || Math.abs(r - APEX) < Math.abs(best.r - APEX)) best = {a, r, c, sc, an};
  }
  const sA = best.a;
  const seats = {
    scott: best.sc,
    marina: seatUp('marina', deg(sA + (360 - 2 * sA) / 3) + ROT, 0.04),
    deena: seatUp('deena', deg(sA + 2 * (360 - 2 * sA) / 3) + ROT, -0.04),
    angelo: best.an,
  };
  const s = seats;
  function clasp(want, A, sideA, kA, B, sideB, kB) {
    let p = want.slice(); const sa = A.sh(sideA), sb = B.sh(sideB), ra = A.reach * kA, rb = B.reach * kB;
    if (dist(sa, sb) > ra + rb) console.error('unreachable clasp ' + A.id + '-' + B.id + ' gap ' + (dist(sa, sb) - ra - rb).toFixed(1));
    for (let i = 0; i < 80; i++) {
      let d = dist(p, sa); if (d > ra) p = [sa[0] + (p[0] - sa[0]) * ra / d, sa[1] + (p[1] - sa[1]) * ra / d];
      d = dist(p, sb); if (d > rb) p = [sb[0] + (p[0] - sb[0]) * rb / d, sb[1] + (p[1] - sb[1]) * rb / d];
    }
    return p;
  }
  const mid = (A, B) => (A.a + B.a) / 2;
  const cSM = clasp(pol(mid(s.scott, s.marina), R - 0.12 * PXM), s.scott, -1, 0.9, s.marina, 1, 0.9);
  const cMD = clasp(pol(mid(s.marina, s.deena), R - 0.12 * PXM), s.marina, -1, 0.9, s.deena, 1, 0.9);
  const cDA = clasp(pol(mid(s.deena, { a: s.angelo.a + Math.PI * 2 }), R - 0.12 * PXM), s.deena, -1, 0.9, s.angelo, 1, 0.9);
  const cAS = best.c;   // the long link across the empty seat
  const hands = { scott: [cSM, cAS], marina: [cMD, cSM], deena: [cDA, cMD], angelo: [cAS, cDA] };

  // z of a figure vertex: head highest, shoulders, then arms falling to the hands
  function zOf(d) {
    if (d <= 0.6) return 0.5 * PXM;
    if (d <= 1.2) return OTM.lerp(0.5, 0.37, (d - 0.6) / 0.6) * PXM;
    if (d <= 2.15) return OTM.lerp(0.37, 0.12, sm((d - 1.2) / 0.95)) * PXM;
    return 0.12 * PXM;
  }
  const figs = {};
  Object.values(seats).forEach(st => {
    const fig = OTM.fig.top(st.id, {x: st.x, y: st.y, scale: SC, dir: st.dir, hands: hands[st.id], handPose: 'clasp', spread: 0.02, swing: 0.12});
    // from straight above the nose is hidden by the brow: drop the top-view nose nub so the crown reads as one clean curve
    { const cs = Math.cos(st.dir), sn = Math.sin(st.dir);
      fig.shape.polys = fig.shape.polys.filter(pl => { let mx = 0, my = 0; pl.forEach(([x, y]) => { mx += x; my += y; }); mx /= pl.length; my /= pl.length;
        const lx = ((mx - st.x) * cs + (my - st.y) * sn) / SC, ly = (-(mx - st.x) * sn + (my - st.y) * cs) / SC; const bb = new OTM.Shape(); bb.polys = [pl]; const q = bb.bbox();
        return !(Math.abs(lx - 0.66) < 0.06 && Math.abs(ly) < 0.06 && q.w < 0.3 * SC && q.h < 0.3 * SC); }); }
    const zf = (x, y) => zOf(Math.hypot(x - st.x, y - st.y) / SC);
    fig.screen = warp(fig.shape, (x, y) => P(x, y, zf(x, y)));
    fig.tShadow = warp(fig.shape, (x, y) => onTable(x, y, Math.min(zf(x, y), LAMP * 0.8)));
    fig.zf = zf; fig.st = st; fig.scr = P(st.x, st.y, 0.45 * PXM); figs[st.id] = fig;
  });

  // ---------------- 1. floor: only the table's bounce reaches it ----------------
  g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
  OTM.lightPool(g, CX, CY, [{r: 1.5 * PXM, color: '#110B08'}, {r: 1.22 * PXM, color: '#160F0B'}, {r: 1.0 * PXM, color: '#1D140E'}], {rough: 2.6, seed: 21});
  // floorboards, quiet
  g.save(); g.strokeStyle = C.ink; const bw = 64;
  for (let i = -10; i < 12; i++) { const y0 = CY + i * bw + 20; g.globalAlpha = 0.55; g.lineWidth = 3; g.beginPath(); g.moveTo(0, y0); g.lineTo(W, y0); g.stroke();
    g.globalAlpha = 0.4; g.lineWidth = 2; for (let j = 0; j < 6; j++) { const xx = R0() * W; g.beginPath(); g.moveTo(xx, y0); g.lineTo(xx, y0 + bw); g.stroke(); } }
  g.restore();

  // chairs: four hidden under bodies, one empty and askew at the gap
  // the empty chair: pulled out and turned, as if somebody had just sat down in it
  {
    const a = EMPTY, r = 1.06 * PXM, rot = -0.2, sw = 0.42 * PXM;
    const M = [Math.cos(a + rot), Math.sin(a + rot), -Math.sin(a + rot), Math.cos(a + rot), CX + Math.cos(a) * r, CY + Math.sin(a) * r];
    const rr = (x, y, w, h, q) => S().M(x + q, y).L(x + w - q, y).Q(x + w, y, x + w, y + q).L(x + w, y + h - q).Q(x + w, y + h, x + w - q, y + h).L(x + q, y + h).Q(x, y + h, x, y + h - q).L(x, y + q).Q(x, y, x + q, y).Z();
    const seat = warp(S().M(-sw / 2 + 8, -sw / 2 - 4).L(sw / 2 - 4, -sw / 2 + 6).L(sw / 2 - 4, sw / 2 - 6).L(-sw / 2 + 8, sw / 2 + 4).Q(-sw / 2 - 6, sw / 2 + 2, -sw / 2 - 6, sw / 2 - 12).L(-sw / 2 - 6, -sw / 2 + 12).Q(-sw / 2 - 6, -sw / 2 - 2, -sw / 2 + 8, -sw / 2 - 4).Z().transform(M), (x, y) => P(x, y, -0.3 * PXM));
    const back = warp(S().rect(sw / 2 - 24, -sw / 2 - 4, 22, sw + 8)
      .add(S().circle(sw / 2 - 13, -sw / 2 - 2, 13)).add(S().circle(sw / 2 - 13, sw / 2 + 2, 13)).transform(M), (x, y) => P(x, y, 0.15 * PXM));
    // near-ink and unlit: the voice is cut through the dark, not printed on furniture
    g.fillStyle = '#110B08'; g.fill(seat.path(1.0, 71));
    g.fillStyle = '#0E0A08'; g.fill(back.path(1.0, 72));
  }

  // ---------------- 2. the table: the lamp pool is exactly the table ----------------
  const tableP = S().circle(CX, CY, R).path(1.4, 12);
  OTM.lightPool(g, CX + 4, CY - 3, [{r: R, color: C.tungstenLow}, {r: R * 0.8, color: C.tungstenMid}, {r: R * 0.47, color: C.tungsten}], {rough: 1.4, seed: 12});
  g.save(); g.clip(tableP);
  g.globalAlpha = 0.13; g.strokeStyle = C.ink; g.lineWidth = 2;
  for (let i = -7; i <= 7; i++) { const o = i * 46; g.beginPath(); g.moveTo(CX + o - 140, CY - 400); g.lineTo(CX + o + 140, CY + 400); g.stroke(); }
  g.restore();

  // ---------------- 3. on the table: five piles, five glasses, one coaster ----------------
  [s.scott.a, s.marina.a, s.deena.a, s.angelo.a, EMPTY + 0.24].forEach((a, i) => {
    const [px, py] = pol(a, 0.345 * PXM);
    for (let k = 2; k >= 0; k--) {
      g.save(); g.translate(px + k * 2.2, py + k * 1.6); g.rotate(a + Math.PI / 2 + (R0() - 0.5) * 0.2);
      g.fillStyle = OTM.rgba(C.ink, 0.42); g.fillRect(-14 + 5, -20 + 6, 28, 40);
      g.fillStyle = C.cardPaper; g.fillRect(-14, -20, 28, 40); g.fillStyle = C.cardBlue; g.fillRect(-11, -17, 22, 34);
      g.restore();
    }
  });
  function glass(b, i, coaster) {
    const hz = 0.2 * PXM, rb = 15, rr = 24;
    if (coaster) {
      g.save(); g.translate(b[0], b[1]); g.rotate(0.38);
      const cs = S().rect(-26, -26, 52, 52);
      g.fillStyle = OTM.rgba(C.ink, 0.5); g.fill(cs.translate(5, 3).path(0.6, 2));
      g.fillStyle = '#2B180B'; g.fill(cs.path(0.6, 3)); g.strokeStyle = OTM.rgba(C.tungstenMid, 0.9); g.lineWidth = 1.5; g.strokeRect(-20, -20, 40, 40);
      g.restore();
    }
    const top = onTable(b[0], b[1], hz), ang = Math.atan2(top[1] - b[1], top[0] - b[0]);
    g.save(); g.fillStyle = OTM.rgba(C.ink, 0.5);
    g.fill(S().capsule(b[0], b[1], 3.5, top[0], top[1], rr * 0.95).path(0.5, i)); g.fill(S().circle(b[0], b[1], rb).path(0.3, i));
    g.fillStyle = OTM.rgba(C.tungsten, 0.85); g.beginPath(); g.ellipse(top[0] - Math.cos(ang) * 5, top[1] - Math.sin(ang) * 5, 5, 3, ang, 0, 7); g.fill();
    g.restore();
    const base = P(b[0], b[1], 0), rim = P(b[0], b[1], hz), wine = P(b[0], b[1], 0.12 * PXM), rk = rr * kz(hz);
    const la = Math.atan2(CY - rim[1], CX - rim[0]);
    // foot ring on the table, seen through the bowl
    g.strokeStyle = OTM.rgba(C.ink, 0.55); g.lineWidth = 1.6; g.beginPath(); g.arc(base[0], base[1], rb, 0, 7); g.stroke();
    // the bowl catches the lamp: a pale glaze, the wine low inside it
    g.fillStyle = OTM.rgba(C.cardPaper, 0.13); g.beginPath(); g.arc(rim[0], rim[1], rk, 0, 7); g.fill();
    g.fillStyle = C.wine; g.beginPath(); g.arc(wine[0], wine[1], rk * 0.6, 0, 7); g.fill();
    g.strokeStyle = OTM.rgba(C.cardPaper, 0.35); g.lineWidth = 1.4; g.beginPath(); g.arc(rim[0], rim[1], rk, 0, 7); g.stroke();
    g.strokeStyle = OTM.rgba(C.ink, 0.6); g.lineWidth = 2; g.beginPath(); g.arc(rim[0], rim[1], rk + 1.5, la + 1.6, la + Math.PI * 2 - 1.6); g.stroke();
    g.strokeStyle = C.cardPaper; g.lineWidth = 2.4; g.beginPath(); g.arc(rim[0], rim[1], rk, la - 1.0, la + 1.0); g.stroke();
    g.fillStyle = C.cardPaper; g.beginPath(); g.ellipse(wine[0] + Math.cos(la) * rk * 0.32, wine[1] + Math.sin(la) * rk * 0.32, 4, 1.8, la + Math.PI / 2, 0, 7); g.fill();
    E.fillStyle = C.cardPaper; E.beginPath(); E.arc(rim[0] + Math.cos(la) * rk, rim[1] + Math.sin(la) * rk, 4, 0, 7); E.fill();
  }
  [s.scott, s.marina, s.deena, s.angelo].forEach((st, i) => glass(pol(st.a - 0.3, R - 0.19 * PXM), i, false));
  const fo = [-0.1 * PXM, -0.085 * PXM];   // between them, right under the stretched link
  const fifth = [cAS[0] + fo[0] * Math.cos(ROT) - fo[1] * Math.sin(ROT), cAS[1] + fo[0] * Math.sin(ROT) + fo[1] * Math.cos(ROT)];
  glass(fifth, 9, true);

  // ---------------- 4. arm shadows on the table ----------------
  g.save(); g.clip(tableP); g.fillStyle = OTM.rgba(C.ink, 0.8);
  Object.values(figs).forEach(fg => g.fill(fg.tShadow.path(1.0, 6)));
  g.restore();

  // ---------------- 5. the four bodies ----------------
  const tmpC = OTM.makeCanvas(W, H), tg = tmpC.getContext('2d');
  function chaikin(q, n) { for (let k = 0; k < n; k++) { const o = []; q.forEach((p, i) => { const r = q[(i + 1) % q.length]; o.push([p[0] * 0.75 + r[0] * 0.25, p[1] * 0.75 + r[1] * 0.25], [p[0] * 0.25 + r[0] * 0.75, p[1] * 0.25 + r[1] * 0.75]); }); q = o; } return q; }
  // convex hull (monotone chain)
  function hull(P0) {
    const q = P0.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]); const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    q.forEach(p => { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); });
    for (let i = q.length - 1; i >= 0; i--) { const p = q[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }
  function rim(path, dir, w, color, clip, alpha) {
    tg.setTransform(1, 0, 0, 1, 0, 0); tg.globalCompositeOperation = 'source-over'; tg.clearRect(0, 0, W, H);
    tg.fillStyle = color; tg.fill(path); tg.globalCompositeOperation = 'destination-out'; tg.translate(-dir[0] * w, -dir[1] * w); tg.fill(path);
    g.save(); if (clip) g.clip(clip, 'evenodd'); g.globalAlpha = alpha == null ? 1 : alpha; g.drawImage(tmpC, 0, 0); g.restore();
  }
  Object.values(figs).forEach((fg, i) => {
    const p = fg.screen.path(0.7, 40 + i);
    g.fillStyle = C.ink; g.fill(p);
    const [hx, hy] = fg.scr; const l = Math.hypot(CX - hx, CY - hy); const dir = [(CX - hx) / l, (CY - hy) / l];
    // rim only on the crown, where it rises into the lamp: a smooth crescent cut from the convex hull of head and hair,
    // so notches in the hair never become a jagged crown; three stepped bands give it a soft inner falloff
    const hd = P(fg.head[0], fg.head[1], 0.5 * PXM); const la = Math.atan2(CY - hd[1], CX - hd[0]); const rr = 0.9 * SC * kz(0.5 * PXM);
    const wedge = new Path2D(); wedge.moveTo(hd[0], hd[1]); wedge.arc(hd[0], hd[1], rr, la - 1.0, la + 1.0); wedge.closePath();
    const st = fg.st, cs = Math.cos(st.dir), sn = Math.sin(st.dir);
    const pts = [];
    fg.shape.polys.forEach((pl, k) => {
      let mx = 0, my = 0, x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      pl.forEach(([x, y]) => { const lx = ((x - st.x) * cs + (y - st.y) * sn) / SC, ly = (-(x - st.x) * sn + (y - st.y) * cs) / SC; mx += lx; my += ly; x0 = Math.min(x0, lx); x1 = Math.max(x1, lx); y0 = Math.min(y0, ly); y1 = Math.max(y1, ly); });
      mx /= pl.length; my /= pl.length;
      if (Math.hypot(mx - 0.15, my) < 0.45 && x1 - x0 < 1.3 && y1 - y0 < 1.3) fg.screen.polys[k].forEach(q => pts.push(q));
    });
    const crown = S().poly(chaikin(hull(pts), 4)).path(0.2, 3);
    rim(crown, dir, 8, C.tungstenLow, wedge, 0.9);
    rim(crown, dir, 4.6, C.tungstenMid, wedge, 1);
    rim(crown, dir, 2.2, C.tungsten, wedge, 1);
    // the ring of arms: a hairline of lamp on their inner edges, only out over the dark floor
    const armClip = new Path2D(); armClip.rect(0, 0, W, H); armClip.arc(CX, CY, R + 3, 0, Math.PI * 2); armClip.moveTo(hx + 1.15 * SC, hy); armClip.arc(hx, hy, 1.15 * SC, 0, Math.PI * 2);
    rim(p, dir, 2.2, C.tungstenMid, armClip, 0.8);
  });
  // the long link: two hands knotted into one white-knuckle grip
  {
    const A = figs.angelo.screen, gp = P(cAS[0], cAS[1], 0.12 * PXM);
    const sa = s.angelo.sh(-1), sb = s.scott.sh(1); const ang = Math.atan2(sb[1] - sa[1], sb[0] - sa[0]);
    const grip = S().ellipse(gp[0], gp[1], 0.3 * SC, 0.2 * SC, ang);
    for (let i = 0; i < 4; i++) { const t = (i - 1.5) * 0.11 * SC; grip.circle(gp[0] + Math.cos(ang) * t - Math.sin(ang) * 0.17 * SC, gp[1] + Math.sin(ang) * t + Math.cos(ang) * 0.17 * SC, 0.065 * SC); }
    g.fillStyle = C.ink; g.fill(grip.path(0.5, 5));
  }
  const ap = (m, q) => [m[0] * q[0] + m[2] * q[1] + m[4], m[1] * q[0] + m[3] * q[1] + m[5]];
  const comp = (M2, m) => [M2[0] * m[0] + M2[2] * m[1], M2[1] * m[0] + M2[3] * m[1], M2[0] * m[2] + M2[2] * m[3], M2[1] * m[2] + M2[3] * m[3], M2[0] * m[4] + M2[2] * m[5] + M2[4], M2[1] * m[4] + M2[3] * m[5] + M2[5]];
  Object.values(figs).forEach(fg => (fg.details || []).forEach(d => {
    if (d.kind === 'rings') { const m = comp(d.M, d.hm); [[0.42, -0.1], [0.4, 0.04]].forEach(q => { const w = ap(m, q); const sp = P(w[0], w[1], fg.zf(w[0], w[1])); g.fillStyle = '#D4AF5E'; g.beginPath(); g.arc(sp[0], sp[1], 3.2, 0, 7); g.fill(); E.fillStyle = '#D4AF5E'; E.beginPath(); E.arc(sp[0], sp[1], 5, 0, 7); E.fill(); }); }
    if (d.kind === 'cigTop') { const a = ap(d.M, [0.1, 0.42]), b = ap(d.M, [-0.25, 0.47]); const A = P(a[0], a[1], fg.zf(a[0], a[1])), B = P(b[0], b[1], fg.zf(b[0], b[1])); g.strokeStyle = C.cardPaper; g.lineCap = 'round'; g.lineWidth = 4.5; g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke(); }
  }));

  // ---------------- 6. the VOICE, at the empty corner, in Angelo's face ----------------
  const vh = P(CX + 1.1 * PXM * Math.cos(EMPTY), CY + 1.1 * PXM * Math.sin(EMPTY), -0.3 * PXM);
  OTM.say(g, 'voice', 'Scott.', vh[0] + 10, vh[1] + 44, {frame: f, face: 'angelo', size: 138, align: 'center'});

  // the pendant shade over the table centre (as in F05): the nearest thing to the camera, so it shows a little parallax upward
  const SHADE_R = 112, SX = CX, SY = CY - 26;
  const drawShade = c => {
    c.save(); c.globalAlpha = 0.4; c.fillStyle = C.ink; c.fill(S().circle(SX + 5, SY + 9, SHADE_R + 6).path(1, 3)); c.restore();
    c.fillStyle = C.ink; c.fill(S().circle(SX, SY, SHADE_R).path(0.8, 4));
    c.strokeStyle = '#1A1310'; c.lineWidth = 2; c.beginPath(); c.arc(SX, SY, SHADE_R * 0.68, 0, 7); c.stroke();
    c.fillStyle = '#1A1310'; c.beginPath(); c.arc(SX, SY, 12, 0, 7); c.fill();
  };
  drawShade(g);
  E.save(); E.fillStyle = C.tungsten; E.globalAlpha = 0.85; E.beginPath(); E.arc(CX, CY, R * 0.5, 0, 7); E.arc(SX, SY, SHADE_R, 0, 7, true); E.fill('evenodd'); E.restore();

  f.finish({letterbox: 2.0, vignette: 0.5, halation: 0.5, beforePost: c => drawShade(c)});
  OTM.slate(ctx, 'ONE TOO MANY  ·  STYLE FRAME 07', 'THE HAND CIRCLE', 2.0);
  window.FRAME_READY = true;
})();
