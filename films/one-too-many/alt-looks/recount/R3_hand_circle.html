<!doctype html><meta charset="utf-8"><title>R3 hand circle - RECOUNT</title>
<script src="../../kit/otm.js"></script><script src="rc.js"></script><script src="people.js"></script><script src="cast.js"></script>
<script>
(async () => {
  await RC.fonts();
  const ctx = OTM.stage(); const { P, W, H, rgba, mix, lin, rad, pool, paper, rim, cast, blob, smooth, polyPath, smoothPath, clamp, lerp } = RC;
  const { sweep, blobPath, form, hand, clasp, folds } = CAST;
  // the night is drawn on its own layer so the handheld roll never touches the record
  const night = RC.cv(), g = night.getContext('2d');
  const LAMP = [1000, 118], LIGHT = { x: 1000, y: 70 };
  const TC = [1000, 822], TRX = 690, TRY = 186;            // the borrowed round table, in perspective
  const CARD = '#F3E2C4', BOUNCE = '#F7B46A';
  const NIGHT = '#140E0A';
  const tableY = (x, near) => TC[1] + (near ? 1 : -1) * TRY * Math.sqrt(Math.max(0, 1 - Math.pow((x - TC[0]) / TRX, 2)));

  // ================= ROOM: everything outside the cone is umber-night =================
  g.fillStyle = NIGHT; g.fillRect(0, 0, W, H);
  // the faintest bounce from the lit table onto the wall behind Scott (separates his head), nothing else
  pool(g, 1000, 470, 520, '#3A2416', 0.55, { sy: 0.62, mid: 0.4, midA: 0.35 });
  RC.texture(g, 0.45, 'overlay');
  // the kitchen doorway (far right): blacker than the wall, the oven clock blinking 00:00 deep inside
  (() => { g.fillStyle = '#060404'; g.fillRect(1772, 150, 160, 520);
    paper(g, polyPath([[1760, 140], [1780, 140], [1780, 670], [1760, 670]]), '#1A120D', { rim: { dx: -1, dy: 0, w: 1.2, color: '#6A4428', alpha: 0.35 } });
    g.save(); g.font = RC.font(500, 15, 'IBM Plex Mono'); g.letterSpacing = '2px'; g.fillStyle = P.led; g.shadowColor = P.led; g.shadowBlur = 12; g.fillText('00:00', 1800, 452); g.restore();
    pool(g, 1822, 446, 46, P.led, 0.16); })();

  // light amount helpers (one source: the pendant)
  const KEY = (x, y, k) => ({ dx: (LIGHT.x - x) * 0.0016, dy: -1, color: P.tungsten, k });
  const lampRim = (x, y, a, w) => ({ dx: (LIGHT.x - x) / 520, dy: -1, w: w || 2.2, color: P.tcore, alpha: a, blur: 0.6 });
  const clothCol = (c, k) => ({ base: mix(c, P.umber, 0.66), lit: mix(mix(c, P.tungsten, 0.22), '#FFFFFF', 0.04 * k), k });
  function torso(pts, c, k, o) {
    o = o || {}; const p = blobPath(pts, 6), cc = clothCol(c, k), bb = pts.reduce((a, q) => [Math.min(a[0], q[0]), Math.min(a[1], q[1]), Math.max(a[2], q[0]), Math.max(a[3], q[1])], [1e9, 1e9, -1e9, -1e9]);
    form(g, p, { light: LIGHT, cx: (bb[0] + bb[2]) / 2, cy: bb[1], base: cc.base, lit: mix(cc.base, cc.lit, k), band: o.band || 34, soft: o.soft || 26, rimC: P.tcore, rimW: 2, rimA: 0.75 * k,
      shadow: o.shadow || { dx: 0, dy: 10, blur: 24, alpha: 0.6 }, ao: 0.3,
      shade: (h) => { h.fillStyle = lin(h, 0, bb[1], 0, bb[3], [[0, '#000000', 0], [1, '#000000', 0.45]]); h.fillRect(bb[0] - 10, bb[1] - 10, bb[2] - bb[0] + 20, bb[3] - bb[1] + 20); if (o.extra) o.extra(h); } });
    return p;
  }
  // an arm: sleeve (cloth) from the shoulder over the elbow, bare forearm or full sleeve to the wrist
  function arm(o) {
    const k = o.k, cc = clothCol(o.cloth, k), skinBase = mix(o.skin, P.umber, 0.64), skinLit = mix(skinBase, mix(mix(o.skin, P.tungsten, 0.25), '#FFFFFF', 0.05), k);
    const sh = o.sh, el = o.el, wr = o.wr; const cuffT = o.cuffT == null ? 0.42 : o.cuffT;
    const cuff = [lerp(el[0], wr[0], cuffT), lerp(el[1], wr[1], cuffT)];
    const R = o.r || [36, 28, 22, 17];
    // forearm (skin)
    if (o.bare !== false) { const fa = sweep([[el[0], el[1], R[2] * 0.95], [lerp(el[0], wr[0], 0.45), lerp(el[1], wr[1], 0.45), R[2] * 0.88], [wr[0], wr[1], R[3]]]);
      form(g, fa.path, { light: LIGHT, cx: el[0], cy: el[1], base: skinBase, lit: skinLit, band: R[2] * 0.9, soft: R[2] * 0.7, rimC: mix(skinLit, '#FFF0D8', 0.4), rimW: 1.6, rimA: 0.7 * k + 0.1, ao: 0.35,
        bounce: o.under ? { color: o.under, a: 0.25, w: R[2] * 0.5 } : null, shadow: { dx: 0, dy: 6, blur: 10, alpha: 0.5 },
        shade: (h) => { if (o.forearmShade) o.forearmShade(h); h.save(); h.globalCompositeOperation = 'screen'; h.strokeStyle = rgba(skinLit, 0.12 * k); h.lineWidth = R[2] * 0.25; h.filter = 'blur(3px)'; h.beginPath(); h.moveTo(lerp(el[0], wr[0], 0.15), lerp(el[1], wr[1], 0.15) - R[2] * 0.3); h.lineTo(lerp(el[0], wr[0], 0.8), lerp(el[1], wr[1], 0.8) - R[3] * 0.3); h.stroke(); h.restore(); } }); }
    // sleeve
    const end = o.bare === false ? [wr[0], wr[1]] : cuff;
    const sp = [[sh[0], sh[1], R[0]], [lerp(sh[0], el[0], 0.55), lerp(sh[1], el[1], 0.55), R[1] * 1.05], [el[0], el[1], R[1] * 1.02], [end[0], end[1], o.bare === false ? R[3] * 1.25 : R[2] * 1.18]];
    const sw = sweep(sp, { capEnd: false });
    form(g, sw.path, { light: LIGHT, cx: sh[0], cy: sh[1], base: cc.base, lit: mix(cc.base, cc.lit, k), band: R[1] * 0.85, soft: R[1] * 0.6, rimC: P.tcore, rimW: 2, rimA: 0.7 * k + 0.05, ao: 0.35,
      shadow: { dx: 0, dy: 8, blur: 14, alpha: 0.55 }, bounce: o.under ? { color: o.under, a: 0.18, w: R[1] * 0.5 } : null,
      shade: (h) => { folds(h, sw, { n: o.nFolds || 5, a: 0.24, seed: o.seed || 'arm', color: '#000000', lit: cc.lit, litA: 0.1 * k });
        if (o.rib) { h.save(); h.strokeStyle = 'rgba(0,0,0,0.2)'; h.lineWidth = 1.1; for (let j = -6; j <= 6; j++) { h.beginPath(); sw.mid.forEach((p, i) => { const q = sw.mid[Math.min(sw.mid.length - 1, i + 1)], pp = sw.mid[Math.max(0, i - 1)], an = Math.atan2(q[1] - pp[1], q[0] - pp[0]); const x = p[0] - Math.sin(an) * p[2] * j / 6.5, y = p[1] + Math.cos(an) * p[2] * j / 6.5; i ? h.lineTo(x, y) : h.moveTo(x, y); }); h.stroke(); } h.restore(); }
        if (o.sleeveShade) o.sleeveShade(h); } });
    // rolled / knitted / denim cuff band
    if (o.cuffBand !== false) { const a = Math.atan2(wr[1] - el[1], wr[0] - el[0]), r = o.bare === false ? R[3] * 1.3 : R[2] * 1.22, L = o.cuffL || 13;
      const cb = sweep([[end[0] - Math.cos(a) * L, end[1] - Math.sin(a) * L, r], [end[0], end[1], r * 1.02]], { capStart: false, capEnd: false });
      form(g, cb.path, { light: LIGHT, cx: end[0], cy: end[1], base: mix(cc.base, '#000000', 0.1), lit: mix(cc.base, cc.lit, k * 1.05), band: r * 0.7, soft: r * 0.4, rimC: P.tcore, rimW: 1.4, rimA: 0.6 * k, ao: 0.55 }); }
    return sw;
  }
  // soft shadow on the tabletop beneath something hovering above it (top light -> straight down)
  function tableShadow(path, dy, a, blur) { const clip = new Path2D(); clip.ellipse(TC[0], TC[1], TRX, TRY, 0, 0, Math.PI * 2); cast(g, path, [1, 0, 0, 0.55, 0, 0], { alpha: 0, blur: 0 });
    const t = RC.tmp(2); t.translate(0, dy); t.fillStyle = '#000'; t.fill(path); g.save(); g.clip(clip); g.globalCompositeOperation = 'multiply'; g.globalAlpha = a; g.filter = `blur(${blur}px)`; g.drawImage(t.canvas, 0, 0); g.restore(); }

  // ================= FAR SIDE: ANGELO (rim of the cone) · THE GAP · SCOTT · MARINA =================
  // chair backs: Angelo's and Marina's; the gap has none
  [[300, 585, 120, 0.25], [1650, 575, 110, 0.45]].forEach(([x, y, w, k]) => {
    const cb = smoothPath([[x - w, y + 30], [x - w + 6, y - 8], [x - w * 0.4, y - 24], [x + w * 0.4, y - 24], [x + w - 6, y - 8], [x + w, y + 30], [x + w - 12, y + 30], [x + w - 18, y + 4], [x - w + 18, y + 4], [x - w + 12, y + 30]], 4);
    paper(g, cb, mix(P.walnut, P.umber, 0.55), { shadow: { dx: 0, dy: 8, blur: 14, alpha: 0.6 }, rim: { dx: 0, dy: -1, w: 1.5, color: P.tcore, alpha: 0.5 * k } }); });

  // --- Angelo body: denim jacket over a white tee, the broadest; 3/4 to screen-right, mostly in the dark
  const AN = { x: 262, y: 468, s: 166, k: 0.22 };
  torso([[292, 540], [342, 556], [384, 586], [404, 650], [408, 740], [392, 820], [170, 830], [140, 740], [150, 660], [178, 610], [222, 572]], P.denim, AN.k, {
    extra: (h) => { // white tee V, lapel seams, the chrome lighter glint in the chest pocket (before we know what it is)
      h.fillStyle = mix(P.tee, P.umber, 0.55); h.beginPath(); h.moveTo(268, 548); h.lineTo(330, 556); h.lineTo(318, 640); h.lineTo(282, 646); h.closePath(); h.fill();
      h.fillStyle = rad(h, 300, 560, 0, 90, [[0, P.tcore, 0.25], [1, P.tcore, 0]]); h.fillRect(200, 470, 200, 200);
      h.strokeStyle = 'rgba(160,180,215,0.16)'; h.lineWidth = 2; h.beginPath(); h.moveTo(262, 550); h.lineTo(250, 760); h.moveTo(336, 560); h.lineTo(330, 760); h.stroke();
      h.strokeStyle = 'rgba(0,0,0,0.35)'; h.lineWidth = 1.5; h.strokeRect(196, 640, 46, 40);
      h.save(); h.fillStyle = '#E8ECF0'; h.shadowColor = '#FFFFFF'; h.shadowBlur = 7; h.fillRect(214, 628, 4, 13); h.restore(); } });
  // neck
  form(g, sweep([[266, 530, 31], [278, 566, 35]]).path, { light: LIGHT, cx: 270, cy: 520, base: mix(P.skin.angelo, P.umber, 0.75), lit: mix(P.skin.angelo, P.umber, 0.5), band: 12, soft: 10 });

  // --- Scott body: pale blue-grey oxford, sleeves rolled once, arms out to both sides
  const SC = { x: 1000, y: 372, s: 150, k: 0.95 };
  torso([[970, 458], [930, 470], [892, 486], [872, 520], [868, 580], [872, 650], [1128, 650], [1132, 580], [1128, 520], [1108, 486], [1070, 470], [1030, 458]], P.oxford, SC.k, { band: 40, soft: 30,
    extra: (h) => {
      // the head's own shadow on the chest (top light), the open collar, placket + buttons, tension folds toward the raised arms
      h.save(); h.globalCompositeOperation = 'multiply'; h.fillStyle = rad(h, 1000, 478, 0, 95, [[0, '#0A0605', 0.75], [0.6, '#0A0605', 0.3], [1, '#0A0605', 0]]); h.translate(0, 0); h.fillRect(880, 420, 240, 160); h.restore();
      const cl = mix(mix(P.oxford, P.tungsten, 0.2), '#FFFFFF', 0.05);
      [[-1], [1]].forEach(([sd]) => { const p = polyPath([[1000 + sd * 22, 460], [1000 + sd * 54, 468], [1000 + sd * 42, 512], [1000 + sd * 9, 490]]); h.fillStyle = mix(cl, P.umber, 0.35); h.fill(p); h.strokeStyle = rgba(P.tcore, 0.35); h.lineWidth = 1.2; h.beginPath(); h.moveTo(1000 + sd * 22, 460); h.lineTo(1000 + sd * 54, 468); h.stroke(); });
      h.fillStyle = mix(P.skin.scott, P.umber, 0.72); h.beginPath(); h.moveTo(986, 462); h.lineTo(1014, 462); h.lineTo(1004, 504); h.lineTo(996, 504); h.closePath(); h.fill();
      h.strokeStyle = 'rgba(0,0,0,0.3)'; h.lineWidth = 1.6; h.beginPath(); h.moveTo(1003, 520); h.lineTo(1006, 650); h.stroke();
      [548, 600].forEach(y => { h.fillStyle = rgba('#F2EEE6', 0.55); h.beginPath(); h.arc(1009, y, 2.6, 0, 7); h.fill(); });
      folds(h, { mid: [[900, 560, 50], [1000, 600, 60], [1100, 560, 50]] }, { n: 6, a: 0.28, seed: 'scottshirt', color: '#000000', lit: cl, litA: 0.1 });
      h.save(); h.globalCompositeOperation = 'screen'; h.fillStyle = rad(h, 1000, 700, 0, 200, [[0, BOUNCE, 0.22], [1, BOUNCE, 0]]); h.fillRect(820, 500, 360, 200); h.restore(); } });
  form(g, sweep([[1000, 430, 31], [1000, 466, 34]]).path, { light: LIGHT, cx: 1000, cy: 430, base: mix(P.skin.scott, P.umber, 0.82), lit: mix(P.skin.scott, P.umber, 0.6), band: 8, soft: 8,
    shade: (h) => { h.save(); h.globalCompositeOperation = 'screen'; h.fillStyle = rad(h, 1000, 500, 0, 40, [[0, BOUNCE, 0.2], [1, BOUNCE, 0]]); h.fillRect(940, 430, 120, 90); h.restore(); } });

  // --- Marina body: burgundy fine-knit turtleneck; 3/4 to screen-left
  const MA = { x: 1612, y: 428, s: 154, k: 0.62 };
  torso([[1588, 530], [1556, 556], [1538, 600], [1538, 680], [1552, 770], [1704, 796], [1726, 712], [1726, 636], [1706, 600], [1668, 562], [1638, 536]], P.burgundy, MA.k, {
    extra: (h) => { h.strokeStyle = 'rgba(0,0,0,0.16)'; h.lineWidth = 1.1; for (let i = 0; i < 24; i++) { h.beginPath(); h.moveTo(1520 + i * 10, 540); h.quadraticCurveTo(1524 + i * 10, 680, 1518 + i * 10.5, 800); h.stroke(); } } });
  // turtleneck roll
  form(g, blobPath([[1576, 500], [1634, 497], [1644, 544], [1604, 556], [1570, 544]], 5), { light: LIGHT, cx: 1600, cy: 492, base: mix(P.burgundy, P.umber, 0.6), lit: mix(mix(P.burgundy, P.tungsten, 0.25), '#FFFFFF', 0.03), band: 14, soft: 10, rimC: P.tcore, rimA: 0.5, rimW: 1.5,
    shade: (h) => { h.strokeStyle = 'rgba(0,0,0,0.3)'; h.lineWidth = 1.4; for (let k = 0; k < 4; k++) { h.beginPath(); h.moveTo(1572, 510 + k * 10); h.quadraticCurveTo(1606, 516 + k * 10, 1642, 508 + k * 10); h.stroke(); } } });

  // ================= HEADS (one key: the pendant, straight down; card bounce from below) =================
  // Angelo: slicked back, the unlit cigarette behind his right ear; at the rim of the cone
  PPL.head(g, { x: AN.x, y: AN.y, s: AN.s, t: 0.44, facing: 1, tilt: -0.02, jaw: 1.12, skin: P.skin.angelo, hair: 'angelo', hairColor: P.hair.angelo, key: KEY(AN.x, AN.y, 0.42), termK: 0.75, ambientDark: 0.86,
    top: 0.9, under: { color: BOUNCE, k: 0.25 }, rims: [lampRim(AN.x, AN.y, 0.7, 2.4)], gaze: [0.8, 0.35], brow: { knit: 0.85, raise: 0.1 }, lid: 0.72, glint: '#FFE6C0', glintA: 0.8, hairSheenAt: [AN.x + 30, AN.y - 84], modelK: 0.8,
    hairStrands: (h, xf) => { h.save(); h.globalCompositeOperation = 'screen'; for (let i = 0; i < 10; i++) { const [a, b] = xf(-0.3 + i * 0.02, -0.5 + i * 0.012), [c, d] = xf(0.0 + i * 0.04, -0.62 + i * 0.03), [e, f] = xf(0.42, -0.36 + i * 0.05); h.strokeStyle = 'rgba(170,185,210,0.07)'; h.lineWidth = 1.3; h.beginPath(); h.moveTo(a, b); h.quadraticCurveTo(c, d, e, f); h.stroke(); } h.restore(); },
    after: (h, geo) => { const xf = geo.xf; const [ax, ay] = xf(0.33, -0.045), [cx, cy] = xf(0.15, -0.075); h.save(); h.lineCap = 'butt'; h.shadowColor = 'rgba(0,0,0,0.55)'; h.shadowBlur = 4; h.shadowOffsetY = 2;
      h.strokeStyle = '#EDE8DE'; h.lineWidth = 4.6; h.beginPath(); h.moveTo(ax, ay); h.lineTo(cx, cy); h.stroke(); h.shadowColor = 'transparent'; h.strokeStyle = '#C8823A'; h.beginPath(); h.moveTo(ax, ay); h.lineTo(ax + (cx - ax) * 0.3, ay + (cy - ay) * 0.3); h.stroke();
      h.strokeStyle = rgba(P.tcore, 0.8); h.lineWidth = 1.2; h.beginPath(); h.moveTo(ax, ay - 2.4); h.lineTo(cx, cy - 2.4); h.stroke(); h.restore(); } });
  // Scott: front, top-lit, dark sockets, looking to his left (Marina) - he doesn't react to the voice
  PPL.head(g, { x: SC.x, y: SC.y, s: SC.s, t: 0.06, facing: 1, tilt: 0.025, jaw: 1.1, skin: P.skin.scott, hair: 'scott', hairColor: P.hair.scott, key: KEY(SC.x, SC.y, 0.95), termK: 1.15, ambientDark: 0.72,
    top: 0.88, under: { color: BOUNCE, k: 0.85 }, rims: [lampRim(SC.x, SC.y, 0.85, 2.6)], gaze: [-0.9, 0.55], brow: { knit: 0.7, raise: 0.2 }, lid: 0.6, glint: '#FFE6C0', hairSheenAt: [SC.x + 4, SC.y - 72], glintDx: -0.1 });
  // Marina: sleek hair, low chignon pinned with a pen
  PPL.head(g, { x: MA.x, y: MA.y, s: MA.s, t: 0.55, facing: -1, tilt: 0.05, skin: P.skin.marina, hair: 'marina', hairColor: P.hair.marina, key: KEY(MA.x, MA.y, 0.75), termK: 0.95, ambientDark: 0.74,
    top: 0.82, under: { color: BOUNCE, k: 0.5 }, jaw: 0.86, rims: [lampRim(MA.x, MA.y, 0.7)], gaze: [-0.4, 0.75], brow: { knit: 0.35, raise: 0.45 }, lid: 0.66, glint: '#FFE6C0', hairSheenAt: [MA.x - 24, MA.y - 70],
    backHair: (h, geo) => { const xf = geo.xf; const [bx, by] = xf(0.47, 0.16); const bun = new Path2D(); bun.ellipse(bx, by, MA.s * 0.16, MA.s * 0.14, 0.3, 0, Math.PI * 2);
      paper(h, bun, P.hair.marina, { shadow: { dx: 4, dy: 6, blur: 8, alpha: 0.6 }, shade: (k) => { k.strokeStyle = 'rgba(160,120,100,0.3)'; k.lineWidth = 1.5; for (let i = 0; i < 3; i++) { k.beginPath(); k.ellipse(bx, by, MA.s * (0.05 + i * 0.04), MA.s * (0.04 + i * 0.035), 0.5, 3.6, 6.6); k.stroke(); } k.fillStyle = rad(k, bx - 6, by - 10, 0, MA.s * 0.15, [[0, '#8A6A5A', 0.4], [1, '#8A6A5A', 0]]); k.fillRect(bx - 40, by - 40, 80, 80); }, rim: lampRim(bx, by, 0.6) }); },
    after: (h, geo) => { const xf = geo.xf; const [ax, ay] = xf(0.3, 0.02), [cx, cy] = xf(0.66, 0.36); h.save(); h.lineCap = 'round'; h.shadowColor = 'rgba(0,0,0,0.6)'; h.shadowBlur = 5; h.shadowOffsetY = 3;
      h.strokeStyle = '#1E2A48'; h.lineWidth = 6; h.beginPath(); h.moveTo(ax, ay); h.lineTo(cx, cy); h.stroke(); h.shadowColor = 'transparent'; h.strokeStyle = '#D8DDE2'; h.lineWidth = 6.5; h.beginPath(); h.moveTo(ax, ay); h.lineTo(ax + (cx - ax) * 0.16, ay + (cy - ay) * 0.16); h.stroke();
      h.strokeStyle = 'rgba(220,230,240,0.7)'; h.lineWidth = 1.3; h.beginPath(); h.moveTo(ax + 1, ay - 2); h.lineTo(cx + 1, cy - 2); h.stroke(); h.restore(); } });

  // ================= THE TABLE =================
  const tableTop = new Path2D(); tableTop.ellipse(TC[0], TC[1], TRX, TRY, 0, 0, Math.PI * 2);
  const tableEdge = new Path2D(); tableEdge.ellipse(TC[0], TC[1] + 30, TRX, TRY, 0, 0, Math.PI); tableEdge.lineTo(TC[0] - TRX, TC[1]); tableEdge.ellipse(TC[0], TC[1], TRX, TRY, 0, Math.PI, 0, true); tableEdge.closePath();
  paper(g, tableEdge, '#1C120C', { shade: (h) => { h.fillStyle = lin(h, TC[0] - TRX, 0, TC[0] + TRX, 0, [[0, '#000000', 0.6], [0.5, P.tungsten, 0.1], [1, '#000000', 0.6]]); h.fillRect(0, 0, W, H); } });

    const r = OTM.rng('tgrain'); h.strokeStyle = 'rgba(0,0,0,0.14)'; h.lineWidth = 1.3; for (let i = 0; i < 44; i++) { const y = TC[1] - TRY + i * 8.6; h.beginPath(); h.moveTo(TC[0] - TRX, y); h.bezierCurveTo(TC[0] - 220, y + (r() - 0.5) * 8, TC[0] + 220, y + (r() - 0.5) * 8, TC[0] + TRX, y + (r() - 0.5) * 4); h.stroke(); }
    // the pendant's hot spot and its fall-off across the walnut (the only light in the room)
    h.save(); h.globalCompositeOperation = 'screen'; h.translate(TC[0], TC[1] - 18); h.scale(1, TRY / TRX * 1.05);
    h.fillStyle = rad(h, 0, 0, 0, TRX * 0.95, [[0, '#FFE2B0', 0.75], [0.22, P.tungsten, 0.5], [0.5, '#A0602A', 0.22], [0.8, '#5A3418', 0.06], [1, '#000000', 0]]); h.fillRect(-TRX, -TRX, TRX * 2, TRX * 2); h.restore();
    h.strokeStyle = rgba(P.tcore, 0.3); h.lineWidth = 1.6; h.beginPath(); h.ellipse(TC[0], TC[1], TRX - 3, TRY - 2, 0, Math.PI * 1.12, Math.PI * 1.88); h.stroke();
  } });
  // the gap: a seat-width of nothing at Scott's right, held warm at 4%
  pool(g, 622, 470, 210, P.tcore, 0.04);
