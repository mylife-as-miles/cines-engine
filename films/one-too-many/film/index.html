<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Too Many</title>
<style>
  /* Film player: one screen, one strip of controls beneath it. Dark by design. */
  :root { --ink: #0D0A09; --soot: #1E1714; --paper: #EFE5D0; --mute: #9A8F80; --amber: #F2A93B; --ember: #FF9440; color-scheme: dark;
          --display: "Six Caps", "Oswald", "Arial Narrow", sans-serif; --ui: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; }
  html, body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--ui); }
  #film { max-width: min(1600px, calc((100vh - 140px) * 16 / 9)); margin: 0 auto; padding-block: 18px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 5vw, 56px); letter-spacing: 4px; margin: 0; line-height: 1; }
  header p { margin: 0; color: var(--mute); letter-spacing: 2px; font-size: 16px; text-transform: uppercase; }
  .screen { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; max-width: 100%; }
  .screen canvas { width: 100%; height: 100%; display: block; }
  .screen:fullscreen { display: grid; place-items: center; background: #000; }
  .screen:fullscreen canvas { width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9; }
  #note { position: absolute; left: 16px; bottom: 14px; font-size: 15px; letter-spacing: 2px; color: var(--mute); text-transform: uppercase; }
  .controls { display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 14px; margin-top: 12px; }
  button { font: inherit; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: var(--paper); background: var(--soot); border: 1px solid #3a2c24; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--amber); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  #play { background: var(--amber); color: var(--ink); border-color: var(--amber); min-width: 88px; font-weight: 600; }
  #time { font-variant-numeric: tabular-nums; letter-spacing: 1px; color: var(--mute); min-width: 92px; }
  #bar { position: relative; height: 26px; cursor: pointer; min-width: 0; }
  #ticks { position: absolute; inset: 9px 0; display: block; }
  .tick { position: absolute; top: 0; height: 8px; padding: 0; border: 0; border-right: 2px solid var(--ink); background: #33261e; }
  .tick:hover { background: #4b3626; }
  #fill { position: absolute; left: 0; top: 9px; height: 8px; background: var(--amber); pointer-events: none; mix-blend-mode: screen; opacity: .85; }
  #head { position: absolute; top: 3px; width: 2px; height: 20px; background: var(--paper); pointer-events: none; transform: translateX(-1px); }
  #scene { color: var(--mute); letter-spacing: 1.5px; text-transform: uppercase; font-size: 15px; margin-top: 8px; min-height: 18px; }
  .keys { color: #6d6257; font-size: 14px; letter-spacing: 1px; margin-top: 10px; }
  @media (max-width: 640px) { .controls { grid-template-columns: auto 1fr auto; } #time { grid-column: 1 / -1; order: 5; } #full { display: none; } }
</style>
</head>
<body>
<main id="film">
  <header><h1>One Too Many</h1><p>A film by Osita Miles</p></header>
  <div class="screen"><div id="note" hidden></div></div>
  <div class="controls">
    <button id="play" type="button" aria-label="Play">Play</button>
    <span id="time">0:00 / 0:00</span>
    <div id="bar" role="slider" aria-label="Timeline" tabindex="0"><div id="ticks"></div><div id="fill"></div><div id="head"></div></div>
    <button id="sound" type="button" aria-pressed="true">Sound on</button>
    <button id="full" type="button">Full screen</button>
  </div>
  <div id="scene"></div>
  <div class="keys">Space play / pause · ← → five seconds · [ ] previous / next scene · best with headphones</div>
</main>
<script src="load.js"></script>
<script>
  FILM_LOAD('../').then(() => FILM.player({ poster: 51.3, audio: '../player/one_too_many.mp3' }));
</script>
</body>
</html>
