  const q = new URLSearchParams(location.search);
  FILM.opts.subs = q.get('subs') === '1'; FILM.opts.sceneOnly = +(q.get('scene') || 0);
  FILM.loadFonts('../fonts/fonts.css').then(() => { FILM.mountHeadless(); window.FILM_READY = true; }).catch(e => { window.FILM_ERROR = String(e); });
