<!doctype html>
<html><head><meta charset="utf-8"><title>Blocking board</title>
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
// A plain blocking set for My Name Is Oren: Laundrette Street, two figures on their marks, cameras from the shot list.
// World: metres, y up. The shopfront wall runs along x at z = 0, facing +z; pavement z 0–4; kerb; road z 4.15–12; far terrace z = 15.
// Helena stands at (0, 0, 1.2) facing +z (her back to the window); Oren at (0, 0, 2.2) facing -z (his back to the road).
import * as THREE from 'three';

const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = 0xc9ced3;
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 18, 85);
scene.add(new THREE.HemisphereLight(0xe4e8ee, 0x5c5c5c, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);           // overcast: soft, high, weak shadows
sun.position.set(6, 20, 14); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 8;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
scene.add(sun);

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, ...o });
const box = (w, h, d, m, x, y, z, parent = scene) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z);
  b.castShadow = b.receiveShadow = true; parent.add(b); return b;
};
const cyl = (r, h, m, x, y, z, parent = scene) => {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 20), m); c.position.set(x, y, z);
  c.castShadow = true; parent.add(c); return c;
};

// ---- ground
box(200, 0.1, 4, mat(0x8e9092), 0, -0.05, 2);                         // near pavement (damp flags)
box(200, 0.14, 0.15, mat(0xa5a7a9), 0, 0.02, 4.07);                   // kerb
box(200, 0.1, 7.9, mat(0x34373b, { roughness: 0.28, metalness: 0.1 }), 0, -0.1, 8.1);   // wet road
box(200, 0.1, 3, mat(0x8e9092), 0, -0.05, 13.5);                      // far pavement
const lane = mat(0xd9d9d9);
for (let x = -100; x < 100; x += 6) box(3, 0.01, 0.12, lane, x, -0.04, 8.1);

// ---- near terrace (z = 0 plane): brick, painted shopfronts, the laundrette
const brick = mat(0x8a4c3e), paint = mat(0x3f4a4a), glassDark = mat(0x2a3033, { roughness: 0.2 });
box(200, 9, 0.4, brick, 0, 4.5, -0.2);
box(200, 0.55, 0.12, paint, 0, 2.85, 0.06);                            // fascia band
const warm = new THREE.MeshStandardMaterial({ color: 0xf3dcae, emissive: 0xf0d29a, emissiveIntensity: 0.9 });
box(4.0, 2.0, 0.05, warm, 0, 1.45, 0.03);                              // laundrette window (lit)
box(0.9, 2.2, 0.05, warm, 2.6, 1.1, 0.03);                             // its glazed door
for (const x of [-2.1, 2.1, 3.15]) box(0.18, 2.6, 0.14, paint, x, 1.3, 0.07);   // pilasters
box(4.4, 0.45, 0.1, mat(0xc9cccf), 0, 0.22, 0.05);                     // tiled stallriser
const win = new THREE.PointLight(0xf3d6a0, 2.2, 6); win.position.set(0, 1.5, 0.6); scene.add(win);
box(1.5, 0.48, 0.35, mat(0x8a4c3e), 4.45, 0.24, 0.25);                 // the low wall: knee-high step, where she sits
box(1.55, 0.06, 0.4, mat(0xb7ae9c), 4.45, 0.51, 0.25);
box(1.5, 1.0, 0.35, mat(0x8a4c3e), 5.95, 0.5, 0.25);                   // then waist-high, as in Q02
box(1.55, 0.06, 0.4, mat(0xb7ae9c), 5.95, 1.03, 0.25);
for (let x = -60; x <= 60; x += 6.5) {                                 // the rest of the terrace
  if (Math.abs(x) < 7) continue;
  box(4.2, 2.0, 0.05, (Math.abs(x) % 13 < 3) ? mat(0xd9cdb5, { emissive: 0x8a7a5a, emissiveIntensity: 0.25 }) : glassDark, x, 1.45, 0.03);
  box(0.18, 2.6, 0.14, paint, x - 2.2, 1.3, 0.07);
}
for (let x = -60; x <= 60; x += 3.2) for (const y of [4.3, 6.9]) box(1.1, 1.5, 0.05, mat(0xdfe3e6, { roughness: 0.3 }), x, y, 0.02);

// ---- far terrace (z = 15), facing -z
box(200, 8, 0.4, mat(0x93594a), 0, 4, 15.2);
for (let x = -60; x <= 60; x += 5.5) { box(3.6, 2.0, 0.05, glassDark, x, 1.5, 14.98); box(1.1, 1.4, 0.05, mat(0xdfe3e6), x, 4.6, 14.98); }

// ---- street furniture
const iron = mat(0x2b2d30);
for (const x of [-14, 3.4, 20]) { cyl(0.06, 6, iron, x, 3, 3.8); box(0.5, 0.12, 0.2, iron, x - 0.2, 6, 3.8); }
box(0.4, 0.75, 0.35, mat(0x3a4044), 4.3, 0.75, 3.6); cyl(0.05, 0.4, iron, 4.3, 0.2, 3.6);

// ---- the street's life (as Q01–Q02): yellow sweepers along the gutter, city units in hi-vis, a passer-by
const yellow = mat(0xd9c23a, { roughness: 0.6 }), hivis = mat(0xd8f03a, { emissive: 0x4a5a00, emissiveIntensity: 0.25 });
for (const [x, z] of [[-7, 4.4], [-16, 4.5], [11, 11.6]]) {
  const sw = box(0.75, 0.55, 0.55, yellow, x, 0.35, z); box(0.8, 0.12, 0.6, mat(0x3a3d40), x, 0.08, z);
}
function walker(x, z, top, legs) {                     // a simple far figure, chest-down detail is enough at this size
  box(0.36, 0.55, 0.24, top, x, 1.3, z); box(0.3, 0.85, 0.2, legs, x, 0.45, z);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), mat(0x9a8a7a)); h.position.set(x, 1.72, z); scene.add(h);
}
walker(-11, 0.9, hivis, mat(0x6f7275)); walker(-12.2, 1.1, hivis, mat(0x6f7275));     // two city units at a bin
box(0.4, 0.75, 0.35, mat(0x3a4044), -11.6, 0.75, 0.9);
walker(-24, 13.6, mat(0x7a2f2f), mat(0x2b2b30)); walker(18, 13.8, mat(0x445566), mat(0x2b2b30));   // passers-by, far pavement

// ---- figures: built facing +z (nose at +z); local -x is their RIGHT, +x their LEFT
function capsule(r, len, m, parent, x, y, z) {
  const c = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 16), m); c.position.set(x, y, z);
  c.castShadow = true; parent.add(c); return c;
}
function figure(o) {
  const g = new THREE.Group(), s = o.height / 1.75;
  const skin = mat(o.skin), trou = mat(o.trousers), top = mat(o.top), jack = mat(o.jacket ?? o.top), hair = mat(o.hair), shoe = mat(o.shoes);
  const legs = {}, HIP = 0.9 * s, KNEE = 0.45 * s;
  for (const [side, sx] of [['right', -1], ['left', 1]]) {
    const leg = new THREE.Group(); leg.position.set(0.1 * s * sx, HIP, 0); g.add(leg);       // pivots at the hip
    capsule(0.078 * s, 0.32 * s, trou, leg, 0, -0.22 * s, 0);                                  // thigh
    const knee = new THREE.Group(); knee.position.set(0, -KNEE, 0); leg.add(knee);              // pivots at the knee
    capsule(0.07 * s, 0.32 * s, trou, knee, 0, -0.22 * s, 0);                                  // shin
    box(0.12 * s, 0.09 * s, 0.27 * s, shoe, 0, -(HIP - KNEE) + 0.045 * s, 0.04 * s, knee);
    if (side === 'right' && o.tape) box(0.125 * s, 0.03 * s, 0.035 * s, mat(0x2f6fd6, { roughness: 0.4 }), 0, -(HIP - KNEE) + 0.07 * s, 0.15 * s, knee);
    if (side === 'right' && o.looseSole) box(0.125 * s, 0.012 * s, 0.06 * s, mat(0x0d0b0a), 0, -(HIP - KNEE) + 0.022 * s, 0.155 * s, knee);
    leg.userData.knee = knee; legs[side] = leg;
  }
  g.userData.hipHeight = HIP;
  box(0.36 * s, 0.24 * s, 0.22 * s, trou, 0, 0.97 * s, 0, g);                     // hips
  box(0.38 * s, 0.5 * s, 0.23 * s, top, 0, 1.3 * s, 0, g);                        // torso
  if (o.jacket) box(0.42 * s, o.jacketLen * s, 0.26 * s, jack, 0, (1.55 - o.jacketLen / 2) * s, 0, g);   // the jacket
  cyl(0.05 * s, 0.1 * s, o.collar ? top : skin, 0, 1.6 * s, 0, g);              // neck / collar
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.105 * s, 32, 24), skin);
  head.scale.set(0.92, 1.12, 1); head.position.set(0, 1.72 * s, 0.005); head.castShadow = true; g.add(head);
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.035 * s, 0.006 * s, 0.01 * s), mat(0x6b3d33));
  mouth.position.set(0, 1.66 * s, 0.098 * s); g.add(mouth);
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.018 * s, 0.05 * s, 12), skin);
  nose.rotation.x = Math.PI / 2; nose.position.set(0, 1.7 * s, 0.11 * s); g.add(nose);
  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.012 * s, 12, 10), mat(0x1c1c1c));
    eye.position.set(0.036 * s * sx, 1.74 * s, 0.098 * s); g.add(eye);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.03 * s, 0.006 * s, 0.01 * s), hair);
    brow.position.set(0.036 * s * sx, 1.765 * s, 0.1 * s); g.add(brow);
  }
  // hair: a crown cap plus the back of the head, leaving the face clear
  const crown = new THREE.Mesh(new THREE.SphereGeometry(0.112 * s, 32, 12, 0, Math.PI * 2, 0, Math.PI * 0.27), hair);
  crown.scale.set(0.95, 1.12, 1.03); crown.position.set(0, 1.72 * s, 0.0); g.add(crown);
  const back = new THREE.Mesh(new THREE.SphereGeometry(0.113 * s, 32, 16, Math.PI, Math.PI, 0, Math.PI * 0.6), hair);
  back.scale.set(0.95, 1.12, 1.03); back.position.set(0, 1.72 * s, -0.004 * s); g.add(back);
  if (o.ponytail) capsule(0.035 * s, 0.16 * s, hair, g, 0, 1.63 * s, -0.12 * s).rotation.x = 0.35;
  const hands = {};
  for (const [side, sx] of [['right', -1], ['left', 1]]) {
    const sleeve = o.jacket ? jack : top;
    capsule(0.052 * s, 0.56 * s, sleeve, g, 0.245 * s * sx, 1.17 * s, 0.0);
    const hand = new THREE.Group(); hand.position.set(0.245 * s * sx, 0.84 * s, 0.01); g.add(hand);
    box(0.035 * s, 0.09 * s, 0.075 * s, skin, 0, 0, 0, hand);                    // palm
    for (let i = 0; i < 4; i++) capsule(0.009 * s, 0.055 * s, skin, hand, 0, -0.075 * s, (-0.027 + i * 0.018) * s);
    capsule(0.01 * s, 0.04 * s, skin, hand, -0.01 * s * sx, -0.02 * s, 0.05 * s).rotation.x = 0.6;   // thumb
    if (o.cuff) { const c = cyl(0.056 * s, 0.03 * s, mat(o.cuff), 0, 0.06 * s, 0, hand); c.material.roughness = 1; }
    hands[side] = hand;
  }
  if (o.badge) box(0.07 * s, 0.025 * s, 0.01, mat(0xb9bcbf, { metalness: 0.5, roughness: 0.4 }), 0.1 * s, 1.43 * s, 0.12 * s, g);   // his left chest
  g.userData.hands = hands; g.userData.legs = legs;
  return g;
}

const helena = figure({ height: 1.68, skin: 0x9c6f56, hair: 0x1d1714, top: 0x3b3d42, jacket: 0x7b8263, jacketLen: 0.5,
  trousers: 0x26272b, shoes: 0x2e2620, ponytail: true, cuff: 0x6c7256, looseSole: true });
helena.position.set(0, 0, 1.2); scene.add(helena);

const oren = figure({ height: 1.78, skin: 0xc49c7f, hair: 0x15130f, top: 0x252f4d, trousers: 0x6f7275, shoes: 0x8a8c8f, collar: true, badge: true, tape: true });
oren.position.set(0, 0, 2.2); oren.rotation.y = Math.PI; scene.add(oren);

// the bag hangs from his LEFT hand
const bag = new THREE.Group();
box(0.19, 0.28, 0.11, mat(0xb18a5d, { roughness: 0.95 }), 0, -0.19, 0, bag);
box(0.19, 0.05, 0.08, mat(0xa47f55), 0, -0.03, 0, bag);
const stain = new THREE.Mesh(new THREE.CircleGeometry(0.035, 20), mat(0x7a5126, { roughness: 0.4 }));
stain.position.set(-0.06, -0.29, 0.056); bag.add(stain);
oren.userData.hands.left.add(bag); bag.position.set(0, -0.06, 0);

// ---- passers-by who walk along the pavements (moved by window.setTime)
const walkers = [];
function passer(x0, z, speed, top, legs) {
  const g = new THREE.Group();
  box(0.4, 0.6, 0.26, mat(top), 0, 1.3, 0, g); box(0.32, 0.9, 0.22, mat(legs), 0, 0.47, 0, g);
  const h = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), mat(0x9a7f6a)); h.position.set(0, 1.74, 0); h.castShadow = true; g.add(h);
  g.traverse(m => { if (m.isMesh) m.castShadow = true; });
  g.position.set(x0, 0, z); g.rotation.y = speed > 0 ? Math.PI / 2 : -Math.PI / 2; scene.add(g);
  walkers.push({ g, x0, speed });
}
passer(-9, 0.55, 1.2, 0x5a3a52, 0x2a2a2e);     // near pavement, window side, walking toward the corner
passer(6, 3.35, -1.3, 0x2e3a4a, 0x3a3a3e);     // near pavement, kerb side, walking the other way
passer(-14, 0.7, 1.1, 0x7a5a2a, 0x2a2a2e);
passer(-20, 13.6, 1.3, 0x7a2f2f, 0x2b2b30);    // far pavement
passer(14, 13.9, -1.2, 0x445566, 0x2b2b30);
window.setTime = (t = 0) => { for (const w of walkers) w.g.position.x = w.x0 + w.speed * t; };
window.setTime(4);

// ---- the pavement sweeper that bumps her boot (movable)
const sweeper = new THREE.Group();
box(0.62, 0.42, 0.46, mat(0xd9c23a, { roughness: 0.6 }), 0, 0.3, 0, sweeper);
box(0.66, 0.1, 0.5, mat(0x3a3d40), 0, 0.07, 0, sweeper);
box(0.2, 0.06, 0.02, mat(0x1c1c1c), 0.315, 0.38, 0, sweeper).rotation.y = Math.PI / 2;      // its sensor window, at the front (+x)
const brush = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.03, 20), mat(0x8a7a60)); brush.position.set(0.3, 0.02, 0.2); sweeper.add(brush);
sweeper.visible = false; scene.add(sweeper);
const restR = oren.userData.legs.right.position.clone(), restL = oren.userData.legs.left.position.clone();
const homeH = helena.position.clone(), homeO = oren.position.clone();
window.setState = (st = {}) => {
  const px = st.pairX ?? 0;                                       // move the pair along the pavement
  helena.position.set(homeH.x + px, 0, st.helenaZ ?? homeH.z);
  oren.position.set(homeO.x + px, 0, homeO.z); oren.rotation.y = Math.PI;
  if (st.helenaPos) helena.position.set(st.helenaPos[0], 0, st.helenaPos[1]);
  if (st.orenPos) { oren.position.set(st.orenPos[0], 0, st.orenPos[1]); oren.rotation.y = st.orenPos[2] ?? Math.PI; }
  const sit = st.helenaSit ?? 0, seat = st.seatHeight ?? 0.54;     // 0 standing … 1 seated on the wall
  const hip = helena.userData.hipHeight;
  helena.position.y = -(hip - (seat + 0.06)) * sit;
  for (const leg of Object.values(helena.userData.legs)) { leg.rotation.x = -Math.PI / 2 * sit; leg.userData.knee.rotation.x = Math.PI / 2 * sit; }
  const hl = helena.userData.hands.left;
  if (!hl.userData.home) hl.userData.home = hl.position.clone();
  if (st.helenaLeftHand) { helena.updateMatrixWorld(true); hl.position.copy(helena.worldToLocal(new THREE.Vector3(...st.helenaLeftHand))); }
  else hl.position.copy(hl.userData.home);
  const hr = helena.userData.hands.right;                         // her right hand, placed in world space (e.g. on the wall)
  if (!hr.userData.home) hr.userData.home = hr.position.clone();
  if (st.helenaRightHand) { helena.updateMatrixWorld(true); hr.position.copy(helena.worldToLocal(new THREE.Vector3(...st.helenaRightHand))); }
  else hr.position.copy(hr.userData.home);
  const offL = st.orenLeftFoot || [0, 0];
  oren.userData.legs.left.position.set(restL.x - offL[0], restL.y, restL.z - offL[1]);
  sweeper.visible = !!st.sweeper;
  if (st.sweeper) { sweeper.position.set(st.sweeper[0], 0, st.sweeper[1]); sweeper.rotation.y = st.sweeper[2] || 0; }
  const off = st.orenRightFoot || [0, 0];                        // world offset for his right leg (he faces -z)
  oren.userData.legs.right.position.set(restR.x - off[0], restR.y, restR.z - off[1]);
};

// ---- cameras: hfov from focal length on a Super 35 width (23.76 mm), drawn 16:9
function cameraFor(c) {
  const hfov = 2 * Math.atan(23.76 / 2 / c.f);
  const vfov = 2 * Math.atan(Math.tan(hfov / 2) / (W / H)) * 180 / Math.PI;
  const cam = new THREE.PerspectiveCamera(vfov, W / H, 0.05, 300);
  cam.position.set(...c.pos); cam.lookAt(new THREE.Vector3(...c.target));
  if (c.shift) cam.setViewOffset(W, H, -c.shift[0] * W, c.shift[1] * H, W, H);   // shift: [+right, +up] moves the subject
  return cam;
}
window.renderShot = (c) => {
  renderer.render(scene, cameraFor(c));
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
