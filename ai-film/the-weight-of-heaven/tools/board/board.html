<script type="module">
// A plain blocking set for The Weight of Heaven: the Cathedral of the Ascension (ENV_E01), for Q01.
// Interface as in My Name Is Oren's board.html: window.setState, window.setTime, window.renderShot, window.ready.
// World: metres, y up. The nave runs along z: the congregation from z = +6 to -78, the rite at z -84 to -90, the open
// tower centred on (0, -95). The aisle is x -3…3. Above, light comes from everywhere: no sun and no cast shadows.
import * as THREE from 'three';

const W = 1280, H = 720;
const CLEAN = new URLSearchParams(location.search).has('clean');   // block-out export: principals colour-coded, to be mapped in the prompt
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const MIST = 0xf1efe9;
scene.background = new THREE.Color(MIST);
scene.fog = new THREE.Fog(MIST, 35, 190);
scene.add(new THREE.HemisphereLight(0xffffff, 0xa9a49a, 1.9));        // cloud light from every side
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xfffaf0, 0.9); key.position.set(-30, 60, 40); scene.add(key);   // soft form only, no cast shadows

const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, ...o });
const box = (w, h, d, m, x, y, z, parent = scene) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); parent.add(b); return b;
};
const cyl = (r1, r2, h, m, x, y, z, parent = scene, seg = 20) => {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg), m); c.position.set(x, y, z); parent.add(c); return c;
};

const marble = mat(0xe9e6de), marbleWarm = mat(0xece7dc), marbleShade = mat(0xd9d5cc), bronze = mat(0x3a3128, { roughness: 0.6, metalness: 0.3 });
const iron = mat(0x2a2b2d, { roughness: 0.7, metalness: 0.4 }), gold = mat(0xc8a45a, { roughness: 0.4, metalness: 0.6 });

// ---- floor and aisle
box(40, 0.1, 210, marble, 0, -0.05, -45);
box(6, 0.02, 92, marbleWarm, 0, 0.005, -36);

// ---- columns: "no thicker than a man", two hundred feet into mist; inner rows x = ±8, outer arcade x = ±16
for (let z = 8; z >= -86; z -= 7) for (const x of [-8, 8, -16, 16]) cyl(0.32, 0.36, 70, marble, x, 35, z);
// ---- galleries at y = 14 between the rows, with balustrades on the nave side, and the outer arches beyond
for (const sx of [-1, 1]) {
  box(8.4, 0.6, 96, marbleShade, 12 * sx, 14, -39);
  box(0.25, 1.1, 96, marble, 7.9 * sx, 14.85, -39);
  for (let z = 8; z >= -86; z -= 7) box(1.0, 0.5, 1.0, marble, 16 * sx, 22, z);   // springing of the outer arches
}
// ---- the end wall around the open tower, and the open tower: four piers, an open top, one stone beam
for (const sx of [-1, 1]) box(9, 60, 2, marbleShade, 13 * sx, 30, -86);           // the wall either side of the tower
box(18, 0.4, 18, marble, 0, 0.2, -95);                                              // floor of the tower
const backPiers = [];
for (const [x, z] of [[-8, -87], [8, -87], [-8, -103], [8, -103]]) { const b = box(2.4, 52, 2.4, marble, x, 26, z); if (z < -100) backPiers.push(b); }
box(18.4, 1.6, 1.6, marble, 0, 34, -95);                                            // the beam the bell hangs from
box(18.4, 1.2, 2.4, marble, 0, 51.4, -87); box(18.4, 1.2, 2.4, marble, 0, 51.4, -103); // open top: ring beams only
box(10, 0.3, 4, marble, 0, 0.15, -89);                                              // the low step where the rite is held

// ---- the bell (PROP_P01): about 6 m tall, 5.8 m across the mouth, dark bronze; crown loops, an iron strap
const bellProfile = [[0, 6], [1.15, 6], [1.75, 5.75], [2.0, 5.2], [2.06, 4.3], [2.16, 3.3], [2.4, 2.3], [2.75, 1.2], [2.9, 0.45], [2.88, 0.12], [2.7, 0]]
  .map(([r, y]) => new THREE.Vector2(r, y));
const bell = new THREE.Group();
const bellBody = new THREE.Mesh(new THREE.LatheGeometry(bellProfile, 48), new THREE.MeshStandardMaterial({ color: 0x3a3128, roughness: 0.6, metalness: 0.3, side: THREE.DoubleSide }));
bell.add(bellBody);
for (let i = 0; i < 6; i++) { const t = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.1, 10, 20), bronze); t.position.set(Math.cos(i * Math.PI / 3) * 0.6, 6.25, Math.sin(i * Math.PI / 3) * 0.6); t.rotation.y = -i * Math.PI / 3; bell.add(t); }
box(0.3, 1.6, 0.3, iron, 0, 6.9, 0, bell);                                          // the strap up to the beam
const BELL_TOP = 33.2;                                                               // settled: the crown just under the beam
bell.position.set(0, BELL_TOP - 6.0, -95); scene.add(bell);

// ---- the hammer (PROP_P21): a door-sized iron head on a white arm, pivoting from a bracket on the beam
// Its head is the size of a door: 2.8 m long (half the bell's 6 m), 1.3 m square, iron bands; the arm white timber.
const hammer = new THREE.Group(); hammer.position.set(4.3, 34.2, -95); scene.add(hammer);
box(0.5, 5.0, 0.5, mat(0xd9d0bd), 0, -2.5, 0, hammer);
box(2.8, 1.3, 1.3, iron, 0.0, -5.0, 0, hammer);
for (const bx of [-0.9, 0.9]) box(0.18, 1.36, 1.36, mat(0x1c1c1e), bx, -5.0, 0, hammer);   // iron bands
box(0.08, 1.2, 1.2, mat(0xc9b48a), -1.44, -5.0, 0, hammer);                            // leather striking pad, facing the bell
// the ropes that draw it back: from the head to a block on the right-hand pier
const ropeMat = mat(0xcfc6b2, { roughness: 1 });
// two ropes from the back of the head to the hands of two bell-ringers on a platform beside the tower (set below)
const ropes = [0.35, -0.35].map(hz => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1, 8), ropeMat); scene.add(m); return { m, hz, hand: new THREE.Vector3() }; });
function setRope() {
  hammer.updateMatrixWorld(true);
  for (const r of ropes) {
    const a = new THREE.Vector3(1.3, -4.7, r.hz).applyMatrix4(hammer.matrixWorld), b = r.hand;
    r.m.position.copy(a).lerp(b, 0.5); r.m.scale.set(1, Math.max(0.01, a.distanceTo(b)), 1);
    r.m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  }
}

// ---- the barge (SHIP_V05) high above the open top, and its four chains to the bell's crown
const barge = new THREE.Group(); barge.position.set(0, 74, -95); scene.add(barge);
box(26, 5, 54, mat(0xe9e6de), 0, 0, 0, barge);
const keel = new THREE.Mesh(new THREE.ConeGeometry(14, 6, 4), mat(0xdcd7cc)); keel.rotation.set(Math.PI, Math.PI / 4, 0); keel.scale.set(0.9, 1, 1.9); keel.position.set(0, -5, 0); barge.add(keel);
box(10, 18, 10, mat(0xece8df), 0, 11.5, 0, barge);                                   // the lifting frame like a bell-cote
cyl(0, 2, 10, mat(0xe9e6de), 0, 25.5, 0, barge, 4);                                  // its small spire
const chainMat = mat(0x232426, { roughness: 0.6, metalness: 0.5 });
let chains = [];
let bargeLift = 0;
function buildChains(slack) {
  for (const c of chains) scene.remove(c);
  chains = [];
  const top = bell.position.y + 6.4;
  for (const [x, z] of [[-6, -101], [6, -101], [-6, -89], [6, -89]]) {
    const a = new THREE.Vector3(x, 70 + bargeLift, z), b = new THREE.Vector3(x * 0.12, top, -95 + (z + 95) * 0.12);
    const mid = a.clone().lerp(b, 0.5); mid.x += x * 0.9 * slack; mid.z += (z + 95) * 0.9 * slack; mid.y -= 14 * slack;
    const curve = new THREE.CatmullRomCurve3([a, a.clone().lerp(mid, 0.5).add(new THREE.Vector3(0, -3 * slack, 0)), mid, mid.clone().lerp(b, 0.5), b]);
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.32, 8, false), chainMat); scene.add(m); chains.push(m);
  }
}

// ---- figures: robed mannequins. Built facing +z; rotation.y = PI turns them to face the tower (-z).
function capsule(r, len, m, parent, x, y, z) {
  const c = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 16), m); c.position.set(x, y, z); parent.add(c); return c;
}
function figure(o) {
  const g = new THREE.Group(), s = (o.height ?? 1.75) / 1.75, body = new THREE.Group(); g.add(body);
  const skin = mat(o.skin ?? 0x9a7a62), robe = mat(o.robe ?? 0xe9e6de), hair = mat(o.hair ?? 0x2a2420);
  const robeLen = o.kneel ? 0.95 : 1.45;
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.2 * s, 0.34 * s, robeLen * s, 20), robe);
  r.position.set(0, (o.kneel ? 0.5 : robeLen / 2) * s, 0); body.add(r);                      // the robe or long coat, to the floor
  const torsoY = (o.kneel ? 1.0 : 1.3) * s;
  box(0.38 * s, 0.5 * s, 0.24 * s, robe, 0, torsoY, 0, body);
  const headY = torsoY + 0.42 * s;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.105 * s, 24, 18), skin); head.scale.set(0.92, 1.12, 1); head.position.set(0, headY, 0); body.add(head);
  const capH = new THREE.Mesh(new THREE.SphereGeometry(0.112 * s, 24, 10, 0, Math.PI * 2, 0, Math.PI * 0.3), hair); capH.scale.set(0.95, 1.12, 1.03); capH.position.set(0, headY, 0); body.add(capH);
  if (o.collar) { const t = new THREE.Mesh(new THREE.TorusGeometry(0.08 * s, 0.025 * s, 10, 24), gold); t.rotation.x = Math.PI / 2; t.position.set(0, headY - 0.13 * s, 0); body.add(t); }
  if (o.headdress) cyl(0.09 * s, 0.11 * s, 0.4 * s, robe, 0, headY + 0.28 * s, 0, body);
  if (o.veil) { const v = new THREE.Mesh(new THREE.ConeGeometry(0.3 * s, 1.2 * s, 20, 1, true), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.45, side: THREE.DoubleSide })); v.position.set(0, headY - 0.45 * s, -0.03); body.add(v); }
  const arms = {};
  for (const [side, sx] of [['right', -1], ['left', 1]]) {
    const arm = new THREE.Group(); arm.position.set(0.25 * s * sx, torsoY + 0.22 * s, 0); body.add(arm);   // pivots at the shoulder
    capsule(0.055 * s, 0.5 * s, robe, arm, 0, -0.3 * s, 0);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.05 * s, 12, 10), o.gloves ? robe : skin); hand.position.set(0, -0.62 * s, 0); arm.add(hand);
    arms[side] = arm;
  }
  g.userData = { arms, s };
  return g;
}
const place = (f, x, z, faceTower = true, y = 0) => { f.position.set(x, y, z); f.rotation.y = faceTower ? Math.PI : 0; scene.add(f); return f; };

// the rite: the Hierophant on the step facing the congregation; the bride and groom kneeling, facing him
const hierophant = place(figure({ height: 1.8, skin: 0x8a6a50, robe: 0xeeeae2, headdress: true }), 0, -90.2, false, 0.3);
place(figure({ height: 1.65, skin: 0x7a5640, veil: true, kneel: true, gloves: true }), -0.65, -86.6);
place(figure({ height: 1.8, skin: 0xb08a6a, kneel: true, gloves: true }), 0.65, -86.6);
// the admirals, front left: a rank of four; Serath one step forward of it, centred; Cassiel at her left shoulder
const C = { serath: CLEAN ? 0x2f6fd0 : 0xe9e6de, girl: CLEAN ? 0xf2c230 : 0xe9e6de, aide: CLEAN ? 0x3aa85a : 0xe9e6de, ringer: CLEAN ? 0x9a5fd0 : 0xe9e6de };
for (const [x, z, sk] of [[-7.6, -79.0, 0x8a6a50], [-6.5, -79.0, 0xb89070], [-5.4, -79.0, 0x6e4e3a], [-3.7, -78.2, 0xc49c7f], [-6.15, -80.1, 0x9a7a62]])
  place(figure({ height: 1.8, skin: sk, gloves: true }), x, z);
const serath = place(figure({ height: 1.78, skin: 0x4a3226, hair: 0x2b2b2b, collar: true, gloves: true, robe: C.serath }), -5.4, -80.6);
const girl = place(figure({ height: 1.15, skin: 0x9a7458, hair: 0x1e1814, robe: C.girl }), -4.6, -78.6);
{ const r = new THREE.Mesh(new THREE.TorusGeometry(0.022, 0.009, 8, 16), iron); r.position.set(0, -0.66, 0); r.rotation.x = Math.PI / 2; serath.userData.arms.right.add(r); }   // the seal ring, over the glove
// ---- Q02: the aide; the basket; the warrant (the aide's two gloved hands on its edge, red wax, the pressed mark); the cup
const aide = place(figure({ height: 1.76, skin: 0x8a6a50, gloves: true, robe: C.aide }), -2.2, -78.2, false); aide.rotation.y = -Math.PI / 2;
const basket = new THREE.Group(); scene.add(basket);
cyl(0.13, 0.1, 0.1, mat(CLEAN ? 0xe07a1f : 0xd8c9a2), 0, 0, 0, basket);
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.012, 8, 20, Math.PI), mat(CLEAN ? 0xe07a1f : 0xffffff)); handle.position.y = 0.05; basket.add(handle);
for (let i = 0; i < 10; i++) box(0.04, 0.005, 0.03, mat(0xffffff), (i % 5 - 2) * 0.04, 0.055, (i < 5 ? -1 : 1) * 0.03, basket);
const warrant = new THREE.Group(); scene.add(warrant);
box(0.24, 0.004, 0.36, mat(0xf3efe4), 0, 0, 0, warrant);
const wax = mat(0x9e2a22);
cyl(0.03, 0.03, 0.006, wax, 0, 0.005, 0.13, warrant); cyl(0.03, 0.03, 0.006, wax, 0, -0.005, 0.13, warrant);   // the wax, seen from either face
const sealMark = new THREE.Mesh(new THREE.TorusGeometry(0.016, 0.004, 6, 20), mat(0x5a1410)); sealMark.rotation.x = Math.PI / 2; sealMark.position.set(0, 0.009, 0.13); warrant.add(sealMark);
const aideHands = [0.1, -0.1].map(z => { const h = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), mat(C.aide)); h.position.set(0.15, 0, z); warrant.add(h); return h; });
const cup = new THREE.Group(); cup.position.set(-7.9, 15.42, -60); scene.add(cup);
cyl(0.045, 0.02, 0.07, gold, 0, 0.13, 0, cup); cyl(0.008, 0.008, 0.08, gold, 0, 0.06, 0, cup); cyl(0.035, 0.035, 0.01, gold, 0, 0.005, 0, cup);
cyl(0.043, 0.043, 0.003, mat(0x3a0f12, { roughness: 0.05 }), 0, 0.167, 0, cup);   // the wine's surface
// two bell-ringers on a platform beside the tower: they haul the hammer back on its ropes, and give its size
box(2.8, 0.3, 2.8, marble, 12.2, 29.85, -95); box(0.7, 29.7, 0.7, marble, 13.2, 14.85, -95);
const ringers = [[11.7, -94.6], [12.5, -95.4]].map(([x, z]) => { const f = place(figure({ height: 1.8, skin: 0x8a6a50, gloves: true, robe: C.ringer }), x, z, false, 30.0); f.rotation.y = -Math.PI / 2; return f; });
// dust shaken from the beam when it takes the bell's weight
const DUST = 90, dust = new THREE.InstancedMesh(new THREE.SphereGeometry(0.09, 6, 5), mat(0xbdb7aa), DUST); dust.visible = false; scene.add(dust);

// ---- the congregation: ten thousand in white, instanced, both sides of the aisle, facing the tower
{
  const bodyG = new THREE.CylinderGeometry(0.2, 0.3, 1.5, 10), headG = new THREE.SphereGeometry(0.11, 10, 8);
  const pos = [];
  for (let z = -77; z <= 6; z += 1.1) for (let x = 3.6; x <= 15.4; x += 0.75) for (const sx of [-1, 1]) {
    const xx = x * sx + (Math.sin(z * 12.9 + x * 7.1) * 0.12);
    if (sx < 0 && z < -76 && x > 3.0 && x < 8.5) continue;                      // leave room for the admirals
    if (Math.abs(Math.abs(xx) - 8) < 0.45 || Math.abs(Math.abs(xx) - 16) < 0.45) continue;   // not inside the columns
    pos.push([xx, z]);
  }
  const bodies = new THREE.InstancedMesh(bodyG, mat(0xd6d1c6), pos.length), heads = new THREE.InstancedMesh(headG, mat(0x8a6a52), pos.length);
  const m4 = new THREE.Matrix4(), skins = [0x5a3e2e, 0x8a6a52, 0xb08a6c, 0xc9a68a, 0x6e4e3a, 0xa07a5c].map(c => new THREE.Color(c));
  pos.forEach(([x, z], i) => {
    const h = 0.9 + ((i * 37) % 23) / 100;
    m4.compose(new THREE.Vector3(x, 0.75 * h, z), new THREE.Quaternion(), new THREE.Vector3(1, h, 1)); bodies.setMatrixAt(i, m4);
    m4.compose(new THREE.Vector3(x, 1.62 * h, z), new THREE.Quaternion(), new THREE.Vector3(1, 1, 1)); heads.setMatrixAt(i, m4);
    heads.setColorAt(i, skins[i % skins.length]);
  });
  scene.add(bodies); scene.add(heads);
}

// ---- banners of the seven kingdoms (PROP_P17), hanging from the galleries, drifting sideways as if under water
const banners = [];
for (const sx of [-1, 1]) for (let z = 4, i = 0; z >= -82; z -= 12, i++) {
  const b = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 7.5, 1, 6), new THREE.MeshStandardMaterial({ color: 0xebe4d2, side: THREE.DoubleSide, roughness: 1 }));
  const g = new THREE.Group(); g.position.set(8.1 * sx, 14.5, z); b.position.y = -3.75; g.add(b); scene.add(g); banners.push({ g, phase: i * 0.9 + sx });
}
// ---- warships at anchor in the cloud beyond the arches (SHIP_V02, far and pale)
for (const [x, y, z] of [[-70, 18, -40], [-90, 26, -80], [75, 20, -30], [95, 30, -95], [60, 12, 20]]) {
  const sh = new THREE.Group(); box(30, 5, 6, mat(0xe4e0d6), 0, 0, 0, sh); box(16, 6, 4, mat(0xeae6dd), 0, 5.5, 0, sh); cyl(0, 1.2, 12, mat(0xeae6dd), 0, 14, 0, sh, 4);
  sh.position.set(x, y, z); sh.rotation.y = Math.PI / 2 + (x > 0 ? 0.3 : -0.3); scene.add(sh);
}
// ---- petals: white, falling at about a quarter of normal speed
const PET = 700, petals = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.16, 0.11), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 1 }), PET);
const petalSeed = Array.from({ length: PET }, (_, i) => [((i * 97) % 280) / 10 - 14, ((i * 53) % 400) / 10, -((i * 71) % 960) / 10 + 6, (i % 13) / 13]);
scene.add(petals);

let shudder = 0;
window.setTime = (t = 0) => {
  bell.rotation.z = shudder ? 0.012 * shudder * Math.sin(t * 9) * Math.exp(-((t * 0.7) % 3)) : 0;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  petalSeed.forEach(([x, y, z, p], i) => {
    const yy = ((y - 0.45 * t) % 40 + 40) % 40;                                  // a quarter-speed fall
    e.set(t * 0.6 + p * 6, t * 0.4 + p * 3, 0);
    m4.compose(new THREE.Vector3(x + 0.6 * Math.sin(t * 0.5 + p * 9), yy, z), q.setFromEuler(e), new THREE.Vector3(1, 1, 1)); petals.setMatrixAt(i, m4);
  });
  petals.instanceMatrix.needsUpdate = true;
  for (const b of banners) { b.g.rotation.z = 0.18 * Math.sin(t * 0.35 + b.phase) * Math.sign(b.g.position.x) * -1; b.g.rotation.x = 0.08 * Math.sin(t * 0.27 + b.phase); }
};

// state: bellSlung 1 = held 0.8 m up in the barge's chains, 0 = settled on the beam; chainSlack 0 = taut, 1 = fallen slack;
// hammer: angle in radians (0 rest, +1 drawn back away from the bell, -0.3 striking); hieroArms 0 = down, 1 = raised.
window.setState = (st = {}) => {
  bell.position.y = BELL_TOP - 6.0 + 0.8 * (st.bellSlung ?? 0);
  hammer.rotation.z = st.hammer ?? 0;
  // the ringers lean back as they haul (haul 0..1); their hands hold the ropes; released, the ropes run slack to the head
  const haul = st.haul ?? 0;
  ringers.forEach((f, i) => { f.rotation.set(0, -Math.PI / 2, 0); f.rotateX(-0.28 * haul); for (const a of Object.values(f.userData.arms)) a.rotation.set(-1.25, 0, 0);
    ropes[i].hand.set(f.position.x - 0.55 + 0.25 * haul, 31.25, f.position.z); });
  setRope();
  for (const b of backPiers) b.visible = !st.hidePiers;
  bargeLift = 4 * (st.bargeLift ?? 0); barge.position.y = 74 + bargeLift;
  buildChains(st.chainSlack ?? 0);
  dust.visible = (st.dust ?? 0) > 0.001;
  if (dust.visible) { const m4 = new THREE.Matrix4(), d = st.dust;
    for (let i = 0; i < DUST; i++) { const x = ((i * 53) % 170) / 10 - 8.5, z = -95 + (((i * 31) % 16) - 8) / 10, lag = ((i * 17) % 10) / 25;
      m4.makeTranslation(x, 33.1 - 9 * Math.max(0, d - lag) * (0.6 + ((i * 7) % 5) / 10), z); dust.setMatrixAt(i, m4); }
    dust.instanceMatrix.needsUpdate = true; }
  shudder = st.shudder ?? 0;
  // tripT: seconds into the basket shot. The girl walks past Serath's right side strewing petals, trips at 1.4 s; the basket
  // leaves her hands and drifts; Serath's right hand takes it out of the air at 3.2 s, her head never turning; she lowers it
  // and the girl, turned back to her, takes it in both hands by 5.0 s.
  const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a))), sm = x => x * x * (3 - 2 * x), mix = (a, b, k) => a + (b - a) * k;
  girl.rotation.set(0, Math.PI, 0); girl.userData.arms.left.rotation.set(0, 0, 0); girl.userData.arms.right.rotation.set(0, 0, 0);
  if (st.tripT != null) {
    // v3 (after Q02A t1): real mechanics at Orison's slow fall (about 1 m/s2).
    //  1.4 s  her toe catches her hem; she pitches forward, arms flung out
    //  1.5 s  the basket leaves her hands with her own walking speed: one low ballistic arc, apex about 1 m, upright
    //  2.5 s  she lands softly on hands and knees      3.0 s  the basket drifts past Serath's side at the height of her
    //         hanging hand; the hand closes on the handle (it began to move 0.5 s before) and gives a little with the weight
    //  3.1-3.9 the girl sits back on her knees         3.9-5.0 Serath lowers the basket to her; she takes it in both hands
    const t = st.tripT, G = 1.0, T0 = 1.5, TC = 3.0, R0 = [-4.75, 0.66, -79.76], CATCH = [-5.12, 0.80, -80.84];
    const V = [(CATCH[0] - R0[0]) / (TC - T0), (CATCH[1] - R0[1] + 0.5 * G * (TC - T0) ** 2) / (TC - T0), (CATCH[2] - R0[2]) / (TC - T0)];
    const fall = Math.pow(seg(t, 1.4, 2.5), 1.6);                                            // an accelerating pitch forward
    const up = sm(seg(t, 3.1, 3.9));                                                          // back onto her knees
    const gz = t < 1.4 ? mix(-78.44, -79.34, t / 1.4) : t < 2.5 ? mix(-79.34, -80.3, sm(seg(t, 1.4, 2.5))) : mix(-80.3, -80.5, up);
    const gx = mix(-4.75, -4.88, up);
    girl.position.set(gx, -0.38 * up, gz);
    girl.rotation.set(-(1.05 * fall) * (1 - up) - 0.05 * up, Math.PI, 0);
    const take = sm(seg(t, 3.9, 4.5)), settle = sm(seg(t, 4.7, 5.2));
    const reach = t < 1.4 ? 0.55 : t < 3.1 ? mix(0.55, 1.45, sm(seg(t, 1.4, 1.6))) : mix(mix(1.45, 0.5, up), 1.9, take) - 1.2 * settle;
    girl.userData.arms.left.rotation.set(-reach, 0, 0); girl.userData.arms.right.rotation.set(-reach, 0, 0);
    // Serath: only the right arm moves. It reaches a hand's width forward, closes, gives with the catch, then lowers and offers.
    const give = 0.08 * Math.sin(seg(t, 3.0, 3.5) * Math.PI);
    st.serathArm = t < 2.5 ? 0 : t < 3.0 ? 0.3 * sm(seg(t, 2.5, 3.0)) : t < 3.9 ? 0.3 + give : t < 4.7 ? mix(0.3, 0.2, sm(seg(t, 3.9, 4.4))) : mix(0.2, 0, sm(seg(t, 4.8, 5.3)));
    st.serathArmOut = t < 3.9 ? 0 : t < 4.7 ? 0.22 * sm(seg(t, 3.9, 4.4)) : 0.22 * (1 - sm(seg(t, 4.8, 5.3)));
    const sa = st.serathArm, so = st.serathArmOut, L = 0.631, hand = [-5.146 + L * Math.sin(so), 1.546 - L * Math.cos(1.3 * sa) * Math.cos(so), -80.6 - L * Math.sin(1.3 * sa)];
    let bp, tilt = 0;
    if (t < T0) bp = [gx, 0.6 + 0.06 * seg(t, 1.4, 1.5), gz - 0.22 - 0.2 * seg(t, 1.4, 1.5)];
    else if (t < TC) { const u = t - T0; bp = [R0[0] + V[0] * u, R0[1] + V[1] * u - 0.5 * G * u * u, R0[2] + V[2] * u]; tilt = -0.3 * Math.sin(seg(t, T0, TC) * Math.PI); }
    else if (t < 4.6) { bp = [hand[0] + 0.03, hand[1] - 0.16, hand[2]]; tilt = 0.25 * Math.exp(-(t - TC) * 2.2) * Math.cos((t - TC) * 7); }   // it swings once on its handle and settles
    else { const k = sm(seg(t, 4.6, 5.2)), lap = [gx - 0.02, 0.42, gz - 0.3]; bp = [mix(hand[0] + 0.03, lap[0], k), mix(hand[1] - 0.16, lap[1], k), mix(hand[2], lap[2], k)]; }
    basket.position.set(...bp); basket.rotation.set(tilt, 0, 0);
  } else {
    if (st.girlPos) girl.position.set(st.girlPos[0], 0, st.girlPos[1]); else girl.position.set(-4.6, 0, -78.7);
    girl.userData.arms.left.rotation.set(-0.55, 0, 0); girl.userData.arms.right.rotation.set(-0.55, 0, 0);
    basket.rotation.set(0, 0, 0); basket.position.set(...(st.basket || [girl.position.x, 0.6, girl.position.z - 0.22]));
  }
  basket.visible = st.basket !== 0;
  warrant.visible = !!st.warrant;
  if (st.warrant) { warrant.position.set(st.warrant[0], st.warrant[1] + (st.warrantRise ?? 0), st.warrant[2]); warrant.rotation.set(st.warrant[3] ?? 0, st.warrant[4] ?? 0, 0); }
  sealMark.visible = (st.sealed ?? 0) > 0.5; for (const h of aideHands) h.visible = st.aideHands !== 0;
  const sa = st.serathArm ?? 0; serath.userData.arms.right.rotation.set(-1.3 * sa, 0, -(st.serathArmOut ?? 0));
  const aa = st.aideArm ?? 0, ah = st.aideHold ?? 0; aide.userData.arms.left.rotation.set(-2.6 * aa - 0.75 * ah, 0, 0); aide.userData.arms.right.rotation.set(-0.75 * ah, 0, 0);
  if (st.aidePos) aide.position.set(st.aidePos[0], 0, st.aidePos[1]); else aide.position.set(-2.2, 0, -78.2);
  aide.rotation.y = st.aideFace ?? -Math.PI / 2;
  aide.visible = !st.aideHidden;
  if (st.warrantInHand) {                       // the sealed warrant in the aide's raised left hand
    aide.updateMatrixWorld(true);
    warrant.visible = true; warrant.position.copy(new THREE.Vector3(0, -0.72, 0.02).applyMatrix4(aide.userData.arms.left.matrixWorld));
    warrant.rotation.set(-1.0, 0, 0);
  }
  const a = st.hieroArms ?? 0, arms = hierophant.userData.arms;
  arms.left.rotation.set(-2.4 * a, 0, 0.45 * a); arms.right.rotation.set(-2.4 * a, 0, -0.45 * a);
};

// ---- cameras: hfov from focal length on a Super 35 width (23.76 mm), drawn 16:9 (as Oren's)
function cameraFor(c) {
  const hfov = 2 * Math.atan(23.76 / 2 / c.f);
  const vfov = 2 * Math.atan(Math.tan(hfov / 2) / (W / H)) * 180 / Math.PI;
  const cam = new THREE.PerspectiveCamera(vfov, W / H, 0.05, 600);
  cam.position.set(...c.pos); cam.lookAt(new THREE.Vector3(...c.target));
  if (c.shift) cam.setViewOffset(W, H, -c.shift[0] * W, c.shift[1] * H, W, H);
  return cam;
}
window.renderShot = (c) => { renderer.render(scene, cameraFor(c)); return renderer.domElement.toDataURL('image/png'); };
window.setState({}); window.setTime(4);
window.ready = true;
</script></body></html>
